  <line x1="660" y1="134" x2="660" y2="174" stroke="#8A4B00" stroke-width="2.3" fill="none" stroke-dasharray="7 4" marker-end="url(#mk-amber)"/>
  <text x="668" y="162" fill="#8A4B00" font-family="sans-serif" font-size="18" font-weight="400">ir_load</text>
