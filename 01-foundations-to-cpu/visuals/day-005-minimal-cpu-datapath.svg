  <rect x="21" y="181" width="138" height="102" rx="5" fill="none" stroke="#1B2A4A" stroke-width="1.4"/>
  <text x="90" y="214" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">PC</text>
  <text x="90" y="242" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">state</text>
  <text x="90" y="270" fill="#1D4E89" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">in: next PC</text>
  <rect x="260" y="176" width="200" height="112" rx="8" fill="#E7F0FA" stroke="#1D4E89" stroke-width="2.2"/>
