  <text x="360" y="242" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">memory</text>
  <text x="360" y="270" fill="#1D4E89" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">byte at address</text>
