  <text x="886" y="270" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">state</text>
  <line x1="164" y1="232" x2="258" y2="232" stroke="#1D4E89" stroke-width="2.6" fill="none" marker-end="url(#mk-blue)"/>
  <text x="198" y="222" fill="#1D4E89" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">address</text>
  <line x1="460" y1="232" x2="554" y2="232" stroke="#1D4E89" stroke-width="2.6" fill="none" marker-end="url(#mk-blue)"/>
  <text x="507" y="222" fill="#1D4E89" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">byte</text>
  <line x1="692" y1="232" x2="786" y2="232" stroke="#1D4E89" stroke-width="2.6" fill="none" marker-end="url(#mk-blue)"/>
  <text x="739" y="222" fill="#1D4E89" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">rd, rs</text>
