  <line x1="210" y1="542" x2="260" y2="542" stroke="#8A4B00" stroke-width="2.4" fill="none" stroke-dasharray="7 4" marker-end="url(#mk-amber)"/>
  <text x="270" y="548" fill="#8A4B00" font-family="sans-serif" font-size="18" font-weight="400">control</text>
  <rect x="390" y="530" width="26" height="20" rx="3" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/>
  <rect x="394" y="534" width="18" height="12" rx="2" fill="none" stroke="#1B2A4A" stroke-width="1.2"/>
  <text x="424" y="548" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400">state</text>
  <text x="520" y="548" fill="#17693F" font-family="sans-serif" font-size="18" font-weight="400">Green: a value that can be captured.</text>
