<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" font-family="sans-serif">
  <title>Tiny-8 minimal CPU datapath</title>
  <desc>Teaching block diagram of one minimal CPU. Solid blue lines are the datapath. Dashed amber lines are control enables and selects from the decoder. Double-bordered boxes are state elements. The next-PC mux chooses PC plus one or hold. This is the lesson's Tiny-8 organization, not a claim about every CPU.</desc>
  <defs>
    <marker id="mk-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="#1D4E89"/>
    </marker>
    <marker id="mk-amber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="#8A4B00"/>
    </marker>
    <marker id="mk-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="#17693F"/>
    </marker>
    <marker id="mk-red" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="#9E2A2A"/>
    </marker>
    <marker id="mk-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="#1B2A4A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#FBF9F4"/>
  <rect x="2" y="2" width="996" height="556" fill="none" stroke="#1B2A4A" stroke-width="2"/>
  <text x="28" y="36" fill="#1B2A4A" font-family="sans-serif" font-size="22" font-weight="700">Tiny-8 datapath: values, control, and state</text>
  <text x="28" y="62" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400">Blue solid moves values. Amber dashed enables them. Double border is state.</text>
  <rect x="300" y="76" width="400" height="58" rx="8" fill="#FFF4E0" stroke="#8A4B00" stroke-width="2.4" stroke-dasharray="7 4"/>
  <text x="500" y="100" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Decoder / control</text>
  <text x="500" y="124" fill="#8A4B00" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">enables and selects</text>
