  <text x="790" y="96" fill="#8A4B00" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">reg_write</text>
  <rect x="48" y="312" width="84" height="40" rx="8" fill="#FFFFFF" stroke="#1D4E89" stroke-width="2"/>
  <text x="90" y="338" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">PC+1</text>
  <line x1="90" y1="288" x2="90" y2="312" stroke="#1D4E89" stroke-width="2.6" fill="none"/>
  <line x1="90" y1="352" x2="90" y2="388" stroke="#1D4E89" stroke-width="2.6" fill="none" marker-end="url(#mk-blue)"/>
  <path d="M150,288 V368 H190 V388" stroke="#1D4E89" stroke-width="2.6" fill="none" marker-end="url(#mk-blue)"/>
  <text x="158" y="348" fill="#1D4E89" font-family="sans-serif" font-size="18" font-weight="400">hold</text>
  <rect x="16" y="390" width="210" height="112" rx="8" fill="#E7F0FA" stroke="#1D4E89" stroke-width="2.2"/>
  <text x="121" y="426" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Next-PC mux</text>
  <text x="121" y="454" fill="#1D4E89" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">PC+1 or hold</text>
  <text x="121" y="482" fill="#17693F" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">out: next PC</text>
  <path d="M300,124 H248 V430 H228" stroke="#8A4B00" stroke-width="2.3" fill="none" stroke-dasharray="7 4" marker-end="url(#mk-amber)"/>
  <text x="240" y="308" fill="#8A4B00" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="end">select</text>
  <path d="M16,446 H8 V232 H14" stroke="#1D4E89" stroke-width="2.6" fill="none" marker-end="url(#mk-blue)"/>
