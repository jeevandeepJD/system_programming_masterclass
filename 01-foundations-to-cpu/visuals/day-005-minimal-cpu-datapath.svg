  <text x="440" y="470" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">state</text>
  <text x="440" y="496" fill="#1D4E89" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">addr and write data</text>
  <path d="M624,288 V372 H390 V400" stroke="#1D4E89" stroke-width="2.6" fill="none" marker-end="url(#mk-blue)"/>
  <text x="440" y="364" fill="#1D4E89" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">addr</text>
  <line x1="508" y1="134" x2="508" y2="400" stroke="#8A4B00" stroke-width="2.3" fill="none" stroke-dasharray="7 4" marker-end="url(#mk-amber)"/>
  <text x="516" y="318" fill="#8A4B00" font-family="sans-serif" font-size="18" font-weight="400">mem_write</text>
  <path d="M820,288 V328 H600 V456 H582" stroke="#1D4E89" stroke-width="2.6" fill="none" marker-end="url(#mk-blue)"/>
  <text x="700" y="312" fill="#1D4E89" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">data</text>
  <line x1="28" y1="542" x2="78" y2="542" stroke="#1D4E89" stroke-width="3" fill="none" marker-end="url(#mk-blue)"/>
