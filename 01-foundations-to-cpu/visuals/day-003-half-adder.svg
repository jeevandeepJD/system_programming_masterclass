<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" font-family="sans-serif">
  <title>Half-adder with XOR sum, AND carry, truth table, and one trace</title>
  <desc>A half-adder sends inputs A and B to an XOR gate for Sum and an AND gate for Carry. The truth table lists all four rows. The highlighted trace is A=1, B=1, which produces Sum 0 and Carry 1.</desc>
  <defs>
    <marker id="arrowNavy" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#1B2A4A"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#1D4E89"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#17693F"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#8A4B00"/>
    </marker>
    <pattern id="amberHatch" patternUnits="userSpaceOnUse" width="10" height="10">
      <path d="M0 10 L10 0" stroke="#8A4B00" stroke-width="1.6"/>
    </pattern>
    <pattern id="greenStripe" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#E3F6EB"/>
      <path d="M0 12 L12 0" stroke="#17693F" stroke-width="1.2" opacity="0.45"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#FBF9F4"/>
  <rect x="2" y="2" width="996" height="576" fill="none" stroke="#1B2A4A" stroke-width="2"/>
  <text x="28.0" y="36.0" font-size="26" fill="#1B2A4A" text-anchor="start" font-weight="700">Half-adder: Sum is XOR, Carry is AND</text>
  <text x="28.0" y="64.0" font-size="18" fill="#1D4E89" text-anchor="start" font-weight="700">Highlighted trace: A = 1 and B = 1.</text>
  <text x="28.0" y="148.0" font-size="20" fill="#1D4E89" text-anchor="start" font-weight="700">A = 1</text>
  <text x="28.0" y="188.0" font-size="20" fill="#1D4E89" text-anchor="start" font-weight="700">B = 1</text>
  <line x1="108.0" y1="142.0" x2="228.0" y2="142.0" stroke="#1D4E89" stroke-width="4"/>
  <line x1="108.0" y1="182.0" x2="248.0" y2="182.0" stroke="#1D4E89" stroke-width="4"/>
  <path d="M 236 116 Q 260 172 236 228" fill="none" stroke="#1D4E89" stroke-width="3"/>
  <path d="M 254 116 Q 330 116 368 172 Q 330 228 254 228 Q 286 172 254 116 Z" fill="#E6F1FB" stroke="#1D4E89" stroke-width="3"/>
  <text x="300.0" y="178.0" font-size="20" fill="#1D4E89" text-anchor="middle" font-weight="700">XOR</text>
  <line x1="368.0" y1="172.0" x2="430.0" y2="172.0" stroke="#17693F" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="440.0" y="178.0" font-size="22" fill="#17693F" text-anchor="start" font-weight="700">Sum 0</text>
  <text x="28.0" y="328.0" font-size="20" fill="#1D4E89" text-anchor="start" font-weight="700">A = 1</text>
  <text x="28.0" y="368.0" font-size="20" fill="#1D4E89" text-anchor="start" font-weight="700">B = 1</text>
  <line x1="108.0" y1="322.0" x2="248.0" y2="322.0" stroke="#1D4E89" stroke-width="4"/>
  <line x1="108.0" y1="362.0" x2="248.0" y2="362.0" stroke="#1D4E89" stroke-width="4"/>
  <path d="M 248 300 H 300 A 40 40 0 0 0 300 380 H 248 Z" fill="#E6F1FB" stroke="#1D4E89" stroke-width="3"/>
  <text x="286.0" y="348.0" font-size="18" fill="#1D4E89" text-anchor="middle" font-weight="700">AND</text>
  <line x1="340.0" y1="340.0" x2="430.0" y2="340.0" stroke="#17693F" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="440.0" y="346.0" font-size="22" fill="#17693F" text-anchor="start" font-weight="700">Carry 1</text>
  <text x="28.0" y="430.0" font-size="18" fill="#1D4E89" text-anchor="start" font-weight="700">Both gates receive this trace.</text>
  <text x="28.0" y="460.0" font-size="20" fill="#1B2A4A" text-anchor="start" font-weight="700">Sum = A XOR B</text>
  <text x="28.0" y="490.0" font-size="20" fill="#1B2A4A" text-anchor="start" font-weight="700">Carry = A AND B</text>
  <text x="28.0" y="526.0" font-size="18" fill="#17693F" text-anchor="start" font-weight="700">1 XOR 1 = 0.   1 AND 1 = 1.</text>
  <text x="760.0" y="108.0" font-size="22" fill="#1B2A4A" text-anchor="middle" font-weight="700">Truth table</text>
  <rect x="600.0" y="128.0" width="308.0" height="44.0" rx="0" fill="#F4F7FB" stroke="#1B2A4A" stroke-width="2"/>
  <text x="632.0" y="158.0" font-size="20" fill="#1B2A4A" text-anchor="middle" font-weight="700">A</text>
  <text x="696.0" y="158.0" font-size="20" fill="#1B2A4A" text-anchor="middle" font-weight="700">B</text>
  <text x="770.0" y="158.0" font-size="20" fill="#1B2A4A" text-anchor="middle" font-weight="700">Sum</text>
  <text x="860.0" y="158.0" font-size="20" fill="#1B2A4A" text-anchor="middle" font-weight="700">Carry</text>
  <rect x="600.0" y="172.0" width="308.0" height="52.0" rx="0" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="632.0" y="206.0" font-size="22" fill="#1B2A4A" text-anchor="middle" font-weight="700">0</text>
  <text x="696.0" y="206.0" font-size="22" fill="#1B2A4A" text-anchor="middle" font-weight="700">0</text>
  <text x="770.0" y="206.0" font-size="22" fill="#1B2A4A" text-anchor="middle" font-weight="700">0</text>
  <text x="860.0" y="206.0" font-size="22" fill="#1B2A4A" text-anchor="middle" font-weight="700">0</text>
  <rect x="600.0" y="224.0" width="308.0" height="52.0" rx="0" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="632.0" y="258.0" font-size="22" fill="#1B2A4A" text-anchor="middle" font-weight="700">0</text>
  <text x="696.0" y="258.0" font-size="22" fill="#1B2A4A" text-anchor="middle" font-weight="700">1</text>
  <text x="770.0" y="258.0" font-size="22" fill="#1B2A4A" text-anchor="middle" font-weight="700">1</text>
  <text x="860.0" y="258.0" font-size="22" fill="#1B2A4A" text-anchor="middle" font-weight="700">0</text>
  <rect x="600.0" y="276.0" width="308.0" height="52.0" rx="0" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="632.0" y="310.0" font-size="22" fill="#1B2A4A" text-anchor="middle" font-weight="700">1</text>
  <text x="696.0" y="310.0" font-size="22" fill="#1B2A4A" text-anchor="middle" font-weight="700">0</text>
  <text x="770.0" y="310.0" font-size="22" fill="#1B2A4A" text-anchor="middle" font-weight="700">1</text>
  <text x="860.0" y="310.0" font-size="22" fill="#1B2A4A" text-anchor="middle" font-weight="700">0</text>
  <rect x="600.0" y="328.0" width="308.0" height="52.0" rx="0" fill="#E6F1FB" stroke="#1D4E89" stroke-width="4"/>
  <text x="632.0" y="362.0" font-size="22" fill="#1B2A4A" text-anchor="middle" font-weight="700">1</text>
  <text x="696.0" y="362.0" font-size="22" fill="#1B2A4A" text-anchor="middle" font-weight="700">1</text>
  <text x="770.0" y="362.0" font-size="22" fill="#17693F" text-anchor="middle" font-weight="700">0</text>
  <text x="860.0" y="362.0" font-size="22" fill="#17693F" text-anchor="middle" font-weight="700">1</text>
  <text x="920.0" y="362.0" font-size="18" fill="#1D4E89" text-anchor="start" font-weight="700">trace</text>
  <text x="600.0" y="430.0" font-size="18" fill="#1B2A4A" text-anchor="start" font-weight="400">Sum column matches XOR.</text>
  <text x="600.0" y="456.0" font-size="18" fill="#1B2A4A" text-anchor="start" font-weight="400">Carry column matches AND.</text>
  <text x="600.0" y="490.0" font-size="18" fill="#1B2A4A" text-anchor="start" font-weight="700">Trace row: A=1, B=1.</text>
  <text x="600.0" y="518.0" font-size="20" fill="#17693F" text-anchor="start" font-weight="700">Sum 0, Carry 1.</text>
</svg>
