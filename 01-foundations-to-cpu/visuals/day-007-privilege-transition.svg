<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" font-family="sans-serif">
  <title>User to kernel privilege transition with three causes sharing saved context</title>
  <desc>A user instruction reaches a controlled entry by a page fault, an asynchronous interrupt, or a syscall. The causes differ. All three then use kernel-stack saved context, a handler, and an architectural return across the user/kernel boundary.</desc>
  <defs>
    <marker id="mk-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="#1D4E89"/>
    </marker>
    <marker id="mk-amber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="#8A4B00"/>
    </marker>
    <marker id="mk-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="#17693F"/>
    </marker>
    <marker id="mk-red" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="#9E2A2A"/>
    </marker>
    <marker id="mk-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="#1B2A4A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#FBF9F4"/>
  <rect x="2" y="2" width="996" height="516" fill="none" stroke="#1B2A4A" stroke-width="2"/>
  <text x="500" y="32" fill="#1B2A4A" font-family="sans-serif" font-size="22" font-weight="700" text-anchor="middle">Controlled entry, saved context, and return</text>
  <rect x="12" y="58" width="360" height="420" rx="8" fill="#F3F6FA" stroke="#1B2A4A" stroke-width="1.5"/>
  <rect x="384" y="58" width="604" height="420" rx="8" fill="#FBF6EE" stroke="#1B2A4A" stroke-width="1.5"/>
  <line x1="372" y1="58" x2="372" y2="478" stroke="#1B2A4A" stroke-width="3" fill="none" stroke-dasharray="8 6"/>
  <text x="28" y="84" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700">USER</text>
  <text x="396" y="84" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700">KERNEL</text>
  <rect x="319.7" y="114.0" width="104.5" height="26.0" fill="#FBF9F4"/>
  <text x="372" y="128" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">boundary</text>
  <rect x="28" y="200" width="200" height="88" rx="8" fill="#FFFFFF" stroke="#1D4E89" stroke-width="2.2"/>
  <text x="128" y="236" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">User instruction</text>
  <text x="128" y="264" fill="#1D4E89" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">unprivileged</text>
  <line x1="228" y1="244" x2="250" y2="244" stroke="#1B2A4A" stroke-width="2.2" fill="none"/>
  <line x1="250" y1="168" x2="250" y2="320" stroke="#1B2A4A" stroke-width="2.2" fill="none"/>
  <rect x="430" y="150" width="220" height="200" rx="8" fill="#FFF4E0" stroke="#8A4B00" stroke-width="2.4" stroke-dasharray="7 4"/>
  <text x="540" y="214" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Controlled entry</text>
  <text x="540" y="246" fill="#8A4B00" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">vector or gate</text>
  <text x="540" y="278" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">kernel chooses PC</text>
  <line x1="250" y1="168" x2="430" y2="168" stroke="#9E2A2A" stroke-width="2.5" fill="none" stroke-dasharray="2 3" marker-end="url(#mk-red)"/>
  <rect x="250.2" y="144.0" width="99.5" height="26.0" fill="#FBF9F4"/>
  <text x="300" y="158" fill="#9E2A2A" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">page fault</text>
  <line x1="250" y1="244" x2="430" y2="244" stroke="#8A4B00" stroke-width="2.5" fill="none" stroke-dasharray="7 4" marker-end="url(#mk-amber)"/>
  <rect x="256.5" y="220.0" width="86.9" height="26.0" fill="#FBF9F4"/>
  <text x="300" y="234" fill="#8A4B00" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">interrupt</text>
  <line x1="250" y1="320" x2="430" y2="320" stroke="#1D4E89" stroke-width="2.5" fill="none" marker-end="url(#mk-blue)"/>
  <rect x="265.8" y="296.0" width="68.3" height="26.0" fill="#FBF9F4"/>
  <text x="300" y="310" fill="#1D4E89" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">syscall</text>
  <text x="28" y="312" fill="#9E2A2A" font-family="sans-serif" font-size="18" font-weight="400">fault: this access</text>
  <text x="28" y="338" fill="#8A4B00" font-family="sans-serif" font-size="18" font-weight="400">interrupt: external</text>
  <text x="28" y="364" fill="#1D4E89" font-family="sans-serif" font-size="18" font-weight="400">syscall: deliberate</text>
  <rect x="700" y="78" width="260" height="112" rx="8" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2.5"/>
  <rect x="705" y="83" width="250" height="102" rx="5" fill="none" stroke="#1B2A4A" stroke-width="1.4"/>
  <text x="830" y="118" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Kernel stack</text>
  <text x="830" y="146" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">saved context</text>
  <text x="830" y="172" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">state</text>
  <path d="M650,210 H676 V134 H698" stroke="#1B2A4A" stroke-width="2.5" fill="none" marker-end="url(#mk-navy)"/>
  <text x="668" y="188" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">save</text>
  <rect x="700" y="230" width="260" height="96" rx="8" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2.2"/>
  <text x="830" y="270" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Handler</text>
  <text x="830" y="298" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">privileged code</text>
  <line x1="830" y1="190" x2="830" y2="228" stroke="#1B2A4A" stroke-width="2.5" fill="none" marker-end="url(#mk-navy)"/>
  <rect x="28" y="390" width="270" height="72" rx="8" fill="#E3F6EB" stroke="#17693F" stroke-width="2.5"/>
  <text x="163" y="420" fill="#17693F" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Restored user context</text>
  <text x="163" y="446" fill="#17693F" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">result of the return</text>
  <path d="M760,326 V426 H300" stroke="#17693F" stroke-width="3" fill="none" marker-end="url(#mk-green)"/>
  <rect x="455.4" y="402.0" width="209.2" height="26.0" fill="#FBF9F4"/>
  <text x="560" y="416" fill="#17693F" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">architectural return</text>
  <text x="500" y="504" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">Different causes share one saved context, then a return crosses back.</text>
</svg>
