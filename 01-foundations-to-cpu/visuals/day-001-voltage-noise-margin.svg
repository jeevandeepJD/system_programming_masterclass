<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" font-family="sans-serif">
  <title>Illustrative voltage bands, undefined transition, and noise margin</title>
  <desc>Analog voltage axis with three labeled regions using illustrative values only: valid LOW from 0.0 V to 0.8 V, an undefined transition from 0.8 V to 2.0 V, and valid HIGH from 2.0 V to 3.3 V. A sender example at 0.2 V plus noise to 0.5 V stays inside valid LOW. The noise-margin bracket runs from that sender example to the 0.8 V LOW threshold. 1.4 V is marked inside the undefined region.</desc>
  <defs>
    <marker id="arrowNavy" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#1B2A4A"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#1D4E89"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#17693F"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#8A4B00"/>
    </marker>
    <pattern id="amberHatch" patternUnits="userSpaceOnUse" width="10" height="10">
      <path d="M0 10 L10 0" stroke="#8A4B00" stroke-width="1.6"/>
    </pattern>
    <pattern id="greenStripe" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#E3F6EB"/>
      <path d="M0 12 L12 0" stroke="#17693F" stroke-width="1.2" opacity="0.45"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#FBF9F4"/>
  <rect x="2" y="2" width="996" height="576" fill="none" stroke="#1B2A4A" stroke-width="2"/>
  <text x="36.0" y="38.0" font-size="26" fill="#1B2A4A" text-anchor="start" font-weight="700">Illustrative voltage bands and noise margin</text>
  <text x="36.0" y="66.0" font-size="18" fill="#1B2A4A" text-anchor="start" font-weight="400">These voltages are an example, not a universal logic standard.</text>
  <rect x="70.0" y="96.0" width="208.5" height="84.0" rx="0" fill="url(#greenStripe)" stroke="#17693F" stroke-width="3"/>
  <rect x="278.5" y="96.0" width="312.7" height="84.0" rx="0" fill="#FFF3DC" stroke="#8A4B00" stroke-width="3" stroke-dasharray="8 5"/>
  <rect x="278.5" y="96.0" width="312.7" height="84.0" fill="url(#amberHatch)"/>
  <rect x="591.2" y="96.0" width="338.8" height="84.0" rx="0" fill="url(#greenStripe)" stroke="#17693F" stroke-width="3"/>
  <rect x="278.5" y="96.0" width="312.7" height="84.0" rx="0" fill="none" stroke="#8A4B00" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="174.2" y="132.0" font-size="20" fill="#1B2A4A" text-anchor="middle" font-weight="700">VALID LOW</text>
  <text x="174.2" y="158.0" font-size="18" fill="#1B2A4A" text-anchor="middle" font-weight="400">logical 0</text>
  <text x="434.8" y="132.0" font-size="20" fill="#8A4B00" text-anchor="middle" font-weight="700">UNDEFINED</text>
  <text x="434.8" y="158.0" font-size="18" fill="#8A4B00" text-anchor="middle" font-weight="400">transition region</text>
  <text x="760.6" y="132.0" font-size="20" fill="#1B2A4A" text-anchor="middle" font-weight="700">VALID HIGH</text>
  <text x="760.6" y="158.0" font-size="18" fill="#1B2A4A" text-anchor="middle" font-weight="400">logical 1</text>
  <line x1="70.0" y1="200.0" x2="930.0" y2="200.0" stroke="#1B2A4A" stroke-width="3"/>
  <line x1="70.0" y1="193.0" x2="70.0" y2="209.0" stroke="#1B2A4A" stroke-width="3"/>
  <text x="70.0" y="232.0" font-size="18" fill="#1B2A4A" text-anchor="start" font-weight="700">0.0 V</text>
  <line x1="278.5" y1="193.0" x2="278.5" y2="209.0" stroke="#1B2A4A" stroke-width="3"/>
  <text x="278.5" y="232.0" font-size="18" fill="#1B2A4A" text-anchor="middle" font-weight="700">0.8 V LOW limit</text>
  <line x1="591.2" y1="193.0" x2="591.2" y2="209.0" stroke="#1B2A4A" stroke-width="3"/>
  <text x="591.2" y="232.0" font-size="18" fill="#1B2A4A" text-anchor="middle" font-weight="700">2.0 V HIGH limit</text>
  <line x1="930.0" y1="193.0" x2="930.0" y2="209.0" stroke="#1B2A4A" stroke-width="3"/>
  <text x="930.0" y="232.0" font-size="18" fill="#1B2A4A" text-anchor="end" font-weight="700">3.3 V</text>
  <line x1="434.8" y1="96.0" x2="434.8" y2="180.0" stroke="#8A4B00" stroke-width="3" stroke-dasharray="4 4"/>
  <text x="434.8" y="86.0" font-size="18" fill="#8A4B00" text-anchor="middle" font-weight="700">1.4 V undefined</text>
  <line x1="122.1" y1="292.0" x2="200.3" y2="292.0" stroke="#1D4E89" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <circle cx="122.1" cy="292.0" r="6.0" fill="#1D4E89" stroke="#1D4E89" stroke-width="2"/>
  <circle cx="200.3" cy="292.0" r="6.0" fill="#17693F" stroke="#17693F" stroke-width="2"/>
  <text x="122.1" y="278.0" font-size="18" fill="#1D4E89" text-anchor="middle" font-weight="700">sender 0.2 V</text>
  <text x="200.3" y="320.0" font-size="18" fill="#17693F" text-anchor="middle" font-weight="700">0.5 V still LOW</text>
  <line x1="122.1" y1="350.0" x2="122.1" y2="370.0" stroke="#1B2A4A" stroke-width="3"/>
  <line x1="278.5" y1="350.0" x2="278.5" y2="370.0" stroke="#1B2A4A" stroke-width="3"/>
  <line x1="122.1" y1="360.0" x2="278.5" y2="360.0" stroke="#1B2A4A" stroke-width="3"/>
  <text x="200.3" y="388.0" font-size="18" fill="#1B2A4A" text-anchor="middle" font-weight="700">noise margin</text>
  <text x="520.0" y="286.0" font-size="18" fill="#1B2A4A" text-anchor="start" font-weight="700">Example, still using illustrative numbers:</text>
  <text x="520.0" y="316.0" font-size="18" fill="#1B2A4A" text-anchor="start" font-weight="400">Noise adds 0.3 V to a 0.2 V LOW.</text>
  <text x="520.0" y="342.0" font-size="18" fill="#1B2A4A" text-anchor="start" font-weight="400">0.5 V remains inside valid LOW.</text>
  <text x="520.0" y="368.0" font-size="18" fill="#1B2A4A" text-anchor="start" font-weight="400">Margin is the room up to 0.8 V.</text>
  <text x="520.0" y="404.0" font-size="18" fill="#1B2A4A" text-anchor="start" font-weight="400">The hatched band promises neither</text>
  <text x="520.0" y="430.0" font-size="18" fill="#1B2A4A" text-anchor="start" font-weight="400">logical 0 nor logical 1.</text>
  <rect x="36.0" y="470.0" width="36.0" height="28.0" rx="2" fill="url(#greenStripe)" stroke="#17693F" stroke-width="2"/>
  <text x="82.0" y="490.0" font-size="18" fill="#1B2A4A" text-anchor="start" font-weight="400">solid band = valid logic level</text>
  <rect x="420.0" y="470.0" width="36.0" height="28.0" rx="2" fill="#FFF3DC" stroke="#8A4B00" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="420" y="470" width="36" height="28" fill="url(#amberHatch)"/>
  <text x="466.0" y="490.0" font-size="18" fill="#1B2A4A" text-anchor="start" font-weight="400">hatch = undefined transition</text>
  <text x="36.0" y="540.0" font-size="18" fill="#1B2A4A" text-anchor="start" font-weight="400">A HIGH noise margin is the same idea above the HIGH limit. Thresholds depend on the device.</text>
</svg>
