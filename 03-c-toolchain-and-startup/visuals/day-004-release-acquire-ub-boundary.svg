<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Day 4: publication edges and the UB boundary</title><desc id="desc">Release and acquire establish a happens-before path for payload publication; undefined behavior removes source-level constraints the optimizer would otherwise preserve.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker>
<marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#75e6a4"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.mono{font-family:monospace;font-size:18px}.label{font-size:18px;font-weight:700}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}.box{stroke:#f7fbff;stroke-width:2}.arrow{fill:none;stroke:#ffd166;stroke-width:4;marker-end:url(#arrow)}.garrow{fill:none;stroke:#75e6a4;stroke-width:4;marker-end:url(#green-arrow)}.dash{fill:none;stroke:#ff7b7b;stroke-width:3;stroke-dasharray:9 7}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><rect x="2" y="2" width="1186" height="836" fill="none" stroke="#6fa8dc" stroke-width="2"/>
<text class="title" x="50" y="58">Day 4: publication edges and the UB boundary</text><rect class="panel" x="45" y="105" width="535" height="410" rx="16"/><text class="head" x="70" y="145">Producer thread</text><rect class="box" x="80" y="190" width="440" height="90" rx="14" fill="#315a88"/><text class="head" x="300.0" y="226" text-anchor="middle">payload = 2026</text><text class="body" x="300.0" y="258" text-anchor="middle">ordinary write</text><path class="arrow" d="M300 280 L300 355"/><text class="label" x="300.0" y="307.5" text-anchor="middle">sequenced-before</text><rect class="box" x="80" y="365" width="440" height="90" rx="14" fill="#1b6444"/><text class="head" x="300.0" y="401" text-anchor="middle">atomic_store(ready, true, release)</text><text class="body" x="300.0" y="433" text-anchor="middle">publishes earlier actions</text><rect class="panel" x="610" y="105" width="535" height="410" rx="16"/><text class="head" x="635" y="145">Consumer thread</text><rect class="box" x="650" y="190" width="455" height="90" rx="14" fill="#624b88"/><text class="head" x="877.5" y="226" text-anchor="middle">atomic_load(ready, acquire)</text><text class="body" x="877.5" y="258" text-anchor="middle">observes released true</text><path class="arrow" d="M875 280 L875 355"/><text class="label" x="875.0" y="307.5" text-anchor="middle">sequenced-before</text><rect class="box" x="650" y="365" width="455" height="90" rx="14" fill="#176b72"/><text class="head" x="877.5" y="401" text-anchor="middle">read payload</text><text class="body" x="877.5" y="433" text-anchor="middle">defined: sees published write</text><path class="garrow" d="M520 410 L640 235"/><text class="label" x="580.0" y="312.5" text-anchor="middle">synchronizes-with</text><text class="label" x="595" y="505" text-anchor="middle" fill="#75e6a4">combined edges establish happens-before</text><rect class="panel" x="45" y="555" width="1100" height="220" rx="16"/><text class="head" x="70" y="595">Optimizer boundary</text><rect class="box" x="80" y="625" width="270" height="105" rx="14" fill="#176b72"/><text class="head" x="215.0" y="661" text-anchor="middle">defined program</text><text class="body" x="215.0" y="693" text-anchor="middle">observable behavior constrains</text><text class="body" x="215.0" y="720" text-anchor="middle">valid transformations</text><path class="arrow" d="M350 677 L520 677"/><text class="label" x="435.0" y="667.0" text-anchor="middle">compiler</text><rect class="box" x="530" y="625" width="250" height="105" rx="14" fill="#315a88"/><text class="head" x="655.0" y="661" text-anchor="middle">optimized ISA</text><text class="body" x="655.0" y="693" text-anchor="middle">same required behavior</text><line class="dash" x1="820" y1="605" x2="820" y2="750"/><text class="label" x="845" y="635" fill="#ff7b7b">UB: no required fallback</text><text class="body" x="845" y="680">signed overflow · race</text><text class="body" x="845" y="715">stale lifetime · bad alias</text></svg>
