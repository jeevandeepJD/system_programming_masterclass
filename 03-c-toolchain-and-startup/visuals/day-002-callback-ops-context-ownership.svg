<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Day 2: callback table, context, and ownership</title><desc id="desc">A framework invokes a typed operation through an immutable operations table while a context pointer names caller-owned concrete state whose lifetime must cover every callback.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker>
<marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#75e6a4"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.mono{font-family:monospace;font-size:18px}.label{font-size:18px;font-weight:700}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}.box{stroke:#f7fbff;stroke-width:2}.arrow{fill:none;stroke:#ffd166;stroke-width:4;marker-end:url(#arrow)}.garrow{fill:none;stroke:#75e6a4;stroke-width:4;marker-end:url(#green-arrow)}.dash{fill:none;stroke:#ff7b7b;stroke-width:3;stroke-dasharray:9 7}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><rect x="2" y="2" width="1186" height="836" fill="none" stroke="#6fa8dc" stroke-width="2"/>
<text class="title" x="50" y="58">Day 2: callback table, context, and ownership</text><rect class="panel" x="45" y="105" width="250" height="610" rx="16"/><text class="head" x="70" y="145">Framework lane</text><rect class="box" x="70" y="190" width="200" height="100" rx="14" fill="#176b72"/><text class="head" x="170.0" y="226" text-anchor="middle">stream</text><text class="body" x="170.0" y="258" text-anchor="middle">state pointer</text><text class="body" x="170.0" y="285" text-anchor="middle">ops pointer</text><rect class="box" x="70" y="365" width="200" height="100" rx="14" fill="#315a88"/><text class="head" x="170.0" y="401" text-anchor="middle">generic call</text><text class="body" x="170.0" y="433" text-anchor="middle">ops-&gt;read(state,</text><text class="body" x="170.0" y="460" text-anchor="middle">dst, capacity)</text><path class="arrow" d="M170 290 L170 355"/><text class="label" x="170.0" y="312.5" text-anchor="middle">dispatch</text><rect class="panel" x="340" y="105" width="330" height="610" rx="16"/><text class="head" x="365" y="145">Contract lane</text><rect class="box" x="375" y="190" width="260" height="155" rx="14" fill="#624b88"/><text class="head" x="505.0" y="226" text-anchor="middle">const stream_ops</text><text class="body" x="505.0" y="258" text-anchor="middle">read → memory_read</text><text class="body" x="505.0" y="285" text-anchor="middle">close → memory_close</text><text class="body" x="505.0" y="312" text-anchor="middle">compatible signatures</text><path class="arrow" d="M270 415 L365 300"/><text class="label" x="317.5" y="347.5" text-anchor="middle">ops</text><rect class="box" x="375" y="430" width="260" height="115" rx="14" fill="#9a6518"/><text class="head" x="505.0" y="466" text-anchor="middle">typed indirect call</text><text class="body" x="505.0" y="498" text-anchor="middle">ABI carries arguments</text><text class="body" x="505.0" y="525" text-anchor="middle">callee returns int</text><path class="arrow" d="M505 345 L505 420"/><text class="label" x="505.0" y="372.5" text-anchor="middle">select member</text><rect class="panel" x="715" y="105" width="430" height="610" rx="16"/><text class="head" x="740" y="145">Concrete owner lane</text><rect class="box" x="750" y="190" width="360" height="145" rx="14" fill="#1b6444"/><text class="head" x="930.0" y="226" text-anchor="middle">memory_state</text><text class="body" x="930.0" y="258" text-anchor="middle">buffer · length · cursor</text><text class="body" x="930.0" y="285" text-anchor="middle">owned by caller/object</text><text class="body" x="930.0" y="312" text-anchor="middle">borrowed during callback</text><path class="arrow" d="M295 240 L740 240"/><text class="label" x="517.5" y="230.0" text-anchor="middle">state pointer</text><path class="garrow" d="M635 485 L740 485"/><text class="label" x="687.5" y="475.0" text-anchor="middle">invoke</text><rect class="box" x="750" y="420" width="360" height="130" rx="14" fill="#176b72"/><text class="head" x="930.0" y="456" text-anchor="middle">memory_read(state, ...)</text><text class="body" x="930.0" y="488" text-anchor="middle">casts context by contract</text><text class="body" x="930.0" y="515" text-anchor="middle">updates cursor</text><text class="body" x="930.0" y="542" text-anchor="middle">does not free owner</text><line class="dash" x1="740" y1="610" x2="1120" y2="610"/><text class="label" x="930" y="650" text-anchor="middle" fill="#ff7b7b">destroy stream/state only after callbacks stop</text><text class="body" x="595" y="775" text-anchor="middle">Function type compatibility protects the call shape; ownership and lifetime policy protect the context.</text></svg>
