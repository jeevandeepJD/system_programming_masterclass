<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Day 5: stop at every translation boundary</title><desc id="desc">Source and headers become a translation unit, then assembly, then a relocatable ELF object; each arrow identifies the responsible tool and what information survives.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker>
<marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#75e6a4"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.mono{font-family:monospace;font-size:18px}.label{font-size:18px;font-weight:700}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}.box{stroke:#f7fbff;stroke-width:2}.arrow{fill:none;stroke:#ffd166;stroke-width:4;marker-end:url(#arrow)}.garrow{fill:none;stroke:#75e6a4;stroke-width:4;marker-end:url(#green-arrow)}.dash{fill:none;stroke:#ff7b7b;stroke-width:3;stroke-dasharray:9 7}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><rect x="2" y="2" width="1186" height="836" fill="none" stroke="#6fa8dc" stroke-width="2"/>
<text class="title" x="50" y="58">Day 5: stop at every translation boundary</text><rect class="box" x="40" y="145" width="230" height="120" rx="14" fill="#176b72"/><text class="head" x="155.0" y="181" text-anchor="middle">source.c + headers</text><text class="body" x="155.0" y="213" text-anchor="middle">macros · declarations</text><rect class="box" x="320" y="145" width="230" height="120" rx="14" fill="#315a88"/><text class="head" x="435.0" y="181" text-anchor="middle">source.i</text><text class="body" x="435.0" y="213" text-anchor="middle">translation unit</text><rect class="box" x="600" y="145" width="230" height="120" rx="14" fill="#624b88"/><text class="head" x="715.0" y="181" text-anchor="middle">source.s</text><text class="body" x="715.0" y="213" text-anchor="middle">target instructions</text><rect class="box" x="880" y="145" width="230" height="120" rx="14" fill="#7d3850"/><text class="head" x="995.0" y="181" text-anchor="middle">source.o (ET_REL)</text><text class="body" x="995.0" y="213" text-anchor="middle">bytes + metadata</text><path class="arrow" d="M270 205 L310 205"/><text class="label" x="290.0" y="195.0" text-anchor="middle">cpp</text><path class="arrow" d="M550 205 L590 205"/><text class="label" x="570.0" y="195.0" text-anchor="middle">compiler</text><path class="arrow" d="M830 205 L870 205"/><text class="label" x="850.0" y="195.0" text-anchor="middle">assembler</text><text class="head" x="55" y="340">What each boundary establishes</text><rect class="box" x="70" y="385" width="200" height="52" rx="10" fill="#176b72"/><text class="label" x="170" y="419" text-anchor="middle">preprocess</text><text class="body" x="310" y="419">#include tokens + macro expansion + conditionals</text><rect class="box" x="70" y="455" width="200" height="52" rx="10" fill="#315a88"/><text class="label" x="170" y="489" text-anchor="middle">compile</text><text class="body" x="310" y="489">types checked → optimization/selection → assembly</text><rect class="box" x="70" y="525" width="200" height="52" rx="10" fill="#624b88"/><text class="label" x="170" y="559" text-anchor="middle">assemble</text><text class="body" x="310" y="559">instruction encodings + section-relative symbols + relocations</text><rect class="panel" x="55" y="620" width="1080" height="145" rx="16"/><text class="head" x="80" y="660">Still unknown in source.o</text><text class="body" x="80" y="700">final addresses · external definitions · startup objects/libraries · executable PT_LOAD mapping plan</text><text class="body" x="80" y="735">The compiler driver coordinates these tools; it does not erase their artifact boundaries.</text></svg>
