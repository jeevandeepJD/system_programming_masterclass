<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Day 3: ownership, borrowing, reachability, lifetime</title><desc id="desc">An allocation graph separates the sole cleanup obligation from temporary aliases and demonstrates how reachability alone does not establish ownership.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker>
<marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#75e6a4"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.mono{font-family:monospace;font-size:18px}.label{font-size:18px;font-weight:700}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}.box{stroke:#f7fbff;stroke-width:2}.arrow{fill:none;stroke:#ffd166;stroke-width:4;marker-end:url(#arrow)}.garrow{fill:none;stroke:#75e6a4;stroke-width:4;marker-end:url(#green-arrow)}.dash{fill:none;stroke:#ff7b7b;stroke-width:3;stroke-dasharray:9 7}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><rect x="2" y="2" width="1186" height="836" fill="none" stroke="#6fa8dc" stroke-width="2"/>
<text class="title" x="50" y="58">Day 3: ownership, borrowing, reachability, lifetime</text><rect class="box" x="70" y="130" width="250" height="130" rx="14" fill="#1b6444"/><text class="head" x="195.0" y="166" text-anchor="middle">owner: document</text><text class="body" x="195.0" y="198" text-anchor="middle">must destroy graph</text><text class="body" x="195.0" y="225" text-anchor="middle">lifetime authority</text><path class="garrow" d="M320 195 L470 195"/><text class="label" x="395.0" y="185.0" text-anchor="middle">owns</text><rect class="box" x="480" y="125" width="250" height="140" rx="14" fill="#176b72"/><text class="head" x="605.0" y="161" text-anchor="middle">allocation A</text><text class="body" x="605.0" y="193" text-anchor="middle">node + payload</text><text class="body" x="605.0" y="220" text-anchor="middle">reachable</text><path class="garrow" d="M730 195 L885 195"/><text class="label" x="807.5" y="185.0" text-anchor="middle">owns child</text><rect class="box" x="895" y="125" width="220" height="140" rx="14" fill="#315a88"/><text class="head" x="1005.0" y="161" text-anchor="middle">allocation B</text><text class="body" x="1005.0" y="193" text-anchor="middle">string bytes</text><text class="body" x="1005.0" y="220" text-anchor="middle">reachable</text><rect class="box" x="70" y="355" width="250" height="120" rx="14" fill="#624b88"/><text class="head" x="195.0" y="391" text-anchor="middle">borrower: parser</text><text class="body" x="195.0" y="423" text-anchor="middle">may read A</text><text class="body" x="195.0" y="450" text-anchor="middle">must not free</text><path class="arrow" d="M320 415 L480 245"/><text class="label" x="400.0" y="320.0" text-anchor="middle">borrow until return</text><rect class="box" x="70" y="555" width="250" height="120" rx="14" fill="#7d3850"/><text class="head" x="195.0" y="591" text-anchor="middle">stale alias</text><text class="body" x="195.0" y="623" text-anchor="middle">same address bits</text><text class="body" x="195.0" y="650" text-anchor="middle">after destroy</text><path class="dash" d="M320 615 L480 265"/><text class="label" x="420" y="520" fill="#ff7b7b">invalid after lifetime end</text><rect class="panel" x="455" y="335" width="660" height="340" rx="16"/><text class="head" x="485" y="380">State transitions</text><rect class="box" x="490" y="420" width="170" height="90" rx="14" fill="#176b72"/><text class="head" x="575.0" y="456" text-anchor="middle">reachable</text><text class="body" x="575.0" y="488" text-anchor="middle">owner exists</text><path class="arrow" d="M660 465 L770 465"/><text class="label" x="715.0" y="455.0" text-anchor="middle">destroy</text><rect class="box" x="780" y="420" width="290" height="90" rx="14" fill="#7d3850"/><text class="head" x="925.0" y="456" text-anchor="middle">lifetime ended</text><text class="body" x="925.0" y="488" text-anchor="middle">all aliases dangling</text><rect class="box" x="490" y="555" width="190" height="90" rx="14" fill="#9a6518"/><text class="head" x="585.0" y="591" text-anchor="middle">reachable</text><text class="body" x="585.0" y="623" text-anchor="middle">no owner</text><path class="arrow" d="M680 600 L790 600"/><text class="label" x="735.0" y="590.0" text-anchor="middle">last alias lost</text><rect class="box" x="800" y="555" width="270" height="90" rx="14" fill="#7d3850"/><text class="head" x="935.0" y="591" text-anchor="middle">unreachable leak</text><text class="body" x="935.0" y="623" text-anchor="middle">cleanup impossible</text><text class="body" x="595" y="755" text-anchor="middle">Invariant: exactly one stated cleanup responsibility (or a stated shared-ownership protocol).</text></svg>
