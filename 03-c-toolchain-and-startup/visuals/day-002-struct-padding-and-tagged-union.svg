<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Day 2: structure layout and tagged union states</title><desc id="desc">A byte-accurate structure layout shows interior and tail padding; a tagged union shows overlapping storage and the software invariant that selects the active member.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker>
<marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#75e6a4"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.mono{font-family:monospace;font-size:18px}.label{font-size:18px;font-weight:700}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}.box{stroke:#f7fbff;stroke-width:2}.arrow{fill:none;stroke:#ffd166;stroke-width:4;marker-end:url(#arrow)}.garrow{fill:none;stroke:#75e6a4;stroke-width:4;marker-end:url(#green-arrow)}.dash{fill:none;stroke:#ff7b7b;stroke-width:3;stroke-dasharray:9 7}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><rect x="2" y="2" width="1186" height="836" fill="none" stroke="#6fa8dc" stroke-width="2"/>
<text class="title" x="50" y="58">Day 2: structure layout and tagged union states</text><text class="head" x="55" y="110">struct record { char tag; uint32_t count; uint16_t flags; }</text><rect class="box" x="55" y="150" width="120" height="100" fill="#176b72"/><text class="label" x="115.0" y="192" text-anchor="middle">tag</text><text class="body" x="115.0" y="224" text-anchor="middle">1 B</text><rect class="box" x="175" y="150" width="300" height="100" fill="#7d3850"/><text class="label" x="325.0" y="192" text-anchor="middle">padding</text><text class="body" x="325.0" y="224" text-anchor="middle">3 B</text><rect class="box" x="475" y="150" width="400" height="100" fill="#315a88"/><text class="label" x="675.0" y="192" text-anchor="middle">count</text><text class="body" x="675.0" y="224" text-anchor="middle">4 B</text><rect class="box" x="875" y="150" width="200" height="100" fill="#624b88"/><text class="label" x="975.0" y="192" text-anchor="middle">flags</text><text class="body" x="975.0" y="224" text-anchor="middle">2 B</text><rect class="box" x="1075" y="150" width="60" height="100" fill="#7d3850"/><text class="label" x="1105.0" y="192" text-anchor="middle">pad</text><text class="body" x="1105.0" y="224" text-anchor="middle">2 B</text><text class="body" x="55" y="285">offset 0</text><text class="body" x="475" y="285">offset 4</text><text class="body" x="875" y="285">offset 8</text><text class="body" x="1075" y="285">10</text><path class="arrow" d="M55 325 L1135 325"/><text class="label" x="595.0" y="315.0" text-anchor="middle">sizeof = 12; tail padding aligns array[i+1] to 4 bytes</text><rect class="panel" x="55" y="390" width="1080" height="350" rx="16"/><text class="head" x="80" y="430">Tagged union: tag owns interpretation</text><rect class="box" x="85" y="475" width="225" height="120" rx="14" fill="#9a6518"/><text class="head" x="197.5" y="511" text-anchor="middle">kind</text><text class="body" x="197.5" y="543" text-anchor="middle">VALUE_NUMBER</text><text class="body" x="197.5" y="570" text-anchor="middle">or VALUE_REAL</text><path class="arrow" d="M310 535 L440 535"/><text class="label" x="375.0" y="525.0" text-anchor="middle">selects</text><rect class="box" x="450" y="465" width="330" height="150" rx="14" fill="#315a88"/><text class="head" x="615" y="505" text-anchor="middle">same 4 bytes</text><text class="body" x="615" y="545" text-anchor="middle">uint32_t number</text><text class="body" x="615" y="580" text-anchor="middle">float real (overlaps)</text><path class="garrow" d="M780 535 L940 535"/><text class="label" x="860.0" y="525.0" text-anchor="middle">checked read</text><rect class="box" x="950" y="475" width="155" height="120" rx="14" fill="#1b6444"/><text class="head" x="1027.5" y="511" text-anchor="middle">switch(kind)</text><text class="body" x="1027.5" y="543" text-anchor="middle">read only</text><text class="body" x="1027.5" y="570" text-anchor="middle">active member</text><text class="body" x="80" y="670">Responsibility: ABI/compiler chooses member offsets; application policy keeps tag and active member consistent.</text><text class="body" x="80" y="705">Raw struct bytes also contain padding—serialize fields, not the object representation.</text></svg>
