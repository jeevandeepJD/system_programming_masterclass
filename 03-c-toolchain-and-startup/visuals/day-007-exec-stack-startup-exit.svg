<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Day 7: exec, initial stack, startup, and exit</title><desc id="desc">Kernel and user-space lanes trace execve through PT_INTERP, the initial argc argv envp auxv stack, dynamic linking, crt and constructors, main, atexit, and kernel termination.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker>
<marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#75e6a4"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.mono{font-family:monospace;font-size:18px}.label{font-size:18px;font-weight:700}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}.box{stroke:#f7fbff;stroke-width:2}.arrow{fill:none;stroke:#ffd166;stroke-width:4;marker-end:url(#arrow)}.garrow{fill:none;stroke:#75e6a4;stroke-width:4;marker-end:url(#green-arrow)}.dash{fill:none;stroke:#ff7b7b;stroke-width:3;stroke-dasharray:9 7}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><rect x="2" y="2" width="1186" height="836" fill="none" stroke="#6fa8dc" stroke-width="2"/>
<text class="title" x="50" y="58">Day 7: exec, initial stack, startup, and exit</text><rect class="panel" x="35" y="95" width="320" height="665" rx="16"/><text class="head" x="60" y="135">Linux kernel lane</text><rect class="box" x="60" y="175" width="270" height="105" rx="14" fill="#9a6518"/><text class="head" x="195.0" y="211" text-anchor="middle">execve succeeds</text><text class="body" x="195.0" y="243" text-anchor="middle">validate ELF</text><text class="body" x="195.0" y="270" text-anchor="middle">replace old image</text><rect class="box" x="60" y="320" width="270" height="140" rx="14" fill="#315a88"/><text class="head" x="195.0" y="356" text-anchor="middle">map startup image</text><text class="body" x="195.0" y="388" text-anchor="middle">PT_LOAD executable</text><text class="body" x="195.0" y="415" text-anchor="middle">PT_INTERP → ld.so</text><text class="body" x="195.0" y="442" text-anchor="middle">set user entry</text><path class="arrow" d="M195 280 L195 310"/><rect class="box" x="60" y="500" width="270" height="190" rx="14" fill="#624b88"/><text class="head" x="195.0" y="536" text-anchor="middle">initial stack</text><text class="body" x="195.0" y="568" text-anchor="middle">argc</text><text class="body" x="195.0" y="595" text-anchor="middle">argv[] → strings</text><text class="body" x="195.0" y="622" text-anchor="middle">envp[] → strings</text><text class="body" x="195.0" y="649" text-anchor="middle">auxv: AT_ENTRY, AT_BASE…</text><path class="arrow" d="M195 460 L195 490"/><text class="label" x="195.0" y="465.0" text-anchor="middle">construct</text><rect class="panel" x="390" y="95" width="355" height="665" rx="16"/><text class="head" x="415" y="135">rtld + libc lane (user)</text><rect class="box" x="420" y="175" width="295" height="135" rx="14" fill="#7d3850"/><text class="head" x="567.5" y="211" text-anchor="middle">dynamic linker</text><text class="body" x="567.5" y="243" text-anchor="middle">map DT_NEEDED</text><text class="body" x="567.5" y="270" text-anchor="middle">apply relocations</text><text class="body" x="567.5" y="297" text-anchor="middle">RELRO / TLS setup</text><rect class="box" x="420" y="355" width="295" height="125" rx="14" fill="#315a88"/><text class="head" x="567.5" y="391" text-anchor="middle">_start → libc</text><text class="body" x="567.5" y="423" text-anchor="middle">decode initial stack</text><text class="body" x="567.5" y="450" text-anchor="middle">runtime initialization</text><path class="arrow" d="M567 310 L567 345"/><text class="label" x="567.0" y="317.5" text-anchor="middle">transfer to e_entry</text><rect class="box" x="420" y="525" width="295" height="110" rx="14" fill="#1b6444"/><text class="head" x="567.5" y="561" text-anchor="middle">constructors</text><text class="body" x="567.5" y="593" text-anchor="middle">before application main</text><path class="arrow" d="M567 480 L567 515"/><path class="arrow" d="M330 390 L410 240"/><text class="label" x="370.0" y="305.0" text-anchor="middle">kernel enters ld.so</text><path class="garrow" d="M330 590 L410 420"/><text class="label" x="370.0" y="495.0" text-anchor="middle">stack/register inputs</text><rect class="panel" x="780" y="95" width="375" height="665" rx="16"/><text class="head" x="805" y="135">Application / exit lane</text><rect class="box" x="810" y="190" width="315" height="105" rx="14" fill="#176b72"/><text class="head" x="967.5" y="226" text-anchor="middle">main(argc, argv)</text><text class="body" x="967.5" y="258" text-anchor="middle">application runs</text><text class="body" x="967.5" y="285" text-anchor="middle">returns status 23</text><path class="garrow" d="M715 580 L800 242"/><text class="label" x="757.5" y="401.0" text-anchor="middle">libc calls main</text><path class="arrow" d="M967 295 L967 390"/><text class="label" x="967.0" y="332.5" text-anchor="middle">return</text><rect class="box" x="810" y="400" width="315" height="125" rx="14" fill="#624b88"/><text class="head" x="967.5" y="436" text-anchor="middle">libc exit</text><text class="body" x="967.5" y="468" text-anchor="middle">atexit in reverse order</text><text class="body" x="967.5" y="495" text-anchor="middle">flush/finalize</text><path class="arrow" d="M967 525 L967 620"/><text class="label" x="967.0" y="562.5" text-anchor="middle">exit_group syscall</text><rect class="box" x="810" y="630" width="315" height="90" rx="14" fill="#9a6518"/><text class="head" x="967.5" y="666" text-anchor="middle">kernel termination</text><text class="body" x="967.5" y="698" text-anchor="middle">record status · notify parent</text><text class="body" x="595" y="810" text-anchor="middle">One PID, replaced image: kernel prepares entry; user-space loader and libc—not the kernel—reach main.</text></svg>
