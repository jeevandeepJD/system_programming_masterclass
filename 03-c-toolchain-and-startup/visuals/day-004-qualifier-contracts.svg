<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Day 4: qualifiers are different contracts</title><desc id="desc">Const constrains modification through an access path, volatile marks accesses as significant to an implementation contract, and restrict promises an aliasing discipline.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker>
<marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#75e6a4"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.mono{font-family:monospace;font-size:18px}.label{font-size:18px;font-weight:700}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}.box{stroke:#f7fbff;stroke-width:2}.arrow{fill:none;stroke:#ffd166;stroke-width:4;marker-end:url(#arrow)}.garrow{fill:none;stroke:#75e6a4;stroke-width:4;marker-end:url(#green-arrow)}.dash{fill:none;stroke:#ff7b7b;stroke-width:3;stroke-dasharray:9 7}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><rect x="2" y="2" width="1186" height="836" fill="none" stroke="#6fa8dc" stroke-width="2"/>
<text class="title" x="50" y="58">Day 4: qualifiers are different contracts</text><rect class="box" x="45" y="125" width="325" height="190" rx="14" fill="#176b72"/><text class="head" x="207.5" y="161" text-anchor="middle">const</text><text class="body" x="207.5" y="193" text-anchor="middle">read-only through this path</text><text class="body" x="207.5" y="220" text-anchor="middle">other aliases may modify</text><text class="body" x="207.5" y="247" text-anchor="middle">not synchronization</text><rect class="box" x="410" y="125" width="325" height="190" rx="14" fill="#9a6518"/><text class="head" x="572.5" y="161" text-anchor="middle">volatile</text><text class="body" x="572.5" y="193" text-anchor="middle">perform specified accesses</text><text class="body" x="572.5" y="220" text-anchor="middle">MMIO may need platform rules</text><text class="body" x="572.5" y="247" text-anchor="middle">not atomic / not a fence</text><rect class="box" x="775" y="125" width="325" height="190" rx="14" fill="#624b88"/><text class="head" x="937.5" y="161" text-anchor="middle">restrict</text><text class="body" x="937.5" y="193" text-anchor="middle">programmer aliasing promise</text><text class="body" x="937.5" y="220" text-anchor="middle">enables optimization</text><text class="body" x="937.5" y="247" text-anchor="middle">violation → undefined behavior</text><text class="head" x="55" y="380">Concrete access paths</text><rect class="box" x="55" y="420" width="245" height="115" rx="14" fill="#315a88"/><text class="head" x="177.5" y="456" text-anchor="middle">int value = 1</text><text class="body" x="177.5" y="488" text-anchor="middle">object is modifiable</text><path class="arrow" d="M300 477 L430 477"/><text class="label" x="365.0" y="467.0" text-anchor="middle">const view</text><rect class="box" x="440" y="420" width="250" height="115" rx="14" fill="#176b72"/><text class="head" x="565.0" y="456" text-anchor="middle">const int *view</text><text class="body" x="565.0" y="488" text-anchor="middle">cannot write via view</text><path class="arrow" d="M300 555 L430 610"/><text class="label" x="365.0" y="572.5" text-anchor="middle">non-const alias</text><rect class="box" x="440" y="575" width="250" height="105" rx="14" fill="#1b6444"/><text class="head" x="565.0" y="611" text-anchor="middle">int *owner</text><text class="body" x="565.0" y="643" text-anchor="middle">may write value = 2</text><rect class="box" x="780" y="410" width="330" height="125" rx="14" fill="#624b88"/><text class="head" x="945.0" y="446" text-anchor="middle">restrict arrays</text><text class="body" x="945.0" y="478" text-anchor="middle">out[] · left[] · right[]</text><text class="body" x="945.0" y="505" text-anchor="middle">must honor promised access bases</text><path class="dash" d="M820 590 C900 530 990 530 1070 590"/><text class="label" x="945" y="625" text-anchor="middle" fill="#ff7b7b">forbidden overlap invalidates optimizer assumptions</text><rect class="panel" x="55" y="720" width="1080" height="70" rx="14"/><text class="body" x="595" y="763" text-anchor="middle">Responsibility: types express contracts; platform APIs supply MMIO rules; atomics supply inter-thread ordering.</text></svg>
