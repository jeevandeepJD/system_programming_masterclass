<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Day 6: PIC call through PLT, GOT, and runtime relocation</title><desc id="desc">Position-independent call code reaches a PLT stub; GOT state either invokes the resolver or directly names the mapped function after dynamic relocation.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker>
<marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#75e6a4"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.mono{font-family:monospace;font-size:18px}.label{font-size:18px;font-weight:700}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}.box{stroke:#f7fbff;stroke-width:2}.arrow{fill:none;stroke:#ffd166;stroke-width:4;marker-end:url(#arrow)}.garrow{fill:none;stroke:#75e6a4;stroke-width:4;marker-end:url(#green-arrow)}.dash{fill:none;stroke:#ff7b7b;stroke-width:3;stroke-dasharray:9 7}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><rect x="2" y="2" width="1186" height="836" fill="none" stroke="#6fa8dc" stroke-width="2"/>
<text class="title" x="50" y="58">Day 6: PIC call through PLT, GOT, and runtime relocation</text><rect class="panel" x="45" y="105" width="1100" height="470" rx="16"/><text class="head" x="70" y="145">Runtime call path</text><rect class="box" x="70" y="200" width="205" height="110" rx="14" fill="#315a88"/><text class="head" x="172.5" y="236" text-anchor="middle">PIC call site</text><text class="body" x="172.5" y="268" text-anchor="middle">call transform@PLT</text><text class="body" x="172.5" y="295" text-anchor="middle">no fixed provider base</text><path class="arrow" d="M275 255 L390 255"/><text class="label" x="332.5" y="245.0" text-anchor="middle">PC-relative</text><rect class="box" x="400" y="200" width="190" height="110" rx="14" fill="#624b88"/><text class="head" x="495.0" y="236" text-anchor="middle">PLT stub</text><text class="body" x="495.0" y="268" text-anchor="middle">indirect via slot</text><path class="arrow" d="M590 255 L705 255"/><text class="label" x="647.5" y="245.0" text-anchor="middle">lookup slot</text><rect class="box" x="715" y="200" width="190" height="110" rx="14" fill="#9a6518"/><text class="head" x="810.0" y="236" text-anchor="middle">GOT entry</text><text class="body" x="810.0" y="268" text-anchor="middle">writable while bound</text><path class="garrow" d="M905 230 L1020 190"/><text class="label" x="962.5" y="200.0" text-anchor="middle">resolved</text><rect class="box" x="1025" y="145" width="100" height="110" rx="14" fill="#1b6444"/><text class="head" x="1075.0" y="181" text-anchor="middle">transform</text><text class="body" x="1075.0" y="213" text-anchor="middle">in .so</text><path class="arrow" d="M810 310 V400 H590"/><rect class="box" x="390" y="365" width="200" height="110" rx="14" fill="#7d3850"/><text class="head" x="490.0" y="401" text-anchor="middle">ld.so resolver</text><text class="body" x="490.0" y="433" text-anchor="middle">symbol lookup</text><text class="body" x="490.0" y="460" text-anchor="middle">write runtime address</text><path class="garrow" d="M390 420 H260 V330 H715"/><text class="label" x="480" y="530" text-anchor="middle">first use (lazy) or startup (eager): relocation installs chosen address</text><rect class="panel" x="45" y="620" width="1100" height="145" rx="16"/><text class="head" x="70" y="660">Responsibility boundaries</text><text class="body" x="70" y="700">compiler: emit PIC and relocation kinds · static linker: create PLT/GOT + dynamic metadata</text><text class="body" x="70" y="735">dynamic linker: choose definition using actual load bases, write slots, then apply RELRO where eligible</text></svg>
