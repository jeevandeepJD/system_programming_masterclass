<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Day 5: one call, one symbol, one relocation</title><desc id="desc">A relocatable ELF object connects a machine instruction placeholder to an undefined symbol through a relocation record attached to the instruction field.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker>
<marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#75e6a4"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.mono{font-family:monospace;font-size:18px}.label{font-size:18px;font-weight:700}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}.box{stroke:#f7fbff;stroke-width:2}.arrow{fill:none;stroke:#ffd166;stroke-width:4;marker-end:url(#arrow)}.garrow{fill:none;stroke:#75e6a4;stroke-width:4;marker-end:url(#green-arrow)}.dash{fill:none;stroke:#ff7b7b;stroke-width:3;stroke-dasharray:9 7}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><rect x="2" y="2" width="1186" height="836" fill="none" stroke="#6fa8dc" stroke-width="2"/>
<text class="title" x="50" y="58">Day 5: one call, one symbol, one relocation</text><rect class="panel" x="45" y="105" width="400" height="650" rx="16"/><text class="head" x="70" y="145">ET_REL section container</text><rect class="box" x="75" y="180" width="340" height="78" rx="14" fill="#315a88"/><text class="head" x="245.0" y="216" text-anchor="middle">.text</text><text class="body" x="245.0" y="248" text-anchor="middle">machine instructions</text><rect class="box" x="75" y="285" width="340" height="78" rx="14" fill="#176b72"/><text class="head" x="245.0" y="321" text-anchor="middle">.rodata</text><text class="body" x="245.0" y="353" text-anchor="middle">format string</text><rect class="box" x="75" y="390" width="340" height="78" rx="14" fill="#624b88"/><text class="head" x="245.0" y="426" text-anchor="middle">.data / .bss</text><text class="body" x="245.0" y="458" text-anchor="middle">objects / zero-size recipe</text><rect class="box" x="75" y="495" width="340" height="78" rx="14" fill="#9a6518"/><text class="head" x="245.0" y="531" text-anchor="middle">.symtab + .strtab</text><text class="body" x="245.0" y="563" text-anchor="middle">names + bindings</text><rect class="box" x="75" y="600" width="340" height="78" rx="14" fill="#7d3850"/><text class="head" x="245.0" y="636" text-anchor="middle">.rela.text</text><text class="body" x="245.0" y="668" text-anchor="middle">patch rules for .text</text><rect class="panel" x="485" y="105" width="660" height="650" rx="16"/><text class="head" x="510" y="145">Call-site evidence chain</text><rect class="box" x="525" y="190" width="580" height="100" rx="14" fill="#315a88"/><text class="head" x="815.0" y="226" text-anchor="middle">.text + 0x24</text><text class="body" x="815.0" y="258" text-anchor="middle">e8 00 00 00 00    call &lt;placeholder&gt;</text><path class="arrow" d="M815 290 L815 365"/><text class="label" x="815.0" y="317.5" text-anchor="middle">relocation applies here</text><rect class="box" x="525" y="375" width="580" height="125" rx="14" fill="#7d3850"/><text class="head" x="815.0" y="411" text-anchor="middle">.rela.text entry</text><text class="body" x="815.0" y="443" text-anchor="middle">offset = 0x25</text><text class="body" x="815.0" y="470" text-anchor="middle">type = R_X86_64_PLT32</text><text class="body" x="815.0" y="497" text-anchor="middle">symbol = external_adjust · addend = -4</text><path class="arrow" d="M815 500 L815 575"/><text class="label" x="815.0" y="527.5" text-anchor="middle">references</text><rect class="box" x="525" y="585" width="580" height="105" rx="14" fill="#9a6518"/><text class="head" x="815.0" y="621" text-anchor="middle">.symtab: external_adjust</text><text class="body" x="815.0" y="653" text-anchor="middle">binding GLOBAL · section UND</text><text class="body" x="815.0" y="680" text-anchor="middle">definition must arrive later</text><text class="body" x="595" y="800" text-anchor="middle">The relocation records both where to patch and which ABI calculation to perform after layout.</text></svg>
