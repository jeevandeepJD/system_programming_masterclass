<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Week 3: typed C to orderly exit</title><desc id="desc">A responsibility-aware roadmap from typed objects and lifetimes through translation, linking, ELF loading, dynamic startup, main, and exit.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker>
<marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#75e6a4"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.mono{font-family:monospace;font-size:18px}.label{font-size:18px;font-weight:700}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}.box{stroke:#f7fbff;stroke-width:2}.arrow{fill:none;stroke:#ffd166;stroke-width:4;marker-end:url(#arrow)}.garrow{fill:none;stroke:#75e6a4;stroke-width:4;marker-end:url(#green-arrow)}.dash{fill:none;stroke:#ff7b7b;stroke-width:3;stroke-dasharray:9 7}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><rect x="2" y="2" width="1186" height="836" fill="none" stroke="#6fa8dc" stroke-width="2"/>
<text class="title" x="50" y="58">Week 3: typed C to orderly exit</text><text class="body" x="50" y="92">Each arrow names the component that transforms the artifact or transfers responsibility.</text><rect class="box" x="35" y="130" width="255" height="115" rx="14" fill="#176b72"/><text class="head" x="162.5" y="166" text-anchor="middle">Typed C + lifetime</text><text class="body" x="162.5" y="198" text-anchor="middle">objects · pointers · contracts</text><rect class="box" x="322" y="130" width="255" height="115" rx="14" fill="#315a88"/><text class="head" x="449.5" y="166" text-anchor="middle">Translation unit</text><text class="body" x="449.5" y="198" text-anchor="middle">preprocessed source</text><rect class="box" x="609" y="130" width="255" height="115" rx="14" fill="#624b88"/><text class="head" x="736.5" y="166" text-anchor="middle">ET_REL object</text><text class="body" x="736.5" y="198" text-anchor="middle">code · symbols · relocations</text><rect class="box" x="896" y="130" width="255" height="115" rx="14" fill="#7d3850"/><text class="head" x="1023.5" y="166" text-anchor="middle">Linked ELF</text><text class="body" x="1023.5" y="198" text-anchor="middle">layout · PT_LOAD plan</text><rect class="box" x="35" y="350" width="255" height="115" rx="14" fill="#9a6518"/><text class="head" x="162.5" y="386" text-anchor="middle">Kernel exec</text><text class="body" x="162.5" y="418" text-anchor="middle">maps image · stack · PT_INTERP</text><rect class="box" x="322" y="350" width="255" height="115" rx="14" fill="#1b6444"/><text class="head" x="449.5" y="386" text-anchor="middle">Dynamic linker + libc</text><text class="body" x="449.5" y="418" text-anchor="middle">dependencies · relocations · crt</text><rect class="box" x="609" y="350" width="255" height="115" rx="14" fill="#176b72"/><text class="head" x="736.5" y="386" text-anchor="middle">main</text><text class="body" x="736.5" y="418" text-anchor="middle">application policy</text><rect class="box" x="896" y="350" width="255" height="115" rx="14" fill="#7d3850"/><text class="head" x="1023.5" y="386" text-anchor="middle">exit / termination</text><text class="body" x="1023.5" y="418" text-anchor="middle">atexit → syscall → status</text><path class="arrow" d="M290 187 L312 187"/><text class="label" x="301.0" y="177.0" text-anchor="middle">preprocessor</text><path class="arrow" d="M577 187 L599 187"/><text class="label" x="588.0" y="177.0" text-anchor="middle">compiler + assembler</text><path class="arrow" d="M864 187 L886 187"/><text class="label" x="875.0" y="177.0" text-anchor="middle">static linker</text><path class="arrow" d="M1023 245 V300 H162 V340"/><text class="label" x="590" y="287" text-anchor="middle">execve: file becomes a process image</text><path class="arrow" d="M290 407 L312 407"/><text class="label" x="301.0" y="397.0" text-anchor="middle">kernel → user</text><path class="arrow" d="M577 407 L599 407"/><text class="label" x="588.0" y="397.0" text-anchor="middle">crt/libc calls</text><path class="arrow" d="M864 407 L886 407"/><text class="label" x="875.0" y="397.0" text-anchor="middle">return / exit</text><rect class="panel" x="35" y="535" width="1120" height="235" rx="16"/><text class="head" x="60" y="575">Authority lanes</text><text class="label" x="75" y="615" fill="#59d8e6">ISO C / compiler</text><text class="body" x="330" y="615">meaning, lifetime, legal transformations</text><text class="label" x="75" y="653" fill="#59d8e6">Linker + ELF ABI</text><text class="body" x="330" y="653">composition, addresses, executable load plan</text><text class="label" x="75" y="691" fill="#59d8e6">Linux kernel</text><text class="body" x="330" y="691">replace image, map PT_LOAD + interpreter, construct initial stack</text><text class="label" x="75" y="729" fill="#59d8e6">User-space rtld / libc</text><text class="body" x="330" y="729">map dependencies, relocate, initialize, call main, clean up</text></svg>
