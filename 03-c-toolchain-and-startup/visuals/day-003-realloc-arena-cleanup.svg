<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Day 3: failure-safe resize and cleanup paths</title><desc id="desc">A realloc decision preserves the old owner on failure, while a reverse-order cleanup ladder and arena boundary show two explicit lifetime strategies.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker>
<marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#75e6a4"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.mono{font-family:monospace;font-size:18px}.label{font-size:18px;font-weight:700}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}.box{stroke:#f7fbff;stroke-width:2}.arrow{fill:none;stroke:#ffd166;stroke-width:4;marker-end:url(#arrow)}.garrow{fill:none;stroke:#75e6a4;stroke-width:4;marker-end:url(#green-arrow)}.dash{fill:none;stroke:#ff7b7b;stroke-width:3;stroke-dasharray:9 7}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><rect x="2" y="2" width="1186" height="836" fill="none" stroke="#6fa8dc" stroke-width="2"/>
<text class="title" x="50" y="58">Day 3: failure-safe resize and cleanup paths</text><text class="head" x="55" y="110">Failure-safe realloc</text><rect class="box" x="55" y="145" width="230" height="105" rx="14" fill="#176b72"/><text class="head" x="170.0" y="181" text-anchor="middle">buffer owns A</text><text class="body" x="170.0" y="213" text-anchor="middle">capacity = 64</text><path class="arrow" d="M285 198 L450 198"/><text class="label" x="367.5" y="188.0" text-anchor="middle">tmp = realloc(A, 128)</text><rect class="box" x="460" y="130" width="250" height="140" rx="14" fill="#9a6518"/><text class="head" x="585.0" y="166" text-anchor="middle">tmp result?</text><text class="body" x="585.0" y="198" text-anchor="middle">NULL or new base B</text><path class="garrow" d="M710 170 L875 145"/><text class="label" x="792.5" y="147.5" text-anchor="middle">success</text><rect class="box" x="885" y="100" width="250" height="105" rx="14" fill="#1b6444"/><text class="head" x="1010.0" y="136" text-anchor="middle">buffer = tmp</text><text class="body" x="1010.0" y="168" text-anchor="middle">B is sole owner</text><path class="arrow" d="M710 225 L875 285"/><text class="label" x="792.5" y="245.0" text-anchor="middle">failure</text><rect class="box" x="885" y="250" width="250" height="110" rx="14" fill="#7d3850"/><text class="head" x="1010.0" y="286" text-anchor="middle">buffer still owns A</text><text class="body" x="1010.0" y="318" text-anchor="middle">handle error safely</text><text class="head" x="55" y="430">Reverse acquisition / cleanup</text><rect class="box" x="55" y="465" width="200" height="90" rx="14" fill="#315a88"/><text class="head" x="155.0" y="501" text-anchor="middle">1 fopen</text><text class="body" x="155.0" y="533" text-anchor="middle">owns file</text><path class="arrow" d="M255 510 L345 510"/><rect class="box" x="355" y="465" width="200" height="90" rx="14" fill="#624b88"/><text class="head" x="455.0" y="501" text-anchor="middle">2 malloc</text><text class="body" x="455.0" y="533" text-anchor="middle">owns buffer</text><path class="arrow" d="M555 510 L645 510"/><rect class="box" x="655" y="465" width="200" height="90" rx="14" fill="#9a6518"/><text class="head" x="755.0" y="501" text-anchor="middle">3 work</text><text class="body" x="755.0" y="533" text-anchor="middle">may fail</text><path class="garrow" d="M755 555 V620 H455 V570"/><text class="label" x="610" y="650" text-anchor="middle">cleanup: free buffer → fclose file</text><rect class="panel" x="885" y="430" width="250" height="260" rx="16"/><text class="head" x="1010" y="470" text-anchor="middle">Arena policy</text><rect class="box" x="920" y="505" width="180" height="70" fill="#176b72"/><text class="body" x="1010" y="548" text-anchor="middle">A | pad | B | free</text><line class="dash" x1="910" y1="610" x2="1110" y2="610"/><text class="body" x="1010" y="645" text-anchor="middle">arena_destroy:</text><text class="body" x="1010" y="675" text-anchor="middle">all slices die together</text><text class="body" x="595" y="770" text-anchor="middle">Never overwrite the sole owner until resize succeeds; every failure edge reaches valid cleanup.</text></svg>
