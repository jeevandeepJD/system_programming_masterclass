<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Day 1: row-major bytes, terminators, and lifetime</title><desc id="desc">A concrete grid demonstrates row stride, while a string view distinguishes the NUL terminator from capacity and marks the object-lifetime boundary.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker>
<marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#75e6a4"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.mono{font-family:monospace;font-size:18px}.label{font-size:18px;font-weight:700}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}.box{stroke:#f7fbff;stroke-width:2}.arrow{fill:none;stroke:#ffd166;stroke-width:4;marker-end:url(#arrow)}.garrow{fill:none;stroke:#75e6a4;stroke-width:4;marker-end:url(#green-arrow)}.dash{fill:none;stroke:#ff7b7b;stroke-width:3;stroke-dasharray:9 7}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><rect x="2" y="2" width="1186" height="836" fill="none" stroke="#6fa8dc" stroke-width="2"/>
<text class="title" x="50" y="58">Day 1: row-major bytes, terminators, and lifetime</text><text class="head" x="55" y="110">int grid[3][4] — one contiguous object</text><rect class="box" x="75" y="145" width="115" height="70" fill="#176b72"/><text class="mono" x="132" y="187" text-anchor="middle">[0][0]</text><rect class="box" x="200" y="145" width="115" height="70" fill="#176b72"/><text class="mono" x="257" y="187" text-anchor="middle">[0][1]</text><rect class="box" x="325" y="145" width="115" height="70" fill="#176b72"/><text class="mono" x="382" y="187" text-anchor="middle">[0][2]</text><rect class="box" x="450" y="145" width="115" height="70" fill="#176b72"/><text class="mono" x="507" y="187" text-anchor="middle">[0][3]</text><rect class="box" x="75" y="233" width="115" height="70" fill="#315a88"/><text class="mono" x="132" y="275" text-anchor="middle">[1][0]</text><rect class="box" x="200" y="233" width="115" height="70" fill="#315a88"/><text class="mono" x="257" y="275" text-anchor="middle">[1][1]</text><rect class="box" x="325" y="233" width="115" height="70" fill="#315a88"/><text class="mono" x="382" y="275" text-anchor="middle">[1][2]</text><rect class="box" x="450" y="233" width="115" height="70" fill="#315a88"/><text class="mono" x="507" y="275" text-anchor="middle">[1][3]</text><rect class="box" x="75" y="321" width="115" height="70" fill="#624b88"/><text class="mono" x="132" y="363" text-anchor="middle">[2][0]</text><rect class="box" x="200" y="321" width="115" height="70" fill="#624b88"/><text class="mono" x="257" y="363" text-anchor="middle">[2][1]</text><rect class="box" x="325" y="321" width="115" height="70" fill="#624b88"/><text class="mono" x="382" y="363" text-anchor="middle">[2][2]</text><rect class="box" x="450" y="321" width="115" height="70" fill="#624b88"/><text class="mono" x="507" y="363" text-anchor="middle">[2][3]</text><path class="arrow" d="M75 425 L575 425"/><text class="label" x="325.0" y="415.0" text-anchor="middle">row stride = 4 × sizeof(int) = 16 bytes</text><rect class="panel" x="635" y="120" width="500" height="360" rx="16"/><text class="head" x="660" y="160">char msg[8] = "hello"</text><rect class="box" x="660" y="205" width="50" height="65" fill="#176b72"/><text class="mono" x="685" y="246" text-anchor="middle">h</text><rect class="box" x="715" y="205" width="50" height="65" fill="#176b72"/><text class="mono" x="740" y="246" text-anchor="middle">e</text><rect class="box" x="770" y="205" width="50" height="65" fill="#176b72"/><text class="mono" x="795" y="246" text-anchor="middle">l</text><rect class="box" x="825" y="205" width="50" height="65" fill="#176b72"/><text class="mono" x="850" y="246" text-anchor="middle">l</text><rect class="box" x="880" y="205" width="50" height="65" fill="#176b72"/><text class="mono" x="905" y="246" text-anchor="middle">o</text><rect class="box" x="935" y="205" width="50" height="65" fill="#9a6518"/><text class="mono" x="960" y="246" text-anchor="middle">\0</text><rect class="box" x="990" y="205" width="50" height="65" fill="#263d54"/><text class="mono" x="1015" y="246" text-anchor="middle">0</text><rect class="box" x="1045" y="205" width="50" height="65" fill="#263d54"/><text class="mono" x="1070" y="246" text-anchor="middle">0</text><text class="body" x="660" y="310">strlen = 5: scan stops at the first NUL byte.</text><text class="body" x="660" y="345">capacity = 8: the remaining bytes still belong to msg.</text><path class="arrow" d="M685 390 L950 390"/><text class="label" x="817.5" y="380.0" text-anchor="middle">char *borrow = msg</text><line class="dash" x1="635" y1="510" x2="1135" y2="510"/><text class="label" x="885" y="545" text-anchor="middle" fill="#ff7b7b">scope exits → msg lifetime ends</text><text class="body" x="885" y="580" text-anchor="middle">The pointer bits may remain, but dereference is now invalid.</text><rect class="panel" x="55" y="610" width="1080" height="155" rx="16"/><text class="head" x="80" y="650">Type distinction</text><text class="body" x="80" y="690">grid decays to pointer-to-row: int (*)[4] — not int **. The row width remains in the pointer type.</text><text class="body" x="80" y="725">String safety needs both a lifetime-valid pointer and a bound/terminator contract.</text></svg>
