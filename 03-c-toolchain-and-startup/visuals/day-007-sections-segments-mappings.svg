<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Day 7: sections become PT_LOAD mappings</title><desc id="desc">The linker groups named sections by permission into loadable segments; Linux maps the program-header recipe page-granularly into the replacement process image.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker>
<marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#75e6a4"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.mono{font-family:monospace;font-size:18px}.label{font-size:18px;font-weight:700}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}.box{stroke:#f7fbff;stroke-width:2}.arrow{fill:none;stroke:#ffd166;stroke-width:4;marker-end:url(#arrow)}.garrow{fill:none;stroke:#75e6a4;stroke-width:4;marker-end:url(#green-arrow)}.dash{fill:none;stroke:#ff7b7b;stroke-width:3;stroke-dasharray:9 7}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><rect x="2" y="2" width="1186" height="836" fill="none" stroke="#6fa8dc" stroke-width="2"/>
<text class="title" x="50" y="58">Day 7: sections become PT_LOAD mappings</text><text class="head" x="55" y="110">ELF file organization</text><rect class="box" x="55" y="145" width="150" height="85" fill="#315a88"/><text class="label" x="130" y="195" text-anchor="middle">.text</text><rect class="box" x="225" y="145" width="150" height="85" fill="#176b72"/><text class="label" x="300" y="195" text-anchor="middle">.rodata</text><rect class="box" x="395" y="145" width="150" height="85" fill="#624b88"/><text class="label" x="470" y="195" text-anchor="middle">.data</text><rect class="box" x="565" y="145" width="150" height="85" fill="#9a6518"/><text class="label" x="640" y="195" text-anchor="middle">.bss</text><path class="arrow" d="M755 187 L880 187"/><text class="label" x="817.5" y="177.0" text-anchor="middle">linker groups</text><rect class="box" x="890" y="120" width="245" height="140" rx="14" fill="#7d3850"/><text class="head" x="1012.5" y="156" text-anchor="middle">program headers</text><text class="body" x="1012.5" y="188" text-anchor="middle">PT_LOAD R-X</text><text class="body" x="1012.5" y="215" text-anchor="middle">PT_LOAD R--</text><text class="body" x="1012.5" y="242" text-anchor="middle">PT_LOAD RW-</text><text class="head" x="55" y="325">Process virtual mappings (observed after exec)</text><rect class="box" x="75" y="365" width="390" height="78" rx="14" fill="#315a88"/><text class="head" x="270.0" y="401" text-anchor="middle">R-X</text><text class="body" x="270.0" y="433" text-anchor="middle">code: .text</text><path class="arrow" d="M465 404 L600 404"/><text class="label" x="532.5" y="394.0" text-anchor="middle">kernel mmap</text><rect class="box" x="610" y="365" width="500" height="78" fill="#315a88"/><text class="body" x="635" y="413">virtual pages at load bias + p_vaddr</text><rect class="box" x="75" y="470" width="390" height="78" rx="14" fill="#176b72"/><text class="head" x="270.0" y="506" text-anchor="middle">R--</text><text class="body" x="270.0" y="538" text-anchor="middle">constants: .rodata</text><path class="arrow" d="M465 509 L600 509"/><text class="label" x="532.5" y="499.0" text-anchor="middle">kernel mmap</text><rect class="box" x="610" y="470" width="500" height="78" fill="#176b72"/><text class="body" x="635" y="518">virtual pages at load bias + p_vaddr</text><rect class="box" x="75" y="575" width="390" height="78" rx="14" fill="#624b88"/><text class="head" x="270.0" y="611" text-anchor="middle">RW-</text><text class="body" x="270.0" y="643" text-anchor="middle">data + zero-fill .bss</text><path class="arrow" d="M465 614 L600 614"/><text class="label" x="532.5" y="604.0" text-anchor="middle">kernel mmap</text><rect class="box" x="610" y="575" width="500" height="78" fill="#624b88"/><text class="body" x="635" y="623">virtual pages at load bias + p_vaddr</text><rect class="panel" x="55" y="705" width="1080" height="80" rx="14"/><text class="body" x="595" y="753" text-anchor="middle">Sections serve link/debug views; PT_LOAD entries—with file size, memory size, flags, and alignment—drive loading.</text></svg>
