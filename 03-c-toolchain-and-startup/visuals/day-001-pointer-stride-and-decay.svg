<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Day 1: type controls stride; decay loses length</title><desc id="desc">Typed pointer arithmetic advances by sizeof the pointed-to type, while array decay preserves the first-element address but discards the array extent.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker>
<marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#75e6a4"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.mono{font-family:monospace;font-size:18px}.label{font-size:18px;font-weight:700}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}.box{stroke:#f7fbff;stroke-width:2}.arrow{fill:none;stroke:#ffd166;stroke-width:4;marker-end:url(#arrow)}.garrow{fill:none;stroke:#75e6a4;stroke-width:4;marker-end:url(#green-arrow)}.dash{fill:none;stroke:#ff7b7b;stroke-width:3;stroke-dasharray:9 7}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><rect x="2" y="2" width="1186" height="836" fill="none" stroke="#6fa8dc" stroke-width="2"/>
<text class="title" x="50" y="58">Day 1: type controls stride; decay loses length</text><text class="head" x="55" y="110">Same +1 spelling, different byte movement</text><rect class="box" x="55" y="145" width="190" height="78" rx="14" fill="#176b72"/><text class="head" x="150.0" y="181" text-anchor="middle">char *p</text><text class="body" x="150.0" y="213" text-anchor="middle">stride = 1 byte</text><rect class="box" x="320" y="145" width="45" height="78" fill="#176b72"/><text class="mono" x="342.5" y="192" text-anchor="middle">0</text><rect class="box" x="375" y="145" width="45" height="78" fill="#176b72"/><text class="mono" x="397.5" y="192" text-anchor="middle">1</text><rect class="box" x="430" y="145" width="45" height="78" fill="#176b72"/><text class="mono" x="452.5" y="192" text-anchor="middle">2</text><rect class="box" x="485" y="145" width="45" height="78" fill="#176b72"/><text class="mono" x="507.5" y="192" text-anchor="middle">3</text><path class="arrow" d="M345 245 L400 245"/><text class="label" x="372.5" y="235.0" text-anchor="middle">p + 1 → +1</text><rect class="box" x="55" y="265" width="190" height="78" rx="14" fill="#315a88"/><text class="head" x="150.0" y="301" text-anchor="middle">int *p</text><text class="body" x="150.0" y="333" text-anchor="middle">stride = 4 bytes</text><rect class="box" x="320" y="265" width="45" height="78" fill="#315a88"/><text class="mono" x="342.5" y="312" text-anchor="middle">0</text><rect class="box" x="375" y="265" width="45" height="78" fill="#315a88"/><text class="mono" x="397.5" y="312" text-anchor="middle">1</text><rect class="box" x="430" y="265" width="45" height="78" fill="#315a88"/><text class="mono" x="452.5" y="312" text-anchor="middle">2</text><rect class="box" x="485" y="265" width="45" height="78" fill="#315a88"/><text class="mono" x="507.5" y="312" text-anchor="middle">3</text><path class="arrow" d="M345 365 L400 365"/><text class="label" x="372.5" y="355.0" text-anchor="middle">p + 1 → +4</text><rect class="box" x="55" y="385" width="190" height="78" rx="14" fill="#624b88"/><text class="head" x="150.0" y="421" text-anchor="middle">struct big *p</text><text class="body" x="150.0" y="453" text-anchor="middle">stride = 12 bytes</text><rect class="box" x="320" y="385" width="145" height="78" fill="#624b88"/><text class="mono" x="392.5" y="432" text-anchor="middle">0</text><rect class="box" x="475" y="385" width="145" height="78" fill="#624b88"/><text class="mono" x="547.5" y="432" text-anchor="middle">1</text><rect class="box" x="630" y="385" width="145" height="78" fill="#624b88"/><text class="mono" x="702.5" y="432" text-anchor="middle">2</text><rect class="box" x="785" y="385" width="145" height="78" fill="#624b88"/><text class="mono" x="857.5" y="432" text-anchor="middle">3</text><path class="arrow" d="M345 485 L520 485"/><text class="label" x="432.5" y="475.0" text-anchor="middle">p + 1 → +12</text><rect class="panel" x="55" y="535" width="1080" height="230" rx="16"/><text class="head" x="80" y="575">Array identity at the call boundary</text><rect class="box" x="90" y="610" width="260" height="105" rx="14" fill="#1b6444"/><text class="head" x="220.0" y="646" text-anchor="middle">int a[5]</text><text class="body" x="220.0" y="678" text-anchor="middle">sizeof a = 20</text><text class="body" x="220.0" y="705" text-anchor="middle">count known</text><path class="arrow" d="M350 662 L510 662"/><text class="label" x="430.0" y="652.0" text-anchor="middle">decay</text><rect class="box" x="520" y="610" width="250" height="105" rx="14" fill="#7d3850"/><text class="head" x="645.0" y="646" text-anchor="middle">int *values</text><text class="body" x="645.0" y="678" text-anchor="middle">sizeof = 8</text><text class="body" x="645.0" y="705" text-anchor="middle">count absent</text><path class="garrow" d="M770 662 L930 662"/><text class="label" x="850.0" y="652.0" text-anchor="middle">API repair</text><rect class="box" x="940" y="600" width="165" height="125" rx="14" fill="#176b72"/><text class="head" x="1022.5" y="636" text-anchor="middle">int_span</text><text class="body" x="1022.5" y="668" text-anchor="middle">data → a[0]</text><text class="body" x="1022.5" y="695" text-anchor="middle">count = 5</text><text class="body" x="580" y="750" text-anchor="middle">One-past may be formed; dereference requires an element still inside the array object.</text></svg>
