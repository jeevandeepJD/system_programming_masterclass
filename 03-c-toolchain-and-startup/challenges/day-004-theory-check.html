<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 3 · Day 4 Theory Check — Qualifiers, Atomics, and Undefined Behavior</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#07111b; --panel:#102031; --panel2:#162a3e; --line:#2d4861;
    --text:#eaf3fa; --muted:#9db0c2; --accent:#5bc8ff;
    --ok:#56df9b; --bad:#ff7589; --warn:#ffd06d;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:linear-gradient(145deg,#07111b,#0d1b29);
    color:var(--text); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  main { width:min(880px,100%); margin:auto; padding:32px 18px 80px; }
  header, .question, .result {
    background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:22px; margin-bottom:18px;
  }
  .eyebrow {
    color:var(--accent); font:700 12px ui-monospace,monospace;
    letter-spacing:.1em; text-transform:uppercase;
  }
  h1 { margin:.35rem 0 .5rem; font-size:clamp(25px,5vw,40px); line-height:1.12; }
  .lede { color:var(--muted); margin:.4rem 0 0; }
  fieldset { border:0; padding:0; margin:0; }
  legend { font-weight:700; margin-bottom:14px; width:100%; }
  .option {
    display:flex; gap:11px; align-items:flex-start; padding:11px 13px;
    margin:8px 0; border:1px solid var(--line); border-radius:9px;
    background:var(--panel2); cursor:pointer;
  }
  .option:hover { border-color:var(--accent); }
  .option.correct { border-color:var(--ok); background:#123629; }
  .option.wrong { border-color:var(--bad); background:#3a1822; }
  input { margin-top:.28rem; accent-color:var(--accent); }
  .feedback {
    display:none; margin-top:13px; padding:11px 13px;
    border-left:3px solid var(--accent); color:var(--muted); background:#0a1723;
  }
  .feedback.show { display:block; }
  .unanswered { border-color:var(--warn); }
  .actions { display:flex; gap:12px; flex-wrap:wrap; margin:24px 0; }
  button {
    border:1px solid var(--accent); border-radius:9px; padding:11px 18px;
    background:#173c55; color:var(--text); font:700 15px inherit; cursor:pointer;
  }
  button.secondary { border-color:var(--line); background:transparent; }
  button:hover { filter:brightness(1.14); }
  .result { display:none; text-align:center; }
  .result.show { display:block; }
  .score { color:var(--accent); font-size:32px; font-weight:800; }
  code { font-family:ui-monospace,monospace; color:#bdeaff; }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Week 3 · Day 4 · Theory check</div>
    <h1>Qualifiers, Atomics, and Undefined Behavior</h1>
    <p class="lede">Predict first. Submit once. Explanations remain hidden until
    every question has an attempted answer.</p>
  </header>
  <form id="quiz"></form>
  <div class="actions">
    <button type="button" id="submit">Submit answers</button>
    <button type="button" class="secondary" id="reset">Reset</button>
  </div>
  <section class="result" id="result" aria-live="polite">
    <div class="score" id="score"></div>
    <p id="summary"></p>
  </section>
</main>
<script>
const questions = [{"prompt": "Why does volatile int ready not make payload = 42; ready = 1; a valid cross-thread publication protocol in ISO C?", "options": ["volatile objects can be accessed only by signal handlers.", "volatile preserves relevant accesses but creates neither atomic synchronization nor a happens-before edge for the ordinary payload access.", "volatile always makes ready thread-local.", "The C standard requires volatile stores to occur only after a process-wide mutex is locked."], "answer": 1, "explanation": "volatile concerns externally significant accesses; it is not the C thread-synchronization mechanism. Conflicting ordinary accesses without a happens-before relationship can form a data race, so release/acquire atomics or a lock is needed to publish payload."}, {"prompt": "Why may an optimizer replace return x + 1 > x; with return 1; for int x under ordinary ISO C rules?", "options": ["All target CPUs saturate signed addition at INT_MAX.", "For executions where x + 1 is defined the comparison is true, while signed overflow is undefined and supplies no required wrapping case.", "int is required to have the same representation as unsigned int.", "Relational expressions involving int are evaluated only at translation time."], "answer": 1, "explanation": "The compiler must preserve defined executions. Whenever signed x + 1 is defined, it exceeds x; the INT_MAX case invokes undefined behavior rather than requiring machine-style wraparound, so it does not constrain the optimized result."}, {"prompt": "A producer writes ordinary payload data and then performs a release store to an atomic flag. When may a consumer safely read that payload without making it atomic?", "options": ["After any relaxed load of the flag, regardless of the value observed.", "After an acquire load observes the value from the relevant release sequence, establishing synchronization and happens-before.", "After reading the flag through a volatile-qualified non-atomic pointer.", "Only if the payload and flag happen to occupy one cache line."], "answer": 1, "explanation": "A matching acquire that reads from the release sequence synchronizes with the release. The producer's earlier payload write then happens before the consumer's later payload read, preventing a data race; cache-line placement is not the language guarantee."}, {"prompt": "Which statement correctly distinguishes unspecified from implementation-defined behavior?", "options": ["Both allow arbitrary behavior and require no documented choices.", "Implementation-defined behavior requires the implementation to choose and document a permitted behavior; unspecified behavior need not document which permitted choice occurs.", "Unspecified behavior is always a compile-time error, while implementation-defined behavior is always undefined at runtime.", "Implementation-defined behavior is fixed by the CPU alone, while unspecified behavior is fixed by the linker."], "answer": 1, "explanation": "Both categories retain constraints from the standard, unlike undefined behavior. The distinguishing requirement is documentation: an implementation-defined choice must be documented, while an unspecified choice may vary among permitted alternatives without documentation."}];
const quiz = document.querySelector("#quiz");

function build() {
  quiz.innerHTML = "";
  questions.forEach((q, qi) => {
    const section = document.createElement("section");
    section.className = "question";
    section.dataset.question = qi;
    const fieldset = document.createElement("fieldset");
    const legend = document.createElement("legend");
    legend.textContent = `${qi + 1}. ${q.prompt}`;
    fieldset.appendChild(legend);
    q.options.forEach((option, oi) => {
      const label = document.createElement("label");
      label.className = "option";
      const input = document.createElement("input");
      input.type = "radio";
      input.name = `q${qi}`;
      input.value = oi;
      label.append(input, document.createTextNode(option));
      fieldset.appendChild(label);
    });
    const feedback = document.createElement("div");
    feedback.className = "feedback";
    section.append(fieldset, feedback);
    quiz.appendChild(section);
  });
}

document.querySelector("#submit").addEventListener("click", () => {
  let score = 0;
  let unanswered = 0;
  questions.forEach((q, qi) => {
    const section = quiz.querySelector(`[data-question="${qi}"]`);
    const selected = section.querySelector("input:checked");
    section.classList.toggle("unanswered", !selected);
    const feedback = section.querySelector(".feedback");
    section.querySelectorAll(".option").forEach((label, oi) => {
      label.classList.remove("correct", "wrong");
      if (oi === q.answer) label.classList.add("correct");
      if (selected && Number(selected.value) === oi && oi !== q.answer)
        label.classList.add("wrong");
    });
    if (!selected) {
      unanswered++;
      feedback.textContent = "Choose an answer before reviewing this explanation.";
    } else {
      if (Number(selected.value) === q.answer) score++;
      feedback.textContent = q.explanation;
    }
    feedback.classList.add("show");
  });
  const result = document.querySelector("#result");
  result.classList.add("show");
  document.querySelector("#score").textContent = `${score} / ${questions.length}`;
  document.querySelector("#summary").textContent = unanswered
    ? `${unanswered} question(s) were unanswered. Review, reset, and try again.`
    : score === questions.length
      ? "All correct. Now explain the causal reason for each answer without the options."
      : "Use the explanations to identify the weak concept, not merely the missed option.";
  result.scrollIntoView({behavior:"smooth", block:"center"});
});

document.querySelector("#reset").addEventListener("click", () => {
  build();
  document.querySelector("#result").classList.remove("show");
  window.scrollTo({top:0, behavior:"smooth"});
});

build();
</script>
</body>
</html>
