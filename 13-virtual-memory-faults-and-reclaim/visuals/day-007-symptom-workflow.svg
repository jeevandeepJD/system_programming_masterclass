<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" font-family="sans-serif">
  <title>Symptom to root cause workflow for a deliberate virtual-memory fault</title>
  <desc>Five steps: symptom, layer, source, measurement, and a falsifier. The example is a child SIGSEGV after munmap. An ordinary exit would retire the conclusion. The lab creates no memory pressure.</desc>
  <rect width="1000" height="520" fill="#FBF6EC"/>
  <rect x="2" y="2" width="996" height="516" fill="none" stroke="#142033" stroke-width="3"/>
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#142033"/>
    </marker>
  </defs>
  <text x="28" y="36" font-size="22" font-weight="700" fill="#142033" text-anchor="start">Symptom to a conclusion you can retire</text>
  <text x="28" y="64" font-size="18" font-weight="400" fill="#142033" text-anchor="start">The worked example is the child fault. Do not create pressure.</text>
  <rect x="24" y="100" width="180" height="110" rx="8" fill="#E5F0FA" stroke="#142033" stroke-width="2.5"/>
  <text x="114" y="146" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">1 Symptom</text>
  <text x="114" y="176" font-size="18" font-weight="400" fill="#142033" text-anchor="middle">Child stopped</text>
  <line x1="204" y1="154" x2="220" y2="154" stroke="#142033" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="220" y="100" width="180" height="110" rx="8" fill="#E5F0FA" stroke="#142033" stroke-width="2.5"/>
  <text x="310" y="146" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">2 Layer</text>
  <text x="310" y="176" font-size="18" font-weight="400" fill="#142033" text-anchor="middle">No VMA</text>
  <line x1="400" y1="154" x2="416" y2="154" stroke="#142033" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="416" y="100" width="180" height="110" rx="8" fill="#E5F0FA" stroke="#142033" stroke-width="2.5"/>
  <text x="506" y="146" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">3 Source</text>
  <text x="506" y="176" font-size="18" font-weight="400" fill="#142033" text-anchor="middle">Fault path</text>
  <line x1="596" y1="154" x2="612" y2="154" stroke="#142033" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="612" y="100" width="180" height="110" rx="8" fill="#E5F0FA" stroke="#142033" stroke-width="2.5"/>
  <text x="702" y="146" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">4 Measure</text>
  <text x="702" y="176" font-size="18" font-weight="400" fill="#142033" text-anchor="middle">WTERMSIG</text>
  <line x1="792" y1="154" x2="808" y2="154" stroke="#142033" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="808" y="100" width="180" height="110" rx="8" fill="#FDE8C8" stroke="#142033" stroke-width="2.5"/>
  <text x="898" y="146" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">5 Retire it</text>
  <text x="898" y="176" font-size="18" font-weight="400" fill="#142033" text-anchor="middle">If it exited</text>
  <rect x="24" y="236" width="952" height="256" rx="8" fill="#FFFFFF" stroke="#142033" stroke-width="2.5"/>
  <text x="40" y="274" font-size="20" font-weight="700" fill="#142033" text-anchor="start">Worked example</text>
  <text x="40" y="308" font-size="18" font-weight="400" fill="#142033" text-anchor="start">Symptom: the child store after munmap does not return.</text>
  <text x="40" y="336" font-size="18" font-weight="400" fill="#142033" text-anchor="start">Layer: the address has no VMA. This is not an OOM kill.</text>
  <text x="40" y="364" font-size="18" font-weight="400" fill="#142033" text-anchor="start">Source: maps would have named a VMA; the fault path finds none.</text>
  <text x="40" y="392" font-size="18" font-weight="400" fill="#142033" text-anchor="start">Measurement: mincore was 1 after the write, then SIGSEGV.</text>
  <text x="40" y="420" font-size="18" font-weight="400" fill="#142033" text-anchor="start">Falsifier: WIFEXITED would mean the unmap did not stick.</text>
  <text x="40" y="448" font-size="18" font-weight="400" fill="#142033" text-anchor="start">Leave oom_kill unread as a cause. Confirm it did not move.</text>
</svg>
