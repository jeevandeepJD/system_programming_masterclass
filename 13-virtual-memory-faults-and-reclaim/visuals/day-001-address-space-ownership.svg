<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" font-family="sans-serif">
  <title>Address-space object ownership</title>
  <desc>Two tasks can point at one mm_struct. That mm owns a maple tree of VMAs and a page-table root. A VMA describes a virtual interval and an optional file. A PTE names a physical page. Fork builds a second mm with its own tree and its own root; the physical page may still be shared until a later copy.</desc>
  <defs>
    <pattern id="ownHatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#FFFFFF"/>
      <path d="M0 8 L8 0" stroke="#1D4E89" stroke-width="1.2"/>
    </pattern>
    <pattern id="ownDots" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#E3F6EB"/>
      <circle cx="2" cy="2" r="1.2" fill="#17693F"/>
    </pattern>
    <marker id="ownArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#1B2A4A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#FBF9F4"/>
  <rect x="2" y="2" width="996" height="516" fill="none" stroke="#1B2A4A" stroke-width="2"/>
  <text x="24" y="36" font-size="22" fill="#1B2A4A" font-weight="700">Who owns the address space</text>
  <text x="24" y="62" font-size="18" fill="#1B2A4A">Threads share one mm. Fork builds a second mm. A VMA is not a physical page.</text>

  <rect x="36" y="84" width="200" height="72" rx="8" fill="url(#ownHatch)" stroke="#1D4E89" stroke-width="3"/>
  <text x="136" y="114" font-size="18" fill="#1B2A4A" text-anchor="middle" font-weight="700">task A</text>
  <text x="136" y="138" font-size="18" fill="#1D4E89" text-anchor="middle">.mm pointer</text>

  <rect x="268" y="84" width="200" height="72" rx="8" fill="url(#ownHatch)" stroke="#1D4E89" stroke-width="3"/>
  <text x="368" y="114" font-size="18" fill="#1B2A4A" text-anchor="middle" font-weight="700">task B</text>
  <text x="368" y="138" font-size="18" fill="#1D4E89" text-anchor="middle">same .mm</text>

  <rect x="560" y="84" width="400" height="72" rx="8" fill="#FFFFFF" stroke="#8A4B00" stroke-width="3" stroke-dasharray="7 4"/>
  <text x="760" y="114" font-size="18" fill="#1B2A4A" text-anchor="middle" font-weight="700">task C after fork</text>
  <text x="760" y="138" font-size="18" fill="#8A4B00" text-anchor="middle">a different mm, dashed box</text>

  <line x1="136" y1="156" x2="250" y2="196" stroke="#1B2A4A" stroke-width="3" marker-end="url(#ownArrow)"/>
  <line x1="368" y1="156" x2="300" y2="196" stroke="#1B2A4A" stroke-width="3" marker-end="url(#ownArrow)"/>
  <line x1="760" y1="156" x2="760" y2="196" stroke="#8A4B00" stroke-width="3" marker-end="url(#ownArrow)"/>

  <rect x="120" y="200" width="320" height="100" rx="8" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="3"/>
  <text x="280" y="230" font-size="20" fill="#1B2A4A" text-anchor="middle" font-weight="700">mm_struct</text>
  <text x="280" y="258" font-size="18" fill="#1B2A4A" text-anchor="middle">mm_mt maple tree</text>
  <text x="280" y="282" font-size="18" fill="#1B2A4A" text-anchor="middle">pgd page-table root</text>

  <rect x="560" y="200" width="400" height="100" rx="8" fill="#FFFFFF" stroke="#8A4B00" stroke-width="3" stroke-dasharray="7 4"/>
  <text x="760" y="230" font-size="20" fill="#1B2A4A" text-anchor="middle" font-weight="700">second mm_struct</text>
  <text x="760" y="258" font-size="18" fill="#1B2A4A" text-anchor="middle">own tree, own pgd</text>
  <text x="760" y="282" font-size="18" fill="#8A4B00" text-anchor="middle">may still name the same frame</text>

  <line x1="200" y1="300" x2="160" y2="340" stroke="#1B2A4A" stroke-width="3" marker-end="url(#ownArrow)"/>
  <line x1="360" y1="300" x2="400" y2="340" stroke="#1B2A4A" stroke-width="3" marker-end="url(#ownArrow)"/>

  <rect x="36" y="344" width="250" height="96" rx="8" fill="#FFFFFF" stroke="#1D4E89" stroke-width="3"/>
  <text x="161" y="376" font-size="18" fill="#1D4E89" text-anchor="middle" font-weight="700">VMA in mm_mt</text>
  <text x="161" y="402" font-size="18" fill="#1B2A4A" text-anchor="middle">[start, end) flags</text>
  <text x="161" y="426" font-size="18" fill="#1B2A4A" text-anchor="middle">file or anonymous</text>

  <rect x="320" y="344" width="250" height="96" rx="8" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="3"/>
  <text x="445" y="376" font-size="18" fill="#1B2A4A" text-anchor="middle" font-weight="700">page tables</text>
  <text x="445" y="402" font-size="18" fill="#1B2A4A" text-anchor="middle">pgd to PTE</text>
  <text x="445" y="426" font-size="18" fill="#1B2A4A" text-anchor="middle">one slot per page</text>

  <rect x="604" y="344" width="360" height="96" rx="8" fill="url(#ownDots)" stroke="#17693F" stroke-width="3"/>
  <text x="784" y="376" font-size="18" fill="#17693F" text-anchor="middle" font-weight="700">physical page</text>
  <text x="784" y="402" font-size="18" fill="#1B2A4A" text-anchor="middle">named by the PTE</text>
  <text x="784" y="426" font-size="18" fill="#1B2A4A" text-anchor="middle">dotted box, not a VMA</text>

  <text x="24" y="490" font-size="18" fill="#1B2A4A">Hatched boxes share one mm. The dashed box is the forked mm. The dotted box is the frame the PTE names.</text>
</svg>
