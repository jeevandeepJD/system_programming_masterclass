<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" font-family="sans-serif">
  <title>Buddy split of an order-2 block and a merge of two free siblings</title>
  <desc>An order-2 block splits into an order-0 page for the caller and free buddies at orders 0 and 1. Two free siblings merge upward. A note separates this from page tables and SLUB.</desc>
  <rect width="1000" height="520" fill="#FBF6EC"/>
  <rect x="2" y="2" width="996" height="516" fill="none" stroke="#142033" stroke-width="3"/>
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#142033"/>
    </marker>
  </defs>
  <text x="28" y="36" font-size="22" font-weight="700" fill="#142033" text-anchor="start">Buddy split, then merge</text>
  <text x="28" y="64" font-size="18" font-weight="400" fill="#142033" text-anchor="start">Order counts pages. The sibling is pfn XOR (1 &lt;&lt; order).</text>
  <text x="36" y="104" font-size="20" font-weight="700" fill="#142033" text-anchor="start">Split an order-2 block</text>
  <rect x="36" y="120" width="420" height="64" rx="6" fill="#E5F0FA" stroke="#142033" stroke-width="2.5"/>
  <text x="246" y="158" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">order 2   four pages</text>
  <line x1="246" y1="184" x2="246" y2="210" stroke="#142033" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="36" y="220" width="100" height="78" rx="6" fill="#F8DADA" stroke="#142033" stroke-width="2.5"/>
  <text x="86" y="252" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">order 0</text>
  <text x="86" y="278" font-size="18" font-weight="400" fill="#142033" text-anchor="middle">caller</text>
  <rect x="144" y="220" width="100" height="78" rx="6" fill="#E5F6EC" stroke="#142033" stroke-width="2.5"/>
  <text x="194" y="252" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">order 0</text>
  <text x="194" y="278" font-size="18" font-weight="400" fill="#142033" text-anchor="middle">buddy</text>
  <rect x="252" y="220" width="204" height="78" rx="6" fill="#FDE8C8" stroke="#142033" stroke-width="2.5"/>
  <text x="354" y="252" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">order 1 free</text>
  <text x="354" y="278" font-size="18" font-weight="400" fill="#142033" text-anchor="middle">one block</text>
  <text x="36" y="330" font-size="18" font-weight="400" fill="#142033" text-anchor="start">expand() parks the upper</text>
  <text x="36" y="354" font-size="18" font-weight="400" fill="#142033" text-anchor="start">halves on lower free lists.</text>
  <text x="530" y="104" font-size="20" font-weight="700" fill="#142033" text-anchor="start">Merge while the sibling is free</text>
  <rect x="530" y="120" width="200" height="70" rx="6" fill="#E5F6EC" stroke="#142033" stroke-width="2.5"/>
  <text x="630" y="162" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">order 0 free</text>
  <rect x="746" y="120" width="200" height="70" rx="6" fill="#E5F6EC" stroke="#142033" stroke-width="2.5"/>
  <text x="846" y="162" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">buddy free</text>
  <line x1="730" y1="190" x2="760" y2="230" stroke="#142033" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="600" y="240" width="280" height="70" rx="6" fill="#E5F0FA" stroke="#142033" stroke-width="2.5"/>
  <text x="740" y="282" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">order 1 block</text>
  <text x="530" y="340" font-size="18" font-weight="400" fill="#142033" text-anchor="start">A busy sibling stops the</text>
  <text x="530" y="364" font-size="18" font-weight="400" fill="#142033" text-anchor="start">merge. Pages can be free</text>
  <text x="530" y="388" font-size="18" font-weight="400" fill="#142033" text-anchor="start">and still be the wrong shape.</text>
  <rect x="24" y="420" width="952" height="76" rx="8" fill="#142033" stroke="#142033" stroke-width="0"/>
  <text x="40" y="452" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">Page tables are not this picture.</text>
  <text x="40" y="478" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="start">SLUB carves objects from a page the buddy already handed out.</text>
</svg>
