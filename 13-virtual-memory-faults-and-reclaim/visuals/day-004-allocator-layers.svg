<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" font-family="sans-serif">
  <title>Allocator layers from a C object down to a kernel fault</title>
  <desc>Five rows: C object lifetime, malloc API, userspace arena, brk or mmap VMA, and the write fault that may allocate a folio. free returns a chunk to the arena.</desc>
  <rect width="1000" height="520" fill="#FBF6EC"/>
  <rect x="2" y="2" width="996" height="516" fill="none" stroke="#142033" stroke-width="3"/>
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#142033"/>
    </marker>
  </defs>
  <text x="28" y="36" font-size="22" font-weight="700" fill="#142033" text-anchor="start">Allocator layers and object lifetime</text>
  <text x="28" y="64" font-size="18" font-weight="400" fill="#142033" text-anchor="start">Each row is a different book. free stops on row 3.</text>
  <rect x="24" y="84" width="952" height="76" rx="8" fill="#E5F0FA" stroke="#142033" stroke-width="2.5"/>
  <rect x="36" y="98" width="250" height="48" rx="6" fill="#142033" stroke="#142033" stroke-width="0"/>
  <text x="161" y="128" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1  C object</text>
  <text x="306" y="130" font-size="18" font-weight="400" fill="#142033" text-anchor="start">Lifetime, void*, size, alignment. The caller owns the bytes.</text>
  <rect x="24" y="166" width="952" height="76" rx="8" fill="#E5F6EC" stroke="#142033" stroke-width="2.5"/>
  <rect x="36" y="180" width="250" height="48" rx="6" fill="#142033" stroke="#142033" stroke-width="0"/>
  <text x="161" y="210" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2  malloc API</text>
  <text x="306" y="212" font-size="18" font-weight="400" fill="#142033" text-anchor="start">Returns a pointer or NULL. free ends that object's lifetime.</text>
  <rect x="24" y="248" width="952" height="76" rx="8" fill="#FDE8C8" stroke="#142033" stroke-width="2.5"/>
  <rect x="36" y="262" width="250" height="48" rx="6" fill="#142033" stroke="#142033" stroke-width="0"/>
  <text x="161" y="292" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3  Arena</text>
  <text x="306" y="294" font-size="18" font-weight="400" fill="#142033" text-anchor="start">Chunks and free lists. free returns here. Holes may remain.</text>
  <rect x="24" y="330" width="952" height="76" rx="8" fill="#E5F0FA" stroke="#142033" stroke-width="2.5"/>
  <rect x="36" y="344" width="250" height="48" rx="6" fill="#142033" stroke="#142033" stroke-width="0"/>
  <text x="161" y="374" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4  brk or mmap</text>
  <text x="306" y="376" font-size="18" font-weight="400" fill="#142033" text-anchor="start">A VMA grows or appears. The kernel sees this operation.</text>
  <rect x="24" y="412" width="952" height="76" rx="8" fill="#F8DADA" stroke="#142033" stroke-width="2.5"/>
  <rect x="36" y="426" width="250" height="48" rx="6" fill="#142033" stroke="#142033" stroke-width="0"/>
  <text x="161" y="456" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5  Write fault</text>
  <text x="306" y="458" font-size="18" font-weight="400" fill="#142033" text-anchor="start">do_anonymous_page may allocate a folio. Reads may use the zero page.</text>
</svg>
