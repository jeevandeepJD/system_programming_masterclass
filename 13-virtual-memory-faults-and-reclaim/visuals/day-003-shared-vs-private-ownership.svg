<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" font-family="sans-serif">
  <title>MAP_SHARED and MAP_PRIVATE page ownership</title>
  <desc>A shared mapping and a private mapping can both start from one page-cache folio. A store through MAP_SHARED writes that folio, so pread and other shared mappings observe it. A store through MAP_PRIVATE allocates a new anonymous folio and leaves the cache folio unchanged.</desc>
  <defs>
    <pattern id="shDots" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#E3F6EB"/>
      <circle cx="2" cy="2" r="1.2" fill="#17693F"/>
    </pattern>
    <pattern id="shHatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#FFFFFF"/>
      <path d="M0 8 L8 0" stroke="#1D4E89" stroke-width="1.2"/>
    </pattern>
    <marker id="shArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#1B2A4A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#FBF9F4"/>
  <rect x="2" y="2" width="996" height="516" fill="none" stroke="#1B2A4A" stroke-width="2"/>
  <text x="24" y="34" font-size="22" fill="#1B2A4A" font-weight="700">Shared store versus private store</text>
  <text x="24" y="58" font-size="18" fill="#1B2A4A">Dotted box: page-cache folio. Hatched box: private anonymous copy.</text>

  <rect x="330" y="76" width="340" height="72" rx="8" fill="url(#shDots)" stroke="#17693F" stroke-width="3"/>
  <text x="500" y="106" font-size="18" fill="#17693F" text-anchor="middle" font-weight="700">page-cache folio</text>
  <text x="500" y="130" font-size="18" fill="#1B2A4A" text-anchor="middle">one file offset, dotted</text>

  <rect x="36" y="200" width="280" height="110" rx="8" fill="#FFFFFF" stroke="#17693F" stroke-width="3"/>
  <text x="176" y="232" font-size="18" fill="#17693F" text-anchor="middle" font-weight="700">MAP_SHARED VMA</text>
  <text x="176" y="258" font-size="18" fill="#1B2A4A" text-anchor="middle">PTE names the folio</text>
  <text x="176" y="284" font-size="18" fill="#1B2A4A" text-anchor="middle">store writes the folio</text>

  <rect x="360" y="200" width="280" height="110" rx="8" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="3"/>
  <text x="500" y="232" font-size="18" fill="#1B2A4A" text-anchor="middle" font-weight="700">pread / read</text>
  <text x="500" y="258" font-size="18" fill="#1B2A4A" text-anchor="middle">reads the same folio</text>
  <text x="500" y="284" font-size="18" fill="#1B2A4A" text-anchor="middle">sees the shared store</text>

  <rect x="684" y="200" width="288" height="110" rx="8" fill="url(#shHatch)" stroke="#1D4E89" stroke-width="3"/>
  <text x="828" y="232" font-size="18" fill="#1D4E89" text-anchor="middle" font-weight="700">MAP_PRIVATE VMA</text>
  <text x="828" y="258" font-size="18" fill="#1B2A4A" text-anchor="middle">after the write, hatched</text>
  <text x="828" y="284" font-size="18" fill="#1B2A4A" text-anchor="middle">PTE names a new folio</text>

  <line x1="420" y1="148" x2="200" y2="196" stroke="#17693F" stroke-width="3" marker-end="url(#shArrow)"/>
  <line x1="500" y1="148" x2="500" y2="196" stroke="#17693F" stroke-width="3" marker-end="url(#shArrow)"/>
  <line x1="580" y1="148" x2="800" y2="196" stroke="#1D4E89" stroke-width="3" marker-end="url(#shArrow)"/>

  <rect x="36" y="344" width="440" height="140" rx="8" fill="#FFFFFF" stroke="#17693F" stroke-width="3"/>
  <text x="56" y="378" font-size="20" fill="#17693F" font-weight="700">1  Shared write</text>
  <text x="56" y="408" font-size="18" fill="#1B2A4A">wp_page_shared dirties the cache folio.</text>
  <text x="56" y="434" font-size="18" fill="#1B2A4A">The PTE stays pointed at that folio.</text>
  <text x="56" y="460" font-size="18" fill="#1B2A4A">pread returns the stored byte.</text>

  <rect x="500" y="344" width="472" height="140" rx="8" fill="#FFFFFF" stroke="#1D4E89" stroke-width="3"/>
  <text x="520" y="378" font-size="20" fill="#1D4E89" font-weight="700">2  Private write</text>
  <text x="520" y="408" font-size="18" fill="#1B2A4A">do_cow_fault or wp_page_copy allocates.</text>
  <text x="520" y="434" font-size="18" fill="#1B2A4A">The hatched folio is anonymous.</text>
  <text x="520" y="460" font-size="18" fill="#1B2A4A">pread still returns the cache byte.</text>
</svg>
