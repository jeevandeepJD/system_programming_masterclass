<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" font-family="sans-serif">
  <title>mprotect permission change and TLB invalidation</title>
  <desc>mprotect gathers the range, updates VMA flags through vma_modify_flags, rewrites present PTEs in change_protection, and invalidates cached translations in tlb_finish_mmu. A page that has no PTE yet takes the new permission on its next fault. Another CPU that has this mm loaded is included in the shootdown.</desc>
  <defs>
    <marker id="mpArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#1B2A4A"/>
    </marker>
    <pattern id="mpHatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#FFFFFF"/>
      <path d="M0 8 L8 0" stroke="#8A4B00" stroke-width="1.2"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#FBF9F4"/>
  <rect x="2" y="2" width="996" height="516" fill="none" stroke="#1B2A4A" stroke-width="2"/>
  <text x="24" y="34" font-size="22" fill="#1B2A4A" font-weight="700">mprotect changes permission, then the TLB</text>
  <text x="24" y="58" font-size="18" fill="#1B2A4A">Numbered boxes run in order. The hatched box is the other CPU's stale TLB entry.</text>

  <rect x="24" y="78" width="210" height="78" rx="8" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="3"/>
  <text x="129" y="110" font-size="18" fill="#1B2A4A" text-anchor="middle" font-weight="700">1  mprotect</text>
  <text x="129" y="136" font-size="18" fill="#1B2A4A" text-anchor="middle">user prot bits</text>

  <rect x="264" y="78" width="230" height="78" rx="8" fill="#FFFFFF" stroke="#1D4E89" stroke-width="3"/>
  <text x="379" y="110" font-size="18" fill="#1B2A4A" text-anchor="middle" font-weight="700">2  vma_modify_flags</text>
  <text x="379" y="136" font-size="18" fill="#1D4E89" text-anchor="middle">split or merge the VMA</text>

  <rect x="524" y="78" width="220" height="78" rx="8" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="3"/>
  <text x="634" y="110" font-size="18" fill="#1B2A4A" text-anchor="middle" font-weight="700">3  new vm_flags</text>
  <text x="634" y="136" font-size="18" fill="#1B2A4A" text-anchor="middle">vm_page_prot</text>

  <rect x="768" y="78" width="208" height="78" rx="8" fill="#FFFFFF" stroke="#17693F" stroke-width="3"/>
  <text x="872" y="110" font-size="18" fill="#17693F" text-anchor="middle" font-weight="700">4  PTEs present</text>
  <text x="872" y="136" font-size="18" fill="#1B2A4A" text-anchor="middle">change_protection</text>

  <line x1="234" y1="117" x2="260" y2="117" stroke="#1B2A4A" stroke-width="3" marker-end="url(#mpArrow)"/>
  <line x1="494" y1="117" x2="520" y2="117" stroke="#1B2A4A" stroke-width="3" marker-end="url(#mpArrow)"/>
  <line x1="744" y1="117" x2="764" y2="117" stroke="#1B2A4A" stroke-width="3" marker-end="url(#mpArrow)"/>

  <rect x="24" y="196" width="460" height="120" rx="8" fill="#FFFFFF" stroke="#17693F" stroke-width="3"/>
  <text x="44" y="230" font-size="20" fill="#17693F" font-weight="700">5  tlb_finish_mmu</text>
  <text x="44" y="260" font-size="18" fill="#1B2A4A">Drops this CPU's TLB entry for the</text>
  <text x="44" y="286" font-size="18" fill="#1B2A4A">virtual page whose PTE just changed.</text>

  <rect x="516" y="196" width="460" height="120" rx="8" fill="url(#mpHatch)" stroke="#8A4B00" stroke-width="3"/>
  <text x="536" y="230" font-size="20" fill="#8A4B00" font-weight="700">6  other CPU</text>
  <text x="536" y="260" font-size="18" fill="#1B2A4A">Hatched: a TLB entry cached the</text>
  <text x="536" y="286" font-size="18" fill="#1B2A4A">old permission. The IPI invalidates it.</text>

  <line x1="872" y1="156" x2="250" y2="192" stroke="#17693F" stroke-width="3" marker-end="url(#mpArrow)"/>
  <line x1="250" y1="256" x2="512" y2="256" stroke="#8A4B00" stroke-width="3" marker-end="url(#mpArrow)"/>

  <rect x="24" y="348" width="460" height="140" rx="8" fill="#FFFFFF" stroke="#1D4E89" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="44" y="382" font-size="20" fill="#1D4E89" font-weight="700">No PTE yet</text>
  <text x="44" y="414" font-size="18" fill="#1B2A4A">Dashed box: nothing to flush.</text>
  <text x="44" y="440" font-size="18" fill="#1B2A4A">The next fault reads vm_page_prot</text>
  <text x="44" y="466" font-size="18" fill="#1B2A4A">and installs the new permission.</text>

  <rect x="516" y="348" width="460" height="140" rx="8" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="3"/>
  <text x="536" y="382" font-size="20" fill="#1B2A4A" font-weight="700">After the flush</text>
  <text x="536" y="414" font-size="18" fill="#1B2A4A">A store the VMA no longer allows</text>
  <text x="536" y="440" font-size="18" fill="#1B2A4A">is SIGSEGV, SEGV_ACCERR.</text>
  <text x="536" y="466" font-size="18" fill="#1B2A4A">The page itself is still allocated.</text>
</svg>
