<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" font-family="sans-serif">
  <title>NUMA zonelist from a preferred zone to a fallback, with watermarks</title>
  <desc>Node 0 ZONE_NORMAL is tried first. A fallback zoneref names another zone. Min, low, and high marks sit on one zone. DMA and MOVABLE zones depend on configuration.</desc>
  <rect width="1000" height="520" fill="#FBF6EC"/>
  <rect x="2" y="2" width="996" height="516" fill="none" stroke="#142033" stroke-width="3"/>
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#142033"/>
    </marker>
  </defs>
  <text x="28" y="36" font-size="22" font-weight="700" fill="#142033" text-anchor="start">Zonelist order and zone watermarks</text>
  <text x="28" y="64" font-size="18" font-weight="400" fill="#142033" text-anchor="start">The first zone is the goal. Later zones are fallbacks.</text>
  <rect x="24" y="92" width="440" height="250" rx="8" fill="#FFFFFF" stroke="#142033" stroke-width="2.5"/>
  <text x="40" y="124" font-size="20" font-weight="700" fill="#142033" text-anchor="start">Node 0, preferred</text>
  <rect x="40" y="144" width="400" height="70" rx="6" fill="#E5F6EC" stroke="#142033" stroke-width="2.5"/>
  <text x="240" y="186" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">ZONE_NORMAL  try first</text>
  <rect x="40" y="230" width="400" height="80" rx="6" fill="#FDE8C8" stroke="#142033" stroke-width="2.5"/>
  <text x="240" y="264" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">DMA zones if CONFIG builds them</text>
  <text x="240" y="290" font-size="18" font-weight="400" fill="#142033" text-anchor="middle">ZONE_MOVABLE is optional too</text>
  <line x1="470" y1="210" x2="530" y2="210" stroke="#142033" stroke-width="3" marker-end="url(#arr)"/>
  <text x="500" y="196" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">fallback</text>
  <rect x="536" y="92" width="440" height="250" rx="8" fill="#FFFFFF" stroke="#142033" stroke-width="2.5"/>
  <text x="552" y="124" font-size="20" font-weight="700" fill="#142033" text-anchor="start">Node 1, later in the list</text>
  <rect x="552" y="150" width="400" height="80" rx="6" fill="#E5F0FA" stroke="#142033" stroke-width="2.5"/>
  <text x="752" y="196" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">Next zoneref zone</text>
  <text x="552" y="270" font-size="18" font-weight="400" fill="#142033" text-anchor="start">Locality beats fragmentation</text>
  <text x="552" y="296" font-size="18" font-weight="400" fill="#142033" text-anchor="start">avoidance once the walk</text>
  <text x="552" y="322" font-size="18" font-weight="400" fill="#142033" text-anchor="start">leaves the preferred node.</text>
  <rect x="24" y="360" width="952" height="136" rx="8" fill="#FFFFFF" stroke="#142033" stroke-width="2.5"/>
  <text x="40" y="392" font-size="20" font-weight="700" fill="#142033" text-anchor="start">One zone, three marks</text>
  <rect x="40" y="412" width="120" height="36" rx="6" fill="#F8DADA" stroke="#142033" stroke-width="2.5"/>
  <text x="52" y="436" font-size="18" font-weight="700" fill="#142033" text-anchor="start">min</text>
  <rect x="280" y="412" width="220" height="36" rx="6" fill="#FDE8C8" stroke="#142033" stroke-width="2.5"/>
  <text x="292" y="436" font-size="18" font-weight="700" fill="#142033" text-anchor="start">low  fast path</text>
  <rect x="620" y="412" width="320" height="36" rx="6" fill="#E5F6EC" stroke="#142033" stroke-width="2.5"/>
  <text x="632" y="436" font-size="18" font-weight="700" fill="#142033" text-anchor="start">high  kswapd target</text>
  <text x="40" y="478" font-size="18" font-weight="400" fill="#142033" text-anchor="start">Below low, the fast path skips the zone. kswapd sleeps when a zone meets high.</text>
</svg>
