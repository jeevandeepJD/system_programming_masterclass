<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" font-family="sans-serif">
  <title>Arena fragmentation beside a VMA that stays mapped</title>
  <desc>Before free, used and free chunks alternate. After free, a larger hole appears inside the arena. The VMA bar underneath keeps the same length.</desc>
  <rect width="1000" height="520" fill="#FBF6EC"/>
  <rect x="2" y="2" width="996" height="516" fill="none" stroke="#142033" stroke-width="3"/>
  <text x="28" y="36" font-size="22" font-weight="700" fill="#142033" text-anchor="start">free leaves the VMA mapped</text>
  <text x="28" y="64" font-size="18" font-weight="400" fill="#142033" text-anchor="start">External fragmentation is a shape problem inside the arena.</text>
  <rect x="24" y="88" width="460" height="300" rx="8" fill="#FFFFFF" stroke="#142033" stroke-width="2.5"/>
  <text x="40" y="118" font-size="20" font-weight="700" fill="#142033" text-anchor="start">Arena before free</text>
  <rect x="40" y="150" width="96" height="90" rx="6" fill="#F8DADA" stroke="#142033" stroke-width="2.5"/>
  <text x="88" y="202" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">used</text>
  <rect x="150" y="150" width="96" height="90" rx="6" fill="#E5F6EC" stroke="#142033" stroke-width="2.5"/>
  <text x="198" y="202" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">free</text>
  <rect x="260" y="150" width="96" height="90" rx="6" fill="#F8DADA" stroke="#142033" stroke-width="2.5"/>
  <text x="308" y="202" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">used</text>
  <rect x="370" y="150" width="96" height="90" rx="6" fill="#FDE8C8" stroke="#142033" stroke-width="2.5"/>
  <text x="418" y="202" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">used</text>
  <text x="40" y="280" font-size="18" font-weight="400" fill="#142033" text-anchor="start">Free bytes exist, split</text>
  <text x="40" y="308" font-size="18" font-weight="400" fill="#142033" text-anchor="start">by live objects.</text>
  <text x="40" y="348" font-size="18" font-weight="400" fill="#142033" text-anchor="start">A large request can fail</text>
  <text x="40" y="376" font-size="18" font-weight="400" fill="#142033" text-anchor="start">while the sum looks enough.</text>
  <rect x="516" y="88" width="460" height="300" rx="8" fill="#FFFFFF" stroke="#142033" stroke-width="2.5"/>
  <text x="532" y="118" font-size="20" font-weight="700" fill="#142033" text-anchor="start">Arena after free</text>
  <rect x="532" y="150" width="206" height="90" rx="6" fill="#E5F6EC" stroke="#142033" stroke-width="2.5"/>
  <text x="635" y="202" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">free hole</text>
  <rect x="752" y="150" width="96" height="90" rx="6" fill="#FDE8C8" stroke="#142033" stroke-width="2.5"/>
  <text x="800" y="202" font-size="18" font-weight="700" fill="#142033" text-anchor="middle">used</text>
  <text x="532" y="280" font-size="18" font-weight="400" fill="#142033" text-anchor="start">The chunk joined the hole.</text>
  <text x="532" y="308" font-size="18" font-weight="400" fill="#142033" text-anchor="start">The C object is gone.</text>
  <text x="532" y="348" font-size="18" font-weight="400" fill="#142033" text-anchor="start">The arena still owns</text>
  <text x="532" y="376" font-size="18" font-weight="400" fill="#142033" text-anchor="start">the virtual range.</text>
  <rect x="24" y="404" width="952" height="92" rx="8" fill="#E5F0FA" stroke="#142033" stroke-width="2.5"/>
  <text x="40" y="440" font-size="20" font-weight="700" fill="#142033" text-anchor="start">VMA length</text>
  <rect x="200" y="418" width="740" height="28" rx="4" fill="#0E3A6B" stroke="#0E3A6B" stroke-width="0"/>
  <text x="570" y="438" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">same mapped range after free</text>
  <text x="40" y="480" font-size="18" font-weight="400" fill="#142033" text-anchor="start">Unmap is a later brk shrink or munmap, chosen by the allocator.</text>
</svg>
