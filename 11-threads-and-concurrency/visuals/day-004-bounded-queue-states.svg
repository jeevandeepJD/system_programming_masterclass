<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 1684" role="img" aria-labelledby="title desc">
<title id="title">Bounded producer consumer queue states</title>
<desc id="desc">Three eight-slot ring snapshots show empty, partially occupied and full states, with head tail count, the predicates can put and can get, and condition-variable signals caused by queue transitions.</desc>
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f8fbff}.t{font-size:37px;font-weight:700}.h{font-size:25px;font-weight:700}.b{font-size:19px}.slot{fill:#173f59;stroke:#83d9ff;stroke-width:3}.used{fill:#174f45;stroke:#7ce2bc;stroke-width:3}.wait{fill:#612e3c;stroke:#ff8d9e;stroke-width:3}.panel{fill:#10283a;stroke:#607f98;stroke-width:3}.edge{stroke:#ffd166;stroke-width:5;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1190" height="1684" fill="#08131e"/>
<text class="t" x="55" y="70">One ring, two predicates, three decisive states</text>
<rect class="panel" x="60" y="130" width="1070" height="390" rx="26"/><text class="h" x="95" y="180">EMPTY  |  count = 0  |  head = tail</text>
<g><rect class="slot" x="110" y="245" width="110" height="100"/><rect class="slot" x="230" y="245" width="110" height="100"/><rect class="slot" x="350" y="245" width="110" height="100"/><rect class="slot" x="470" y="245" width="110" height="100"/><rect class="slot" x="590" y="245" width="110" height="100"/><rect class="slot" x="710" y="245" width="110" height="100"/><rect class="slot" x="830" y="245" width="110" height="100"/><rect class="slot" x="950" y="245" width="110" height="100"/></g>
<text class="b" x="110" y="395">can_put: true</text><text class="b" x="410" y="395">can_get: false  ->  consumers wait on not_empty</text>
<rect class="panel" x="60" y="585" width="1070" height="430" rx="26"/><text class="h" x="95" y="635">OCCUPIED  |  count = 3  |  head at oldest  |  tail at next free</text>
<g><rect class="used" x="110" y="710" width="110" height="100"/><rect class="used" x="230" y="710" width="110" height="100"/><rect class="used" x="350" y="710" width="110" height="100"/><rect class="slot" x="470" y="710" width="110" height="100"/><rect class="slot" x="590" y="710" width="110" height="100"/><rect class="slot" x="710" y="710" width="110" height="100"/><rect class="slot" x="830" y="710" width="110" height="100"/><rect class="slot" x="950" y="710" width="110" height="100"/></g>
<text class="b" x="120" y="765">41</text><text class="b" x="240" y="765">42</text><text class="b" x="360" y="765">43</text><text class="b" x="110" y="860">^ head</text><text class="b" x="470" y="860">^ tail</text>
<text class="b" x="110" y="930">put: write tail  ->  advance  ->  count++  ->  signal not_empty</text><text class="b" x="110" y="970">get: read head  ->  advance  ->  count--  ->  signal not_full</text>
<rect class="panel" x="60" y="1080" width="1070" height="390" rx="26"/><text class="h" x="95" y="1130">FULL  |  count = 8  |  head = tail</text>
<g><rect class="used" x="110" y="1205" width="110" height="100"/><rect class="used" x="230" y="1205" width="110" height="100"/><rect class="used" x="350" y="1205" width="110" height="100"/><rect class="used" x="470" y="1205" width="110" height="100"/><rect class="used" x="590" y="1205" width="110" height="100"/><rect class="used" x="710" y="1205" width="110" height="100"/><rect class="used" x="830" y="1205" width="110" height="100"/><rect class="used" x="950" y="1205" width="110" height="100"/></g>
<text class="b" x="110" y="1355">can_get: true</text><text class="b" x="410" y="1355">can_put: false  ->  producers wait on not_full</text>
<rect class="wait" x="150" y="1510" width="890" height="105" rx="20"/><text class="b" x="190" y="1575">head == tail is ambiguous; count distinguishes empty from full.</text>
</svg>
