<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 1684" role="img" aria-labelledby="title desc">
<title id="title">Deadlock cycle, starvation, and ordered liveness</title>
<desc id="desc">Three wait-for graphs distinguish a deadlock cycle, a starvation schedule with continuing system progress, and an acyclic global lock order.</desc>
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f8fbff}.t{font-size:37px;font-weight:700}.h{font-size:25px;font-weight:700}.b{font-size:19px}.dead{fill:#612e3c;stroke:#ff8d9e;stroke-width:3}.starve{fill:#5b441b;stroke:#ffd166;stroke-width:3}.live{fill:#174f45;stroke:#7ce2bc;stroke-width:3}.node{fill:#143f5a;stroke:#83d9ff;stroke-width:3}.edge{stroke:#ffd166;stroke-width:5;fill:none;marker-end:url(#a)}.bad{stroke:#ff8d9e;stroke-width:6;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1190" height="1684" fill="#08131e"/>
<text class="t" x="55" y="70">Liveness failures need different evidence</text>
<rect class="dead" x="60" y="130" width="1070" height="480" rx="28"/><text class="h" x="95" y="180">DEADLOCK  |  closed wait-for cycle; nobody in the cycle can unlock</text>
<circle class="node" cx="250" cy="330" r="85"/><text class="h" x="205" y="340">Thread A</text>
<circle class="node" cx="940" cy="330" r="85"/><text class="h" x="895" y="340">Thread B</text>
<rect class="node" x="460" y="220" width="270" height="95" rx="18"/><text class="h" x="515" y="280">lock 0</text>
<rect class="node" x="460" y="405" width="270" height="95" rx="18"/><text class="h" x="515" y="465">lock 1</text>
<path class="bad" d="M330 300L460 270"/><path class="bad" d="M730 455L860 360"/><path class="edge" d="M860 300L730 270"/><path class="edge" d="M460 455L330 360"/>
<text class="b" x="145" y="550">A owns 0, waits for 1  |  B owns 1, waits for 0  |  timeout detects; it does not repair payload</text>
<rect class="starve" x="60" y="675" width="1070" height="390" rx="28"/><text class="h" x="95" y="725">STARVATION  |  system progresses while one participant never wins</text>
<text class="b" x="125" y="800">round</text><text class="b" x="280" y="800">1</text><text class="b" x="420" y="800">2</text><text class="b" x="560" y="800">3</text><text class="b" x="700" y="800">4</text><text class="b" x="840" y="800">...</text>
<text class="b" x="125" y="870">winner</text><text class="h" x="265" y="870">A</text><text class="h" x="405" y="870">A</text><text class="h" x="545" y="870">A</text><text class="h" x="685" y="870">A</text><text class="h" x="825" y="870">A</text>
<text class="b" x="125" y="940">B remains runnable or repeatedly blocked; no cycle and no fairness bound</text>
<rect class="live" x="60" y="1130" width="1070" height="400" rx="28"/><text class="h" x="95" y="1180">GLOBAL ORDER  |  acyclic waits</text>
<rect class="node" x="125" y="1280" width="280" height="105" rx="18"/><text class="h" x="180" y="1345">rank 0  |  lock 0</text>
<rect class="node" x="760" y="1280" width="280" height="105" rx="18"/><text class="h" x="815" y="1345">rank 1  |  lock 1</text>
<path class="edge" d="M405 1333H760"/>
<text class="b" x="165" y="1460">all acquisitions move toward higher rank; releases run in reverse</text>
<text class="b" x="90" y="1600">Safety asks "can a bad state occur?"  |  Liveness asks "must useful progress eventually occur?"</text>
</svg>
