<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 1684" role="img" aria-labelledby="title desc">
<title id="title">Concurrency evidence sources and their limits</title>
<desc id="desc">Five distinct instruments compare deterministic assertions, sanitizers and Helgrind, GDB, and perf measurements, with the claim each supports and the questions it cannot answer.</desc>
<style>text{font-family:Arial,sans-serif;fill:#f8fbff}.t{font-size:37px;font-weight:700}.h{font-size:24px;font-weight:700}.b{font-size:18px}.assert{fill:#174f45;stroke:#7ce2bc;stroke-width:3}.san{fill:#612e3c;stroke:#ff8d9e;stroke-width:3}.gdb{fill:#493865;stroke:#d1b1ff;stroke-width:3}.perf{fill:#5b441b;stroke:#ffd166;stroke-width:3}.skip{fill:#143f5a;stroke:#83d9ff;stroke-width:3}</style>
<rect width="1190" height="1684" fill="#08131e"/>
<text class="t" x="55" y="70">Evidence is layered; quiet tools are not proofs</text>
<rect class="assert" x="65" y="140" width="1060" height="235" rx="26"/><text class="h" x="105" y="190">DETERMINISTIC ASSERTIONS</text><text class="b" x="105" y="235">supports: exact checked marker for this input and binary</text><text class="b" x="105" y="275">examples: counter = 800000  |  queue sum  |  test_hung = no</text><text class="b" x="105" y="325">does not support: exhaustive schedules, fairness, or race freedom</text>
<rect class="san" x="65" y="420" width="510" height="365" rx="26"/><text class="h" x="105" y="470">SANITIZERS</text><text class="b" x="105" y="515">TSan: modeled conflicting accesses</text><text class="b" x="105" y="555">ASan: poisoned-address violations</text><text class="b" x="105" y="595">UBSan: inserted undefined checks</text><text class="b" x="105" y="650">report = evidence from that run</text><text class="b" x="105" y="690">quiet run is not proof of absence</text><text class="b" x="105" y="735">different flags  ->  different binary</text>
<rect class="san" x="615" y="420" width="510" height="365" rx="26"/><text class="h" x="655" y="470">HELGRIND / MEMCHECK</text><text class="b" x="655" y="515">Helgrind: lock / happens-before model</text><text class="b" x="655" y="555">Memcheck: heap definedness / leaks</text><text class="b" x="655" y="595">different Valgrind tools, different claims</text><text class="b" x="655" y="650">tool warnings need source diagnosis</text><text class="b" x="655" y="690">wrapper may not invoke Helgrind</text><text class="b" x="655" y="735">absence then means "not observed"</text>
<rect class="gdb" x="65" y="830" width="510" height="340" rx="26"/><text class="h" x="105" y="880">GDB SNAPSHOT</text><text class="b" x="105" y="925">threads  |  registers  |  stacks  |  wait sites</text><text class="b" x="105" y="965">supports: architectural state at a stop</text><text class="b" x="105" y="1010">pause changes the schedule</text><text class="b" x="105" y="1050">one stop cannot clear future cycles</text><text class="b" x="105" y="1090">ptrace failure must remain a SKIP</text>
<rect class="perf" x="615" y="830" width="510" height="340" rx="26"/><text class="h" x="655" y="880">PERF / TIMING</text><text class="b" x="655" y="925">cycles  |  misses  |  migrations  |  samples</text><text class="b" x="655" y="965">supports: measured cost on this host</text><text class="b" x="655" y="1010">needs workload and binary identity</text><text class="b" x="655" y="1050">noisy timing is not correctness</text><text class="b" x="655" y="1090">unavailable counters remain a SKIP</text>
<rect class="skip" x="120" y="1250" width="950" height="280" rx="28"/><text class="h" x="160" y="1300">HONEST RESULT LABELS</text><text class="b" x="160" y="1350">PASS: the named expected observation occurred</text><text class="b" x="160" y="1392">FAIL-EVIDENCE: the layer ran and found a problem or command failed</text><text class="b" x="160" y="1434">SKIP: the layer was unavailable, incompatible, or inconclusive</text><text class="b" x="160" y="1480">A SKIP withholds a claim; it never converts the source into safe code.</text>
</svg>
