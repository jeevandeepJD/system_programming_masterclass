<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 1684" role="img" aria-labelledby="title desc">
<title id="title">Evidence-driven concurrency diagnosis workflow</title>
<desc id="desc">A branching workflow starts with binary identity and deterministic reproduction, classifies safety, liveness or performance symptoms, gathers matching tool evidence, compares it with the source protocol, and ends in diagnosis, unresolved question or honest skip.</desc>
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f8fbff}.t{font-size:37px;font-weight:700}.h{font-size:23px;font-weight:700}.b{font-size:18px}.step{fill:#143f5a;stroke:#83d9ff;stroke-width:3}.safety{fill:#612e3c;stroke:#ff8d9e;stroke-width:3}.live{fill:#493865;stroke:#d1b1ff;stroke-width:3}.perf{fill:#5b441b;stroke:#ffd166;stroke-width:3}.done{fill:#174f45;stroke:#7ce2bc;stroke-width:3}.edge{stroke:#ffd166;stroke-width:5;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1190" height="1684" fill="#08131e"/>
<text class="t" x="55" y="70">Diagnose from reproducible evidence, not one symptom</text>
<rect class="step" x="210" y="135" width="770" height="145" rx="24"/><text class="h" x="250" y="185">1  |  IDENTIFY THE ARTIFACT</text><text class="b" x="250" y="230">hash  |  compiler flags  |  host kernel  |  libc  |  tool versions</text>
<path class="edge" d="M595 280V355"/>
<rect class="step" x="210" y="355" width="770" height="145" rx="24"/><text class="h" x="250" y="405">2  |  REPRODUCE A BOUNDED SYMPTOM</text><text class="b" x="250" y="450">keep assertions and caveats; never turn a hang into an unbounded test</text>
<path class="edge" d="M595 500V575"/>
<polygon class="step" points="595,575 910,725 595,875 280,725"/><text class="h" x="455" y="710">3  |  CLASSIFY THE QUESTION</text><text class="b" x="477" y="750">safety  |  liveness  |  performance</text>
<path class="edge" d="M375 780L225 940"/><path class="edge" d="M595 875V940"/><path class="edge" d="M815 780L965 940"/>
<rect class="safety" x="40" y="940" width="350" height="300" rx="24"/><text class="h" x="75" y="990">SAFETY</text><text class="b" x="75" y="1035">assertions</text><text class="b" x="75" y="1075">TSan / Helgrind</text><text class="b" x="75" y="1115">ASan / UBSan</text><text class="b" x="75" y="1160">name conflicting accesses</text><text class="b" x="75" y="1200">and missing edge</text>
<rect class="live" x="420" y="940" width="350" height="300" rx="24"/><text class="h" x="455" y="990">LIVENESS</text><text class="b" x="455" y="1035">GDB all-thread stacks</text><text class="b" x="455" y="1075">futex / lock traces</text><text class="b" x="455" y="1115">bounded timeout</text><text class="b" x="455" y="1160">draw owners and waits</text><text class="b" x="455" y="1200">look for a cycle or unfairness</text>
<rect class="perf" x="800" y="940" width="350" height="300" rx="24"/><text class="h" x="835" y="990">PERFORMANCE</text><text class="b" x="835" y="1035">perf counters</text><text class="b" x="835" y="1075">affinity and layout</text><text class="b" x="835" y="1115">repeatable timings</text><text class="b" x="835" y="1160">separate contention, cache</text><text class="b" x="835" y="1200">and scheduler effects</text>
<path class="edge" d="M215 1240L470 1340"/><path class="edge" d="M595 1240V1340"/><path class="edge" d="M975 1240L720 1340"/>
<rect class="done" x="180" y="1340" width="830" height="225" rx="28"/><text class="h" x="220" y="1390">4  |  COMPARE TOOL OUTPUT WITH THE SOURCE PROTOCOL</text><text class="b" x="220" y="1435">state the invariant, ownership, happens-before edge, wait predicate, or layout</text><text class="b" x="220" y="1478">conclude only what independent evidence supports</text><text class="b" x="220" y="1521">diagnosis  |  unresolved question  |  or honest SKIP with the blocker named</text>
</svg>
