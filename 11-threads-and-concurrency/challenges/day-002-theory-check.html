<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 11 Day 2 Theory Check</title><style>body{margin:0;background:#08131e;color:#edf5fb;font:16px/1.5 system-ui}main{max-width:850px;margin:auto;padding:28px 18px}header,.q,#result{background:#112437;border:1px solid #31506c;border-radius:12px;padding:20px;margin:14px 0}h1{margin:.2em 0}.opt{display:block;background:#172e44;border:1px solid #31506c;border-radius:8px;padding:9px;margin:7px 0}.ok{border-color:#55dc9a}.bad{border-color:#ff7188}.fb{color:#b9ccdc;margin-top:8px}button{padding:10px 16px;background:#195070;color:white;border:1px solid #64ccff;border-radius:8px;margin-right:8px}#result{display:none}</style></head><body><main><header><small>WEEK 11 · DAY 2 · THEORY CHECK</small><h1>Data Races and the C Abstract Machine</h1><p>Answer all four, then inspect causal explanations.</p></header><form id="quiz"></form><button type="button" id="submit">Submit</button><button type="button" id="reset">Reset</button><section id="result"></section></main><script>const Q=[{"prompt": "When do conflicting C accesses form a data race?", "options": ["Whenever values differ", "When unordered by happens-before and at least one is non-atomic", "Only on multicore CPUs", "Only when output is wrong"], "answer": 1, "explanation": "The C definition depends on conflicting actions, atomicity, and happens-before\u2014not observed wall-clock overlap."}, {"prompt": "Why can counter++ lose updates?", "options": ["It is always a mutex operation", "Its ordinary read-modify-write is not atomic", "Integer addition is forbidden", "pthread_join resets it"], "answer": 1, "explanation": "Workers can conflict on the read and write; in C that race makes the execution undefined."}, {"prompt": "Does volatile repair the counter race?", "options": ["Yes, on x86 only", "Yes, if aligned", "No; it does not provide atomicity or inter-thread happens-before", "Only under TSan"], "answer": 2, "explanation": "Volatile access semantics are not thread synchronization."}, {"prompt": "What does a clean TSan run prove?", "options": ["All executions are race-free", "Only that no report arose on covered paths in that run", "The CPU is sequentially consistent", "Object lifetimes are all valid"], "answer": 1, "explanation": "TSan is dynamic and can miss unexecuted paths, schedules, or unsupported synchronization."}];const F=document.querySelector('#quiz');function build(){F.innerHTML='';Q.forEach((q,i)=>{let s=document.createElement('section');s.className='q';s.innerHTML=`<strong>${i+1}. ${q.prompt}</strong>`;q.options.forEach((o,j)=>s.innerHTML+=`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${o}</label>`);s.innerHTML+='<div class="fb"></div>';F.append(s)})}document.querySelector('#submit').onclick=()=>{let n=0;[...F.children].forEach((s,i)=>{let x=s.querySelector('input:checked');s.querySelectorAll('.opt').forEach((e,j)=>{e.classList.toggle('ok',j===Q[i].answer);e.classList.toggle('bad',!!x&&+x.value===j&&j!==Q[i].answer)});s.querySelector('.fb').textContent=x?Q[i].explanation:'Unanswered: choose an option before review.';if(x&&+x.value===Q[i].answer)n++});let r=document.querySelector('#result');r.style.display='block';r.textContent=`Score: ${n} / ${Q.length}`};document.querySelector('#reset').onclick=()=>{build();document.querySelector('#result').style.display='none'};build();</script></body></html>
