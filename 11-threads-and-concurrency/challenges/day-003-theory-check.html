<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 11 Day 3 Theory Check</title><style>body{margin:0;background:#08131e;color:#edf5fb;font:16px/1.5 system-ui}main{max-width:850px;margin:auto;padding:28px 18px}header,.q,#result{background:#112437;border:1px solid #31506c;border-radius:12px;padding:20px;margin:14px 0}h1{margin:.2em 0}.opt{display:block;background:#172e44;border:1px solid #31506c;border-radius:8px;padding:9px;margin:7px 0}.ok{border-color:#55dc9a}.bad{border-color:#ff7188}.fb{color:#b9ccdc;margin-top:8px}button{padding:10px 16px;background:#195070;color:white;border:1px solid #64ccff;border-radius:8px;margin-right:8px}#result{display:none}</style></head><body><main><header><small>WEEK 11 · DAY 3 · THEORY CHECK</small><h1>Mutexes, Ownership, and Futexes</h1><p>Answer all four, then inspect causal explanations.</p></header><form id="quiz"></form><button type="button" id="submit">Submit</button><button type="button" id="reset">Reset</button><section id="result"></section></main><script>const Q=[{"prompt": "What should define a mutex's scope?", "options": ["A named shared invariant", "A fixed line count", "Every function call", "A futex syscall"], "answer": 0, "explanation": "All accesses participating in the invariant must follow the same locking protocol."}, {"prompt": "Who frees the ownership-mode heap object?", "options": ["Worker before returning it", "Parent after join validates it", "pthread_create", "The kernel at mutex unlock"], "answer": 1, "explanation": "Ownership returns through join and the parent performs the one free."}, {"prompt": "How does global lock ordering prevent classic deadlock?", "options": ["It removes all mutexes", "It prevents circular wait", "It guarantees FIFO fairness", "It preempts owners"], "answer": 1, "explanation": "Consistent increasing acquisition order makes a lock-cycle impossible."}, {"prompt": "Why might strace show no futex calls for a mutex run?", "options": ["The mutex was not used", "Uncontended paths can remain in userspace", "Futexes are compile-time only", "POSIX forbids futexes"], "answer": 1, "explanation": "Linux libc mutexes commonly use atomic fast paths and enter the kernel on contention."}];const F=document.querySelector('#quiz');function build(){F.innerHTML='';Q.forEach((q,i)=>{let s=document.createElement('section');s.className='q';s.innerHTML=`<strong>${i+1}. ${q.prompt}</strong>`;q.options.forEach((o,j)=>s.innerHTML+=`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${o}</label>`);s.innerHTML+='<div class="fb"></div>';F.append(s)})}document.querySelector('#submit').onclick=()=>{let n=0;[...F.children].forEach((s,i)=>{let x=s.querySelector('input:checked');s.querySelectorAll('.opt').forEach((e,j)=>{e.classList.toggle('ok',j===Q[i].answer);e.classList.toggle('bad',!!x&&+x.value===j&&j!==Q[i].answer)});s.querySelector('.fb').textContent=x?Q[i].explanation:'Unanswered: choose an option before review.';if(x&&+x.value===Q[i].answer)n++});let r=document.querySelector('#result');r.style.display='block';r.textContent=`Score: ${n} / ${Q.length}`};document.querySelector('#reset').onclick=()=>{build();document.querySelector('#result').style.display='none'};build();</script></body></html>
