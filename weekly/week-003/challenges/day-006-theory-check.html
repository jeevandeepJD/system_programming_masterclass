<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 3 · Day 6 Theory Check — Linking and Libraries</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#07111b; --panel:#102031; --panel2:#162a3e; --line:#2d4861;
    --text:#eaf3fa; --muted:#9db0c2; --accent:#5bc8ff;
    --ok:#56df9b; --bad:#ff7589; --warn:#ffd06d;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:linear-gradient(145deg,#07111b,#0d1b29);
    color:var(--text); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  main { width:min(880px,100%); margin:auto; padding:32px 18px 80px; }
  header, .question, .result {
    background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:22px; margin-bottom:18px;
  }
  .eyebrow {
    color:var(--accent); font:700 12px ui-monospace,monospace;
    letter-spacing:.1em; text-transform:uppercase;
  }
  h1 { margin:.35rem 0 .5rem; font-size:clamp(25px,5vw,40px); line-height:1.12; }
  .lede { color:var(--muted); margin:.4rem 0 0; }
  fieldset { border:0; padding:0; margin:0; }
  legend { font-weight:700; margin-bottom:14px; width:100%; }
  .option {
    display:flex; gap:11px; align-items:flex-start; padding:11px 13px;
    margin:8px 0; border:1px solid var(--line); border-radius:9px;
    background:var(--panel2); cursor:pointer;
  }
  .option:hover { border-color:var(--accent); }
  .option.correct { border-color:var(--ok); background:#123629; }
  .option.wrong { border-color:var(--bad); background:#3a1822; }
  input { margin-top:.28rem; accent-color:var(--accent); }
  .feedback {
    display:none; margin-top:13px; padding:11px 13px;
    border-left:3px solid var(--accent); color:var(--muted); background:#0a1723;
  }
  .feedback.show { display:block; }
  .unanswered { border-color:var(--warn); }
  .actions { display:flex; gap:12px; flex-wrap:wrap; margin:24px 0; }
  button {
    border:1px solid var(--accent); border-radius:9px; padding:11px 18px;
    background:#173c55; color:var(--text); font:700 15px inherit; cursor:pointer;
  }
  button.secondary { border-color:var(--line); background:transparent; }
  button:hover { filter:brightness(1.14); }
  .result { display:none; text-align:center; }
  .result.show { display:block; }
  .score { color:var(--accent); font-size:32px; font-weight:800; }
  code { font-family:ui-monospace,monospace; color:#bdeaff; }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Week 3 · Day 6 · Theory check</div>
    <h1>Linking and Libraries</h1>
    <p class="lede">Predict first. Submit once. Explanations remain hidden until
    every question has an attempted answer.</p>
  </header>
  <form id="quiz"></form>
  <div class="actions">
    <button type="button" id="submit">Submit answers</button>
    <button type="button" class="secondary" id="reset">Reset</button>
  </div>
  <section class="result" id="result" aria-live="polite">
    <div class="score" id="score"></div>
    <p id="summary"></p>
  </section>
</main>
<script>
const questions = [{"prompt": "Why can placing a static archive before main.o on a traditional left-to-right link command leave a symbol unresolved?", "options": ["Archive members are interpreted as C source and require a preceding header.", "When the archive is scanned, the linker may not yet have seen main.o's unresolved reference, so it does not extract the provider member and may not revisit the archive.", "ELF forbids archive members from defining global symbols.", "Static archives can satisfy references only from shared objects."], "answer": 1, "explanation": "Archive extraction is demand-driven under conventional one-pass processing. Inputs already seen establish the unresolved set, so an archive scanned too early may contribute nothing even though a later object introduces the need."}, {"prompt": "Which statement correctly distinguishes linking against libmathops.a from requesting a fully static executable with -static?", "options": ["Using one archive selects needed members from that archive, while -static broadly requests static forms of default libraries and avoids normal shared dependencies where available.", "They are identical because every .a option implies -static for the entire link.", "-static converts every archive member into position-independent shared code.", "An archive-backed link cannot produce an ELF executable."], "answer": 0, "explanation": "A normal executable can incorporate selected members of a private .a yet remain dynamically linked to libc and other defaults. -static changes the broader library-selection policy and depends on suitable static libraries being installed."}, {"prompt": "Why can position-independent code for a shared object be mapped at different base addresses without rewriting most of its instruction bytes?", "options": ["PIC contains no references to code or data addresses.", "PIC uses base-independent calculations such as PC-relative addressing and loader-fixed indirection tables for addresses that cannot be fixed locally.", "Linux disables ASLR whenever it maps a shared object.", "Every process maps every shared object at one ABI-mandated absolute address."], "answer": 1, "explanation": "PIC still computes addresses, but it avoids unnecessary embedded absolutes. Relative references remain valid after rebasing, while GOT entries and selected dynamic relocations hold runtime-dependent values, preserving shareable code pages."}, {"prompt": "Why does full RELRO commonly pair -z relro with eager binding via -z now?", "options": ["Eager binding resolves function-related relocation state before the loader makes the protected relocation region read-only.", "Lazy binding requires all .text pages to stay writable forever.", "RELRO removes every dynamic symbol from the executable.", "-z now forces all shared-library code to be copied into the executable."], "answer": 0, "explanation": "Classic lazy PLT binding may need to update GOT state on first call. Resolving those entries during startup lets the loader finish relocations and then make more relocation-related memory read-only, reducing writable control-data exposure."}];
const quiz = document.querySelector("#quiz");

function build() {
  quiz.innerHTML = "";
  questions.forEach((q, qi) => {
    const section = document.createElement("section");
    section.className = "question";
    section.dataset.question = qi;
    const fieldset = document.createElement("fieldset");
    const legend = document.createElement("legend");
    legend.textContent = `${qi + 1}. ${q.prompt}`;
    fieldset.appendChild(legend);
    q.options.forEach((option, oi) => {
      const label = document.createElement("label");
      label.className = "option";
      const input = document.createElement("input");
      input.type = "radio";
      input.name = `q${qi}`;
      input.value = oi;
      label.append(input, document.createTextNode(option));
      fieldset.appendChild(label);
    });
    const feedback = document.createElement("div");
    feedback.className = "feedback";
    section.append(fieldset, feedback);
    quiz.appendChild(section);
  });
}

document.querySelector("#submit").addEventListener("click", () => {
  let score = 0;
  let unanswered = 0;
  questions.forEach((q, qi) => {
    const section = quiz.querySelector(`[data-question="${qi}"]`);
    const selected = section.querySelector("input:checked");
    section.classList.toggle("unanswered", !selected);
    const feedback = section.querySelector(".feedback");
    section.querySelectorAll(".option").forEach((label, oi) => {
      label.classList.remove("correct", "wrong");
      if (oi === q.answer) label.classList.add("correct");
      if (selected && Number(selected.value) === oi && oi !== q.answer)
        label.classList.add("wrong");
    });
    if (!selected) {
      unanswered++;
      feedback.textContent = "Choose an answer before reviewing this explanation.";
    } else {
      if (Number(selected.value) === q.answer) score++;
      feedback.textContent = q.explanation;
    }
    feedback.classList.add("show");
  });
  const result = document.querySelector("#result");
  result.classList.add("show");
  document.querySelector("#score").textContent = `${score} / ${questions.length}`;
  document.querySelector("#summary").textContent = unanswered
    ? `${unanswered} question(s) were unanswered. Review, reset, and try again.`
    : score === questions.length
      ? "All correct. Now explain the causal reason for each answer without the options."
      : "Use the explanations to identify the weak concept, not merely the missed option.";
  result.scrollIntoView({behavior:"smooth", block:"center"});
});

document.querySelector("#reset").addEventListener("click", () => {
  build();
  document.querySelector("#result").classList.remove("show");
  window.scrollTo({top:0, behavior:"smooth"});
});

build();
</script>
</body>
</html>
