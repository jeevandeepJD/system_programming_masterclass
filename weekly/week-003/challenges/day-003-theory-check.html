<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 3 · Day 3 Theory Check — Dynamic Memory and Lifetime</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#07111b; --panel:#102031; --panel2:#162a3e; --line:#2d4861;
    --text:#eaf3fa; --muted:#9db0c2; --accent:#5bc8ff;
    --ok:#56df9b; --bad:#ff7589; --warn:#ffd06d;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:linear-gradient(145deg,#07111b,#0d1b29);
    color:var(--text); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  main { width:min(880px,100%); margin:auto; padding:32px 18px 80px; }
  header, .question, .result {
    background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:22px; margin-bottom:18px;
  }
  .eyebrow {
    color:var(--accent); font:700 12px ui-monospace,monospace;
    letter-spacing:.1em; text-transform:uppercase;
  }
  h1 { margin:.35rem 0 .5rem; font-size:clamp(25px,5vw,40px); line-height:1.12; }
  .lede { color:var(--muted); margin:.4rem 0 0; }
  fieldset { border:0; padding:0; margin:0; }
  legend { font-weight:700; margin-bottom:14px; width:100%; }
  .option {
    display:flex; gap:11px; align-items:flex-start; padding:11px 13px;
    margin:8px 0; border:1px solid var(--line); border-radius:9px;
    background:var(--panel2); cursor:pointer;
  }
  .option:hover { border-color:var(--accent); }
  .option.correct { border-color:var(--ok); background:#123629; }
  .option.wrong { border-color:var(--bad); background:#3a1822; }
  input { margin-top:.28rem; accent-color:var(--accent); }
  .feedback {
    display:none; margin-top:13px; padding:11px 13px;
    border-left:3px solid var(--accent); color:var(--muted); background:#0a1723;
  }
  .feedback.show { display:block; }
  .unanswered { border-color:var(--warn); }
  .actions { display:flex; gap:12px; flex-wrap:wrap; margin:24px 0; }
  button {
    border:1px solid var(--accent); border-radius:9px; padding:11px 18px;
    background:#173c55; color:var(--text); font:700 15px inherit; cursor:pointer;
  }
  button.secondary { border-color:var(--line); background:transparent; }
  button:hover { filter:brightness(1.14); }
  .result { display:none; text-align:center; }
  .result.show { display:block; }
  .score { color:var(--accent); font-size:32px; font-weight:800; }
  code { font-family:ui-monospace,monospace; color:#bdeaff; }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Week 3 · Day 3 · Theory check</div>
    <h1>Dynamic Memory and Lifetime</h1>
    <p class="lede">Predict first. Submit once. Explanations remain hidden until
    every question has an attempted answer.</p>
  </header>
  <form id="quiz"></form>
  <div class="actions">
    <button type="button" id="submit">Submit answers</button>
    <button type="button" class="secondary" id="reset">Reset</button>
  </div>
  <section class="result" id="result" aria-live="polite">
    <div class="score" id="score"></div>
    <p id="summary"></p>
  </section>
</main>
<script>
const questions = [{"prompt": "Why does assigning the result of realloc directly back to the sole owner risk a leak?", "options": ["realloc always frees the old allocation before attempting any resize.", "On failure realloc returns null while leaving the old allocation valid, so overwriting the only pointer loses the allocation's address.", "realloc can resize only allocations originally returned by calloc.", "A successful realloc never preserves existing bytes."], "answer": 1, "explanation": "For a nonzero resize request, failure returns null and leaves the original allocation unchanged. Using a temporary preserves the old owner until success is known; direct assignment can discard the only path needed to use and free that still-live block."}, {"prompt": "After free(p), why is reading through an alias q that still contains the old address undefined even if the page remains mapped?", "options": ["free is required to unmap the entire virtual page immediately.", "The allocation's lifetime ended, and address translation by the MMU does not grant C permission to access a dead object.", "All pointer representations are automatically changed to null by free.", "Mapped pages may contain only objects with static storage duration."], "answer": 1, "explanation": "free ends the allocated object's lifetime, making every alias dangling. The allocator may retain the block and Linux may keep its page mapped, but mapping state and familiar bytes are lower-layer facts that do not recreate a live C object."}, {"prompt": "Why is count > SIZE_MAX / sizeof *items checked before malloc(count * sizeof *items)?", "options": ["malloc accepts element counts but not byte counts.", "The division forces malloc to return storage aligned for items.", "The multiplication could wrap as size_t and request a smaller block than the program will index.", "ISO C defines every failed multiplication as a null pointer."], "answer": 2, "explanation": "size_t arithmetic is unsigned and wraps modulo its range. If the product wraps, malloc may successfully allocate too few bytes while later code assumes count elements exist; the precondition prevents that undersized-allocation cause."}, {"prompt": "Which design property is the primary reason a bump arena can allocate cheaply?", "options": ["It asks the kernel for a fresh page for every object.", "It generally advances an aligned offset in one backing region and defers reclamation to one bulk lifetime end.", "It stores every object in static storage.", "It can reclaim any individual object without metadata."], "answer": 1, "explanation": "A bump arena commonly computes alignment, returns the next slice, and advances one offset. Avoiding per-object free and general-purpose free-list management makes allocation cheap, at the cost of tying all contained objects to the arena's bulk lifetime."}];
const quiz = document.querySelector("#quiz");

function build() {
  quiz.innerHTML = "";
  questions.forEach((q, qi) => {
    const section = document.createElement("section");
    section.className = "question";
    section.dataset.question = qi;
    const fieldset = document.createElement("fieldset");
    const legend = document.createElement("legend");
    legend.textContent = `${qi + 1}. ${q.prompt}`;
    fieldset.appendChild(legend);
    q.options.forEach((option, oi) => {
      const label = document.createElement("label");
      label.className = "option";
      const input = document.createElement("input");
      input.type = "radio";
      input.name = `q${qi}`;
      input.value = oi;
      label.append(input, document.createTextNode(option));
      fieldset.appendChild(label);
    });
    const feedback = document.createElement("div");
    feedback.className = "feedback";
    section.append(fieldset, feedback);
    quiz.appendChild(section);
  });
}

document.querySelector("#submit").addEventListener("click", () => {
  let score = 0;
  let unanswered = 0;
  questions.forEach((q, qi) => {
    const section = quiz.querySelector(`[data-question="${qi}"]`);
    const selected = section.querySelector("input:checked");
    section.classList.toggle("unanswered", !selected);
    const feedback = section.querySelector(".feedback");
    section.querySelectorAll(".option").forEach((label, oi) => {
      label.classList.remove("correct", "wrong");
      if (oi === q.answer) label.classList.add("correct");
      if (selected && Number(selected.value) === oi && oi !== q.answer)
        label.classList.add("wrong");
    });
    if (!selected) {
      unanswered++;
      feedback.textContent = "Choose an answer before reviewing this explanation.";
    } else {
      if (Number(selected.value) === q.answer) score++;
      feedback.textContent = q.explanation;
    }
    feedback.classList.add("show");
  });
  const result = document.querySelector("#result");
  result.classList.add("show");
  document.querySelector("#score").textContent = `${score} / ${questions.length}`;
  document.querySelector("#summary").textContent = unanswered
    ? `${unanswered} question(s) were unanswered. Review, reset, and try again.`
    : score === questions.length
      ? "All correct. Now explain the causal reason for each answer without the options."
      : "Use the explanations to identify the weak concept, not merely the missed option.";
  result.scrollIntoView({behavior:"smooth", block:"center"});
});

document.querySelector("#reset").addEventListener("click", () => {
  build();
  document.querySelector("#result").classList.remove("show");
  window.scrollTo({top:0, behavior:"smooth"});
});

build();
</script>
</body>
</html>
