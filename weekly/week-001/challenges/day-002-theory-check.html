<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 1 · Day 2 Theory Check — Signed Bits</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#07111b; --panel:#102031; --panel2:#162a3e; --line:#2d4861;
    --text:#eaf3fa; --muted:#9db0c2; --accent:#5bc8ff;
    --ok:#56df9b; --bad:#ff7589; --warn:#ffd06d;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:linear-gradient(145deg,#07111b,#0d1b29);
    color:var(--text); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  main { width:min(880px,100%); margin:auto; padding:32px 18px 80px; }
  header, .question, .result {
    background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:22px; margin-bottom:18px;
  }
  .eyebrow {
    color:var(--accent); font:700 12px ui-monospace,monospace;
    letter-spacing:.1em; text-transform:uppercase;
  }
  h1 { margin:.35rem 0 .5rem; font-size:clamp(25px,5vw,40px); line-height:1.12; }
  .lede { color:var(--muted); margin:.4rem 0 0; }
  fieldset { border:0; padding:0; margin:0; }
  legend { font-weight:700; margin-bottom:14px; width:100%; }
  .option {
    display:flex; gap:11px; align-items:flex-start; padding:11px 13px;
    margin:8px 0; border:1px solid var(--line); border-radius:9px;
    background:var(--panel2); cursor:pointer;
  }
  .option:hover { border-color:var(--accent); }
  .option.correct { border-color:var(--ok); background:#123629; }
  .option.wrong { border-color:var(--bad); background:#3a1822; }
  input { margin-top:.28rem; accent-color:var(--accent); }
  .feedback {
    display:none; margin-top:13px; padding:11px 13px;
    border-left:3px solid var(--accent); color:var(--muted); background:#0a1723;
  }
  .feedback.show { display:block; }
  .unanswered { border-color:var(--warn); }
  .actions { display:flex; gap:12px; flex-wrap:wrap; margin:24px 0; }
  button {
    border:1px solid var(--accent); border-radius:9px; padding:11px 18px;
    background:#173c55; color:var(--text); font:700 15px inherit; cursor:pointer;
  }
  button.secondary { border-color:var(--line); background:transparent; }
  button:hover { filter:brightness(1.14); }
  .result { display:none; text-align:center; }
  .result.show { display:block; }
  .score { color:var(--accent); font-size:32px; font-weight:800; }
  code { font-family:ui-monospace,monospace; color:#bdeaff; }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Week 1 · Day 2 · Theory check</div>
    <h1>Signed Bits</h1>
    <p class="lede">Predict first. Submit once. Explanations remain hidden until
    every question has an attempted answer.</p>
  </header>
  <form id="quiz"></form>
  <div class="actions">
    <button type="button" id="submit">Submit answers</button>
    <button type="button" class="secondary" id="reset">Reset</button>
  </div>
  <section class="result" id="result" aria-live="polite">
    <div class="score" id="score"></div>
    <p id="summary"></p>
  </section>
</main>
<script>
const questions = [{"prompt": "Why can the same fixed-width binary adder serve both unsigned and two's-complement addition?", "options": ["The adder detects the source-language type and changes its gates.", "Both interpretations use the same modulo-2^n low result bits; signedness changes how operands, results, and flags are interpreted.", "Signed values reserve a separate carry wire for every negative operand.", "Two's-complement addition converts both operands to decimal before adding."], "answer": 1, "explanation": "Binary addition produces the same low n bits in either interpretation, while carry and signed overflow report different range facts."}, {"prompt": "Software must replace a packed MODE field while preserving neighboring bits. Which sequence has the required effect?", "options": ["OR the new shifted value into the register once.", "XOR the entire register with the field mask.", "Clear the field with an inverted mask, then OR in the masked and shifted new value.", "Shift the complete register right and write it back."], "answer": 2, "explanation": "Clearing removes every old field bit, and masking the shifted replacement prevents it from leaking into adjacent fields."}, {"prompt": "An 8-bit addition computes 01111111 + 00000001 = 10000000 with no carry-out. Which status interpretation is correct?", "options": ["Unsigned carry occurred because the result's high bit is one.", "Signed overflow occurred because two positive operands produced a negative-encoded result.", "Both unsigned carry and signed overflow occurred.", "Neither condition occurred because the adder produced eight result bits."], "answer": 1, "explanation": "Unsigned 128 fits in eight bits, but signed +128 exceeds the range -128 through +127, so only signed overflow occurs."}, {"prompt": "The 8-bit pattern 11110110 is widened to preserve its value as signed two's complement. Which result and rationale are correct?", "options": ["0000000011110110, because widening always inserts zeros", "1111111111110110, because replicating the sign bit preserves the same negative residue at the wider width", "1111011000000000, because widening appends low zeros", "0000000011110110, because the original pattern represents -10 under every interpretation"], "answer": 1, "explanation": "Sign extension copies the old high bit so the wider two's-complement pattern still represents -10."}];
const quiz = document.querySelector("#quiz");

function build() {
  quiz.innerHTML = "";
  questions.forEach((q, qi) => {
    const section = document.createElement("section");
    section.className = "question";
    section.dataset.question = qi;
    const fieldset = document.createElement("fieldset");
    const legend = document.createElement("legend");
    legend.textContent = `${qi + 1}. ${q.prompt}`;
    fieldset.appendChild(legend);
    q.options.forEach((option, oi) => {
      const label = document.createElement("label");
      label.className = "option";
      const input = document.createElement("input");
      input.type = "radio";
      input.name = `q${qi}`;
      input.value = oi;
      label.append(input, document.createTextNode(option));
      fieldset.appendChild(label);
    });
    const feedback = document.createElement("div");
    feedback.className = "feedback";
    section.append(fieldset, feedback);
    quiz.appendChild(section);
  });
}

document.querySelector("#submit").addEventListener("click", () => {
  let score = 0;
  let unanswered = 0;
  questions.forEach((q, qi) => {
    const section = quiz.querySelector(`[data-question="${qi}"]`);
    const selected = section.querySelector("input:checked");
    section.classList.toggle("unanswered", !selected);
    const feedback = section.querySelector(".feedback");
    section.querySelectorAll(".option").forEach((label, oi) => {
      label.classList.remove("correct", "wrong");
      if (oi === q.answer) label.classList.add("correct");
      if (selected && Number(selected.value) === oi && oi !== q.answer)
        label.classList.add("wrong");
    });
    if (!selected) {
      unanswered++;
      feedback.textContent = "Choose an answer before reviewing this explanation.";
    } else {
      if (Number(selected.value) === q.answer) score++;
      feedback.textContent = q.explanation;
    }
    feedback.classList.add("show");
  });
  const result = document.querySelector("#result");
  result.classList.add("show");
  document.querySelector("#score").textContent = `${score} / ${questions.length}`;
  document.querySelector("#summary").textContent = unanswered
    ? `${unanswered} question(s) were unanswered. Review, reset, and try again.`
    : score === questions.length
      ? "All correct. Now explain the causal reason for each answer without the options."
      : "Use the explanations to identify the weak concept, not merely the missed option.";
  result.scrollIntoView({behavior:"smooth", block:"center"});
});

document.querySelector("#reset").addEventListener("click", () => {
  build();
  document.querySelector("#result").classList.remove("show");
  window.scrollTo({top:0, behavior:"smooth"});
});

build();
</script>
</body>
</html>
