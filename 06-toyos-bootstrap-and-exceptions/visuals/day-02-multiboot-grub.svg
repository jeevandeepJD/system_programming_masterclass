<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Multiboot2 recognition and handoff</title><desc id="desc">Separates the Multiboot2 header, GRUB loading, and transfer to the ELF entry.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#172554"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:22px;fill:#fff;font-weight:700}.heading{font-size:34px;fill:#0b1f33}.note{font-size:20px;fill:#25364a;font-weight:400}.edge{stroke:#172554;stroke-width:5;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="700" fill="#f8fafc"/><text x="600" y="58" text-anchor="middle" class="heading">Multiboot2 recognition and handoff</text><text x="600" y="94" text-anchor="middle" class="note">Separates the Multiboot2 header, GRUB loading, and transfer to the ELF entry.</text><path class="edge" d="M195,230 L475,230"/><path class="edge" d="M475,230 L755,230"/><path class="edge" d="M755,230 L1035,230"/><path class="edge" d="M1035,230 L1035,480"/><rect x="70" y="155" width="250" height="150" rx="16" fill="#0b1f33" stroke="#061626" stroke-width="3"/><text x="195.0" y="230.0" text-anchor="middle" dominant-baseline="middle">Multiboot2 header</text><rect x="350" y="155" width="250" height="150" rx="16" fill="#0f4c5c" stroke="#061626" stroke-width="3"/><text x="475.0" y="230.0" text-anchor="middle" dominant-baseline="middle">GRUB validates</text><rect x="630" y="155" width="250" height="150" rx="16" fill="#146c94" stroke="#061626" stroke-width="3"/><text x="755.0" y="230.0" text-anchor="middle" dominant-baseline="middle">ELF segments loaded</text><rect x="910" y="155" width="250" height="150" rx="16" fill="#8a4f0d" stroke="#061626" stroke-width="3"/><text x="1035.0" y="230.0" text-anchor="middle" dominant-baseline="middle">EAX magic + EBX info</text><rect x="910" y="405" width="250" height="150" rx="16" fill="#6b2d5c" stroke="#061626" stroke-width="3"/><text x="1035.0" y="480.0" text-anchor="middle" dominant-baseline="middle">_start handoff</text></svg>
