<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Uniform exception-frame normalization</title><desc id="desc">Shows how stubs add a synthetic error code so C sees one stable frame layout.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#172554"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:22px;fill:#fff;font-weight:700}.heading{font-size:34px;fill:#0b1f33}.note{font-size:20px;fill:#25364a;font-weight:400}.edge{stroke:#172554;stroke-width:5;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="700" fill="#f8fafc"/><text x="600" y="58" text-anchor="middle" class="heading">Uniform exception-frame normalization</text><text x="600" y="94" text-anchor="middle" class="note">Shows how stubs add a synthetic error code so C sees one stable frame layout.</text><path class="edge" d="M305,198 L895,198"/><path class="edge" d="M895,198 L305,372"/><path class="edge" d="M305,372 L895,372"/><path class="edge" d="M895,372 L305,548"/><path class="edge" d="M305,548 L895,548"/><rect x="80" y="145" width="450" height="105" rx="16" fill="#0b1f33" stroke="#061626" stroke-width="3"/><text x="305.0" y="182.5" text-anchor="middle" dominant-baseline="middle">No-error vector: CPU</text><text x="305.0" y="212.5" text-anchor="middle" dominant-baseline="middle">frame</text><rect x="670" y="145" width="450" height="105" rx="16" fill="#0f4c5c" stroke="#061626" stroke-width="3"/><text x="895.0" y="197.5" text-anchor="middle" dominant-baseline="middle">Stub pushes 0</text><rect x="80" y="320" width="450" height="105" rx="16" fill="#146c94" stroke="#061626" stroke-width="3"/><text x="305.0" y="372.5" text-anchor="middle" dominant-baseline="middle">Vector number</text><rect x="670" y="320" width="450" height="105" rx="16" fill="#8a4f0d" stroke="#061626" stroke-width="3"/><text x="895.0" y="372.5" text-anchor="middle" dominant-baseline="middle">Saved registers</text><rect x="80" y="495" width="450" height="105" rx="16" fill="#6b2d5c" stroke="#061626" stroke-width="3"/><text x="305.0" y="547.5" text-anchor="middle" dominant-baseline="middle">Uniform C frame</text><rect x="670" y="495" width="450" height="105" rx="16" fill="#325d23" stroke="#061626" stroke-width="3"/><text x="895.0" y="532.5" text-anchor="middle" dominant-baseline="middle">Error vector: CPU error</text><text x="895.0" y="562.5" text-anchor="middle" dominant-baseline="middle">code</text></svg>
