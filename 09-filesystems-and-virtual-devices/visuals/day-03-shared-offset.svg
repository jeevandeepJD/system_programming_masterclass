<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
<title id="title">Day 3: shared-offset ownership</title>
<desc id="desc">Offset ownership comparison among ToyOS independent opens, conceptual duplicated descriptors, and inode data sharing. It also exposes the read copy-out failure after offset advancement.</desc>
<rect width="794" height="1123" fill="#FFFFFF"/>
<rect x="0" y="0" width="794" height="132" fill="#102A43"/>
<text x="48" y="55" fill="#F6C85F" font-family="Arial, sans-serif" font-size="18" font-weight="700">TOYOS • WEEK 9 • EVIDENCE MAP 07</text>
<text x="48" y="98" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="700">Day 3: shared-offset ownership</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0B63A5"/></marker></defs><rect x="48" y="164" width="698" height="184" rx="14" fill="#D9F2FA" stroke="#0B63A5" stroke-width="3"/><circle cx="78" cy="199" r="18" fill="#0B63A5"/><text x="78" y="206" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="700">1</text><text x="112" y="207" fill="#102A43" font-family="Arial, sans-serif" font-size="22" font-weight="700">TOYOS OPEN A</text><rect x="82" y="233" width="9" height="9" fill="#0B63A5"/><text x="106" y="244" fill="#243B53" font-family="Arial, sans-serif" font-size="18">fd 5 → file slot A</text><rect x="82" y="260" width="9" height="9" fill="#0B63A5"/><text x="106" y="271" fill="#243B53" font-family="Arial, sans-serif" font-size="18">A owns offset 0…n</text><rect x="82" y="287" width="9" height="9" fill="#0B63A5"/><text x="106" y="298" fill="#243B53" font-family="Arial, sans-serif" font-size="18">points to shared /hello inode</text><path d="M397 349 L397 372" stroke="#0B63A5" stroke-width="4" marker-end="url(#arrow)"/><rect x="48" y="386" width="698" height="184" rx="14" fill="#FFF8E7" stroke="#0B63A5" stroke-width="3"/><circle cx="78" cy="421" r="18" fill="#0B63A5"/><text x="78" y="428" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="700">2</text><text x="112" y="429" fill="#102A43" font-family="Arial, sans-serif" font-size="22" font-weight="700">TOYOS OPEN B</text><rect x="82" y="455" width="9" height="9" fill="#0B63A5"/><text x="106" y="466" fill="#243B53" font-family="Arial, sans-serif" font-size="18">fd 6 → file slot B</text><rect x="82" y="482" width="9" height="9" fill="#0B63A5"/><text x="106" y="493" fill="#243B53" font-family="Arial, sans-serif" font-size="18">B owns a different offset</text><rect x="82" y="509" width="9" height="9" fill="#0B63A5"/><text x="106" y="520" fill="#243B53" font-family="Arial, sans-serif" font-size="18">reads do not move A</text><path d="M397 571 L397 594" stroke="#0B63A5" stroke-width="4" marker-end="url(#arrow)"/><rect x="48" y="608" width="698" height="184" rx="14" fill="#EAF7EE" stroke="#0B63A5" stroke-width="3"/><circle cx="78" cy="643" r="18" fill="#0B63A5"/><text x="78" y="650" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="700">3</text><text x="112" y="651" fill="#102A43" font-family="Arial, sans-serif" font-size="22" font-weight="700">DUP MODEL — NOT IMPLEMENTED</text><rect x="82" y="677" width="9" height="9" fill="#0B63A5"/><text x="106" y="688" fill="#243B53" font-family="Arial, sans-serif" font-size="18">fd 5 and fd 9 could share one file</text><rect x="82" y="704" width="9" height="9" fill="#0B63A5"/><text x="106" y="715" fill="#243B53" font-family="Arial, sans-serif" font-size="18">both would observe one shared offset</text><rect x="82" y="731" width="9" height="9" fill="#0B63A5"/><text x="106" y="742" fill="#243B53" font-family="Arial, sans-serif" font-size="18">would require references and close semantics</text><path d="M397 793 L397 816" stroke="#0B63A5" stroke-width="4" marker-end="url(#arrow)"/><rect x="48" y="830" width="698" height="184" rx="14" fill="#FDECEC" stroke="#0B63A5" stroke-width="3"/><circle cx="78" cy="865" r="18" fill="#0B63A5"/><text x="78" y="872" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="700">4</text><text x="112" y="873" fill="#102A43" font-family="Arial, sans-serif" font-size="22" font-weight="700">READ FAILURE WINDOW</text><rect x="82" y="899" width="9" height="9" fill="#0B63A5"/><text x="106" y="910" fill="#243B53" font-family="Arial, sans-serif" font-size="18">vfs_read advances slot offset first</text><rect x="82" y="926" width="9" height="9" fill="#0B63A5"/><text x="106" y="937" fill="#243B53" font-family="Arial, sans-serif" font-size="18">copy_to_user may then fail with −14</text><rect x="82" y="953" width="9" height="9" fill="#0B63A5"/><text x="106" y="964" fill="#243B53" font-family="Arial, sans-serif" font-size="18">ToyOS does not roll offset back</text><rect x="82" y="980" width="9" height="9" fill="#0B63A5"/><text x="106" y="991" fill="#243B53" font-family="Arial, sans-serif" font-size="18">inode owns bytes; user owns destination</text><rect x="48" y="1040" width="698" height="42" rx="8" fill="#102A43"/><text x="397" y="1067" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="700">Solid = implemented or owned • Dashed red = absent / claim boundary</text></svg>