<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
<title id="title">Day 1: references and lifetime transitions</title>
<desc id="desc">Reference and lifetime ledger for ToyOS compared with the transitions a fuller VFS would require. It highlights static lifetime, borrowed pointers, absent close, and absent reference counting.</desc>
<rect width="794" height="1123" fill="#FFFFFF"/>
<rect x="0" y="0" width="794" height="132" fill="#102A43"/>
<text x="48" y="55" fill="#F6C85F" font-family="Arial, sans-serif" font-size="18" font-weight="700">TOYOS • WEEK 9 • EVIDENCE MAP 03</text>
<text x="48" y="98" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="700">Day 1: references and lifetime transitions</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0B63A5"/></marker></defs><rect x="48" y="164" width="698" height="184" rx="14" fill="#D9F2FA" stroke="#0B63A5" stroke-width="3"/><circle cx="78" cy="199" r="18" fill="#0B63A5"/><text x="78" y="206" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="700">1</text><text x="112" y="207" fill="#102A43" font-family="Arial, sans-serif" font-size="22" font-weight="700">TOYOS REFERENCES</text><rect x="82" y="233" width="9" height="9" fill="#0B63A5"/><text x="106" y="244" fill="#243B53" font-family="Arial, sans-serif" font-size="18">descriptor → one global file slot</text><rect x="82" y="260" width="9" height="9" fill="#0B63A5"/><text x="106" y="271" fill="#243B53" font-family="Arial, sans-serif" font-size="18">file.inode → borrowed static pointer</text><rect x="82" y="287" width="9" height="9" fill="#0B63A5"/><text x="106" y="298" fill="#243B53" font-family="Arial, sans-serif" font-size="18">inode.path → immutable image literal</text><rect x="82" y="314" width="9" height="9" fill="#0B63A5"/><text x="106" y="325" fill="#243B53" font-family="Arial, sans-serif" font-size="18">all arrays survive until VM shutdown</text><path d="M397 349 L397 372" stroke="#0B63A5" stroke-width="4" marker-end="url(#arrow)"/><rect x="48" y="386" width="698" height="184" rx="14" fill="#FFF8E7" stroke="#0B63A5" stroke-width="3"/><circle cx="78" cy="421" r="18" fill="#0B63A5"/><text x="78" y="428" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="700">2</text><text x="112" y="429" fill="#102A43" font-family="Arial, sans-serif" font-size="22" font-weight="700">OPEN TRANSITION</text><rect x="82" y="455" width="9" height="9" fill="#0B63A5"/><text x="106" y="466" fill="#243B53" font-family="Arial, sans-serif" font-size="18">find matching static inode</text><rect x="82" y="482" width="9" height="9" fill="#0B63A5"/><text x="106" y="493" fill="#243B53" font-family="Arial, sans-serif" font-size="18">reserve free slot; offset = 0</text><rect x="82" y="509" width="9" height="9" fill="#0B63A5"/><text x="106" y="520" fill="#243B53" font-family="Arial, sans-serif" font-size="18">return 5 + slot</text><rect x="82" y="536" width="9" height="9" fill="#0B63A5"/><text x="106" y="547" fill="#243B53" font-family="Arial, sans-serif" font-size="18">no dynamic allocation occurs</text><path d="M397 571 L397 594" stroke="#0B63A5" stroke-width="4" marker-end="url(#arrow)"/><rect x="48" y="608" width="698" height="184" rx="14" fill="#EAF7EE" stroke="#B42318" stroke-width="3" stroke-dasharray="10 7"/><circle cx="78" cy="643" r="18" fill="#B42318"/><text x="78" y="650" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="700">3</text><text x="112" y="651" fill="#102A43" font-family="Arial, sans-serif" font-size="22" font-weight="700">MISSING RELEASE TRANSITION</text><rect x="82" y="677" width="9" height="9" fill="#B42318"/><text x="106" y="688" fill="#243B53" font-family="Arial, sans-serif" font-size="18">no close syscall</text><rect x="82" y="704" width="9" height="9" fill="#B42318"/><text x="106" y="715" fill="#243B53" font-family="Arial, sans-serif" font-size="18">open flag never clears</text><rect x="82" y="731" width="9" height="9" fill="#B42318"/><text x="106" y="742" fill="#243B53" font-family="Arial, sans-serif" font-size="18">four successful slots eventually exhaust</text><rect x="82" y="758" width="9" height="9" fill="#B42318"/><text x="106" y="769" fill="#243B53" font-family="Arial, sans-serif" font-size="18">current failure: −24</text><path d="M397 793 L397 816" stroke="#0B63A5" stroke-width="4" marker-end="url(#arrow)"/><rect x="48" y="830" width="698" height="184" rx="14" fill="#FDECEC" stroke="#0B63A5" stroke-width="3"/><circle cx="78" cy="865" r="18" fill="#0B63A5"/><text x="78" y="872" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="700">4</text><text x="112" y="873" fill="#102A43" font-family="Arial, sans-serif" font-size="22" font-weight="700">FULLER VFS — CONCEPT ONLY</text><rect x="82" y="899" width="9" height="9" fill="#0B63A5"/><text x="106" y="910" fill="#243B53" font-family="Arial, sans-serif" font-size="18">fd table retains open-file description</text><rect x="82" y="926" width="9" height="9" fill="#0B63A5"/><text x="106" y="937" fill="#243B53" font-family="Arial, sans-serif" font-size="18">file references inode/dentry</text><rect x="82" y="953" width="9" height="9" fill="#0B63A5"/><text x="106" y="964" fill="#243B53" font-family="Arial, sans-serif" font-size="18">dup may share file and offset</text><rect x="82" y="980" width="9" height="9" fill="#0B63A5"/><text x="106" y="991" fill="#243B53" font-family="Arial, sans-serif" font-size="18">unlink may remove name while file survives</text><rect x="48" y="1040" width="698" height="42" rx="8" fill="#102A43"/><text x="397" y="1067" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="700">Solid = implemented or owned • Dashed red = absent / claim boundary</text></svg>