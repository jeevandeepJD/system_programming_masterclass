e="18">tiny in-memory filesystem works</text><rect x="82" y="926" width="9" height="9" fill="#0B63A5"/><text x="106" y="937" fill="#243B53" font-family="Arial, sans-serif" font-size="18">conceptual stack explains a future design</text><rect x="82" y="953" width="9" height="9" fill="#0B63A5"/><text x="106" y="964" fill="#243B53" font-family="Arial, sans-serif" font-size="18">search evidence is scoped to this build</text><rect x="82" y="980" width="9" height="9" fill="#0B63A5"/><text x="106" y="991" fill="#243B53" font-family="Arial, sans-serif" font-size="18">do not draw ramfs → EDU data arrow</text><rect x="48" y="1040" width="698" height="42" rx="8" fill="#102A43"/><text x="397" y="1067" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="700">Solid = implemented or owned • Dashed red = absent / claim boundary</text></svg>