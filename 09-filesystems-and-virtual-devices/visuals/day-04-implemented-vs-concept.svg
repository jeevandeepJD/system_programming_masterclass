<text x="48" y="55" fill="#F6C85F" font-family="Arial, sans-serif" font-size="18" font-weight="700">TOYOS • WEEK 9 • EVIDENCE MAP 09</text>
<text x="48" y="98" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="700">Day 4: implementation versus storage concepts</text>
