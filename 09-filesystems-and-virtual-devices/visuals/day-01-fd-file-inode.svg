<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
<title id="title">Day 1: descriptor, file, inode, and name</title>
<desc id="desc">Ownership diagram separating a userspace descriptor value, the global open-file slot that owns an offset, the static inode that owns bytes and metadata, and the path name used only for lookup.</desc>
<rect width="794" height="1123" fill="#FFFFFF"/>
<rect x="0" y="0" width="794" height="132" fill="#102A43"/>
<text x="48" y="55" fill="#F6C85F" font-family="Arial, sans-serif" font-size="18" font-weight="700">TOYOS • WEEK 9 • EVIDENCE MAP 02</text>
<text x="48" y="98" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="700">Day 1: descriptor, file, inode, and name</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0B63A5"/></marker></defs><rect x="48" y="164" width="698" height="184" rx="14" fill="#D9F2FA" stroke="#0B63A5" stroke-width="3"/><circle cx="78" cy="199" r="18" fill="#0B63A5"/><text x="78" y="206" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="700">1</text><text x="112" y="207" fill="#102A43" font-family="Arial, sans-serif" font-size="22" font-weight="700">USER VALUE</text><rect x="82" y="233" width="9" height="9" fill="#0B63A5"/><text x="106" y="244" fill="#243B53" font-family="Arial, sans-serif" font-size="18">fd 5..8 is an index-like value</text><rect x="82" y="260" width="9" height="9" fill="#0B63A5"/><text x="106" y="271" fill="#243B53" font-family="Arial, sans-serif" font-size="18">it owns no inode or data</text><rect x="82" y="287" width="9" height="9" fill="#0B63A5"/><text x="106" y="298" fill="#243B53" font-family="Arial, sans-serif" font-size="18">decode: slot = fd − 5</text><path d="M397 349 L397 372" stroke="#0B63A5" stroke-width="4" marker-end="url(#arrow)"/><rect x="48" y="386" width="698" height="184" rx="14" fill="#FFF8E7" stroke="#0B63A5" stroke-width="3"/><circle cx="78" cy="421" r="18" fill="#0B63A5"/><text x="78" y="428" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="700">2</text><text x="112" y="429" fill="#102A43" font-family="Arial, sans-serif" font-size="22" font-weight="700">OPEN-FILE SLOT — KERNEL LIFETIME</text><rect x="82" y="455" width="9" height="9" fill="#0B63A5"/><text x="106" y="466" fill="#243B53" font-family="Arial, sans-serif" font-size="18">owns: open flag + current offset</text><rect x="82" y="482" width="9" height="9" fill="#0B63A5"/><text x="106" y="493" fill="#243B53" font-family="Arial, sans-serif" font-size="18">borrows: pointer to static inode</text><rect x="82" y="509" width="9" height="9" fill="#0B63A5"/><text x="106" y="520" fill="#243B53" font-family="Arial, sans-serif" font-size="18">independent opens get independent offsets</text><path d="M397 571 L397 594" stroke="#0B63A5" stroke-width="4" marker-end="url(#arrow)"/><rect x="48" y="608" width="698" height="184" rx="14" fill="#EAF7EE" stroke="#0B63A5" stroke-width="3"/><circle cx="78" cy="643" r="18" fill="#0B63A5"/><text x="78" y="650" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="700">3</text><text x="112" y="651" fill="#102A43" font-family="Arial, sans-serif" font-size="22" font-weight="700">STATIC INODE — KERNEL LIFETIME</text><rect x="82" y="677" width="9" height="9" fill="#0B63A5"/><text x="106" y="688" fill="#243B53" font-family="Arial, sans-serif" font-size="18">owns: 256-byte data + size + writable</text><rect x="82" y="704" width="9" height="9" fill="#0B63A5"/><text x="106" y="715" fill="#243B53" font-family="Arial, sans-serif" font-size="18">identity shared by all opens</text><rect x="82" y="731" width="9" height="9" fill="#0B63A5"/><text x="106" y="742" fill="#243B53" font-family="Arial, sans-serif" font-size="18">not destroyed or reclaimed</text><path d="M397 793 L397 816" stroke="#0B63A5" stroke-width="4" marker-end="url(#arrow)"/><rect x="48" y="830" width="698" height="184" rx="14" fill="#FDECEC" stroke="#B42318" stroke-width="3" stroke-dasharray="10 7"/><circle cx="78" cy="865" r="18" fill="#B42318"/><text x="78" y="872" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="700">4</text><text x="112" y="873" fill="#102A43" font-family="Arial, sans-serif" font-size="22" font-weight="700">NAME / DENTRY BOUNDARY</text><rect x="82" y="899" width="9" height="9" fill="#B42318"/><text x="106" y="910" fill="#243B53" font-family="Arial, sans-serif" font-size="18">ToyOS stores whole absolute path</text><rect x="82" y="926" width="9" height="9" fill="#B42318"/><text x="106" y="937" fill="#243B53" font-family="Arial, sans-serif" font-size="18">no dentry object or cache exists</text><rect x="82" y="953" width="9" height="9" fill="#B42318"/><text x="106" y="964" fill="#243B53" font-family="Arial, sans-serif" font-size="18">lookup compares /hello or /note exactly</text><rect x="48" y="1040" width="698" height="42" rx="8" fill="#102A43"/><text x="397" y="1067" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="700">Solid = implemented or owned • Dashed red = absent / claim boundary</text></svg>