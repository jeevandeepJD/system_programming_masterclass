<title id="title">Day 7: implementation and concept boundary matrix</title>
<desc id="desc">Integrated matrix distinguishing mechanisms demonstrated by the Week 9 build, mechanisms discussed only conceptually, and mechanisms explicitly absent from the filesystem and device slices.</desc>
