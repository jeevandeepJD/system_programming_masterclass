18"/><text x="78" y="872" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="700">4</text><text x="112" y="873" fill="#102A43" font-family="Arial, sans-serif" font-size="22" font-weight="700">EXPLICITLY ABSENT</text><rect x="82" y="899" width="9" height="9" fill="#B42318"/><text x="106" y="910" fill="#243B53" font-family="Arial, sans-serif" font-size="18">persistence, page cache, block I/O</text><rect x="82" y="926" width="9" height="9" fill="#B42318"/><text x="106" y="937" fill="#243B53" font-family="Arial, sans-serif" font-size="18">directories, reclaim, concurrency</text><rect x="82" y="953" width="9" height="9" fill="#B42318"/><text x="106" y="964" fill="#243B53" font-family="Arial, sans-serif" font-size="18">IRQ routing/asynchronous completion</text><rect x="82" y="980" width="9" height="9" fill="#B42318"/><text x="106" y="991" fill="#243B53" font-family="Arial, sans-serif" font-size="18">DMA mapping/coherency/IOMMU</text><rect x="48" y="1040" width="698" height="42" rx="8" fill="#102A43"/><text x="397" y="1067" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="700">Solid = implemented or owned • Dashed red = absent / claim boundary</text></svg>