<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"
 role="img" aria-labelledby="title desc">
<title id="title">Execution context selects legal primitives</title>
<desc id="desc">Sleepability, local re-entry, preemption, and remote CPU concurrency are separate questions.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
  <path d="M0,0 L12,6 L0,12 Z" fill="context-stroke"/>
 </marker>
</defs>
<rect x="0" y="0" width="1400" height="990" fill="#081621"/>
<text x="70" y="68" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="38px" font-weight="700"><tspan x="70" dy="0">Execution context selects legal primitives</tspan></text>
<text x="70" y="108" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="70" dy="0">Sleepability, local re-entry, preemption, and remote CPU concurrency are separate questions.</tspan></text>
<path d="M70 128 L1330 128" stroke="#31566C" stroke-width="2"/>
<text x="90" y="180" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="25px" font-weight="700"><tspan x="90" dy="0">Where can this accessor run?</tspan></text><rect x="80" y="215" width="190" height="70" rx="14" fill="#102A3A" stroke="#4ADE80" stroke-width="3"/><text x="175" y="258" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="175" dy="0">Process</tspan></text><rect x="330" y="215" width="190" height="70" rx="14" fill="#102A3A" stroke="#C084FC" stroke-width="3"/><text x="425" y="258" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="425" dy="0">Worker</tspan></text><rect x="580" y="215" width="190" height="70" rx="14" fill="#102A3A" stroke="#FB923C" stroke-width="3"/><text x="675" y="258" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="675" dy="0">Softirq</tspan></text><rect x="830" y="215" width="190" height="70" rx="14" fill="#102A3A" stroke="#FB7185" stroke-width="3"/><text x="925" y="258" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="925" dy="0">Hard IRQ</tspan></text><rect x="1080" y="215" width="190" height="70" rx="14" fill="#102A3A" stroke="#FACC15" stroke-width="3"/><text x="1175" y="258" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="1175" dy="0">NMI</tspan></text><path d="M 175 285 L 175 350" fill="none" stroke="#4ADE80" stroke-width="4" marker-end="url(#arrow)"/><path d="M 425 285 L 425 350" fill="none" stroke="#4ADE80" stroke-width="4" marker-end="url(#arrow)"/><path d="M 675 285 L 675 350" fill="none" stroke="#FB923C" stroke-width="4" marker-end="url(#arrow)"/><path d="M 925 285 L 925 350" fill="none" stroke="#FB7185" stroke-width="4" marker-end="url(#arrow)"/><path d="M 1175 285 L 1175 350" fill="none" stroke="#FACC15" stroke-width="4" marker-end="url(#arrow)"/><rect x="85" y="350" width="430" height="105" rx="14" fill="#173C4F" stroke="#4ADE80" stroke-width="3"/><text x="300" y="389" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="23px" font-weight="700"><tspan x="300" dy="0">May sleep?</tspan></text><text x="300" y="424" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="20px" font-weight="400"><tspan x="300" dy="0">yes → mutex / wait queue</tspan></text><rect x="570" y="350" width="700" height="105" rx="14" fill="#173C4F" stroke="#FB7185" stroke-width="3"/><text x="920" y="389" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="23px" font-weight="700"><tspan x="920" dy="0">Atomic context: must not sleep</tspan></text><text x="920" y="424" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="20px" font-weight="400"><tspan x="920" dy="0">bounded non-sleeping primitive only</tspan></text><path d="M 920 455 L 920 520" fill="none" stroke="#FB7185" stroke-width="4" marker-end="url(#arrow)"/><polygon points="920,535 1115,600 920,665 725,600" fill="#102A3A" stroke="#FACC15" stroke-width="3"/><text x="920" y="584" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="920" dy="0">Can local IRQ / softirq</tspan><tspan x="920" dy="29">re-enter this invariant?</tspan></text><path d="M725 600 C640 600, 640 710, 555 710" fill="none" stroke="#FB923C" stroke-width="4" marker-end="url(#arrow)"/><text x="650" y="580" text-anchor="middle" fill="#FB923C" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="650" dy="0">yes</tspan></text><path d="M1115 600 C1200 600, 1200 710, 1260 710" fill="none" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrow)"/><text x="1190" y="580" text-anchor="middle" fill="#38BDF8" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="1190" dy="0">no</tspan></text><rect x="320" y="665" width="470" height="115" rx="14" fill="#173C4F" stroke="#FB923C" stroke-width="3"/><text x="555" y="703" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="555" dy="0">IRQ/preemption distinction</tspan></text><text x="555" y="737" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="555" dy="0">irqsave: mask local IRQ + lock</tspan><tspan x="555" dy="27">preempt_disable: blocks migration, not IRQ</tspan></text><rect x="1060" y="665" width="270" height="115" rx="14" fill="#173C4F" stroke="#38BDF8" stroke-width="3"/><text x="1195" y="704" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="1195" dy="0">SMP exclusion</tspan></text><text x="1195" y="738" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="1195" dy="0">spinlock or atomic</tspan><tspan x="1195" dy="27">for short invariant</tspan></text><text x="90" y="850" text-anchor="start" fill="#FACC15" font-family="DejaVu Sans, Arial, sans-serif" font-size="23px" font-weight="700"><tspan x="90" dy="0">Rule: choose against the most restrictive accessor, not the most common one.</tspan></text>

</svg>
