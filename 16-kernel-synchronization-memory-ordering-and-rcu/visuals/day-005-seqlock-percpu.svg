<title id="title">Seqlock retry and per-CPU aggregation</title>
<desc id="desc">A serialized writer enables retrying snapshots; independent per-CPU shards localize updates before aggregation.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
  <path d="M0,0 L12,6 L0,12 Z" fill="context-stroke"/>
 </marker>
</defs>
<rect x="0" y="0" width="1400" height="990" fill="#081621"/>
<text x="70" y="68" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="38px" font-weight="700"><tspan x="70" dy="0">Seqlock retry and per-CPU aggregation</tspan></text>
<text x="70" y="108" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="70" dy="0">A serialized writer enables retrying snapshots; independent per-CPU shards localize updates before aggregation.</tspan></text>
<path d="M70 128 L1330 128" stroke="#31566C" stroke-width="2"/>
