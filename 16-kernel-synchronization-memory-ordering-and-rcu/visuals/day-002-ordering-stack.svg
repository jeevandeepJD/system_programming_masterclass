<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"
 role="img" aria-labelledby="title desc">
<title id="title">The memory-ordering stack</title>
<desc id="desc">C, compiler, ISA, and cache coherence each have exact responsibilities; the protocol composes them.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
  <path d="M0,0 L12,6 L0,12 Z" fill="context-stroke"/>
 </marker>
</defs>
<rect x="0" y="0" width="1400" height="990" fill="#081621"/>
<text x="70" y="68" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="38px" font-weight="700"><tspan x="70" dy="0">The memory-ordering stack</tspan></text>
<text x="70" y="108" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="70" dy="0">C, compiler, ISA, and cache coherence each have exact responsibilities; the protocol composes them.</tspan></text>
<path d="M70 128 L1330 128" stroke="#31566C" stroke-width="2"/>
<text x="70" y="175" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="27px" font-weight="700"><tspan x="70" dy="0">Each layer answers a different question</tspan></text><rect x="130" y="180" width="1140" height="82" rx="14" fill="#102A3A" stroke="#C084FC" stroke-width="3"/><text x="158" y="214" text-anchor="start" fill="#C084FC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="158" dy="0">C abstract machine</tspan></text><text x="430" y="214" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="430" dy="0">Defines data races, atomics, sequenced-before, and happens-before.</tspan></text><text x="430" y="242" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="430" dy="0">Responsibility does not transfer automatically to adjacent layers.</tspan></text><rect x="190" y="285" width="1020" height="82" rx="14" fill="#102A3A" stroke="#38BDF8" stroke-width="3"/><text x="218" y="319" text-anchor="start" fill="#38BDF8" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="218" dy="0">Compiler mapping</tspan></text><text x="490" y="319" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="490" dy="0">Preserves required observable ordering; may reorder what C permits.</tspan></text><text x="490" y="347" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="490" dy="0">Responsibility does not transfer automatically to adjacent layers.</tspan></text><rect x="250" y="390" width="900" height="82" rx="14" fill="#102A3A" stroke="#FB923C" stroke-width="3"/><text x="278" y="424" text-anchor="start" fill="#FB923C" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="278" dy="0">ISA memory model</tspan></text><text x="550" y="424" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="550" dy="0">Defines load/store visibility and architecture barrier effects.</tspan></text><text x="550" y="452" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="550" dy="0">Responsibility does not transfer automatically to adjacent layers.</tspan></text><rect x="310" y="495" width="780" height="82" rx="14" fill="#102A3A" stroke="#4ADE80" stroke-width="3"/><text x="338" y="529" text-anchor="start" fill="#4ADE80" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="338" dy="0">Cache coherence</tspan></text><text x="610" y="529" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="610" dy="0">Orders writes to one location; not a whole protocol by itself.</tspan></text><text x="610" y="557" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="610" dy="0">Responsibility does not transfer automatically to adjacent layers.</tspan></text><path d="M700 577 L700 675" fill="none" stroke="#FACC15" stroke-width="5" marker-end="url(#arrow)"/><rect x="370" y="675" width="660" height="125" rx="14" fill="#173C4F" stroke="#FACC15" stroke-width="3"/><text x="700" y="716" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="25px" font-weight="700"><tspan x="700" dy="0">Protocol invariant</tspan></text><text x="700" y="752" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="400"><tspan x="700" dy="0">Pair atomicity + ordering + lifetime</tspan><tspan x="700" dy="30">with an explicit inter-thread relationship.</tspan></text><text x="70" y="870" text-anchor="start" fill="#22D3EE" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="70" dy="0">Coherence answers “which write to this location?”; barriers connect operations across locations.</tspan></text>

</svg>
