<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"
 role="img" aria-labelledby="title desc">
<title id="title">RCU update separates publication from reclamation</title>
<desc id="desc">Updater locking serializes writers; publish and unlink precede either synchronous waiting or deferred callback reclamation.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
  <path d="M0,0 L12,6 L0,12 Z" fill="context-stroke"/>
 </marker>
</defs>
<rect x="0" y="0" width="1400" height="990" fill="#081621"/>
<text x="70" y="68" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="38px" font-weight="700"><tspan x="70" dy="0">RCU update separates publication from reclamation</tspan></text>
<text x="70" y="108" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="70" dy="0">Updater locking serializes writers; publish and unlink precede either synchronous waiting or deferred callback reclamation.</tspan></text>
<path d="M70 128 L1330 128" stroke="#31566C" stroke-width="2"/>
<text x="70" y="170" text-anchor="start" fill="#FB923C" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="70" dy="0">Updater serialization</tspan></text><rect x="70" y="200" width="1260" height="75" rx="14" fill="#302315" stroke="#FB923C" stroke-width="3"/><text x="700" y="246" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="700" dy="0">updater lock protects competing writers and update-side invariants</tspan></text><rect x="70" y="335" width="350" height="350" rx="14" fill="#102A3A" stroke="#38BDF8" stroke-width="3"/><text x="95" y="380" text-anchor="start" fill="#38BDF8" font-family="DejaVu Sans, Arial, sans-serif" font-size="23px" font-weight="700"><tspan x="95" dy="0">1 · Publish / unlink</tspan></text><circle cx="105" cy="428" r="8" fill="#38BDF8" stroke="#38BDF8" stroke-width="3"/><text x="128" y="435" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="128" dy="0">allocate replacement</tspan></text><circle cx="105" cy="506" r="8" fill="#38BDF8" stroke="#38BDF8" stroke-width="3"/><text x="128" y="513" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="128" dy="0">rcu_assign_pointer()</tspan></text><circle cx="105" cy="584" r="8" fill="#38BDF8" stroke="#38BDF8" stroke-width="3"/><text x="128" y="591" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="128" dy="0">detach old object</tspan></text><rect x="525" y="335" width="350" height="350" rx="14" fill="#102A3A" stroke="#FACC15" stroke-width="3"/><text x="550" y="380" text-anchor="start" fill="#FACC15" font-family="DejaVu Sans, Arial, sans-serif" font-size="23px" font-weight="700"><tspan x="550" dy="0">2 · Grace-period choice</tspan></text><circle cx="560" cy="428" r="8" fill="#FACC15" stroke="#FACC15" stroke-width="3"/><text x="583" y="435" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="583" dy="0">synchronize_rcu(): wait here</tspan></text><circle cx="560" cy="506" r="8" fill="#FACC15" stroke="#FACC15" stroke-width="3"/><text x="583" y="513" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="583" dy="0">or call_rcu(): queue callback</tspan></text><circle cx="560" cy="584" r="8" fill="#FACC15" stroke="#FACC15" stroke-width="3"/><text x="583" y="591" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="583" dy="0">readers remain non-blocking</tspan></text><rect x="980" y="335" width="350" height="350" rx="14" fill="#102A3A" stroke="#4ADE80" stroke-width="3"/><text x="1005" y="380" text-anchor="start" fill="#4ADE80" font-family="DejaVu Sans, Arial, sans-serif" font-size="23px" font-weight="700"><tspan x="1005" dy="0">3 · Callback / reclaim</tspan></text><circle cx="1015" cy="428" r="8" fill="#4ADE80" stroke="#4ADE80" stroke-width="3"/><text x="1038" y="435" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="1038" dy="0">callback runs after grace period</tspan></text><circle cx="1015" cy="506" r="8" fill="#4ADE80" stroke="#4ADE80" stroke-width="3"/><text x="1038" y="513" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="1038" dy="0">free detached object</tspan></text><circle cx="1015" cy="584" r="8" fill="#4ADE80" stroke="#4ADE80" stroke-width="3"/><text x="1038" y="591" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="1038" dy="0">release external resources</tspan></text><path d="M 420 510 L 525 510" fill="none" stroke="#38BDF8" stroke-width="5" marker-end="url(#arrow)"/><path d="M 875 510 L 980 510" fill="none" stroke="#FACC15" stroke-width="5" marker-end="url(#arrow)"/><path d="M700 685 L700 800" fill="none" stroke="#FB7185" stroke-width="4" marker-end="url(#arrow)"/><rect x="395" y="800" width="610" height="75" rx="14" fill="#3B1E28" stroke="#FB7185" stroke-width="3"/><text x="700" y="846" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="700"><tspan x="700" dy="0">Never reclaim immediately after unlink: old readers may still hold the pointer.</tspan></text>

</svg>
