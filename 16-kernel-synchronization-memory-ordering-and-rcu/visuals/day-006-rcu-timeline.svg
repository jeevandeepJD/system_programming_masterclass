<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"
 role="img" aria-labelledby="title desc">
<title id="title">RCU grace period waits for pre-existing readers</title>
<desc id="desc">Pointer replacement begins a grace period; old data is reclaimed only after all readers that could hold it have exited.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
  <path d="M0,0 L12,6 L0,12 Z" fill="context-stroke"/>
 </marker>
</defs>
<rect x="0" y="0" width="1400" height="990" fill="#081621"/>
<text x="70" y="68" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="38px" font-weight="700"><tspan x="70" dy="0">RCU grace period waits for pre-existing readers</tspan></text>
<text x="70" y="108" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="70" dy="0">Pointer replacement begins a grace period; old data is reclaimed only after all readers that could hold it have exited.</tspan></text>
<path d="M70 128 L1330 128" stroke="#31566C" stroke-width="2"/>
<text x="70" y="170" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="70" dy="0">Time →</tspan></text><text x="70" y="283" text-anchor="start" fill="#38BDF8" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="70" dy="0">Reader A (old)</tspan></text><path d="M 245 275 L 1320 275" fill="none" stroke="#42687C" stroke-width="3"/><text x="70" y="443" text-anchor="start" fill="#C084FC" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="70" dy="0">Reader B (old)</tspan></text><path d="M 245 435 L 1320 435" fill="none" stroke="#42687C" stroke-width="3"/><text x="70" y="603" text-anchor="start" fill="#4ADE80" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="70" dy="0">Reader C (new)</tspan></text><path d="M 245 595 L 1320 595" fill="none" stroke="#42687C" stroke-width="3"/><text x="70" y="778" text-anchor="start" fill="#FB923C" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="70" dy="0">Updater</tspan></text><path d="M 245 770 L 1320 770" fill="none" stroke="#42687C" stroke-width="3"/><rect x="275" y="237" width="575" height="76" rx="14" fill="#123D55" stroke="#38BDF8" stroke-width="3"/><text x="562" y="285" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="700"><tspan x="562" dy="0">pre-existing read-side critical section</tspan></text><rect x="430" y="397" width="580" height="76" rx="14" fill="#332654" stroke="#C084FC" stroke-width="3"/><text x="720" y="445" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="700"><tspan x="720" dy="0">pre-existing read-side critical section</tspan></text><rect x="760" y="557" width="390" height="76" rx="14" fill="#163D2D" stroke="#4ADE80" stroke-width="3"/><text x="955" y="605" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="700"><tspan x="955" dy="0">new reader sees replacement</tspan></text><path d="M 610 205 L 610 835" fill="none" stroke="#FB923C" stroke-width="4" stroke-dasharray="10 8"/><text x="610" y="195" text-anchor="middle" fill="#FB923C" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="610" dy="0">replace pointer</tspan></text><rect x="500" y="720" width="225" height="100" rx="14" fill="#102A3A" stroke="#FB923C" stroke-width="3"/><text x="612" y="758" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="612" dy="0">publish new</tspan></text><text x="612" y="790" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="612" dy="0">unlink old</tspan></text><path d="M 710 690 L 710 835" fill="none" stroke="#FACC15" stroke-width="4" stroke-dasharray="10 8"/><text x="710" y="680" text-anchor="middle" fill="#FACC15" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="710" dy="0">grace period starts</tspan></text><circle cx="850" cy="275" r="12" fill="#38BDF8" stroke="#F8FAFC" stroke-width="3"/><text x="850" y="340" text-anchor="middle" fill="#38BDF8" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="850" dy="0">A exits</tspan></text><circle cx="1010" cy="435" r="12" fill="#C084FC" stroke="#F8FAFC" stroke-width="3"/><text x="1010" y="500" text-anchor="middle" fill="#C084FC" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="1010" dy="0">B exits last</tspan></text><path d="M710 770 C850 870, 1000 870, 1080 800" fill="none" stroke="#FACC15" stroke-width="5" marker-end="url(#arrow)"/><rect x="1080" y="720" width="230" height="100" rx="14" fill="#102A3A" stroke="#FB7185" stroke-width="3"/><text x="1195" y="758" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="1195" dy="0">reclaim old</tspan></text><text x="1195" y="790" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="1195" dy="0">only after A + B exit</tspan></text><text x="760" y="860" text-anchor="start" fill="#4ADE80" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="700"><tspan x="760" dy="0">Reader C started after replacement.</tspan><tspan x="760" dy="28">It does not delay reclaim of the old version.</tspan></text>

</svg>
