<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"
 role="img" aria-labelledby="title desc">
<title id="title">Priority inheritance resolves bounded inversion</title>
<desc id="desc">Low owns the mutex, High blocks and donates priority, Medium cannot interfere, then unlock causes deboost and handoff.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
  <path d="M0,0 L12,6 L0,12 Z" fill="context-stroke"/>
 </marker>
</defs>
<rect x="0" y="0" width="1400" height="990" fill="#081621"/>
<text x="70" y="68" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="38px" font-weight="700"><tspan x="70" dy="0">Priority inheritance resolves bounded inversion</tspan></text>
<text x="70" y="108" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="70" dy="0">Low owns the mutex, High blocks and donates priority, Medium cannot interfere, then unlock causes deboost and handoff.</tspan></text>
<path d="M70 128 L1330 128" stroke="#31566C" stroke-width="2"/>
<text x="70" y="175" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="70" dy="0">Time →</tspan></text><text x="75" y="273" text-anchor="start" fill="#FB7185" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="75" dy="0">High waiter</tspan></text><path d="M 260 265 L 1310 265" fill="none" stroke="#42687C" stroke-width="3"/><text x="75" y="473" text-anchor="start" fill="#FB923C" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="75" dy="0">Medium competitor</tspan></text><path d="M 260 465 L 1310 465" fill="none" stroke="#42687C" stroke-width="3"/><text x="75" y="673" text-anchor="start" fill="#38BDF8" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="75" dy="0">Low owner</tspan></text><path d="M 260 665 L 1310 665" fill="none" stroke="#42687C" stroke-width="3"/><rect x="300" y="615" width="270" height="100" rx="14" fill="#102A3A" stroke="#38BDF8" stroke-width="3"/><text x="435" y="654" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="435" dy="0">Low locks M</tspan></text><text x="435" y="685" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="435" dy="0">base priority: low</tspan></text><rect x="525" y="215" width="255" height="100" rx="14" fill="#102A3A" stroke="#FB7185" stroke-width="3"/><text x="652" y="254" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="652" dy="0">High blocks on M</tspan></text><text x="652" y="285" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="652" dy="0">donates priority</tspan></text><path d="M652 315 C652 385, 640 555, 640 615" fill="none" stroke="#FB7185" stroke-width="5" marker-end="url(#arrow)"/><text x="690" y="445" text-anchor="start" fill="#FB7185" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="700"><tspan x="690" dy="0">PI boost</tspan></text><rect x="600" y="615" width="330" height="100" rx="14" fill="#173C4F" stroke="#C084FC" stroke-width="3"/><text x="765" y="654" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="765" dy="0">Low runs boosted</tspan></text><text x="765" y="685" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="765" dy="0">preempts Medium · finishes CS</tspan></text><rect x="670" y="415" width="300" height="100" rx="14" fill="#332510" stroke="#FB923C" stroke-width="3"/><text x="820" y="454" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="820" dy="0">Medium ready</tspan></text><text x="820" y="485" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="820" dy="0">cannot prolong inversion</tspan></text><path d="M 930 665 L 1030 665" fill="none" stroke="#4ADE80" stroke-width="5" marker-end="url(#arrow)"/><rect x="1030" y="615" width="250" height="100" rx="14" fill="#102A3A" stroke="#4ADE80" stroke-width="3"/><text x="1155" y="654" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="1155" dy="0">Low unlocks M</tspan></text><text x="1155" y="685" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="1155" dy="0">deboost to base</tspan></text><path d="M1155 615 C1155 520, 1100 360, 1040 315" fill="none" stroke="#4ADE80" stroke-width="5" marker-end="url(#arrow)"/><rect x="950" y="215" width="300" height="100" rx="14" fill="#102A3A" stroke="#4ADE80" stroke-width="3"/><text x="1100" y="254" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="1100" dy="0">High acquires M</tspan></text><text x="1100" y="285" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="1100" dy="0">blocking chain resolved</tspan></text><text x="70" y="815" text-anchor="start" fill="#FACC15" font-family="DejaVu Sans, Arial, sans-serif" font-size="20px" font-weight="700"><tspan x="70" dy="0">PI changes effective priority temporarily; it does not transfer the lock early.</tspan><tspan x="70" dy="30">Bounded critical sections remain required for a useful latency bound.</tspan></text>

</svg>
