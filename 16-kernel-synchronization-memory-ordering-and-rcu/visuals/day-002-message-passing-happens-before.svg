<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"
 role="img" aria-labelledby="title desc">
<title id="title">Acquire/release message passing</title>
<desc id="desc">Two timelines show publication; the synchronizes-with edge exists only when acquire reads the release sequence.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
  <path d="M0,0 L12,6 L0,12 Z" fill="context-stroke"/>
 </marker>
</defs>
<rect x="0" y="0" width="1400" height="990" fill="#081621"/>
<text x="70" y="68" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="38px" font-weight="700"><tspan x="70" dy="0">Acquire/release message passing</tspan></text>
<text x="70" y="108" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="70" dy="0">Two timelines show publication; the synchronizes-with edge exists only when acquire reads the release sequence.</tspan></text>
<path d="M70 128 L1330 128" stroke="#31566C" stroke-width="2"/>
<text x="315" y="175" text-anchor="middle" fill="#38BDF8" font-family="DejaVu Sans, Arial, sans-serif" font-size="28px" font-weight="700"><tspan x="315" dy="0">Writer</tspan></text><text x="1085" y="175" text-anchor="middle" fill="#4ADE80" font-family="DejaVu Sans, Arial, sans-serif" font-size="28px" font-weight="700"><tspan x="1085" dy="0">Reader</tspan></text><path d="M 315 205 L 315 800" fill="none" stroke="#38BDF8" stroke-width="5"/><path d="M 1085 205 L 1085 800" fill="none" stroke="#4ADE80" stroke-width="5"/><circle cx="315" cy="275" r="16" fill="#38BDF8" stroke="#F8FAFC" stroke-width="3"/><rect x="60" y="223" width="485" height="104" rx="14" fill="#102A3A" stroke="#38BDF8" stroke-width="3"/><text x="90" y="265" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="90" dy="0">1  data = 42</tspan></text><text x="90" y="298" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="90" dy="0">ordinary / relaxed data store</tspan></text><circle cx="315" cy="430" r="16" fill="#38BDF8" stroke="#F8FAFC" stroke-width="3"/><rect x="60" y="378" width="485" height="104" rx="14" fill="#102A3A" stroke="#38BDF8" stroke-width="3"/><text x="90" y="420" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="90" dy="0">2  flag.store(1, release)</tspan></text><text x="90" y="453" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="90" dy="0">publishes prior writer operations</tspan></text><circle cx="1085" cy="600" r="16" fill="#4ADE80" stroke="#F8FAFC" stroke-width="3"/><rect x="855" y="548" width="485" height="104" rx="14" fill="#102A3A" stroke="#4ADE80" stroke-width="3"/><text x="885" y="590" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="885" dy="0">3  flag.load(acquire) == 1</tspan></text><text x="885" y="623" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="885" dy="0">must read release or its release sequence</tspan></text><circle cx="1085" cy="755" r="16" fill="#4ADE80" stroke="#F8FAFC" stroke-width="3"/><rect x="855" y="703" width="485" height="104" rx="14" fill="#102A3A" stroke="#4ADE80" stroke-width="3"/><text x="885" y="745" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="885" dy="0">4  load data → 42</tspan></text><text x="885" y="778" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="885" dy="0">operation after successful acquire</tspan></text><path d="M550 430 C700 430, 700 600, 835 600" fill="none" stroke="#FACC15" stroke-width="6" marker-end="url(#arrow)"/><text x="700" y="495" text-anchor="middle" fill="#FACC15" font-family="DejaVu Sans, Arial, sans-serif" font-size="20px" font-weight="700"><tspan x="700" dy="0">synchronizes-with</tspan><tspan x="700" dy="28">only when acquire observes</tspan><tspan x="700" dy="28">the release sequence</tspan></text><path d="M570 285 C735 310, 920 680, 850 755" fill="none" stroke="#22D3EE" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="12 9"/><text x="700" y="715" text-anchor="middle" fill="#22D3EE" font-family="DejaVu Sans, Arial, sans-serif" font-size="20px" font-weight="700"><tspan x="700" dy="0">happens-before</tspan></text>
<rect x="70" y="922" width="24" height="18" rx="3" fill="#38BDF8"/><text x="104" y="938" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="104" dy="0">writer order</tspan></text><rect x="249" y="922" width="24" height="18" rx="3" fill="#FACC15"/><text x="283" y="938" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="283" dy="0">synchronizes-with</tspan></text><rect x="470" y="922" width="24" height="18" rx="3" fill="#22D3EE"/><text x="504" y="938" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="504" dy="0">happens-before</tspan></text><rect x="658" y="922" width="24" height="18" rx="3" fill="#4ADE80"/><text x="692" y="938" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="692" dy="0">reader order</tspan></text>
</svg>
