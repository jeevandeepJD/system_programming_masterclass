<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"
 role="img" aria-labelledby="title desc">
<title id="title">Reference count defines a terminal lifetime</title>
<desc id="desc">Acquire-unless-zero protects use; the final drop permits reclaim, and any later dereference crosses the UAF boundary.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
  <path d="M0,0 L12,6 L0,12 Z" fill="context-stroke"/>
 </marker>
</defs>
<rect x="0" y="0" width="1400" height="990" fill="#081621"/>
<text x="70" y="68" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="38px" font-weight="700"><tspan x="70" dy="0">Reference count defines a terminal lifetime</tspan></text>
<text x="70" y="108" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="70" dy="0">Acquire-unless-zero protects use; the final drop permits reclaim, and any later dereference crosses the UAF boundary.</tspan></text>
<path d="M70 128 L1330 128" stroke="#31566C" stroke-width="2"/>
<text x="70" y="175" text-anchor="start" fill="#4ADE80" font-family="DejaVu Sans, Arial, sans-serif" font-size="27px" font-weight="700"><tspan x="70" dy="0">Valid object lifetime</tspan></text><circle cx="150" cy="350" r="78" fill="#102A3A" stroke="#38BDF8" stroke-width="4"/><text x="150" y="337" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="700"><tspan x="150" dy="0">owner publishes</tspan></text><text x="150" y="370" text-anchor="middle" fill="#38BDF8" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="150" dy="0">refs = 1</tspan></text><circle cx="420" cy="350" r="78" fill="#102A3A" stroke="#4ADE80" stroke-width="4"/><text x="420" y="337" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="700"><tspan x="420" dy="0">acquire unless zero</tspan></text><text x="420" y="370" text-anchor="middle" fill="#4ADE80" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="420" dy="0">refs 1 → 2</tspan></text><circle cx="690" cy="350" r="78" fill="#102A3A" stroke="#22D3EE" stroke-width="4"/><text x="690" y="337" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="700"><tspan x="690" dy="0">use object</tspan></text><text x="690" y="370" text-anchor="middle" fill="#22D3EE" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="690" dy="0">reference held</tspan></text><circle cx="960" cy="350" r="78" fill="#102A3A" stroke="#FB923C" stroke-width="4"/><text x="960" y="337" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="700"><tspan x="960" dy="0">drop references</tspan></text><text x="960" y="370" text-anchor="middle" fill="#FB923C" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="960" dy="0">refs 2 → 1 → 0</tspan></text><circle cx="1230" cy="350" r="78" fill="#102A3A" stroke="#FB7185" stroke-width="4"/><text x="1230" y="337" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="700"><tspan x="1230" dy="0">reclaim</tspan></text><text x="1230" y="370" text-anchor="middle" fill="#FB7185" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="1230" dy="0">after final drop</tspan></text><path d="M 228 350 L 342 350" fill="none" stroke="#4ADE80" stroke-width="5" marker-end="url(#arrow)"/><path d="M 498 350 L 612 350" fill="none" stroke="#22D3EE" stroke-width="5" marker-end="url(#arrow)"/><path d="M 768 350 L 882 350" fill="none" stroke="#FB923C" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1038 350 L 1152 350" fill="none" stroke="#FB7185" stroke-width="5" marker-end="url(#arrow)"/><path d="M1230 428 L1230 650" fill="none" stroke="#FB7185" stroke-width="6" marker-end="url(#arrow)"/><text x="1230" y="690" text-anchor="middle" fill="#FB7185" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="1230" dy="0">UAF boundary</tspan></text><rect x="120" y="560" width="880" height="180" rx="14" fill="#173C4F" stroke="#FACC15" stroke-width="3"/><text x="155" y="605" text-anchor="start" fill="#FACC15" font-family="DejaVu Sans, Arial, sans-serif" font-size="23px" font-weight="700"><tspan x="155" dy="0">Terminal-zero rule</tspan></text><text x="155" y="647" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="20px" font-weight="400"><tspan x="155" dy="0">Acquire must fail once count is zero.</tspan><tspan x="155" dy="32">No resurrection after final drop.</tspan><tspan x="155" dy="32">Ordering/lifetime protocol must protect the final destructor.</tspan></text><path d="M1120 720 C980 810, 660 810, 520 740" fill="none" stroke="#FB7185" stroke-width="5" marker-end="url(#arrow)" stroke-dasharray="12 9"/><text x="840" y="840" text-anchor="middle" fill="#FB7185" font-family="DejaVu Sans, Arial, sans-serif" font-size="20px" font-weight="700"><tspan x="840" dy="0">invalid: stale pointer tries get after zero</tspan></text>

</svg>
