<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"
 role="img" aria-labelledby="title desc">
<title id="title">ABBA deadlock and canonical lock order</title>
<desc id="desc">Opposite A-to-B and B-to-A acquisition forms a wait-for cycle; one documented order removes the cycle.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
  <path d="M0,0 L12,6 L0,12 Z" fill="context-stroke"/>
 </marker>
</defs>
<rect x="0" y="0" width="1400" height="990" fill="#081621"/>
<text x="70" y="68" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="38px" font-weight="700"><tspan x="70" dy="0">ABBA deadlock and canonical lock order</tspan></text>
<text x="70" y="108" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="70" dy="0">Opposite A-to-B and B-to-A acquisition forms a wait-for cycle; one documented order removes the cycle.</tspan></text>
<path d="M70 128 L1330 128" stroke="#31566C" stroke-width="2"/>
<text x="70" y="175" text-anchor="start" fill="#FB7185" font-family="DejaVu Sans, Arial, sans-serif" font-size="27px" font-weight="700"><tspan x="70" dy="0">Broken order: wait-for cycle</tspan></text><circle cx="360" cy="390" r="100" fill="#3A1D28" stroke="#FB7185" stroke-width="4"/><text x="360" y="378" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="23px" font-weight="700"><tspan x="360" dy="0">Task 0</tspan><tspan x="360" dy="31">holds A</tspan></text><circle cx="760" cy="390" r="100" fill="#3A1D28" stroke="#FB7185" stroke-width="4"/><text x="760" y="378" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="23px" font-weight="700"><tspan x="760" dy="0">Task 1</tspan><tspan x="760" dy="31">holds B</tspan></text><path d="M455 355 C545 295, 660 295, 665 355" fill="none" stroke="#FB7185" stroke-width="6" marker-end="url(#arrow)"/><text x="560" y="290" text-anchor="middle" fill="#FB7185" font-family="DejaVu Sans, Arial, sans-serif" font-size="20px" font-weight="700"><tspan x="560" dy="0">waits for B</tspan></text><path d="M665 425 C570 500, 470 500, 455 425" fill="none" stroke="#FB7185" stroke-width="6" marker-end="url(#arrow)"/><text x="560" y="530" text-anchor="middle" fill="#FB7185" font-family="DejaVu Sans, Arial, sans-serif" font-size="20px" font-weight="700"><tspan x="560" dy="0">waits for A</tspan></text><rect x="900" y="250" width="430" height="330" rx="14" fill="#102A3A" stroke="#4ADE80" stroke-width="3"/><text x="1115" y="292" text-anchor="middle" fill="#4ADE80" font-family="DejaVu Sans, Arial, sans-serif" font-size="26px" font-weight="700"><tspan x="1115" dy="0">Canonical remedy</tspan></text><rect x="965" y="340" width="120" height="85" rx="14" fill="#173C4F" stroke="#38BDF8" stroke-width="3"/><text x="1025" y="390" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="1025" dy="0">Lock A</tspan></text><path d="M 1085 383 L 1155 383" fill="none" stroke="#4ADE80" stroke-width="5" marker-end="url(#arrow)"/><rect x="1155" y="340" width="120" height="85" rx="14" fill="#173C4F" stroke="#C084FC" stroke-width="3"/><text x="1215" y="390" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="1215" dy="0">Lock B</tspan></text><text x="1115" y="475" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="20px" font-weight="400"><tspan x="1115" dy="0">Every nested path acquires A → B.</tspan><tspan x="1115" dy="31">Release in reverse: B → A.</tspan></text><rect x="120" y="650" width="1160" height="140" rx="14" fill="#173C4F" stroke="#FACC15" stroke-width="3"/><text x="160" y="695" text-anchor="start" fill="#FACC15" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="160" dy="0">Check:</tspan></text><text x="275" y="695" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="275" dy="0">dependency graph must remain acyclic</tspan></text><text x="160" y="735" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="160" dy="0">Trylock/timeouts may change symptoms; they do not repair an undocumented order.</tspan><tspan x="160" dy="31">Lockdep observes lock-class dependencies and can report a potential cycle.</tspan></text>

</svg>
