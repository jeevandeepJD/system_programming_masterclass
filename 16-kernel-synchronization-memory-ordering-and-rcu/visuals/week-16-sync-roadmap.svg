<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"
 role="img" aria-labelledby="title desc">
<title id="title">Week 16 synchronization roadmap</title>
<desc id="desc">Execution contexts constrain primitive choice; ordering and lifetime lead to RCU and bounded debugging evidence.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
  <path d="M0,0 L12,6 L0,12 Z" fill="context-stroke"/>
 </marker>
</defs>
<rect x="0" y="0" width="1400" height="990" fill="#081621"/>
<text x="70" y="68" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="38px" font-weight="700"><tspan x="70" dy="0">Week 16 synchronization roadmap</tspan></text>
<text x="70" y="108" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="70" dy="0">Execution contexts constrain primitive choice; ordering and lifetime lead to RCU and bounded debugging evidence.</tspan></text>
<path d="M70 128 L1330 128" stroke="#31566C" stroke-width="2"/>
<rect x="70" y="205" width="280" height="78" rx="14" fill="#102A3A" stroke="#4ADE80" stroke-width="3"/><text x="92" y="237" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="23px" font-weight="700"><tspan x="92" dy="0">Process</tspan></text><text x="92" y="266" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="92" dy="0">sleepable task context</tspan></text><path d="M350 244 C430 244, 440 390, 510 390" fill="none" stroke="#4ADE80" stroke-width="4" marker-end="url(#arrow)"/><rect x="70" y="315" width="280" height="78" rx="14" fill="#102A3A" stroke="#FB7185" stroke-width="3"/><text x="92" y="347" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="23px" font-weight="700"><tspan x="92" dy="0">Hard IRQ</tspan></text><text x="92" y="376" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="92" dy="0">cannot sleep · local re-entry</tspan></text><path d="M350 354 C430 354, 440 390, 510 390" fill="none" stroke="#FB7185" stroke-width="4" marker-end="url(#arrow)"/><rect x="70" y="425" width="280" height="78" rx="14" fill="#102A3A" stroke="#FB923C" stroke-width="3"/><text x="92" y="457" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="23px" font-weight="700"><tspan x="92" dy="0">Softirq</tspan></text><text x="92" y="486" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="92" dy="0">cannot sleep · may run on CPUs</tspan></text><path d="M350 464 C430 464, 440 390, 510 390" fill="none" stroke="#FB923C" stroke-width="4" marker-end="url(#arrow)"/><rect x="70" y="535" width="280" height="78" rx="14" fill="#102A3A" stroke="#C084FC" stroke-width="3"/><text x="92" y="567" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="23px" font-weight="700"><tspan x="92" dy="0">Worker</tspan></text><text x="92" y="596" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="92" dy="0">deferred · sleepable</tspan></text><path d="M350 574 C430 574, 440 390, 510 390" fill="none" stroke="#C084FC" stroke-width="4" marker-end="url(#arrow)"/><polygon points="650,295 790,390 650,485 510,390" fill="#173C4F" stroke="#FACC15" stroke-width="3"/><text x="650" y="373" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="25px" font-weight="700"><tspan x="650" dy="0">Primitive</tspan><tspan x="650" dy="32">choice</tspan></text><path d="M790 390 C850 390, 850 270, 900 270" fill="none" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrow)"/><path d="M790 390 C850 390, 850 515, 900 515" fill="none" stroke="#C084FC" stroke-width="4" marker-end="url(#arrow)"/><rect x="900" y="205" width="300" height="130" rx="14" fill="#102A3A" stroke="#38BDF8" stroke-width="3"/><text x="1050" y="246" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="25px" font-weight="700"><tspan x="1050" dy="0">Ordering</tspan></text><text x="1050" y="280" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="1050" dy="0">atomicity · barriers</tspan><tspan x="1050" dy="27">happens-before</tspan></text><rect x="900" y="450" width="300" height="130" rx="14" fill="#102A3A" stroke="#C084FC" stroke-width="3"/><text x="1050" y="491" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="25px" font-weight="700"><tspan x="1050" dy="0">Lifetime</tspan></text><text x="1050" y="525" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="1050" dy="0">refcount · seqlock</tspan><tspan x="1050" dy="27">publication · reclaim</tspan></text><path d="M1050 335 L1050 650" fill="none" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrow)"/><path d="M1050 580 L1050 650" fill="none" stroke="#C084FC" stroke-width="4" marker-end="url(#arrow)"/><rect x="900" y="650" width="300" height="105" rx="14" fill="#173C4F" stroke="#4ADE80" stroke-width="3"/><text x="1050" y="695" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="26px" font-weight="700"><tspan x="1050" dy="0">RCU</tspan></text><text x="1050" y="727" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="1050" dy="0">readers → grace period → reclaim</tspan></text><path d="M 1200 703 L 1270 703" fill="none" stroke="#FACC15" stroke-width="4" marker-end="url(#arrow)"/><rect x="1270" y="640" width="95" height="126" rx="14" fill="#102A3A" stroke="#FACC15" stroke-width="3"/><text x="1317" y="686" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="700"><tspan x="1317" dy="0">Debug</tspan><tspan x="1317" dy="25">&amp;</tspan><tspan x="1317" dy="25">prove</tspan></text><text x="70" y="710" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="23px" font-weight="400"><tspan x="70" dy="0">First classify every accessor.</tspan><tspan x="70" dy="35">Then select exclusion, ordering,</tspan><tspan x="70" dy="35">and lifetime rules together.</tspan></text>
<rect x="70" y="922" width="24" height="18" rx="3" fill="#4ADE80"/><text x="104" y="938" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="104" dy="0">sleepable</tspan></text><rect x="249" y="922" width="24" height="18" rx="3" fill="#FB7185"/><text x="283" y="938" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="283" dy="0">atomic context</tspan></text><rect x="437" y="922" width="24" height="18" rx="3" fill="#38BDF8"/><text x="471" y="938" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="471" dy="0">ordering</tspan></text><rect x="616" y="922" width="24" height="18" rx="3" fill="#C084FC"/><text x="650" y="938" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="650" dy="0">lifetime</tspan></text>
</svg>
