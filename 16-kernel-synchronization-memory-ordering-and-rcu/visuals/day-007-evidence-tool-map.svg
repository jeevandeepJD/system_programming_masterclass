<title id="title">Symptom-to-evidence tool map</title>
<desc id="desc">Each diagnostic supports a bounded claim and has a specific class of claims it cannot establish.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
  <path d="M0,0 L12,6 L0,12 Z" fill="context-stroke"/>
 </marker>
</defs>
<rect x="0" y="0" width="1400" height="990" fill="#081621"/>
<text x="70" y="68" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="38px" font-weight="700"><tspan x="70" dy="0">Symptom-to-evidence tool map</tspan></text>
<text x="70" y="108" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="70" dy="0">Each diagnostic supports a bounded claim and has a specific class of claims it cannot establish.</tspan></text>
<path d="M70 128 L1330 128" stroke="#31566C" stroke-width="2"/>
<rect x="60" y="170" width="210" height="65" rx="0" fill="#1B4053" stroke="#5F8295" stroke-width="2"/><text x="165.0" y="210" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="700"><tspan x="165.0" dy="0">Symptom</tspan></text><rect x="270" y="170" width="260" height="65" rx="0" fill="#1B4053" stroke="#5F8295" stroke-width="2"/><text x="400.0" y="210" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="700"><tspan x="400.0" dy="0">Best first tool</tspan></text><rect x="530" y="170" width="335" height="65" rx="0" fill="#1B4053" stroke="#5F8295" stroke-width="2"/><text x="697.5" y="210" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="700"><tspan x="697.5" dy="0">What it supports</tspan></text><rect x="865" y="170" width="470" height="65" rx="0" fill="#1B4053" stroke="#5F8295" stroke-width="2"/><text x="1100.0" y="210" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="700"><tspan x="1100.0" dy="0">What it cannot prove</tspan></text><rect x="60" y="235" width="210" height="125" rx="0" fill="#102A3A" stroke="#31566C" stroke-width="2"/><text x="165.0" y="291" text-anchor="middle" fill="#FB7185" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="165.0" dy="0">lock cycle</tspan></text><rect x="270" y="235" width="260" height="125" rx="0" fill="#102A3A" stroke="#31566C" stroke-width="2"/><text x="400.0" y="291" text-anchor="middle" fill="#FB7185" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="400.0" dy="0">lockdep</tspan></text><rect x="530" y="235" width="335" height="125" rx="0" fill="#102A3A" stroke="#31566C" stroke-width="2"/><text x="697.5" y="291" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="697.5" dy="0">dependency</tspan><tspan x="697.5" dy="27">context misuse</tspan></text><rect x="865" y="235" width="470" height="125" rx="0" fill="#102A3A" stroke="#31566C" stroke-width="2"/><text x="1100.0" y="291" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="1100.0" dy="0">actual hang or hold time</tspan></text><rect x="60" y="360" width="210" height="125" rx="0" fill="#0D2230" stroke="#31566C" stroke-width="2"/><text x="165.0" y="416" text-anchor="middle" fill="#FB923C" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="165.0" dy="0">suspected race</tspan></text><rect x="270" y="360" width="260" height="125" rx="0" fill="#0D2230" stroke="#31566C" stroke-width="2"/><text x="400.0" y="416" text-anchor="middle" fill="#FB923C" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="400.0" dy="0">KCSAN</tspan></text><rect x="530" y="360" width="335" height="125" rx="0" fill="#0D2230" stroke="#31566C" stroke-width="2"/><text x="697.5" y="416" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="697.5" dy="0">sampled conflicting access</tspan></text><rect x="865" y="360" width="470" height="125" rx="0" fill="#0D2230" stroke="#31566C" stroke-width="2"/><text x="1100.0" y="416" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="1100.0" dy="0">absence means race-free</tspan></text><rect x="60" y="485" width="210" height="125" rx="0" fill="#102A3A" stroke="#31566C" stroke-width="2"/><text x="165.0" y="541" text-anchor="middle" fill="#C084FC" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="165.0" dy="0">grace-period delay</tspan></text><rect x="270" y="485" width="260" height="125" rx="0" fill="#102A3A" stroke="#31566C" stroke-width="2"/><text x="400.0" y="541" text-anchor="middle" fill="#C084FC" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="400.0" dy="0">RCU stall</tspan></text><rect x="530" y="485" width="335" height="125" rx="0" fill="#102A3A" stroke="#31566C" stroke-width="2"/><text x="697.5" y="541" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="697.5" dy="0">insufficient progress threshold</tspan></text><rect x="865" y="485" width="470" height="125" rx="0" fill="#102A3A" stroke="#31566C" stroke-width="2"/><text x="1100.0" y="541" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="1100.0" dy="0">single root-cause line</tspan></text><rect x="60" y="610" width="210" height="125" rx="0" fill="#0D2230" stroke="#31566C" stroke-width="2"/><text x="165.0" y="666" text-anchor="middle" fill="#38BDF8" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="165.0" dy="0">mechanism question</tspan></text><rect x="270" y="610" width="260" height="125" rx="0" fill="#0D2230" stroke="#31566C" stroke-width="2"/><text x="400.0" y="666" text-anchor="middle" fill="#38BDF8" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="400.0" dy="0">pinned source</tspan></text><rect x="530" y="610" width="335" height="125" rx="0" fill="#0D2230" stroke="#31566C" stroke-width="2"/><text x="697.5" y="666" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="697.5" dy="0">implemented control flow</tspan></text><rect x="865" y="610" width="470" height="125" rx="0" fill="#0D2230" stroke="#31566C" stroke-width="2"/><text x="1100.0" y="666" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="1100.0" dy="0">runtime branch occurred</tspan></text><rect x="60" y="735" width="210" height="125" rx="0" fill="#102A3A" stroke="#31566C" stroke-width="2"/><text x="165.0" y="791" text-anchor="middle" fill="#4ADE80" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="165.0" dy="0">process baseline</tspan></text><rect x="270" y="735" width="260" height="125" rx="0" fill="#102A3A" stroke="#31566C" stroke-width="2"/><text x="400.0" y="791" text-anchor="middle" fill="#4ADE80" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="400.0" dy="0">/proc</tspan></text><rect x="530" y="735" width="335" height="125" rx="0" fill="#102A3A" stroke="#31566C" stroke-width="2"/><text x="697.5" y="791" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="697.5" dy="0">state</tspan><tspan x="697.5" dy="27">cumulative counters</tspan></text><rect x="865" y="735" width="470" height="125" rx="0" fill="#102A3A" stroke="#31566C" stroke-width="2"/><text x="1100.0" y="791" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="1100.0" dy="0">event ordering / causality</tspan></text><text x="60" y="905" text-anchor="start" fill="#FACC15" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="60" dy="0">Triangulate: symptom + runtime evidence + pinned mechanism + explicit limits.</tspan></text>

