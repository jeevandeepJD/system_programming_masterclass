<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"
 role="img" aria-labelledby="title desc">
<title id="title">spin_lock_irqsave protects two dimensions</title>
<desc id="desc">Local interrupt state is saved and restored while lock ownership excludes a remote CPU from the invariant.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
  <path d="M0,0 L12,6 L0,12 Z" fill="context-stroke"/>
 </marker>
</defs>
<rect x="0" y="0" width="1400" height="990" fill="#081621"/>
<text x="70" y="68" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="38px" font-weight="700"><tspan x="70" dy="0">spin_lock_irqsave protects two dimensions</tspan></text>
<text x="70" y="108" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="70" dy="0">Local interrupt state is saved and restored while lock ownership excludes a remote CPU from the invariant.</tspan></text>
<path d="M70 128 L1330 128" stroke="#31566C" stroke-width="2"/>
<text x="85" y="180" text-anchor="start" fill="#38BDF8" font-family="DejaVu Sans, Arial, sans-serif" font-size="25px" font-weight="700"><tspan x="85" dy="0">CPU 0 · process context</tspan></text><text x="1010" y="180" text-anchor="start" fill="#C084FC" font-family="DejaVu Sans, Arial, sans-serif" font-size="25px" font-weight="700"><tspan x="1010" dy="0">CPU 1 · remote contender</tspan></text><rect x="85" y="215" width="600" height="78" rx="14" fill="#102A3A" stroke="#38BDF8" stroke-width="3"/><text x="112" y="246" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="112" dy="0">save flags</tspan></text><text x="365" y="246" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="365" dy="0">IF state captured</tspan></text><path d="M 385 293 L 385 325" fill="none" stroke="#38BDF8" stroke-width="3" marker-end="url(#arrow)"/><rect x="85" y="325" width="600" height="78" rx="14" fill="#102A3A" stroke="#FB7185" stroke-width="3"/><text x="112" y="356" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="112" dy="0">disable local IRQ</tspan></text><text x="365" y="356" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="365" dy="0">prevents local IRQ re-entry</tspan></text><path d="M 385 403 L 385 435" fill="none" stroke="#FB7185" stroke-width="3" marker-end="url(#arrow)"/><rect x="85" y="435" width="600" height="78" rx="14" fill="#102A3A" stroke="#FACC15" stroke-width="3"/><text x="112" y="466" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="112" dy="0">acquire lock</tspan></text><text x="365" y="466" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="365" dy="0">cross-CPU exclusion begins</tspan></text><path d="M 385 513 L 385 545" fill="none" stroke="#FACC15" stroke-width="3" marker-end="url(#arrow)"/><rect x="85" y="545" width="600" height="78" rx="14" fill="#102A3A" stroke="#4ADE80" stroke-width="3"/><text x="112" y="576" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="112" dy="0">update invariant</tspan></text><text x="365" y="576" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="365" dy="0">bounded · must not sleep</tspan></text><path d="M 385 623 L 385 655" fill="none" stroke="#4ADE80" stroke-width="3" marker-end="url(#arrow)"/><rect x="85" y="655" width="600" height="78" rx="14" fill="#102A3A" stroke="#FACC15" stroke-width="3"/><text x="112" y="686" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="112" dy="0">unlock</tspan></text><text x="365" y="686" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="365" dy="0">publish protected state</tspan></text><path d="M 385 733 L 385 765" fill="none" stroke="#FACC15" stroke-width="3" marker-end="url(#arrow)"/><rect x="85" y="765" width="600" height="78" rx="14" fill="#102A3A" stroke="#38BDF8" stroke-width="3"/><text x="112" y="796" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="112" dy="0">restore flags</tspan></text><text x="365" y="796" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="365" dy="0">restore original IF state</tspan></text><path d="M 1010 230 L 1010 820" fill="none" stroke="#C084FC" stroke-width="4"/><rect x="890" y="420" width="390" height="95" rx="14" fill="#173C4F" stroke="#C084FC" stroke-width="3"/><text x="1085" y="459" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="1085" dy="0">spin_lock waits</tspan></text><text x="1085" y="491" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="1085" dy="0">CPU 0 owns the same lock</tspan></text><path d="M890 468 C815 468, 815 474, 685 474" fill="none" stroke="#C084FC" stroke-width="5" marker-end="url(#arrow)"/><path d="M685 694 C810 694, 810 690, 890 690" fill="none" stroke="#4ADE80" stroke-width="5" marker-end="url(#arrow)"/><rect x="890" y="645" width="390" height="95" rx="14" fill="#173C4F" stroke="#4ADE80" stroke-width="3"/><text x="1085" y="684" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="22px" font-weight="700"><tspan x="1085" dy="0">lock becomes available</tspan></text><text x="1085" y="716" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="1085" dy="0">remote CPU may acquire</tspan></text><text x="760" y="835" text-anchor="start" fill="#FB7185" font-family="DejaVu Sans, Arial, sans-serif" font-size="20px" font-weight="700"><tspan x="760" dy="0">irqsave changes only CPU 0&#x27;s local IRQ state;</tspan></text><text x="760" y="867" text-anchor="start" fill="#C084FC" font-family="DejaVu Sans, Arial, sans-serif" font-size="20px" font-weight="700"><tspan x="760" dy="0">the lock excludes CPU 1.</tspan></text>

</svg>
