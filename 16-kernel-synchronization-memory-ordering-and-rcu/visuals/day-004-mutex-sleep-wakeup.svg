<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990"
 role="img" aria-labelledby="title desc">
<title id="title">Mutex fast path and contended sleep path</title>
<desc id="desc">Uncontended cmpxchg enters directly; contention queues a waiter, sleeps, wakes, and retries acquisition.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
  <path d="M0,0 L12,6 L0,12 Z" fill="context-stroke"/>
 </marker>
</defs>
<rect x="0" y="0" width="1400" height="990" fill="#081621"/>
<text x="70" y="68" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="38px" font-weight="700"><tspan x="70" dy="0">Mutex fast path and contended sleep path</tspan></text>
<text x="70" y="108" text-anchor="start" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="400"><tspan x="70" dy="0">Uncontended cmpxchg enters directly; contention queues a waiter, sleeps, wakes, and retries acquisition.</tspan></text>
<path d="M70 128 L1330 128" stroke="#31566C" stroke-width="2"/>
<text x="70" y="180" text-anchor="start" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="27px" font-weight="700"><tspan x="70" dy="0">mutex_lock()</tspan></text><polygon points="300,238 480,310 300,382 120,310" fill="#173C4F" stroke="#FACC15" stroke-width="3"/><text x="300" y="300" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="300" dy="0">cmpxchg:</tspan><tspan x="300" dy="29">unlocked → owned?</tspan></text><path d="M480 310 L650 310" fill="none" stroke="#4ADE80" stroke-width="5" marker-end="url(#arrow)"/><text x="560" y="288" text-anchor="middle" fill="#4ADE80" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="560" dy="0">success</tspan></text><rect x="650" y="250" width="320" height="120" rx="14" fill="#102A3A" stroke="#4ADE80" stroke-width="3"/><text x="810" y="296" text-anchor="middle" fill="#4ADE80" font-family="DejaVu Sans, Arial, sans-serif" font-size="24px" font-weight="700"><tspan x="810" dy="0">Fast path</tspan></text><text x="810" y="332" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="20px" font-weight="400"><tspan x="810" dy="0">enter critical section</tspan></text><path d="M300 382 L300 470" fill="none" stroke="#FB7185" stroke-width="5" marker-end="url(#arrow)"/><text x="335" y="432" text-anchor="start" fill="#FB7185" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="700"><tspan x="335" dy="0">contended</tspan></text><rect x="120" y="500" width="240" height="120" rx="14" fill="#102A3A" stroke="#38BDF8" stroke-width="3"/><text x="240" y="545" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="240" dy="0">queue waiter</tspan></text><text x="240" y="582" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="240" dy="0">under internal wait lock</tspan></text><rect x="430" y="500" width="240" height="120" rx="14" fill="#102A3A" stroke="#38BDF8" stroke-width="3"/><text x="550" y="545" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="550" dy="0">set sleep state</tspan></text><text x="550" y="582" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="550" dy="0">do not spin indefinitely</tspan></text><rect x="740" y="500" width="240" height="120" rx="14" fill="#102A3A" stroke="#38BDF8" stroke-width="3"/><text x="860" y="545" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="860" dy="0">schedule</tspan></text><text x="860" y="582" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="860" dy="0">owner can run</tspan></text><rect x="1050" y="500" width="240" height="120" rx="14" fill="#102A3A" stroke="#38BDF8" stroke-width="3"/><text x="1170" y="545" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="21px" font-weight="700"><tspan x="1170" dy="0">wake + reacquire</tspan></text><text x="1170" y="582" text-anchor="middle" fill="#C8D8E4" font-family="DejaVu Sans, Arial, sans-serif" font-size="18px" font-weight="400"><tspan x="1170" dy="0">loop on ownership</tspan></text><path d="M 360 560 L 430 560" fill="none" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrow)"/><path d="M 670 560 L 740 560" fill="none" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrow)"/><path d="M 980 560 L 1050 560" fill="none" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrow)"/><path d="M1170 620 C1170 735, 810 750, 810 370" fill="none" stroke="#FACC15" stroke-width="4" marker-end="url(#arrow)"/><text x="1020" y="730" text-anchor="middle" fill="#FACC15" font-family="DejaVu Sans, Arial, sans-serif" font-size="19px" font-weight="700"><tspan x="1020" dy="0">retry ownership after wake</tspan></text><rect x="120" y="810" width="1170" height="65" rx="14" fill="#302A12" stroke="#FACC15" stroke-width="3"/><text x="705" y="851" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-size="20px" font-weight="700"><tspan x="705" dy="0">Wakeup is permission to retry—not ownership transfer and not proof the predicate is true.</tspan></text>

</svg>
