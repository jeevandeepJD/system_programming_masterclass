<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
  <title id="title">User and supervisor page-table translation</title>
  <desc id="desc">A four-level x86-64 walk shows that a ring 3 translation requires present and user permission at PML4E, PDPTE, PDE, and PTE, while a supervisor leaf remains inaccessible.</desc>
  <rect width="794" height="1123" fill="#fff"/>
  <style>text{font-family:Arial,sans-serif;fill:#10243e;font-size:20px}.h{font-size:34px;font-weight:700}.sub{font-size:19px;fill:#334e68}.ok{fill:#e7f7ed;stroke:#176b3a;stroke-width:3}.no{fill:#fff1e8;stroke:#9a3412;stroke-width:3}.a{stroke:#174ea6;stroke-width:4;fill:none}.x{stroke:#9a3412;stroke-width:7}</style>
  <text class="h" x="397" y="62" text-anchor="middle">Ring 3 permission is an all-level AND</text>
  <text class="sub" x="397" y="98" text-anchor="middle">Present and U/S must permit the access through the complete walk.</text>
  <text x="397" y="155" text-anchor="middle" font-weight="700">user virtual address e 0x40000000</text>
  <path class="a" d="M397 175V225"/>
  <g>
    <rect class="ok" x="155" y="225" width="484" height="105" rx="12"/>
    <text x="397" y="267" text-anchor="middle" font-weight="700">PML4E  |  index bits 47 to 39</text>
    <text class="sub" x="397" y="301" text-anchor="middle">P=1  |  U/S=1 -&gt; continue</text>
    <path class="a" d="M397 330V385"/>
    <rect class="ok" x="155" y="385" width="484" height="105" rx="12"/>
    <text x="397" y="427" text-anchor="middle" font-weight="700">PDPTE  |  index bits 38 to 30</text>
    <text class="sub" x="397" y="461" text-anchor="middle">P=1  |  U/S=1 -&gt; continue</text>
    <path class="a" d="M397 490V545"/>
    <rect class="ok" x="155" y="545" width="484" height="105" rx="12"/>
    <text x="397" y="587" text-anchor="middle" font-weight="700">PDE  |  index bits 29 to 21</text>
    <text class="sub" x="397" y="621" text-anchor="middle">P=1  |  U/S=1  |  not huge -&gt; continue</text>
    <path class="a" d="M397 650V705"/>
    <rect class="ok" x="155" y="705" width="484" height="105" rx="12"/>
    <text x="397" y="747" text-anchor="middle" font-weight="700">PTE  |  index bits 20 to 12</text>
    <text class="sub" x="397" y="781" text-anchor="middle">P=1  |  U/S=1  |  R/W as required</text>
    <path class="a" d="M397 810V865"/>
    <rect class="ok" x="155" y="865" width="484" height="105" rx="12"/>
    <text x="397" y="907" text-anchor="middle" font-weight="700">physical frame + 12-bit offset</text>
    <text class="sub" x="397" y="941" text-anchor="middle">Translation succeeds for ring 3.</text>
  </g>
  <rect class="no" x="95" y="1010" width="604" height="72" rx="10"/>
  <line class="x" x1="116" y1="1028" x2="152" y2="1064"/><line class="x" x1="152" y1="1028" x2="116" y2="1064"/>
  <text x="172" y="1053">Any U/S=0 entry blocks the user access.</text>
</svg>
