<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 800" role="img" aria-labelledby="title desc"><title id="title">Memory hierarchy latency and capacity path</title><desc id="desc">A load searches registers, three cache levels, DRAM, and storage; widening levels indicate increasing capacity while arrows and labels indicate increasing latency and explain the memory wall.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:sans-serif;fill:#f7fbff}.h{font-size:32px;font-weight:700}.t{font-size:22px;font-weight:700}.s{font-size:18px}.f{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1190" height="800" fill="#071521"/><text class="h" x="595" y="48" text-anchor="middle">A load pays only as far down as its nearest usable copy</text>
<g text-anchor="middle"><rect x="470" y="90" width="250" height="75" rx="10" fill="#22563f" stroke="#fff" stroke-width="3"/><text class="t" x="595" y="137">Registers  /  bytes</text><rect x="415" y="195" width="360" height="75" rx="10" fill="#176b72" stroke="#fff" stroke-width="3"/><text class="t" x="595" y="242">L1  /  tens of KiB</text><rect x="350" y="300" width="490" height="75" rx="10" fill="#315a88" stroke="#fff" stroke-width="3"/><text class="t" x="595" y="347">L2/L3  /  MiB</text><rect x="275" y="405" width="640" height="75" rx="10" fill="#624b88" stroke="#fff" stroke-width="3"/><text class="t" x="595" y="452">DRAM  /  GiB</text><rect x="175" y="510" width="840" height="75" rx="10" fill="#7d3850" stroke="#fff" stroke-width="3"/><text class="t" x="595" y="557">SSD / storage  /  TiB, I/O path</text></g>
<path class="f" d="M90 120V570"/><text class="t" x="65" y="345" text-anchor="middle" transform="rotate(-90 65 345)">latency generally increases</text><path class="f" d="M1100 120V570"/><text class="t" x="1125" y="345" text-anchor="middle" transform="rotate(90 1125 345)">capacity generally increases</text>
<rect x="125" y="650" width="940" height="95" rx="12" fill="#284b63" stroke="#8ecae6" stroke-width="3"/><text class="t" x="595" y="688" text-anchor="middle">Miss path: cache tags -> coherence / controller -> DRAM line fill -> requested bytes</text><text class="s" x="595" y="722" text-anchor="middle">Storage is not "the next ordinary cache miss"; the OS and device I/O path intervene.</text></svg>
