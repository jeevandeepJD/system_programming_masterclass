<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 800" role="img" aria-labelledby="title desc"><title id="title">Equivalent x86-64 and RISC-V load add branch paths</title><desc id="desc">Parallel paths implement sum plus equals array index: x86-64 uses a scaled memory operand and flags while RISC-V explicitly shifts, adds, loads, adds, and compares registers; both finish with equivalent state and neither path implies runtime superiority.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:monospace;fill:#f7fbff}.h{font:700 32px sans-serif}.t{font-size:22px;font-weight:700}.s{font-size:18px}.b{stroke:#d8f3ff;stroke-width:3}.f{stroke:#ffd166;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1190" height="800" fill="#071521"/><text class="h" x="595" y="48" text-anchor="middle">Same required work, different visible decomposition</text><text class="t" x="300" y="100" text-anchor="middle">x86-64 System V</text><text class="t" x="890" y="100" text-anchor="middle">RV64I psABI</text>
<g text-anchor="middle"><rect class="b" x="70" y="135" width="460" height="90" rx="10" fill="#315a88"/><text class="t" x="300" y="175">movq (%rdi,%rsi,8), %rdx</text><text class="s" x="300" y="205">scaled EA + load</text><rect class="b" x="70" y="270" width="460" height="90" rx="10" fill="#176b72"/><text class="t" x="300" y="310">addq %rdx, %rax</text><text class="s" x="300" y="340">sum update + flags</text><rect class="b" x="70" y="405" width="460" height="115" rx="10" fill="#624b88"/><text class="t" x="300" y="445">cmpq %rcx, %rsi</text><text class="t" x="300" y="480">jb .loop</text><text class="s" x="300" y="510">branch consumes RFLAGS</text>
<rect class="b" x="660" y="135" width="460" height="90" rx="10" fill="#315a88"/><text class="t" x="890" y="175">slli t0,a1,3; add t0,a0,t0</text><text class="s" x="890" y="205">explicit scaled address</text><rect class="b" x="660" y="270" width="460" height="90" rx="10" fill="#176b72"/><text class="t" x="890" y="310">ld t1,0(t0); add s0,s0,t1</text><text class="s" x="890" y="340">explicit load + sum update</text><rect class="b" x="660" y="405" width="460" height="115" rx="10" fill="#624b88"/><text class="t" x="890" y="455">bltu a1,a2,.loop</text><text class="s" x="890" y="495">branch compares registers directly</text></g>
<path class="f" d="M300 225V260"/><path class="f" d="M300 360V395"/><path class="f" d="M890 225V260"/><path class="f" d="M890 360V395"/>
<rect x="130" y="610" width="930" height="120" rx="14" fill="#284b63" stroke="#ffd166" stroke-width="3"/><text class="t" x="595" y="650" text-anchor="middle">Equivalent architectural outcome</text><text class="s" x="595" y="685" text-anchor="middle">same element address -> same loaded 64-bit value -> same modular sum -> same loop decision</text><text class="s" x="595" y="715" text-anchor="middle">Instruction count alone says nothing about uops, fusion, cache misses, prediction, or cycles.</text></svg>
