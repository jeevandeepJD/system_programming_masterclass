<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 760" role="img" aria-labelledby="title desc">
  <title id="title">Effective address, flags, and branch flow on x86-64</title><desc id="desc">A worked instruction path computes address 0x1018, loads a value, compares i and n into flags, and selects either the branch target or fall-through RIP.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:sans-serif;fill:#f7fbff}.h{font-size:32px;font-weight:700}.t{font-size:22px;font-weight:700}.s{font-size:18px}.b{fill:#12304a;stroke:#8ecae6;stroke-width:3}.f{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1190" height="760" fill="#071521"/>
  <text class="h" x="595" y="48" text-anchor="middle">Address dataflow and control dataflow meet at RIP</text>
  <rect class="b" x="50" y="105" width="300" height="155" rx="12"/><text class="t" x="200" y="145" text-anchor="middle">Address inputs</text><text class="s" x="75" y="182">rdi = 0x1000</text><text class="s" x="75" y="214">rsi = 3; scale = 4</text><text class="s" x="75" y="246">displacement = 12</text>
  <rect class="b" x="445" y="105" width="300" height="155" rx="12"/><text class="t" x="595" y="145" text-anchor="middle">Address generation</text><text class="s" x="595" y="190" text-anchor="middle">0x1000 + 3x4 + 12</text><text class="t" x="595" y="230" text-anchor="middle">EA = 0x1018</text>
  <rect class="b" x="840" y="105" width="300" height="155" rx="12"/><text class="t" x="990" y="145" text-anchor="middle">movl 12(...), %eax</text><text class="s" x="990" y="188" text-anchor="middle">read memory[0x1018..1b]</text><text class="s" x="990" y="222" text-anchor="middle">write EAX; zero upper RAX</text>
  <path class="f" d="M350 182H435"/><path class="f" d="M745 182H830"/>
  <rect class="b" x="150" y="390" width="300" height="145" rx="12"/><text class="t" x="300" y="430" text-anchor="middle">cmpq %rdi, %rcx</text><text class="s" x="300" y="472" text-anchor="middle">compute rcx - rdi</text><text class="s" x="300" y="505" text-anchor="middle">store ZF / SF / OF / CF</text>
  <rect class="b" x="515" y="390" width="220" height="145" rx="12"/><text class="t" x="625" y="430" text-anchor="middle">jge .done</text><text class="s" x="625" y="475" text-anchor="middle">test SF = OF</text><text class="s" x="625" y="508" text-anchor="middle">flags are inputs</text>
  <rect x="805" y="355" width="300" height="95" rx="12" fill="#22563f" stroke="#b7f7d0" stroke-width="3"/><text class="t" x="955" y="395" text-anchor="middle">true: RIP &lt;- .done</text><text class="s" x="955" y="428" text-anchor="middle">taken edge</text>
  <rect x="805" y="500" width="300" height="95" rx="12" fill="#682e40" stroke="#ffb3bd" stroke-width="3"/><text class="t" x="955" y="540" text-anchor="middle">false: RIP &lt;- next</text><text class="s" x="955" y="573" text-anchor="middle">fall-through edge</text>
  <path class="f" d="M450 462H505"/><path class="f" d="M735 440L795 405"/><path class="f" d="M735 485L795 545"/><text class="s" x="595" y="690" text-anchor="middle">LEA stops after address generation; MOV continues into memory. CMP stops after flags; Jcc consumes them.</text>
</svg>
