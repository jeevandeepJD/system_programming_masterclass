<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 780" role="img" aria-labelledby="title desc"><title id="title">Address tag set and offset mapping</title><desc id="desc">The address 0x12345678 is split for a 32-bit, 64-byte-line, 256-set, four-way cache into an 18-bit tag, 8-bit set 0x59, and 6-bit offset 56, then looked up across four tags in the selected set.</desc><defs><style>text{font-family:monospace;fill:#f7fbff}.h{font:700 32px sans-serif}.t{font-size:22px;font-weight:700}.s{font-size:18px}.field{stroke:#fff;stroke-width:3}</style></defs><rect width="1190" height="780" fill="#071521"/><text class="h" x="595" y="48" text-anchor="middle">Worked mapping: 32-bit address, 64 B lines, 256 sets, 4 ways</text><text class="t" x="55" y="110">A = 0x12345678</text>
<g text-anchor="middle"><rect class="field" x="55" y="145" width="600" height="105" fill="#315a88"/><text class="t" x="355" y="185">TAG  /  upper 18 bits</text><text class="t" x="355" y="225">0x48d1</text><rect class="field" x="655" y="145" width="290" height="105" fill="#176b72"/><text class="t" x="800" y="185">SET  /  8 bits</text><text class="t" x="800" y="225">0x59 = 89</text><rect class="field" x="945" y="145" width="190" height="105" fill="#9a6518"/><text class="t" x="1040" y="185">OFFSET  /  6</text><text class="t" x="1040" y="225">56</text></g>
<text class="s" x="55" y="305">offset = A mod 64 = 56</text><text class="s" x="55" y="340">line = floor(A / 64) = 0x0048d159</text><text class="s" x="55" y="375">set = line mod 256 = 0x59</text><text class="s" x="55" y="410">tag = floor(line / 256) = 0x48d1</text>
<rect x="520" y="310" width="615" height="355" rx="14" fill="#12304a" stroke="#8ecae6" stroke-width="3"/><text class="t" x="827" y="350" text-anchor="middle">Read set 89: compare requested tag in parallel</text><g><rect class="field" x="560" y="385" width="535" height="55" fill="#4c5968"/><text class="s" x="580" y="420">way 0: valid=1 tag=0x31aa -> no</text><rect class="field" x="560" y="455" width="535" height="55" fill="#22563f"/><text class="s" x="580" y="490">way 1: valid=1 tag=0x48d1 -> HIT</text><rect class="field" x="560" y="525" width="535" height="55" fill="#4c5968"/><text class="s" x="580" y="560">way 2: valid=1 tag=0x77c0 -> no</text><rect class="field" x="560" y="595" width="535" height="55" fill="#4c5968"/><text class="s" x="580" y="630">way 3: valid=0 -> no</text></g>
<text class="t" x="55" y="505">Matching way supplies the line</text><text class="t" x="55" y="550">offset 56 selects bytes 56 onward</text><text class="s" x="55" y="610">Ways do not change mapping.</text><text class="s" x="55" y="642">They provide four candidate tags</text><text class="s" x="55" y="674">inside the one selected set.</text><text class="s" x="595" y="735" text-anchor="middle">Same set + offset, different tag: add sets x line_size = 256 x 64 = 16 KiB.</text></svg>
