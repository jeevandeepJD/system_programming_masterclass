<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 760" role="img" aria-labelledby="title desc"><title id="title">RISC-V instruction field decoding</title><desc id="desc">The 32-bit word 0x00b50633 is split into R-type fields and decoded as add x12 x10 x11, while a B-type strip shows how branch immediate bits are reconstructed and sign extended.</desc><style>text{font-family:monospace;fill:#f7fbff}.h{font:700 32px sans-serif}.t{font-size:22px;font-weight:700}.s{font-size:18px}.c1{fill:#315a88}.c2{fill:#176b72}.c3{fill:#624b88}.c4{fill:#9a6518}.c5{fill:#7d3850}.field{stroke:#fff;stroke-width:3}</style><rect width="1190" height="760" fill="#071521"/><text class="h" x="595" y="48" text-anchor="middle">Decode by fields first; assign a mnemonic last</text><text class="t" x="55" y="105">Worked R-type word: 0x00b50633</text>
<g text-anchor="middle"><rect class="field c1" x="55" y="135" width="245" height="100"/><text class="s" x="177" y="178">funct7 [31:25]</text><text class="t" x="177" y="213">0000000</text><rect class="field c2" x="300" y="135" width="175" height="100"/><text class="s" x="387" y="178">rs2 [24:20]</text><text class="t" x="387" y="213">01011 = x11</text><rect class="field c3" x="475" y="135" width="175" height="100"/><text class="s" x="562" y="178">rs1 [19:15]</text><text class="t" x="562" y="213">01010 = x10</text><rect class="field c4" x="650" y="135" width="145" height="100"/><text class="s" x="722" y="178">funct3</text><text class="t" x="722" y="213">000</text><rect class="field c5" x="795" y="135" width="175" height="100"/><text class="s" x="882" y="178">rd [11:7]</text><text class="t" x="882" y="213">01100 = x12</text><rect class="field c1" x="970" y="135" width="165" height="100"/><text class="s" x="1052" y="178">opcode [6:0]</text><text class="t" x="1052" y="213">0110011</text></g>
<rect x="250" y="285" width="690" height="90" rx="12" fill="#22563f" stroke="#b7f7d0" stroke-width="3"/><text class="t" x="595" y="325" text-anchor="middle">opcode + funct3 + funct7 => ADD</text><text class="t" x="595" y="358" text-anchor="middle">add x12, x10, x11  (add a2, a0, a1)</text>
<text class="t" x="55" y="445">B-type immediate reconstruction</text><g text-anchor="middle"><rect class="field c5" x="55" y="475" width="170" height="80"/><text class="s" x="140" y="525">bit31 -> imm[12]</text><rect class="field c1" x="225" y="475" width="250" height="80"/><text class="s" x="350" y="525">bits30:25 -> imm[10:5]</text><rect class="field c2" x="475" y="475" width="250" height="80"/><text class="s" x="600" y="525">bits11:8 -> imm[4:1]</text><rect class="field c4" x="725" y="475" width="170" height="80"/><text class="s" x="810" y="525">bit7 -> imm[11]</text><rect class="field c3" x="895" y="475" width="240" height="80"/><text class="s" x="1015" y="525">implicit imm[0] = 0</text></g>
<text class="t" x="595" y="625" text-anchor="middle">{12,11,10:5,4:1,0} -> sign-extend -> PC + byte displacement</text><text class="s" x="595" y="690" text-anchor="middle">Stable register positions simplify extraction; split immediates preserve those positions.</text></svg>
