<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 820" role="img" aria-labelledby="title desc"><title id="title">Structure padding alignment and byte order</title><desc id="desc">A 24-byte mixed structure is laid out byte by byte with internal padding and aligned member offsets, followed by little- and big-endian representations of 0x12345678 to distinguish native object layout from serialized byte order.</desc><style>text{font-family:monospace;fill:#f7fbff}.h{font:700 32px sans-serif}.t{font-size:22px;font-weight:700}.s{font-size:18px}.m{stroke:#fff;stroke-width:2}.pad{fill:#4c5968}.char{fill:#9a6518}.u32{fill:#315a88}.u16{fill:#176b72}.dbl{fill:#624b88}</style><rect width="1190" height="820" fill="#071521"/><text class="h" x="595" y="48" text-anchor="middle">ABI layout aligns members; byte order assigns significance</text><text class="t" x="55" y="105">struct mixed { char marker; uint32_t count; uint16_t code; double value; }</text>
<g text-anchor="middle"><rect class="m char" x="55" y="140" width="45" height="90"/><text class="s" x="77" y="190">m</text><rect class="m pad" x="100" y="140" width="135" height="90"/><text class="s" x="167" y="190">pad x3</text><rect class="m u32" x="235" y="140" width="180" height="90"/><text class="s" x="325" y="190">count  /  4</text><rect class="m u16" x="415" y="140" width="90" height="90"/><text class="s" x="460" y="190">code</text><rect class="m pad" x="505" y="140" width="270" height="90"/><text class="s" x="640" y="190">pad x6</text><rect class="m dbl" x="775" y="140" width="360" height="90"/><text class="s" x="955" y="190">double value  /  8</text></g>
<text class="s" x="55" y="270">offset: 0     1-3          4-7        8-9       10-15                 16-23</text><text class="t" x="55" y="315">sizeof = 24, alignof = 8; array stride = 24</text><text class="s" x="55" y="350">Padding makes each member and the next array element satisfy the ABI alignment contract.</text>
<text class="t" x="55" y="430">The uint32_t value 0x12345678 at addresses A through A+3</text><text class="s" x="55" y="470">little-endian: least-significant byte first</text><g text-anchor="middle"><rect class="m u32" x="55" y="490" width="200" height="75"/><text class="t" x="155" y="536">A: 78</text><rect class="m u32" x="255" y="490" width="200" height="75"/><text class="t" x="355" y="536">A+1: 56</text><rect class="m u32" x="455" y="490" width="200" height="75"/><text class="t" x="555" y="536">A+2: 34</text><rect class="m u32" x="655" y="490" width="200" height="75"/><text class="t" x="755" y="536">A+3: 12</text></g>
<text class="s" x="55" y="620">big-endian: most-significant byte first</text><g text-anchor="middle"><rect class="m u16" x="55" y="640" width="200" height="75"/><text class="t" x="155" y="686">A: 12</text><rect class="m u16" x="255" y="640" width="200" height="75"/><text class="t" x="355" y="686">A+1: 34</text><rect class="m u16" x="455" y="640" width="200" height="75"/><text class="t" x="555" y="686">A+2: 56</text><rect class="m u16" x="655" y="640" width="200" height="75"/><text class="t" x="755" y="686">A+3: 78</text></g><text class="s" x="595" y="775" text-anchor="middle">A wire format must specify widths and byte order; native struct bytes include ABI-specific padding.</text></svg>
