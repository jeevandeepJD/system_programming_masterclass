<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 820" role="img" aria-labelledby="title desc"><title id="title">Call, stack-frame, and return anatomy</title><desc id="desc">A downward-growing x86-64 stack shows call pushing a return address, a prologue saving RBP and RBX and allocating 72 local bytes, then the reverse epilogue and ret restoring RIP.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:sans-serif;fill:#f7fbff}.h{font-size:32px;font-weight:700}.t{font-size:22px;font-weight:700}.s{font-size:18px}.slot{stroke:#d8f3ff;stroke-width:3}.f{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1190" height="820" fill="#071521"/><text class="h" x="595" y="48" text-anchor="middle">One activation: every stack mutation has an inverse</text>
<text class="t" x="55" y="110">Caller: call descend</text><text class="s" x="55" y="145">rsp -= 8; [rsp] = next RIP; RIP = descend</text><path class="f" d="M330 125H455"/>
<g text-anchor="middle"><rect class="slot" x="455" y="90" width="400" height="75" fill="#315a88"/><text class="t" x="655" y="135">return address  +8(%rbp)</text><rect class="slot" x="455" y="165" width="400" height="75" fill="#176b72"/><text class="t" x="655" y="210">saved rbp  &lt;- rbp</text><rect class="slot" x="455" y="240" width="400" height="75" fill="#624b88"/><text class="t" x="655" y="285">saved rbx  -8(%rbp)</text><rect class="slot" x="455" y="315" width="400" height="210" fill="#12304a"/><text class="t" x="655" y="405">72 bytes locals / spills</text><text class="s" x="655" y="445">-80(%rbp) through -9(%rbp)</text></g>
<text class="s" x="880" y="135">higher addresses</text><text class="s" x="880" y="520">lower addresses</text><path class="f" d="M1030 160V495"/><line x1="410" y1="202" x2="455" y2="202" stroke="#ffd166" stroke-width="4"/><text class="t" x="395" y="210" text-anchor="end">rbp -></text><line x1="410" y1="525" x2="455" y2="525" stroke="#ffd166" stroke-width="4"/><text class="t" x="395" y="533" text-anchor="end">rsp -></text>
<rect x="55" y="610" width="1080" height="135" rx="12" fill="#284b63" stroke="#8ecae6" stroke-width="3"/><text class="t" x="595" y="650" text-anchor="middle">Prologue: push rbp -> mov rsp,rbp -> push rbx -> sub $72,rsp</text><text class="t" x="595" y="690" text-anchor="middle">Epilogue: add $72,rsp -> pop rbx -> pop rbp -> ret</text><text class="s" x="595" y="723" text-anchor="middle">ret: RIP = [rsp]; rsp += 8  -  it trusts the stack bytes.</text>
</svg>
