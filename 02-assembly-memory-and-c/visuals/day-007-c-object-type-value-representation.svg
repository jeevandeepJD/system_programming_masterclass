<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 800" role="img" aria-labelledby="title desc"><title id="title">C abstract-machine layers of object type value and representation</title><desc id="desc">The declaration uint32_t count equals 5 is separated into identifier, object and lifetime, type constraints, mathematical value, and four representation bytes, then connected through compiler, ABI, and ISA layers without claiming a permanent memory slot.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:sans-serif;fill:#f7fbff}.h{font-size:32px;font-weight:700}.t{font-size:22px;font-weight:700}.s{font-size:18px}.f{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1190" height="800" fill="#071521"/><text class="h" x="595" y="48" text-anchor="middle">C defines related layers - not one "variable box"</text><rect x="355" y="85" width="480" height="75" rx="12" fill="#284b63" stroke="#fff" stroke-width="3"/><text class="t" x="595" y="132" text-anchor="middle">uint32_t count = 5;</text>
<g><rect x="55" y="230" width="205" height="150" rx="12" fill="#315a88" stroke="#fff" stroke-width="3"/><text class="t" x="157" y="270" text-anchor="middle">Identifier</text><text class="s" x="157" y="310" text-anchor="middle">source name</text><text class="s" x="157" y="342" text-anchor="middle">scope controls use</text><rect x="280" y="230" width="205" height="150" rx="12" fill="#176b72" stroke="#fff" stroke-width="3"/><text class="t" x="382" y="270" text-anchor="middle">Object</text><text class="s" x="382" y="310" text-anchor="middle">region of storage</text><text class="s" x="382" y="342" text-anchor="middle">has a lifetime</text><rect x="505" y="230" width="205" height="150" rx="12" fill="#624b88" stroke="#fff" stroke-width="3"/><text class="t" x="607" y="270" text-anchor="middle">Type</text><text class="s" x="607" y="310" text-anchor="middle">uint32_t</text><text class="s" x="607" y="342" text-anchor="middle">range + operations</text><rect x="730" y="230" width="205" height="150" rx="12" fill="#9a6518" stroke="#fff" stroke-width="3"/><text class="t" x="832" y="270" text-anchor="middle">Value</text><text class="s" x="832" y="310" text-anchor="middle">mathematical 5</text><text class="s" x="832" y="342" text-anchor="middle">within type domain</text><rect x="955" y="230" width="180" height="150" rx="12" fill="#7d3850" stroke="#fff" stroke-width="3"/><text class="t" x="1045" y="270" text-anchor="middle">Representation</text><text class="s" x="1045" y="310" text-anchor="middle">05 00 00 00</text><text class="s" x="1045" y="342" text-anchor="middle">one LE target</text></g>
<path class="f" d="M595 160V200H157V220"/><path class="f" d="M595 200H382V220"/><path class="f" d="M595 200H607V220"/><path class="f" d="M595 200H832V220"/><path class="f" d="M595 200H1045V220"/>
<rect x="120" y="500" width="950" height="170" rx="14" fill="#12304a" stroke="#8ecae6" stroke-width="3"/><text class="t" x="595" y="542" text-anchor="middle">Compiler preserves required observable behavior</text><text class="s" x="595" y="582" text-anchor="middle">may keep value in a register  /  may fold it to a constant  /  may allocate bytes</text><text class="s" x="595" y="620" text-anchor="middle">ABI chooses interoperable layout and locations  /  ISA supplies machine operations</text><text class="s" x="595" y="652" text-anchor="middle">No rule says the identifier permanently owns one stack slot.</text><text class="s" x="595" y="735" text-anchor="middle">The same representation bits acquire meaning only through a type and an operation.</text></svg>
