<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 800" role="img" aria-labelledby="title desc"><title id="title">Coherence ownership movement caused by false sharing</title><desc id="desc">Two cores update independent counters A and B in one 64-byte line. Each write requires exclusive ownership of the entire line, invalidating the peer and causing ownership to ping-pong across the coherence fabric.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:sans-serif;fill:#f7fbff}.h{font-size:32px;font-weight:700}.t{font-size:22px;font-weight:700}.s{font-size:18px}.f{stroke:#ffd166;stroke-width:5;fill:none;marker-end:url(#a)}</style></defs><rect width="1190" height="800" fill="#071521"/><text class="h" x="595" y="48" text-anchor="middle">Independent objects can contend because coherence owns a whole line</text>
<rect x="55" y="115" width="410" height="185" rx="14" fill="#315a88" stroke="#fff" stroke-width="3"/><text class="t" x="260" y="155" text-anchor="middle">Core 0 writes counter A</text><text class="s" x="260" y="195" text-anchor="middle">request exclusive ownership</text><text class="s" x="260" y="230" text-anchor="middle">peer copy becomes invalid</text><text class="s" x="260" y="265" text-anchor="middle">line state here: writable</text>
<rect x="725" y="115" width="410" height="185" rx="14" fill="#176b72" stroke="#fff" stroke-width="3"/><text class="t" x="930" y="155" text-anchor="middle">Core 1 writes counter B</text><text class="s" x="930" y="195" text-anchor="middle">request exclusive ownership</text><text class="s" x="930" y="230" text-anchor="middle">Core 0 copy becomes invalid</text><text class="s" x="930" y="265" text-anchor="middle">line state here: writable</text>
<path class="f" d="M465 175C560 105 630 105 715 175"/><path class="f" d="M725 255C630 330 560 330 475 255"/><text class="s" x="595" y="115" text-anchor="middle">ownership + line data</text><text class="s" x="595" y="345" text-anchor="middle">next write transfers it back</text>
<text class="t" x="55" y="430">One 64-byte coherence line</text><g><rect x="55" y="460" width="270" height="105" fill="#9a6518" stroke="#fff" stroke-width="3"/><text class="t" x="190" y="505" text-anchor="middle">counter A  /  8 B</text><text class="s" x="190" y="538" text-anchor="middle">thread 0 only</text><rect x="325" y="460" width="270" height="105" fill="#7d3850" stroke="#fff" stroke-width="3"/><text class="t" x="460" y="505" text-anchor="middle">counter B  /  8 B</text><text class="s" x="460" y="538" text-anchor="middle">thread 1 only</text><rect x="595" y="460" width="540" height="105" fill="#4c5968" stroke="#fff" stroke-width="3"/><text class="t" x="865" y="520" text-anchor="middle">48 unused bytes</text></g>
<rect x="120" y="645" width="950" height="95" rx="12" fill="#284b63" stroke="#8ecae6" stroke-width="3"/><text class="t" x="595" y="685" text-anchor="middle">No C data race: separate atomic objects. Real hardware traffic: one shared line.</text><text class="s" x="595" y="720" text-anchor="middle">Padding can place A and B on different lines, trading footprint for less ownership movement.</text></svg>
