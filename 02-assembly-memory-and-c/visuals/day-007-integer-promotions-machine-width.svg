<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 820" role="img" aria-labelledby="title desc"><title id="title">Integer promotions and conversion to machine operation width</title><desc id="desc">Two worked C expressions show unsigned char operands promoting to int before a 32-bit addition yielding 260, and signed negative one converting to unsigned int before an unsigned comparison with one, influencing extension and condition selection.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:monospace;fill:#f7fbff}.h{font:700 32px sans-serif}.t{font-size:22px;font-weight:700}.s{font-size:18px}.b{stroke:#fff;stroke-width:3}.f{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1190" height="820" fill="#071521"/><text class="h" x="595" y="48" text-anchor="middle">Derive the C domain before predicting machine width</text>
<text class="t" x="55" y="105">Example A: (unsigned char)250 + (unsigned char)10</text><g text-anchor="middle"><rect class="b" x="55" y="140" width="270" height="115" rx="10" fill="#315a88"/><text class="t" x="190" y="182">8-bit operands</text><text class="s" x="190" y="220">250 and 10</text><rect class="b" x="455" y="140" width="280" height="115" rx="10" fill="#176b72"/><text class="t" x="595" y="182">promote to int</text><text class="s" x="595" y="220">both exactly representable</text><rect class="b" x="865" y="140" width="270" height="115" rx="10" fill="#624b88"/><text class="t" x="1000" y="182">32-bit add domain</text><text class="s" x="1000" y="220">result = 260, not 4</text></g><path class="f" d="M325 197H445"/><path class="f" d="M735 197H855"/>
<text class="t" x="55" y="350">Example B: int s = -1; unsigned int u = 1; evaluate s &lt; u</text><g text-anchor="middle"><rect class="b" x="55" y="385" width="270" height="130" rx="10" fill="#315a88"/><text class="t" x="190" y="427">declared types</text><text class="s" x="190" y="465">int -1, unsigned 1</text><text class="s" x="190" y="495">same rank</text><rect class="b" x="455" y="385" width="280" height="130" rx="10" fill="#9a6518"/><text class="t" x="595" y="427">common type</text><text class="s" x="595" y="465">unsigned int</text><text class="s" x="595" y="495">-1 -> UINT_MAX</text><rect class="b" x="865" y="385" width="270" height="130" rx="10" fill="#7d3850"/><text class="t" x="1000" y="427">unsigned compare</text><text class="s" x="1000" y="465">UINT_MAX &lt; 1</text><text class="s" x="1000" y="495">false</text></g><path class="f" d="M325 450H445"/><path class="f" d="M735 450H855"/>
<rect x="90" y="625" width="1010" height="125" rx="12" fill="#12304a" stroke="#8ecae6" stroke-width="3"/><text class="t" x="595" y="665" text-anchor="middle">Likely lowering consequences - not permanent type-to-opcode mappings</text><text class="s" x="595" y="703" text-anchor="middle">narrow load + zero/sign extension -> promoted width  /  signed/unsigned condition choice</text><text class="s" x="595" y="735" text-anchor="middle">Optimization may fold either result and emit no runtime add or comparison.</text></svg>
