<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 760" role="img" aria-labelledby="title desc"><title id="title">System V AMD64 register ownership and stack alignment</title><desc id="desc">Values live across a call are assigned preservation responsibility: the caller saves caller-saved registers, the callee restores callee-saved registers it borrows, and RSP changes from zero modulo sixteen before call to eight modulo sixteen on entry.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:sans-serif;fill:#f7fbff}.h{font-size:32px;font-weight:700}.t{font-size:22px;font-weight:700}.s{font-size:18px}.b{stroke:#d8f3ff;stroke-width:3}.f{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1190" height="760" fill="#071521"/><text class="h" x="595" y="48" text-anchor="middle">ABI ownership answers: "who pays to preserve this live value?"</text>
<rect class="b" x="55" y="100" width="500" height="245" rx="14" fill="#315a88"/><text class="t" x="305" y="145" text-anchor="middle">Caller-saved: call may destroy</text><text class="s" x="305" y="188" text-anchor="middle">rax rcx rdx rsi rdi r8 r9 r10 r11</text><text class="s" x="85" y="235">value live after call?</text><text class="s" x="85" y="272">yes -> caller spills before call</text><text class="s" x="85" y="309">then reloads after return</text>
<rect class="b" x="635" y="100" width="500" height="245" rx="14" fill="#176b72"/><text class="t" x="885" y="145" text-anchor="middle">Callee-saved: callee returns unchanged</text><text class="s" x="885" y="188" text-anchor="middle">rbx rbp r12 r13 r14 r15 rsp</text><text class="s" x="665" y="235">callee wants a scratch register?</text><text class="s" x="665" y="272">save borrowed register in prologue</text><text class="s" x="665" y="309">restore it before ret</text>
<path class="f" d="M555 222H625"/><text class="s" x="590" y="207" text-anchor="middle">call boundary</text>
<rect class="b" x="55" y="430" width="300" height="150" rx="12" fill="#12304a"/><text class="t" x="205" y="472" text-anchor="middle">Immediately before call</text><text class="t" x="205" y="520" text-anchor="middle">rsp mod 16 = 0</text><text class="s" x="205" y="555" text-anchor="middle">ABI alignment point</text>
<rect class="b" x="445" y="430" width="300" height="150" rx="12" fill="#624b88"/><text class="t" x="595" y="472" text-anchor="middle">call pushes 8 bytes</text><text class="t" x="595" y="520" text-anchor="middle">rsp &lt;- rsp - 8</text><text class="s" x="595" y="555" text-anchor="middle">return address at [rsp]</text>
<rect class="b" x="835" y="430" width="300" height="150" rx="12" fill="#9a6518"/><text class="t" x="985" y="472" text-anchor="middle">Callee entry</text><text class="t" x="985" y="520" text-anchor="middle">rsp mod 16 = 8</text><text class="s" x="985" y="555" text-anchor="middle">prologue realigns as needed</text><path class="f" d="M355 505H435"/><path class="f" d="M745 505H825"/>
<text class="s" x="595" y="675" text-anchor="middle">Arguments rdi through r9 and result rax are locations; preservation is a separate ownership rule.</text>
</svg>
