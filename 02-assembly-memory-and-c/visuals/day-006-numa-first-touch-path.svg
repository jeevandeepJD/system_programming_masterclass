<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 820" role="img" aria-labelledby="title desc"><title id="title">CPU package NUMA first-touch and local versus remote paths</title><desc id="desc">A thread on NUMA node zero first-writes virtual pages, causing Linux to allocate physical pages near node zero. Later access from node zero follows a local controller path while access from node one crosses the package interconnect to remote memory.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:sans-serif;fill:#f7fbff}.h{font-size:32px;font-weight:700}.t{font-size:22px;font-weight:700}.s{font-size:18px}.f{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}.local{stroke:#80ed99;stroke-width:6;fill:none;marker-end:url(#a)}.remote{stroke:#ff6b6b;stroke-width:6;fill:none;marker-end:url(#a)}</style></defs><rect width="1190" height="820" fill="#071521"/><text class="h" x="595" y="48" text-anchor="middle">First allocation chooses a locality; later CPU placement chooses distance</text>
<rect x="45" y="100" width="520" height="520" rx="18" fill="#12304a" stroke="#8ecae6" stroke-width="3"/><text class="t" x="305" y="140" text-anchor="middle">Package / NUMA node 0</text><rect x="90" y="180" width="180" height="105" rx="10" fill="#315a88" stroke="#fff" stroke-width="3"/><text class="t" x="180" y="220" text-anchor="middle">CPU 0</text><text class="s" x="180" y="255" text-anchor="middle">initializer</text><rect x="340" y="180" width="180" height="105" rx="10" fill="#176b72" stroke="#fff" stroke-width="3"/><text class="t" x="430" y="220" text-anchor="middle">memory</text><text class="s" x="430" y="255" text-anchor="middle">physical pages</text><rect x="340" y="410" width="180" height="105" rx="10" fill="#624b88" stroke="#fff" stroke-width="3"/><text class="t" x="430" y="450" text-anchor="middle">controller 0</text><text class="s" x="430" y="485" text-anchor="middle">channels / DRAM</text>
<rect x="625" y="100" width="520" height="520" rx="18" fill="#12304a" stroke="#8ecae6" stroke-width="3"/><text class="t" x="885" y="140" text-anchor="middle">Package / NUMA node 1</text><rect x="670" y="180" width="180" height="105" rx="10" fill="#315a88" stroke="#fff" stroke-width="3"/><text class="t" x="760" y="220" text-anchor="middle">CPU 1</text><text class="s" x="760" y="255" text-anchor="middle">later worker</text><rect x="920" y="180" width="180" height="105" rx="10" fill="#176b72" stroke="#fff" stroke-width="3"/><text class="t" x="1010" y="220" text-anchor="middle">memory</text><text class="s" x="1010" y="255" text-anchor="middle">other pages</text><rect x="920" y="410" width="180" height="105" rx="10" fill="#624b88" stroke="#fff" stroke-width="3"/><text class="t" x="1010" y="450" text-anchor="middle">controller 1</text><text class="s" x="1010" y="485" text-anchor="middle">channels / DRAM</text>
<path class="f" d="M180 285V340H430V295"/><text class="s" x="305" y="330" text-anchor="middle">first write faults -> allocate near CPU 0</text><path class="local" d="M180 300V462H330"/><text class="s" x="185" y="400">local path</text><path class="remote" d="M760 300V555H590V462H530"/><text class="s" x="680" y="585" text-anchor="middle">remote: interconnect + controller 0</text>
<rect x="95" y="675" width="1000" height="95" rx="12" fill="#284b63" stroke="#ffd166" stroke-width="3"/><text class="t" x="595" y="713" text-anchor="middle">malloc reserves virtual space; policy acts when a physical page is allocated.</text><text class="s" x="595" y="748" text-anchor="middle">Affinity, cpusets, bind/interleave policy, pressure, migration, and balancing can alter this default path.</text></svg>
