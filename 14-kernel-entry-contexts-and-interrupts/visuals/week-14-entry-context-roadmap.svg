<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" font-family="sans-serif">
  <title>Week 14 entry and context roadmap</title>
  <desc>A user syscall, a CPU exception, and an external interrupt converge on one entry and state save, then split into a syscall core, an exception core, and an IRQ core. The IRQ core continues through hardirq, deferred work, wakeup, and return. Bands mark hardirq and softirq as contexts that must not sleep, and process or workqueue context as a context that may sleep.</desc>
  <defs>
    <marker id="mk-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="#1B2A4A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#FBF9F4"/>
  <rect x="2" y="2" width="996" height="556" fill="none" stroke="#1B2A4A" stroke-width="2"/>
  <text x="500" y="32" fill="#1B2A4A" font-family="sans-serif" font-size="22" font-weight="700" text-anchor="middle">Three entries, one saved state, then three cores</text>
  <rect x="16" y="48" width="308" height="78" rx="8" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/>
  <text x="170" y="78" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">User instruction</text>
  <text x="170" y="106" fill="#1D4E89" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">syscall</text>
  <rect x="346" y="48" width="308" height="78" rx="8" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/>
  <text x="500" y="78" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">CPU exception</text>
  <text x="500" y="106" fill="#1D4E89" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">fault or trap</text>
  <rect x="676" y="48" width="308" height="78" rx="8" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/>
  <text x="830" y="78" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">External interrupt</text>
  <text x="830" y="106" fill="#1D4E89" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">device line</text>
  <line x1="170" y1="126" x2="170" y2="154" stroke="#1B2A4A" stroke-width="2.5" fill="none" marker-end="url(#mk-navy)"/>
  <line x1="500" y1="126" x2="500" y2="154" stroke="#1B2A4A" stroke-width="2.5" fill="none" marker-end="url(#mk-navy)"/>
  <line x1="830" y1="126" x2="830" y2="154" stroke="#1B2A4A" stroke-width="2.5" fill="none" marker-end="url(#mk-navy)"/>
  <rect x="16" y="156" width="968" height="64" rx="8" fill="#E7EEF6" stroke="#1B2A4A" stroke-width="2"/>
  <text x="500" y="182" fill="#1B2A4A" font-family="sans-serif" font-size="20" font-weight="700" text-anchor="middle">Entry and state save</text>
  <text x="500" y="206" fill="#1D4E89" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">registers, stack, and privilege</text>
  <line x1="170" y1="220" x2="170" y2="246" stroke="#1B2A4A" stroke-width="2.5" fill="none" marker-end="url(#mk-navy)"/>
  <line x1="500" y1="220" x2="500" y2="246" stroke="#1B2A4A" stroke-width="2.5" fill="none" marker-end="url(#mk-navy)"/>
  <line x1="830" y1="220" x2="830" y2="246" stroke="#1B2A4A" stroke-width="2.5" fill="none" marker-end="url(#mk-navy)"/>
  <rect x="16" y="248" width="308" height="72" rx="8" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/>
  <text x="170" y="276" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Syscall core</text>
  <text x="170" y="302" fill="#17693F" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">then return</text>
  <rect x="346" y="248" width="308" height="72" rx="8" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/>
  <text x="500" y="276" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Exception core</text>
  <text x="500" y="302" fill="#17693F" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">then return</text>
  <rect x="676" y="248" width="308" height="72" rx="8" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/>
  <text x="830" y="276" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">IRQ core</text>
  <text x="830" y="302" fill="#8A4B00" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">then the row below</text>
  <line x1="830" y1="320" x2="830" y2="338" stroke="#8A4B00" stroke-width="2.5" fill="none"/>
  <line x1="830" y1="338" x2="126" y2="338" stroke="#8A4B00" stroke-width="2.5" fill="none"/>
  <line x1="126" y1="338" x2="126" y2="356" stroke="#8A4B00" stroke-width="2.5" fill="none" marker-end="url(#mk-navy)"/>
  <rect x="16" y="358" width="220" height="58" rx="8" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/>
  <text x="126" y="393" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Hardirq</text>
  <rect x="262" y="358" width="220" height="58" rx="8" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/>
  <text x="372" y="393" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Deferred work</text>
  <rect x="508" y="358" width="220" height="58" rx="8" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/>
  <text x="618" y="393" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Wakeup</text>
  <rect x="754" y="358" width="230" height="58" rx="8" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/>
  <text x="869" y="393" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Return</text>
  <line x1="236" y1="387" x2="260" y2="387" stroke="#1B2A4A" stroke-width="2.5" fill="none" marker-end="url(#mk-navy)"/>
  <line x1="482" y1="387" x2="506" y2="387" stroke="#1B2A4A" stroke-width="2.5" fill="none" marker-end="url(#mk-navy)"/>
  <line x1="728" y1="387" x2="752" y2="387" stroke="#1B2A4A" stroke-width="2.5" fill="none" marker-end="url(#mk-navy)"/>
  <rect x="16" y="432" width="308" height="72" rx="8" fill="#F8D0D0" stroke="#7A1020" stroke-width="2"/>
  <text x="170" y="462" fill="#7A1020" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Hardirq context</text>
  <text x="170" y="488" fill="#7A1020" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">do not sleep</text>
  <rect x="346" y="432" width="308" height="72" rx="8" fill="#F8D0D0" stroke="#7A1020" stroke-width="2"/>
  <text x="500" y="462" fill="#7A1020" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Softirq context</text>
  <text x="500" y="488" fill="#7A1020" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">do not sleep</text>
  <rect x="676" y="432" width="308" height="72" rx="8" fill="#D7F0E0" stroke="#0E5A32" stroke-width="2"/>
  <text x="830" y="462" fill="#0E5A32" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Process context</text>
  <text x="830" y="488" fill="#0E5A32" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">workqueue may sleep</text>
  <text x="500" y="530" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">Week 14 is the entry and context foundation. The scheduler dive is Week 15.</text>
</svg>
