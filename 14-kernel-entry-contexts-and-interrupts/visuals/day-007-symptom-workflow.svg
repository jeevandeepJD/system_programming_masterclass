<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" font-family="sans-serif">
  <title>Five-step workflow from an interrupt symptom to a kept or replaced hypothesis</title>
  <desc>Name the symptom, write a hypothesis a measurement can reject, choose one evidence source, read it with uname recorded, then keep or replace the hypothesis. Stop when the evidence answers the sentence you wrote.</desc>
  <defs>
    <marker id="mk-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="#1B2A4A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#FBF9F4"/>
  <rect x="2" y="2" width="996" height="516" fill="none" stroke="#1B2A4A" stroke-width="2"/>
  <text x="500" y="34" fill="#1B2A4A" font-family="sans-serif" font-size="22" font-weight="700" text-anchor="middle">Interrupt symptom workflow</text>
  <rect x="20" y="58" width="620" height="64" rx="8" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2.2"/>
  <text x="40" y="98" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700">1. Name the symptom in one sentence.</text>
  <line x1="640" y1="90" x2="668" y2="90" stroke="#1B2A4A" stroke-width="2.4" fill="none" marker-end="url(#mk-navy)"/>
  <rect x="20" y="136" width="620" height="64" rx="8" fill="#FFF4E0" stroke="#8A4B00" stroke-width="2.2"/>
  <text x="40" y="176" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700">2. Write a hypothesis a sample can reject.</text>
  <rect x="20" y="214" width="620" height="64" rx="8" fill="#E8F0FA" stroke="#1D4E89" stroke-width="2.2"/>
  <text x="40" y="254" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700">3. Choose one file, trace, or skip.</text>
  <rect x="20" y="292" width="620" height="64" rx="8" fill="#E3F6EB" stroke="#17693F" stroke-width="2.2"/>
  <text x="40" y="332" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700">4. Read it. Record uname -r beside it.</text>
  <rect x="20" y="370" width="620" height="64" rx="8" fill="#F3F6FA" stroke="#1B2A4A" stroke-width="2.2"/>
  <text x="40" y="410" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700">5. Keep the hypothesis or write the next one.</text>
  <rect x="700" y="136" width="276" height="298" rx="8" fill="#F8E8E8" stroke="#9E2A2A" stroke-width="2.4"/>
  <text x="838" y="184" fill="#9E2A2A" font-family="sans-serif" font-size="20" font-weight="700" text-anchor="middle">Stop rule</text>
  <text x="838" y="232" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">The evidence</text>
  <text x="838" y="262" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">answers the</text>
  <text x="838" y="292" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">sentence you</text>
  <text x="838" y="322" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">wrote.</text>
  <text x="838" y="370" fill="#9E2A2A" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">A rising count</text>
  <text x="838" y="400" fill="#9E2A2A" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">is a clue.</text>
  <text x="500" y="478" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">Do not enable tracing or write affinity. Read, or record a skip.</text>
  <text x="500" y="506" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400" text-anchor="middle">Root is not required for /proc/interrupts on a normal desktop.</text>
</svg>
