<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" font-family="sans-serif">
  <title>Sleepability of process, hardirq, softirq, NMI, threaded IRQ, and work items</title>
  <desc>A matrix lists process context, hardirq, softirq, NMI, a threaded IRQ, a worker thread, and a WQ_BH work item. Each row says whether that context may sleep, take a mutex, or take a spinlock.</desc>
  <rect x="0" y="0" width="1000" height="520" fill="#FBF9F4"/>
  <rect x="2" y="2" width="996" height="516" fill="none" stroke="#1B2A4A" stroke-width="2"/>
  <text x="500" y="32" fill="#1B2A4A" font-family="sans-serif" font-size="22" font-weight="700" text-anchor="middle">Context and sleepability</text>
  <rect x="16" y="48" width="968" height="40" fill="#1B2A4A"/>
  <text x="36" y="74" fill="#FBF9F4" font-family="sans-serif" font-size="18" font-weight="700">Context</text>
  <text x="340" y="74" fill="#FBF9F4" font-family="sans-serif" font-size="18" font-weight="700">Sleep</text>
  <text x="520" y="74" fill="#FBF9F4" font-family="sans-serif" font-size="18" font-weight="700">Mutex</text>
  <text x="720" y="74" fill="#FBF9F4" font-family="sans-serif" font-size="18" font-weight="700">Spinlock</text>
  <text x="36" y="118" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="700">Process task</text>
  <text x="340" y="118" fill="#17693F" font-family="sans-serif" font-size="18" font-weight="700">Yes</text>
  <text x="520" y="118" fill="#17693F" font-family="sans-serif" font-size="18" font-weight="700">Yes</text>
  <text x="720" y="118" fill="#17693F" font-family="sans-serif" font-size="18" font-weight="700">Yes</text>
  <line x1="20" y1="132" x2="980" y2="132" stroke="#C5C0B4" stroke-width="1"/>
  <text x="36" y="164" fill="#9E2A2A" font-family="sans-serif" font-size="18" font-weight="700">Hardirq</text>
  <text x="340" y="164" fill="#9E2A2A" font-family="sans-serif" font-size="18" font-weight="700">No</text>
  <text x="520" y="164" fill="#9E2A2A" font-family="sans-serif" font-size="18" font-weight="700">No</text>
  <text x="720" y="164" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400">irqs already off</text>
  <line x1="20" y1="178" x2="980" y2="178" stroke="#C5C0B4" stroke-width="1"/>
  <text x="36" y="210" fill="#1D4E89" font-family="sans-serif" font-size="18" font-weight="700">Softirq / tasklet</text>
  <text x="340" y="210" fill="#9E2A2A" font-family="sans-serif" font-size="18" font-weight="700">No</text>
  <text x="520" y="210" fill="#9E2A2A" font-family="sans-serif" font-size="18" font-weight="700">No</text>
  <text x="720" y="210" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400">spin_lock_bh</text>
  <line x1="20" y1="224" x2="980" y2="224" stroke="#C5C0B4" stroke-width="1"/>
  <text x="36" y="256" fill="#9E2A2A" font-family="sans-serif" font-size="18" font-weight="700">NMI</text>
  <text x="340" y="256" fill="#9E2A2A" font-family="sans-serif" font-size="18" font-weight="700">No</text>
  <text x="520" y="256" fill="#9E2A2A" font-family="sans-serif" font-size="18" font-weight="700">No</text>
  <text x="720" y="256" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400">NMI-safe only</text>
  <line x1="20" y1="270" x2="980" y2="270" stroke="#C5C0B4" stroke-width="1"/>
  <text x="36" y="302" fill="#8A4B00" font-family="sans-serif" font-size="18" font-weight="700">Threaded IRQ</text>
  <text x="340" y="302" fill="#17693F" font-family="sans-serif" font-size="18" font-weight="700">Yes</text>
  <text x="520" y="302" fill="#17693F" font-family="sans-serif" font-size="18" font-weight="700">Yes</text>
  <text x="720" y="302" fill="#17693F" font-family="sans-serif" font-size="18" font-weight="700">Yes</text>
  <line x1="20" y1="316" x2="980" y2="316" stroke="#C5C0B4" stroke-width="1"/>
  <text x="36" y="348" fill="#17693F" font-family="sans-serif" font-size="18" font-weight="700">Worker thread</text>
  <text x="340" y="348" fill="#17693F" font-family="sans-serif" font-size="18" font-weight="700">Yes</text>
  <text x="520" y="348" fill="#17693F" font-family="sans-serif" font-size="18" font-weight="700">Yes</text>
  <text x="720" y="348" fill="#17693F" font-family="sans-serif" font-size="18" font-weight="700">Yes</text>
  <line x1="20" y1="362" x2="980" y2="362" stroke="#C5C0B4" stroke-width="1"/>
  <text x="36" y="394" fill="#1D4E89" font-family="sans-serif" font-size="18" font-weight="700">WQ_BH work</text>
  <text x="340" y="394" fill="#9E2A2A" font-family="sans-serif" font-size="18" font-weight="700">No</text>
  <text x="520" y="394" fill="#9E2A2A" font-family="sans-serif" font-size="18" font-weight="700">No</text>
  <text x="720" y="394" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400">same as softirq</text>
  <rect x="16" y="420" width="968" height="78" rx="8" fill="#F3F6FA" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="36" y="452" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400">might_sleep warns under DEBUG_ATOMIC_SLEEP. in_atomic is a count test.</text>
  <text x="36" y="480" fill="#1B2A4A" font-family="sans-serif" font-size="18" font-weight="400">Holding a spinlock still forbids sleep after the lock is taken.</text>
</svg>
