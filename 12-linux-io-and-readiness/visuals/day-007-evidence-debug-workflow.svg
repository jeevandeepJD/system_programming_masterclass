<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
<title id="title">Evidence-driven I/O debugging workflow</title><desc id="desc">A debugging workflow proceeds from symptom to hypothesis, runtime evidence from strace and proc, source inspection, measurement, mitigation, and a regression check.</desc>
<defs><style>
  .bg{fill:#f8fafc}.ink{fill:#111827}.muted{fill:#334155}.card{fill:#fff;stroke:#0f172a;stroke-width:3}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.green{fill:#dcfce7;stroke:#15803d;stroke-width:3}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:3}.red{fill:#fee2e2;stroke:#b91c1c;stroke-width:3}.violet{fill:#ede9fe;stroke:#6d28d9;stroke-width:3}.line{fill:none;stroke:#0f172a;stroke-width:4}.dash{fill:none;stroke:#475569;stroke-width:3;stroke-dasharray:10 8}.t{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.h{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#0f172a}.p{font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:400;fill:#111827}.s{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:400;fill:#334155}.code{font-family:"Courier New",Courier,monospace;font-size:18px;font-weight:400;fill:#111827}.white{fill:#fff}.center{text-anchor:middle}.right{text-anchor:end}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker></defs>
<rect width="794" height="1123" class="bg"/>
<text x="48" y="58" class="t">Evidence-driven I/O debugging workflow</text>
<path d="M48 78 H746" class="line"/>
<rect x="80" y="110" width="635" height="105" rx="16" class="red"/><text x="105" y="150" class="h" text-anchor="start">SYMPTOM</text><text x="105" y="182" class="h" text-anchor="start">observable failure or stall</text><path d="M397 215 L397 245" class="line" marker-end="url(#arrow)"/><rect x="80" y="250" width="635" height="105" rx="16" class="amber"/><text x="105" y="290" class="h" text-anchor="start">HYPOTHESIS</text><text x="105" y="322" class="h" text-anchor="start">specific layer and mechanism</text><path d="M397 355 L397 385" class="line" marker-end="url(#arrow)"/><rect x="80" y="390" width="635" height="105" rx="16" class="blue"/><text x="105" y="430" class="h" text-anchor="start">STRACE / PROC</text><text x="105" y="462" class="h" text-anchor="start">runtime observations</text><path d="M397 495 L397 525" class="line" marker-end="url(#arrow)"/><rect x="80" y="530" width="635" height="105" rx="16" class="violet"/><text x="105" y="570" class="h" text-anchor="start">SOURCE</text><text x="105" y="602" class="h" text-anchor="start">mechanism in identified tree</text><path d="M397 635 L397 665" class="line" marker-end="url(#arrow)"/><rect x="80" y="670" width="635" height="105" rx="16" class="green"/><text x="105" y="710" class="h" text-anchor="start">MEASUREMENT</text><text x="105" y="742" class="h" text-anchor="start">counts, timing, errno, signal</text><path d="M397 775 L397 805" class="line" marker-end="url(#arrow)"/><rect x="80" y="810" width="635" height="105" rx="16" class="amber"/><text x="105" y="850" class="h" text-anchor="start">MITIGATION</text><text x="105" y="882" class="h" text-anchor="start">change ownership or loop</text><path d="M397 915 L397 945" class="line" marker-end="url(#arrow)"/><rect x="80" y="950" width="635" height="105" rx="16" class="green"/><text x="105" y="990" class="h" text-anchor="start">REGRESSION</text><text x="105" y="1022" class="h" text-anchor="start">repeatable pass + failure checks</text><text x="55" y="1090" class="s" text-anchor="start">A report is a chain of claims, each tagged with the layer that supports it.</text>
</svg>
