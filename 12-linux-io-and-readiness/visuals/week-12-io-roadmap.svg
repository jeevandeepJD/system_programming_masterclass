<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
<title id="title">Week 12 I/O ownership roadmap</title><desc id="desc">A seven-stage roadmap from file descriptors through open files, byte movement, VFS and durability, pipes, readiness, memory mapping, and an evidence report.</desc>
<defs><style>
  .bg{fill:#f8fafc}.ink{fill:#111827}.muted{fill:#334155}.card{fill:#fff;stroke:#0f172a;stroke-width:3}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.green{fill:#dcfce7;stroke:#15803d;stroke-width:3}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:3}.red{fill:#fee2e2;stroke:#b91c1c;stroke-width:3}.violet{fill:#ede9fe;stroke:#6d28d9;stroke-width:3}.line{fill:none;stroke:#0f172a;stroke-width:4}.dash{fill:none;stroke:#475569;stroke-width:3;stroke-dasharray:10 8}.t{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.h{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#0f172a}.p{font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:400;fill:#111827}.s{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:400;fill:#334155}.code{font-family:"Courier New",Courier,monospace;font-size:18px;font-weight:400;fill:#111827}.white{fill:#fff}.center{text-anchor:middle}.right{text-anchor:end}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker></defs>
<rect width="794" height="1123" class="bg"/>
<text x="48" y="58" class="t">Week 12 I/O ownership roadmap</text>
<path d="M48 78 H746" class="line"/>
<circle cx="90" cy="175" r="34" class="blue"/><text x="90" y="183" class="h center">1</text><rect x="150" y="130" width="530" height="90" rx="16" class="blue"/><text x="175" y="166" class="h" text-anchor="start">fd → open file</text><text x="175" y="196" class="h" text-anchor="start">→ inode</text><path d="M90 212 L90 255" class="line" marker-end="url(#arrow)"/><circle cx="90" cy="310" r="34" class="green"/><text x="90" y="318" class="h center">2</text><rect x="150" y="265" width="530" height="90" rx="16" class="green"/><text x="175" y="301" class="h" text-anchor="start">read/write</text><text x="175" y="331" class="h" text-anchor="start">blocking</text><path d="M90 347 L90 390" class="line" marker-end="url(#arrow)"/><circle cx="90" cy="445" r="34" class="amber"/><text x="90" y="453" class="h center">3</text><rect x="150" y="400" width="530" height="90" rx="16" class="amber"/><text x="175" y="436" class="h" text-anchor="start">VFS + cache</text><text x="175" y="466" class="h" text-anchor="start">+ durability</text><path d="M90 482 L90 525" class="line" marker-end="url(#arrow)"/><circle cx="90" cy="580" r="34" class="violet"/><text x="90" y="588" class="h center">4</text><rect x="150" y="535" width="530" height="90" rx="16" class="violet"/><text x="175" y="571" class="h" text-anchor="start">pipes +</text><text x="175" y="601" class="h" text-anchor="start">backpressure</text><path d="M90 617 L90 660" class="line" marker-end="url(#arrow)"/><circle cx="90" cy="715" r="34" class="blue"/><text x="90" y="723" class="h center">5</text><rect x="150" y="670" width="530" height="90" rx="16" class="blue"/><text x="175" y="706" class="h" text-anchor="start">readiness</text><text x="175" y="736" class="h" text-anchor="start">not completion</text><path d="M90 752 L90 795" class="line" marker-end="url(#arrow)"/><circle cx="90" cy="850" r="34" class="green"/><text x="90" y="858" class="h center">6</text><rect x="150" y="805" width="530" height="90" rx="16" class="green"/><text x="175" y="841" class="h" text-anchor="start">mmap +</text><text x="175" y="871" class="h" text-anchor="start">page faults</text><path d="M90 887 L90 930" class="line" marker-end="url(#arrow)"/><circle cx="90" cy="985" r="34" class="red"/><text x="90" y="993" class="h center">7</text><rect x="150" y="940" width="530" height="90" rx="16" class="red"/><text x="175" y="976" class="h" text-anchor="start">evidence</text><text x="175" y="1006" class="h" text-anchor="start">report</text><text x="48" y="1080" class="s" text-anchor="start">One boundary at a time: integer → object → bytes → pages → evidence.</text>
</svg>
