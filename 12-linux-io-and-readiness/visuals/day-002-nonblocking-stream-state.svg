<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
<title id="title">Nonblocking byte-stream state machine</title><desc id="desc">A nonblocking state machine cycles among ready attempts, positive progress, EAGAIN readiness registration, and EINTR retries, while byte-stream reads do not preserve write boundaries.</desc>
<defs><style>
  .bg{fill:#f8fafc}.ink{fill:#111827}.muted{fill:#334155}.card{fill:#fff;stroke:#0f172a;stroke-width:3}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.green{fill:#dcfce7;stroke:#15803d;stroke-width:3}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:3}.red{fill:#fee2e2;stroke:#b91c1c;stroke-width:3}.violet{fill:#ede9fe;stroke:#6d28d9;stroke-width:3}.line{fill:none;stroke:#0f172a;stroke-width:4}.dash{fill:none;stroke:#475569;stroke-width:3;stroke-dasharray:10 8}.t{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.h{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#0f172a}.p{font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:400;fill:#111827}.s{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:400;fill:#334155}.code{font-family:"Courier New",Courier,monospace;font-size:18px;font-weight:400;fill:#111827}.white{fill:#fff}.center{text-anchor:middle}.right{text-anchor:end}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker></defs>
<rect width="794" height="1123" class="bg"/>
<text x="48" y="58" class="t">Nonblocking byte-stream state machine</text>
<path d="M48 78 H746" class="line"/>
<rect x="55" y="130" width="210" height="160" rx="16" class="blue"/><text x="160" y="175" class="h" text-anchor="middle">READY</text><text x="160" y="213" class="h" text-anchor="middle">attempt read</text><text x="160" y="251" class="h" text-anchor="middle">or write</text><rect x="292" y="365" width="210" height="160" rx="16" class="amber"/><text x="397" y="410" class="h" text-anchor="middle">WOULD BLOCK</text><text x="397" y="448" class="h" text-anchor="middle">EAGAIN</text><text x="397" y="486" class="h" text-anchor="middle">register interest</text><rect x="530" y="130" width="210" height="160" rx="16" class="green"/><text x="635" y="175" class="h" text-anchor="middle">PROGRESS</text><text x="635" y="213" class="h" text-anchor="middle">n bytes</text><text x="635" y="251" class="h" text-anchor="middle">advance cursor</text><rect x="292" y="650" width="210" height="160" rx="16" class="violet"/><text x="397" y="695" class="h" text-anchor="middle">INTERRUPTED</text><text x="397" y="733" class="h" text-anchor="middle">EINTR</text><text x="397" y="771" class="h" text-anchor="middle">retry same tail</text><path d="M265 200 L530 200" class="line" marker-end="url(#arrow)"/><path d="M635 290 L500 390" class="line" marker-end="url(#arrow)"/><path d="M292 440 L160 290" class="line" marker-end="url(#arrow)"/><path d="M292 700 L160 290" class="line" marker-end="url(#arrow)"/><rect x="55" y="885" width="685" height="120" rx="16" class="red"/><text x="397" y="927" class="h" text-anchor="middle">Byte stream ≠ message stream</text><text x="397" y="967" class="h" text-anchor="middle">write(&quot;AB&quot;) + write(&quot;CD&quot;) may read as &quot;ABC&quot; then &quot;D&quot;.</text><text x="55" y="1060" class="s" text-anchor="start">Boundaries require an explicit framing protocol in the bytes.</text>
</svg>
