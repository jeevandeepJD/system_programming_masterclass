<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
<title id="title">Write visibility, fsync, and durability claims</title><desc id="desc">A timeline distinguishes write return, page-cache visibility, the fsync request and wait, and the device completion boundary, emphasizing that fsync success is not universal crash proof.</desc>
<defs><style>
  .bg{fill:#f8fafc}.ink{fill:#111827}.muted{fill:#334155}.card{fill:#fff;stroke:#0f172a;stroke-width:3}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.green{fill:#dcfce7;stroke:#15803d;stroke-width:3}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:3}.red{fill:#fee2e2;stroke:#b91c1c;stroke-width:3}.violet{fill:#ede9fe;stroke:#6d28d9;stroke-width:3}.line{fill:none;stroke:#0f172a;stroke-width:4}.dash{fill:none;stroke:#475569;stroke-width:3;stroke-dasharray:10 8}.t{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.h{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#0f172a}.p{font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:400;fill:#111827}.s{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:400;fill:#334155}.code{font-family:"Courier New",Courier,monospace;font-size:18px;font-weight:400;fill:#111827}.white{fill:#fff}.center{text-anchor:middle}.right{text-anchor:end}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker></defs>
<rect width="794" height="1123" class="bg"/>
<text x="48" y="58" class="t">Write visibility, fsync, and durability claims</text>
<path d="M48 78 H746" class="line"/>
<text x="55" y="120" class="h" text-anchor="start">Time →</text><path d="M75 210 H720" class="line" marker-end="url(#arrow)"/><circle cx="120" cy="210" r="14" class="green"/><text x="120" y="260" class="h" text-anchor="middle">write</text><text x="120" y="292" class="h" text-anchor="middle">returns</text><circle cx="300" cy="210" r="14" class="green"/><text x="300" y="260" class="h" text-anchor="middle">dirty page</text><text x="300" y="292" class="h" text-anchor="middle">visible</text><circle cx="475" cy="210" r="14" class="amber"/><text x="475" y="260" class="h" text-anchor="middle">fsync</text><text x="475" y="292" class="h" text-anchor="middle">request</text><circle cx="650" cy="210" r="14" class="red"/><text x="650" y="260" class="h" text-anchor="middle">device reports</text><text x="650" y="292" class="h" text-anchor="middle">completion</text><rect x="55" y="390" width="685" height="175" rx="16" class="blue"/><text x="75" y="430" class="h" text-anchor="start">What fsync success supports</text><text x="75" y="472" class="h" text-anchor="start">writeback and filesystem/device request completed</text><text x="75" y="502" class="h" text-anchor="start">per their contracts</text><text x="75" y="538" class="h" text-anchor="start">pending errors may be reported; check the return value</text><rect x="55" y="620" width="685" height="175" rx="16" class="red"/><text x="75" y="660" class="h" text-anchor="start">What it does not prove by itself</text><text x="75" y="702" class="h" text-anchor="start">survival under every power-loss mode</text><text x="75" y="744" class="h" text-anchor="start">drive firmware, cache, hardware, and filesystem</text><text x="75" y="774" class="h" text-anchor="start">guarantees still matter</text><rect x="55" y="850" width="685" height="130" rx="16" class="amber"/><text x="75" y="892" class="h" text-anchor="start">Precise claim</text><text x="75" y="932" class="h" text-anchor="start">fsync is a durability request and wait boundary—</text><text x="75" y="962" class="h" text-anchor="start">not universal crash proof.</text><text x="55" y="1050" class="s" text-anchor="start">Separate observation (“readback matched”) from the durability contract.</text>
</svg>
