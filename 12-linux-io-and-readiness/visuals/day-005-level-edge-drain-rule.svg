<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
<title id="title">Level versus edge trigger and the drain rule</title><desc id="desc">Level-triggered epoll reports a still-readable pipe repeatedly, while edge-triggered epoll requires a nonblocking reader to drain until EAGAIN and does not equate readiness with completion.</desc>
<defs><style>
  .bg{fill:#f8fafc}.ink{fill:#111827}.muted{fill:#334155}.card{fill:#fff;stroke:#0f172a;stroke-width:3}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.green{fill:#dcfce7;stroke:#15803d;stroke-width:3}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:3}.red{fill:#fee2e2;stroke:#b91c1c;stroke-width:3}.violet{fill:#ede9fe;stroke:#6d28d9;stroke-width:3}.line{fill:none;stroke:#0f172a;stroke-width:4}.dash{fill:none;stroke:#475569;stroke-width:3;stroke-dasharray:10 8}.t{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.h{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#0f172a}.p{font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:400;fill:#111827}.s{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:400;fill:#334155}.code{font-family:"Courier New",Courier,monospace;font-size:18px;font-weight:400;fill:#111827}.white{fill:#fff}.center{text-anchor:middle}.right{text-anchor:end}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker></defs>
<rect width="794" height="1123" class="bg"/>
<text x="48" y="58" class="t">Level versus edge trigger and the drain rule</text>
<path d="M48 78 H746" class="line"/>
<text x="55" y="120" class="h" text-anchor="start">Pipe contains 600 bytes; read buffer holds 256.</text><rect x="55" y="180" width="320" height="600" rx="16" class="blue"/><text x="215" y="225" class="t" text-anchor="middle">LEVEL TRIGGER</text><text x="80" y="295" class="h" text-anchor="start">epoll_wait → ready</text><text x="80" y="352" class="h" text-anchor="start">read → 256</text><text x="80" y="409" class="h" text-anchor="start">344 remain</text><text x="80" y="466" class="h" text-anchor="start">next wait → ready</text><text x="80" y="523" class="h" text-anchor="start">read → 256</text><text x="80" y="580" class="h" text-anchor="start">88 remain</text><text x="80" y="637" class="h" text-anchor="start">next wait → ready</text><rect x="420" y="180" width="320" height="600" rx="16" class="violet"/><text x="580" y="225" class="t" text-anchor="middle">EDGE TRIGGER</text><text x="445" y="295" class="h" text-anchor="start">epoll_wait → edge</text><text x="445" y="352" class="h" text-anchor="start">read → 256</text><text x="445" y="409" class="h" text-anchor="start">344 remain</text><text x="445" y="466" class="h" text-anchor="start">no new edge</text><text x="445" y="523" class="h" text-anchor="start">wrong: wait again</text><text x="445" y="580" class="h" text-anchor="start">right: keep reading</text><text x="445" y="637" class="h" text-anchor="start">stop at EAGAIN</text><rect x="55" y="845" width="685" height="145" rx="16" class="red"/><text x="75" y="885" class="h" text-anchor="start">Drain rule for EPOLLET</text><text x="75" y="927" class="h" text-anchor="start">set O_NONBLOCK; read until EAGAIN; treat 0 as EOF.</text><text x="55" y="1050" class="s" text-anchor="start">Even after readiness, races can make the next call short or EAGAIN.</text>
</svg>
