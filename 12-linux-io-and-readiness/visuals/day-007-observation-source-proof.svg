<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
<title id="title">Observation, source proof, and system boundaries</title><desc id="desc">A matrix separates runtime observations from source proof and contrasts what ToyOS implements and can evidence with what Linux implements and can evidence.</desc>
<defs><style>
  .bg{fill:#f8fafc}.ink{fill:#111827}.muted{fill:#334155}.card{fill:#fff;stroke:#0f172a;stroke-width:3}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.green{fill:#dcfce7;stroke:#15803d;stroke-width:3}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:3}.red{fill:#fee2e2;stroke:#b91c1c;stroke-width:3}.violet{fill:#ede9fe;stroke:#6d28d9;stroke-width:3}.line{fill:none;stroke:#0f172a;stroke-width:4}.dash{fill:none;stroke:#475569;stroke-width:3;stroke-dasharray:10 8}.t{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.h{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#0f172a}.p{font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:400;fill:#111827}.s{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:400;fill:#334155}.code{font-family:"Courier New",Courier,monospace;font-size:18px;font-weight:400;fill:#111827}.white{fill:#fff}.center{text-anchor:middle}.right{text-anchor:end}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker></defs>
<rect width="794" height="1123" class="bg"/>
<text x="48" y="58" class="t">Observation, source proof, and system boundaries</text>
<path d="M48 78 H746" class="line"/>
<text x="55" y="120" class="h" text-anchor="start">Observation and source answer different questions.</text><rect x="55" y="170" width="320" height="330" rx="16" class="blue"/><text x="75" y="215" class="h" text-anchor="start">OBSERVATION</text><text x="75" y="267" class="h" text-anchor="start">strace: syscall + return</text><text x="75" y="319" class="h" text-anchor="start">/proc: fd target + flags</text><text x="75" y="371" class="h" text-anchor="start">measurement: counts/timing</text><text x="75" y="423" class="h" text-anchor="start">proves what this run did</text><rect x="420" y="170" width="320" height="330" rx="16" class="violet"/><text x="440" y="215" class="h" text-anchor="start">SOURCE PROOF</text><text x="440" y="267" class="h" text-anchor="start">named function / contract</text><text x="440" y="319" class="h" text-anchor="start">identified commit or release</text><text x="440" y="371" class="h" text-anchor="start">explains mechanism</text><text x="440" y="423" class="h" text-anchor="start">does not prove this run took it</text><rect x="55" y="565" width="320" height="300" rx="16" class="amber"/><text x="75" y="610" class="h" text-anchor="start">ToyOS boundary</text><text x="75" y="658" class="h" text-anchor="start">small descriptor table</text><text x="75" y="706" class="h" text-anchor="start">linear pipe model</text><text x="75" y="754" class="h" text-anchor="start">serial / QEMU evidence</text><text x="75" y="802" class="h" text-anchor="start">no Linux epoll/page cache</text><rect x="420" y="565" width="320" height="300" rx="16" class="green"/><text x="440" y="610" class="h" text-anchor="start">Linux boundary</text><text x="440" y="658" class="h" text-anchor="start">VFS + page cache</text><text x="440" y="706" class="h" text-anchor="start">pipe wait queues + epoll</text><text x="440" y="754" class="h" text-anchor="start">proc / strace / source</text><text x="440" y="802" class="h" text-anchor="start">record uname + tree id</text><rect x="55" y="930" width="685" height="90" rx="16" class="red"/><text x="75" y="960" class="h" text-anchor="start">Strong claim = matching observation + applicable source</text><text x="75" y="990" class="h" text-anchor="start">+ explicit system/version.</text><text x="55" y="1080" class="s" text-anchor="start">Never use ToyOS behavior as proof of Linux behavior, or vice versa.</text>
</svg>
