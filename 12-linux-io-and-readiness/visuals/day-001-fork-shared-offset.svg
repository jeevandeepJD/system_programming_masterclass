<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
<title id="title">Fork copies slots, not the offset owner</title><desc id="desc">A parent and child have distinct descriptor tables after fork, but corresponding slots retain references to the same open-file description and therefore the same file offset.</desc>
<defs><style>
  .bg{fill:#f8fafc}.ink{fill:#111827}.muted{fill:#334155}.card{fill:#fff;stroke:#0f172a;stroke-width:3}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.green{fill:#dcfce7;stroke:#15803d;stroke-width:3}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:3}.red{fill:#fee2e2;stroke:#b91c1c;stroke-width:3}.violet{fill:#ede9fe;stroke:#6d28d9;stroke-width:3}.line{fill:none;stroke:#0f172a;stroke-width:4}.dash{fill:none;stroke:#475569;stroke-width:3;stroke-dasharray:10 8}.t{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.h{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#0f172a}.p{font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:400;fill:#111827}.s{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:400;fill:#334155}.code{font-family:"Courier New",Courier,monospace;font-size:18px;font-weight:400;fill:#111827}.white{fill:#fff}.center{text-anchor:middle}.right{text-anchor:end}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker></defs>
<rect width="794" height="1123" class="bg"/>
<text x="48" y="58" class="t">Fork copies slots, not the offset owner</text>
<path d="M48 78 H746" class="line"/>
<text x="55" y="120" class="h" text-anchor="start">Parent before fork</text><rect x="55" y="150" width="300" height="120" rx="16" class="blue"/><text x="75" y="190" class="h" text-anchor="start">files_struct P</text><text x="75" y="232" class="h" text-anchor="start">fd 3 → open file X</text><path d="M205 270 L205 345" class="line" marker-end="url(#arrow)"/><text x="55" y="330" class="h" text-anchor="start">fork duplicates the table</text><rect x="55" y="380" width="300" height="135" rx="16" class="blue"/><text x="75" y="420" class="h" text-anchor="start">parent table</text><text x="75" y="462" class="h" text-anchor="start">fd 3 → X</text><rect x="440" y="380" width="300" height="135" rx="16" class="violet"/><text x="460" y="420" class="h" text-anchor="start">child table</text><text x="460" y="462" class="h" text-anchor="start">fd 3 → X</text><rect x="245" y="595" width="305" height="145" rx="16" class="green"/><text x="397" y="640" class="h" text-anchor="middle">open file X</text><text x="397" y="678" class="h" text-anchor="middle">one f_pos</text><text x="397" y="716" class="h" text-anchor="middle">refcount ≥ 2</text><path d="M205 515 L320 595" class="line" marker-end="url(#arrow)"/><path d="M590 515 L475 595" class="line" marker-end="url(#arrow)"/><rect x="55" y="815" width="690" height="165" rx="16" class="amber"/><text x="75" y="855" class="h" text-anchor="start">Shared-offset consequence</text><text x="75" y="891" class="h" text-anchor="start">parent read: f_pos 0 → 1</text><text x="75" y="927" class="h" text-anchor="start">child read begins at 1, not 0</text><text x="75" y="963" class="h" text-anchor="start">Use pread when ownership must stay positional.</text><text x="55" y="1045" class="s" text-anchor="start">Tables are private after fork; the referenced open file is shared.</text>
</svg>
