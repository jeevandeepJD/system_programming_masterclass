<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
<title id="title">select, poll, and epoll registration paths</title><desc id="desc">Three columns compare select copied bitmaps, poll arrays, and epoll persistent registrations and ready callbacks, while retaining the common register, test, sleep, wake, and retest contract.</desc>
<defs><style>
  .bg{fill:#f8fafc}.ink{fill:#111827}.muted{fill:#334155}.card{fill:#fff;stroke:#0f172a;stroke-width:3}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.green{fill:#dcfce7;stroke:#15803d;stroke-width:3}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:3}.red{fill:#fee2e2;stroke:#b91c1c;stroke-width:3}.violet{fill:#ede9fe;stroke:#6d28d9;stroke-width:3}.line{fill:none;stroke:#0f172a;stroke-width:4}.dash{fill:none;stroke:#475569;stroke-width:3;stroke-dasharray:10 8}.t{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.h{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#0f172a}.p{font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:400;fill:#111827}.s{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:400;fill:#334155}.code{font-family:"Courier New",Courier,monospace;font-size:18px;font-weight:400;fill:#111827}.white{fill:#fff}.center{text-anchor:middle}.right{text-anchor:end}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker></defs>
<rect width="794" height="1123" class="bg"/>
<text x="48" y="58" class="t">select, poll, and epoll registration paths</text>
<path d="M48 78 H746" class="line"/>
<rect x="45" y="130" width="220" height="480" rx="16" class="blue"/><text x="155" y="180" class="t" text-anchor="middle">select</text><text x="65" y="245" class="h" text-anchor="start">copied bitmap</text><text x="65" y="303" class="h" text-anchor="start">scan fd range</text><text x="65" y="361" class="h" text-anchor="start">one-call wait</text><path d="M80 450 H230" class="dash"/><text x="155" y="500" class="s" text-anchor="middle">file.poll</text><text x="155" y="534" class="s" text-anchor="middle">wait queue</text><text x="155" y="568" class="s" text-anchor="middle">wakeup</text><rect x="285" y="130" width="220" height="480" rx="16" class="violet"/><text x="395" y="180" class="t" text-anchor="middle">poll</text><text x="305" y="245" class="h" text-anchor="start">pollfd array</text><text x="305" y="303" class="h" text-anchor="start">scan entries</text><text x="305" y="361" class="h" text-anchor="start">one-call wait</text><path d="M320 450 H470" class="dash"/><text x="395" y="500" class="s" text-anchor="middle">file.poll</text><text x="395" y="534" class="s" text-anchor="middle">wait queue</text><text x="395" y="568" class="s" text-anchor="middle">wakeup</text><rect x="525" y="130" width="220" height="480" rx="16" class="green"/><text x="635" y="180" class="t" text-anchor="middle">epoll</text><text x="545" y="245" class="h" text-anchor="start">stored registrations</text><text x="545" y="303" class="h" text-anchor="start">callback ready list</text><text x="545" y="361" class="h" text-anchor="start">persistent set</text><path d="M560 450 H710" class="dash"/><text x="635" y="500" class="s" text-anchor="middle">file.poll</text><text x="635" y="534" class="s" text-anchor="middle">wait queue</text><text x="635" y="568" class="s" text-anchor="middle">wakeup</text><rect x="55" y="690" width="685" height="145" rx="16" class="amber"/><text x="75" y="730" class="h" text-anchor="start">Common contract</text><text x="75" y="765" class="h" text-anchor="start">register interest → test readiness → sleep</text><text x="75" y="795" class="h" text-anchor="start">→ wake → retest</text><rect x="55" y="885" width="685" height="115" rx="16" class="red"/><text x="75" y="925" class="h" text-anchor="start">A readiness event is permission to try—</text><text x="75" y="955" class="h" text-anchor="start">not completion of I/O.</text><text x="55" y="1060" class="s" text-anchor="start">The following read or write supplies the byte count.</text>
</svg>
