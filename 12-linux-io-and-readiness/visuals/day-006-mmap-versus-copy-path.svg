<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
<title id="title">Memory mapping versus copying I/O</title><desc id="desc">A side-by-side comparison shows read and write syscalls copying between page cache and anonymous buffers, while mmap creates a VMA, faults, installs a PTE to the cache folio, and retries the instruction.</desc>
<defs><style>
  .bg{fill:#f8fafc}.ink{fill:#111827}.muted{fill:#334155}.card{fill:#fff;stroke:#0f172a;stroke-width:3}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.green{fill:#dcfce7;stroke:#15803d;stroke-width:3}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:3}.red{fill:#fee2e2;stroke:#b91c1c;stroke-width:3}.violet{fill:#ede9fe;stroke:#6d28d9;stroke-width:3}.line{fill:none;stroke:#0f172a;stroke-width:4}.dash{fill:none;stroke:#475569;stroke-width:3;stroke-dasharray:10 8}.t{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.h{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#0f172a}.p{font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:400;fill:#111827}.s{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:400;fill:#334155}.code{font-family:"Courier New",Courier,monospace;font-size:18px;font-weight:400;fill:#111827}.white{fill:#fff}.center{text-anchor:middle}.right{text-anchor:end}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker></defs>
<rect width="794" height="1123" class="bg"/>
<text x="48" y="58" class="t">Memory mapping versus copying I/O</text>
<path d="M48 78 H746" class="line"/>
<rect x="55" y="125" width="320" height="750" rx="16" class="blue"/><text x="215" y="170" class="t" text-anchor="middle">read / write path</text><text x="80" y="245" class="h" text-anchor="start">syscall entry</text><text x="80" y="310" class="h" text-anchor="start">VFS method</text><text x="80" y="375" class="h" text-anchor="start">page-cache folio</text><text x="80" y="440" class="h" text-anchor="start">copy_to_user /</text><text x="80" y="505" class="h" text-anchor="start">copy_from_user</text><text x="80" y="570" class="h" text-anchor="start">anonymous buffer</text><text x="80" y="635" class="h" text-anchor="start">return byte count</text><path d="M215 260 L215 285" class="line" marker-end="url(#arrow)"/><path d="M215 390 L215 415" class="line" marker-end="url(#arrow)"/><path d="M215 585 L215 610" class="line" marker-end="url(#arrow)"/><rect x="420" y="125" width="320" height="750" rx="16" class="green"/><text x="580" y="170" class="t" text-anchor="middle">mmap path</text><text x="445" y="245" class="h" text-anchor="start">mmap creates VMA</text><text x="445" y="310" class="h" text-anchor="start">first touch faults</text><text x="445" y="375" class="h" text-anchor="start">filemap_fault</text><text x="445" y="440" class="h" text-anchor="start">finds cache folio</text><text x="445" y="505" class="h" text-anchor="start">PTE maps folio</text><text x="445" y="570" class="h" text-anchor="start">retry instruction</text><text x="445" y="635" class="h" text-anchor="start">later load/store</text><path d="M580 260 L580 285" class="line" marker-end="url(#arrow)"/><path d="M580 390 L580 415" class="line" marker-end="url(#arrow)"/><path d="M580 585 L580 610" class="line" marker-end="url(#arrow)"/><rect x="55" y="930" width="685" height="95" rx="16" class="amber"/><text x="75" y="963" class="h" text-anchor="start">Copy path returns counts; mapping path installs</text><text x="75" y="995" class="h" text-anchor="start">translations and may signal SIGBUS.</text><text x="55" y="1080" class="s" text-anchor="start">Both paths meet at the same page cache; their costs and failure modes differ.</text>
</svg>
