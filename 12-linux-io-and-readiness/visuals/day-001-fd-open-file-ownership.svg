<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
<title id="title">Descriptor, open file, inode, and ownership</title><desc id="desc">A process descriptor table has two entries from dup or fork that point to one open-file description with a shared offset, which in turn refers to an inode. A separate open creates a separate offset.</desc>
<defs><style>
  .bg{fill:#f8fafc}.ink{fill:#111827}.muted{fill:#334155}.card{fill:#fff;stroke:#0f172a;stroke-width:3}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.green{fill:#dcfce7;stroke:#15803d;stroke-width:3}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:3}.red{fill:#fee2e2;stroke:#b91c1c;stroke-width:3}.violet{fill:#ede9fe;stroke:#6d28d9;stroke-width:3}.line{fill:none;stroke:#0f172a;stroke-width:4}.dash{fill:none;stroke:#475569;stroke-width:3;stroke-dasharray:10 8}.t{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.h{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#0f172a}.p{font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:400;fill:#111827}.s{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:400;fill:#334155}.code{font-family:"Courier New",Courier,monospace;font-size:18px;font-weight:400;fill:#111827}.white{fill:#fff}.center{text-anchor:middle}.right{text-anchor:end}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker></defs>
<rect width="794" height="1123" class="bg"/>
<text x="48" y="58" class="t">Descriptor, open file, inode, and ownership</text>
<path d="M48 78 H746" class="line"/>
<rect x="55" y="125" width="220" height="150" rx="16" class="blue"/><text x="75" y="165" class="h" text-anchor="start">process fd table</text><text x="75" y="207" class="h" text-anchor="start">fd 3</text><text x="75" y="249" class="h" text-anchor="start">fd 4</text><rect x="330" y="125" width="270" height="190" rx="16" class="green"/><text x="350" y="165" class="h" text-anchor="start">open-file description</text><text x="350" y="201" class="h" text-anchor="start">f_pos = 128</text><text x="350" y="237" class="h" text-anchor="start">status flags</text><text x="350" y="273" class="h" text-anchor="start">reference count = 2</text><rect x="640" y="145" width="105" height="150" rx="16" class="amber"/><text x="692" y="184" class="h" text-anchor="middle">inode</text><text x="692" y="218" class="h" text-anchor="middle">file</text><text x="692" y="252" class="h" text-anchor="middle">identity</text><path d="M275 190 L330 190" class="line" marker-end="url(#arrow)"/><path d="M275 235 L330 235" class="line" marker-end="url(#arrow)"/><path d="M600 220 L640 220" class="line" marker-end="url(#arrow)"/><text x="65" y="335" class="p" text-anchor="start">Two descriptor slots; one shared open-file description; one inode.</text><rect x="55" y="395" width="690" height="180" rx="16" class="violet"/><text x="75" y="435" class="h" text-anchor="start">dup(fd) and fork() copy a reference</text><text x="75" y="477" class="h" text-anchor="start">Both aliases advance the same f_pos</text><text x="75" y="519" class="h" text-anchor="start">close(fd 4) drops one reference; object remains</text><rect x="55" y="625" width="320" height="185" rx="16" class="green"/><text x="75" y="665" class="h" text-anchor="start">second open(path)</text><text x="75" y="707" class="h" text-anchor="start">new open-file description</text><text x="75" y="749" class="h" text-anchor="start">independent f_pos = 0</text><rect x="425" y="625" width="320" height="185" rx="16" class="amber"/><text x="445" y="665" class="h" text-anchor="start">ownership rule</text><text x="445" y="701" class="h" text-anchor="start">fd table owns references</text><text x="445" y="737" class="h" text-anchor="start">open file owns offset</text><text x="445" y="773" class="h" text-anchor="start">inode owns file identity</text><path d="M215 575 L215 625" class="line" marker-end="url(#arrow)"/><path d="M585 575 L585 625" class="dash" marker-end="url(#arrow)"/><rect x="55" y="865" width="690" height="145" rx="16" class="red"/><text x="75" y="905" class="h" text-anchor="start">Do not say “the fd has an offset.”</text><text x="75" y="947" class="h" text-anchor="start">The descriptor selects an open-file description;</text><text x="75" y="981" class="h" text-anchor="start">that object owns f_pos.</text>
</svg>
