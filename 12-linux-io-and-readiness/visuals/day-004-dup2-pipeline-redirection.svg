<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
<title id="title">Shell redirection with fork, dup2, and close</title><desc id="desc">A shell forks producer and consumer children, uses dup2 to connect standard output and input to pipe endpoints, closes inherited extras, and relies on the bounded ring for backpressure and correct EOF.</desc>
<defs><style>
  .bg{fill:#f8fafc}.ink{fill:#111827}.muted{fill:#334155}.card{fill:#fff;stroke:#0f172a;stroke-width:3}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.green{fill:#dcfce7;stroke:#15803d;stroke-width:3}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:3}.red{fill:#fee2e2;stroke:#b91c1c;stroke-width:3}.violet{fill:#ede9fe;stroke:#6d28d9;stroke-width:3}.line{fill:none;stroke:#0f172a;stroke-width:4}.dash{fill:none;stroke:#475569;stroke-width:3;stroke-dasharray:10 8}.t{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.h{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#0f172a}.p{font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:400;fill:#111827}.s{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:400;fill:#334155}.code{font-family:"Courier New",Courier,monospace;font-size:18px;font-weight:400;fill:#111827}.white{fill:#fff}.center{text-anchor:middle}.right{text-anchor:end}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker></defs>
<rect width="794" height="1123" class="bg"/>
<text x="48" y="58" class="t">Shell redirection with fork, dup2, and close</text>
<path d="M48 78 H746" class="line"/>
<rect x="55" y="120" width="685" height="105" rx="16" class="blue"/><text x="75" y="164" class="h" text-anchor="start">shell: pipe() → r, w; then fork producer and consumer</text><rect x="55" y="300" width="310" height="240" rx="16" class="green"/><text x="75" y="345" class="h" text-anchor="start">producer child</text><text x="75" y="383" class="h" text-anchor="start">dup2(w, STDOUT_FILENO)</text><text x="75" y="421" class="h" text-anchor="start">close(r); close(w)</text><text x="75" y="459" class="h" text-anchor="start">exec producer</text><text x="75" y="497" class="h" text-anchor="start">write(1, …) → pipe</text><rect x="430" y="300" width="310" height="240" rx="16" class="violet"/><text x="450" y="345" class="h" text-anchor="start">consumer child</text><text x="450" y="383" class="h" text-anchor="start">dup2(r, STDIN_FILENO)</text><text x="450" y="421" class="h" text-anchor="start">close(r); close(w)</text><text x="450" y="459" class="h" text-anchor="start">exec consumer</text><text x="450" y="497" class="h" text-anchor="start">read(0, …) ← pipe</text><rect x="265" y="610" width="265" height="160" rx="16" class="amber"/><text x="397" y="655" class="h" text-anchor="middle">one pipe object</text><text x="397" y="693" class="h" text-anchor="middle">finite ring</text><text x="397" y="731" class="h" text-anchor="middle">backpressure</text><path d="M365 540 L330 610" class="line" marker-end="url(#arrow)"/><path d="M430 540 L465 610" class="line" marker-end="url(#arrow)"/><rect x="55" y="840" width="685" height="145" rx="16" class="red"/><text x="75" y="880" class="h" text-anchor="start">Close discipline is correctness</text><text x="75" y="918" class="h" text-anchor="start">an extra write-end reference prevents EOF</text><text x="75" y="956" class="h" text-anchor="start">an absent read-end reference causes SIGPIPE / EPIPE</text><text x="55" y="1050" class="s" text-anchor="start">dup2 changes which file descriptor number names the endpoint.</text>
</svg>
