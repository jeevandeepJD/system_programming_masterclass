<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
<title id="title">Short I/O retry loop</title><desc id="desc">A read or write loop advances only by positive returned counts, treats read zero as EOF, retries EINTR without moving the cursor, and waits for readiness after EAGAIN.</desc>
<defs><style>
  .bg{fill:#f8fafc}.ink{fill:#111827}.muted{fill:#334155}.card{fill:#fff;stroke:#0f172a;stroke-width:3}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.green{fill:#dcfce7;stroke:#15803d;stroke-width:3}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:3}.red{fill:#fee2e2;stroke:#b91c1c;stroke-width:3}.violet{fill:#ede9fe;stroke:#6d28d9;stroke-width:3}.line{fill:none;stroke:#0f172a;stroke-width:4}.dash{fill:none;stroke:#475569;stroke-width:3;stroke-dasharray:10 8}.t{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.h{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#0f172a}.p{font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:400;fill:#111827}.s{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:400;fill:#334155}.code{font-family:"Courier New",Courier,monospace;font-size:18px;font-weight:400;fill:#111827}.white{fill:#fff}.center{text-anchor:middle}.right{text-anchor:end}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker></defs>
<rect width="794" height="1123" class="bg"/>
<text x="48" y="58" class="t">Short I/O retry loop</text>
<path d="M48 78 H746" class="line"/>
<rect x="55" y="120" width="685" height="100" rx="16" class="blue"/><text x="75" y="162" class="h" text-anchor="start">request: write 8192 bytes</text><path d="M397 220 L397 285" class="line" marker-end="url(#arrow)"/><rect x="55" y="285" width="685" height="160" rx="16" class="green"/><text x="75" y="325" class="h" text-anchor="start">return n &gt; 0: progress, possibly short</text><text x="75" y="367" class="h" text-anchor="start">advance pointer by n; remaining -= n</text><text x="75" y="409" class="h" text-anchor="start">never resend the completed prefix</text><path d="M397 445 L397 510" class="line" marker-end="url(#arrow)"/><rect x="55" y="510" width="205" height="160" rx="16" class="amber"/><text x="157" y="550" class="h" text-anchor="middle">n == 0</text><text x="157" y="588" class="h" text-anchor="middle">read: EOF</text><text x="157" y="626" class="h" text-anchor="middle">write: policy</text><rect x="295" y="510" width="205" height="160" rx="16" class="violet"/><text x="397" y="550" class="h" text-anchor="middle">EINTR</text><text x="397" y="588" class="h" text-anchor="middle">no progress</text><text x="397" y="626" class="h" text-anchor="middle">retry tail</text><rect x="535" y="510" width="205" height="160" rx="16" class="red"/><text x="637" y="550" class="h" text-anchor="middle">EAGAIN</text><text x="637" y="588" class="h" text-anchor="middle">would block</text><text x="637" y="626" class="h" text-anchor="middle">wait readiness</text><path d="M397 670 L397 745" class="line" marker-end="url(#arrow)"/><rect x="110" y="745" width="575" height="175" rx="16" class="green"/><text x="397" y="790" class="h" text-anchor="middle">loop invariant</text><text x="397" y="828" class="h" text-anchor="middle">completed prefix is [0, cursor)</text><text x="397" y="866" class="h" text-anchor="middle">next call starts at cursor</text><text x="397" y="904" class="h" text-anchor="middle">success only when cursor == requested</text><text x="55" y="1010" class="s" text-anchor="start">A count is a ceiling; the return value is the progress actually made.</text>
</svg>
