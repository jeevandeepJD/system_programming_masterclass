<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
<title id="title">Pipe ring, endpoint lifetime, and backpressure</title><desc id="desc">A bounded pipe ring connects write and read endpoints, sleeps or returns EAGAIN when full, preserves atomicity for small competing writes, returns EOF after the last writer, and emits SIGPIPE and EPIPE after the last reader.</desc>
<defs><style>
  .bg{fill:#f8fafc}.ink{fill:#111827}.muted{fill:#334155}.card{fill:#fff;stroke:#0f172a;stroke-width:3}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.green{fill:#dcfce7;stroke:#15803d;stroke-width:3}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:3}.red{fill:#fee2e2;stroke:#b91c1c;stroke-width:3}.violet{fill:#ede9fe;stroke:#6d28d9;stroke-width:3}.line{fill:none;stroke:#0f172a;stroke-width:4}.dash{fill:none;stroke:#475569;stroke-width:3;stroke-dasharray:10 8}.t{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.h{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#0f172a}.p{font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:400;fill:#111827}.s{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:400;fill:#334155}.code{font-family:"Courier New",Courier,monospace;font-size:18px;font-weight:400;fill:#111827}.white{fill:#fff}.center{text-anchor:middle}.right{text-anchor:end}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker></defs>
<rect width="794" height="1123" class="bg"/>
<text x="48" y="58" class="t">Pipe ring, endpoint lifetime, and backpressure</text>
<path d="M48 78 H746" class="line"/>
<rect x="55" y="130" width="180" height="145" rx="16" class="blue"/><text x="145" y="175" class="h" text-anchor="middle">writers</text><text x="145" y="213" class="h" text-anchor="middle">write end</text><text x="145" y="251" class="h" text-anchor="middle">writers = 1</text><rect x="280" y="120" width="235" height="300" rx="16" class="violet"/><text x="397" y="160" class="h" text-anchor="middle">pipe ring</text><rect x="315" y="205" width="165" height="38" rx="6" class="green"/><text x="397" y="231" class="code" text-anchor="middle">A B</text><rect x="315" y="253" width="165" height="38" rx="6" class="green"/><text x="397" y="279" class="code" text-anchor="middle">C D</text><rect x="315" y="301" width="165" height="38" rx="6" class="amber"/><text x="397" y="327" class="code" text-anchor="middle">free</text><rect x="315" y="349" width="165" height="38" rx="6" class="amber"/><text x="397" y="375" class="code" text-anchor="middle">free</text><rect x="560" y="130" width="180" height="145" rx="16" class="blue"/><text x="650" y="175" class="h" text-anchor="middle">readers</text><text x="650" y="213" class="h" text-anchor="middle">read end</text><text x="650" y="251" class="h" text-anchor="middle">readers = 1</text><path d="M235 205 L280 205" class="line" marker-end="url(#arrow)"/><path d="M515 205 L560 205" class="line" marker-end="url(#arrow)"/><rect x="55" y="485" width="215" height="155" rx="16" class="amber"/><text x="162" y="528" class="h" text-anchor="middle">full ring</text><text x="162" y="566" class="h" text-anchor="middle">blocking: sleep</text><text x="162" y="604" class="h" text-anchor="middle">nonblock: EAGAIN</text><rect x="290" y="485" width="215" height="155" rx="16" class="green"/><text x="397" y="528" class="h" text-anchor="middle">small writes</text><text x="397" y="566" class="h" text-anchor="middle">≤ PIPE_BUF</text><text x="397" y="604" class="h" text-anchor="middle">atomic vs writers</text><rect x="525" y="485" width="215" height="155" rx="16" class="red"/><text x="632" y="528" class="h" text-anchor="middle">no readers</text><text x="632" y="566" class="h" text-anchor="middle">SIGPIPE</text><text x="632" y="604" class="h" text-anchor="middle">and EPIPE</text><rect x="55" y="705" width="685" height="145" rx="16" class="violet"/><text x="75" y="745" class="h" text-anchor="start">EOF rule</text><text x="75" y="783" class="h" text-anchor="start">ring empty + writers == 0 → read returns 0</text><text x="75" y="821" class="h" text-anchor="start">buffered bytes are delivered before EOF</text><rect x="55" y="900" width="685" height="105" rx="16" class="blue"/><text x="75" y="940" class="h" text-anchor="start">Atomic small write does not create</text><text x="75" y="970" class="h" text-anchor="start">read-side message boundaries.</text><text x="55" y="1060" class="s" text-anchor="start">The finite ring turns consumer delay into backpressure.</text>
</svg>
