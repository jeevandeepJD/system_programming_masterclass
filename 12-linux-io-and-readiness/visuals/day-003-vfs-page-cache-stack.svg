<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
<title id="title">From syscall to the durability boundary</title><desc id="desc">A buffered write passes through the VFS into a dirty page-cache folio, later enters writeback and the block layer, and finally reaches a device durability boundary.</desc>
<defs><style>
  .bg{fill:#f8fafc}.ink{fill:#111827}.muted{fill:#334155}.card{fill:#fff;stroke:#0f172a;stroke-width:3}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.green{fill:#dcfce7;stroke:#15803d;stroke-width:3}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:3}.red{fill:#fee2e2;stroke:#b91c1c;stroke-width:3}.violet{fill:#ede9fe;stroke:#6d28d9;stroke-width:3}.line{fill:none;stroke:#0f172a;stroke-width:4}.dash{fill:none;stroke:#475569;stroke-width:3;stroke-dasharray:10 8}.t{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.h{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#0f172a}.p{font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:400;fill:#111827}.s{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:400;fill:#334155}.code{font-family:"Courier New",Courier,monospace;font-size:18px;font-weight:400;fill:#111827}.white{fill:#fff}.center{text-anchor:middle}.right{text-anchor:end}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker></defs>
<rect width="794" height="1123" class="bg"/>
<text x="48" y="58" class="t">From syscall to the durability boundary</text>
<path d="M48 78 H746" class="line"/>
<rect x="75" y="120" width="645" height="110" rx="16" class="blue"/><text x="100" y="162" class="h" text-anchor="start">syscall</text><text x="100" y="196" class="h" text-anchor="start">write(fd, user, count)</text><path d="M397 230 L397 265" class="line" marker-end="url(#arrow)"/><rect x="75" y="275" width="645" height="110" rx="16" class="violet"/><text x="100" y="317" class="h" text-anchor="start">VFS</text><text x="100" y="351" class="h" text-anchor="start">vfs_write → file operation</text><path d="M397 385 L397 420" class="line" marker-end="url(#arrow)"/><rect x="75" y="430" width="645" height="110" rx="16" class="green"/><text x="100" y="472" class="h" text-anchor="start">page cache</text><text x="100" y="506" class="h" text-anchor="start">copy into folio; mark DIRTY</text><path d="M397 540 L397 575" class="line" marker-end="url(#arrow)"/><rect x="75" y="585" width="645" height="110" rx="16" class="amber"/><text x="100" y="627" class="h" text-anchor="start">writeback</text><text x="100" y="661" class="h" text-anchor="start">DIRTY → WRITEBACK</text><path d="M397 695 L397 730" class="line" marker-end="url(#arrow)"/><rect x="75" y="740" width="645" height="110" rx="16" class="amber"/><text x="100" y="782" class="h" text-anchor="start">filesystem / block layer</text><text x="100" y="816" class="h" text-anchor="start">submit device request</text><path d="M397 850 L397 885" class="line" marker-end="url(#arrow)"/><rect x="75" y="895" width="645" height="110" rx="16" class="red"/><text x="100" y="937" class="h" text-anchor="start">device durability boundary</text><text x="100" y="971" class="h" text-anchor="start">controller + media contract</text><text x="55" y="1080" class="s" text-anchor="start">Visibility after write is not evidence of persistence across power loss.</text>
</svg>
