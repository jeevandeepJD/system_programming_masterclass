<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
<title id="title">MAP_SHARED visibility through the page cache</title><desc id="desc">Two virtual mappings and the read path converge on one page-cache folio; a shared store becomes visible through that page and dirties it for later writeback.</desc>
<defs><style>
  .bg{fill:#f8fafc}.ink{fill:#111827}.muted{fill:#334155}.card{fill:#fff;stroke:#0f172a;stroke-width:3}.blue{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.green{fill:#dcfce7;stroke:#15803d;stroke-width:3}.amber{fill:#fef3c7;stroke:#b45309;stroke-width:3}.red{fill:#fee2e2;stroke:#b91c1c;stroke-width:3}.violet{fill:#ede9fe;stroke:#6d28d9;stroke-width:3}.line{fill:none;stroke:#0f172a;stroke-width:4}.dash{fill:none;stroke:#475569;stroke-width:3;stroke-dasharray:10 8}.t{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.h{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#0f172a}.p{font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:400;fill:#111827}.s{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:400;fill:#334155}.code{font-family:"Courier New",Courier,monospace;font-size:18px;font-weight:400;fill:#111827}.white{fill:#fff}.center{text-anchor:middle}.right{text-anchor:end}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker></defs>
<rect width="794" height="1123" class="bg"/>
<text x="48" y="58" class="t">MAP_SHARED visibility through the page cache</text>
<path d="M48 78 H746" class="line"/>
<rect x="55" y="120" width="300" height="170" rx="16" class="blue"/><text x="75" y="160" class="h" text-anchor="start">process virtual memory</text><text x="75" y="202" class="h" text-anchor="start">VMA: file offset 0</text><text x="75" y="244" class="h" text-anchor="start">PTE → frame P</text><rect x="440" y="120" width="300" height="170" rx="16" class="violet"/><text x="460" y="160" class="h" text-anchor="start">second process / read</text><text x="460" y="202" class="h" text-anchor="start">VMA or read path</text><text x="460" y="244" class="h" text-anchor="start">same file offset</text><rect x="245" y="390" width="305" height="175" rx="16" class="green"/><text x="397" y="435" class="h" text-anchor="middle">page-cache folio P</text><text x="397" y="477" class="h" text-anchor="middle">shared file bytes</text><text x="397" y="519" class="h" text-anchor="middle">dirty after store</text><path d="M205 290 L320 390" class="line" marker-end="url(#arrow)"/><path d="M590 290 L475 390" class="line" marker-end="url(#arrow)"/><rect x="55" y="655" width="320" height="170" rx="16" class="amber"/><text x="75" y="695" class="h" text-anchor="start">MAP_SHARED store</text><text x="75" y="731" class="h" text-anchor="start">CPU writes frame P</text><text x="75" y="767" class="h" text-anchor="start">other mapping sees bytes</text><text x="75" y="803" class="h" text-anchor="start">read copies from P</text><rect x="420" y="655" width="320" height="170" rx="16" class="red"/><text x="440" y="695" class="h" text-anchor="start">writeback path</text><text x="440" y="731" class="h" text-anchor="start">dirty tag</text><text x="440" y="767" class="h" text-anchor="start">filesystem request</text><text x="440" y="803" class="h" text-anchor="start">device boundary</text><path d="M397 565 L215 655" class="line" marker-end="url(#arrow)"/><path d="M397 565 L580 655" class="line" marker-end="url(#arrow)"/><rect x="55" y="900" width="685" height="100" rx="16" class="blue"/><text x="75" y="942" class="h" text-anchor="start">Shared visibility is not synchronization and not durability.</text><text x="55" y="1060" class="s" text-anchor="start">Use atomics/locks for ordering; use msync/fsync for a durability request.</text>
</svg>
