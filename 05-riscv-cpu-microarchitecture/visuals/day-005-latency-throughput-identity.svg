<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Pipeline latency throughput and carried identity</title><desc id="desc">A timing comparison shows stage imbalance and register overhead while interstage boundaries carry instruction identity, control, and valid bits.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><marker id="bad" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6b6b"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:18px}.box{fill:#14344a;stroke:#8fd3ff;stroke-width:2}.state{fill:#27496d;stroke:#f7fbff;stroke-width:3}.arch{fill:#176b72;stroke:#74f0c0;stroke-width:2}.os{fill:#633c70;stroke:#e0b3ff;stroke-width:2}.phys{fill:#754f20;stroke:#ffd166;stroke-width:2}.warn{fill:#642f3c;stroke:#ff8f8f;stroke-width:2}.wire{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#8fd3ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#ff8f8f;stroke-width:3;stroke-dasharray:10 7;fill:none;marker-end:url(#bad)}.grid{stroke:#5d7890;stroke-width:2}.muted{fill:#bcd0df}.ok{fill:#82efb4}.bad{fill:#ff9b9b}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="40" y="52">Pipeline latency throughput and carried identity</text><rect class="state" x="40" y="115" width="330" height="245" rx="12"/><text class="head" x="205.0" y="149" text-anchor="middle">Timing budget</text><text class="body" x="65" y="170" text-anchor="start">single-cycle: 1000 + 60 = 1060 ps</text><text class="body" x="65" y="216" text-anchor="start">pipeline: max stage 250 + 60</text><text class="body" x="65" y="262" text-anchor="start">Tclock = 310 ps</text><text class="body" x="65" y="308" text-anchor="start">one instruction = 5 × 310 = 1550 ps</text><rect class="arch" x="425" y="115" width="330" height="245" rx="12"/><text class="head" x="590.0" y="149" text-anchor="middle">Latency ≠ throughput</text><text class="body" x="450" y="185" text-anchor="start">latency: 1550 ps / instruction</text><text class="body" x="450" y="235" text-anchor="start">steady throughput: 1 / 310 ps</text><text class="body" x="450" y="285" text-anchor="start">imbalance: EX controls clock</text><rect class="warn" x="810" y="115" width="340" height="245" rx="12"/><text class="head" x="980.0" y="149" text-anchor="middle">Boundary overhead</text><text class="body" x="835" y="175" text-anchor="start">clock-to-Q + setup + skew</text><text class="body" x="835" y="225" text-anchor="start">storage + clock energy</text><text class="body" x="835" y="275" text-anchor="start">deeper recovery distance</text><rect class="box" x="190" y="490" width="170" height="125" rx="12"/><text class="head" x="275.0" y="524" text-anchor="middle">IF/ID</text><text class="body" x="275.0" y="554" text-anchor="middle">data + control</text><path class="wire" d="M360 552L435 552"/><rect class="box" x="435" y="490" width="170" height="125" rx="12"/><text class="head" x="520.0" y="524" text-anchor="middle">ID/EX</text><text class="body" x="520.0" y="554" text-anchor="middle">data + control</text><path class="wire" d="M605 552L680 552"/><rect class="box" x="680" y="490" width="170" height="125" rx="12"/><text class="head" x="765.0" y="524" text-anchor="middle">EX/MEM</text><text class="body" x="765.0" y="554" text-anchor="middle">data + control</text><path class="wire" d="M850 552L925 552"/><rect class="box" x="925" y="490" width="170" height="125" rx="12"/><text class="head" x="1010.0" y="524" text-anchor="middle">MEM/WB</text><text class="body" x="1010.0" y="554" text-anchor="middle">data + control</text><text class="body" x="75" y="690" text-anchor="start">• PC + instruction + valid</text><text class="body" x="75" y="720" text-anchor="start">• operands + rd + valid</text><text class="body" x="75" y="750" text-anchor="start">• result + store data + valid</text><text class="body" x="75" y="780" text-anchor="start">• value + rd + valid</text><text class="head" x="740" y="710" text-anchor="middle">valid=0 → bubble</text><text class="body" x="740" y="748" text-anchor="middle">Identity prevents a value from becoming</text><text class="body" x="740" y="778" text-anchor="middle">the wrong instruction's write.</text></svg>
