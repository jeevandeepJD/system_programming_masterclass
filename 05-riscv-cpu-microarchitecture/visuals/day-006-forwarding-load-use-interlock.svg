<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">RAW forwarding and load-use interlock</title><desc id="desc">EX MEM and MEM WB forwarding paths feed an ALU operand mux, while a load-use match freezes PC and IF ID and inserts one bubble.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><marker id="bad" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6b6b"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:18px}.box{fill:#14344a;stroke:#8fd3ff;stroke-width:2}.state{fill:#27496d;stroke:#f7fbff;stroke-width:3}.arch{fill:#176b72;stroke:#74f0c0;stroke-width:2}.os{fill:#633c70;stroke:#e0b3ff;stroke-width:2}.phys{fill:#754f20;stroke:#ffd166;stroke-width:2}.warn{fill:#642f3c;stroke:#ff8f8f;stroke-width:2}.wire{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#8fd3ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#ff8f8f;stroke-width:3;stroke-dasharray:10 7;fill:none;marker-end:url(#bad)}.grid{stroke:#5d7890;stroke-width:2}.muted{fill:#bcd0df}.ok{fill:#82efb4}.bad{fill:#ff9b9b}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="40" y="52">RAW forwarding and load-use interlock</text><text class="body" x="45" y="90" text-anchor="start">ALU RAW: value exists after EX → bypass. Load-use: data exists only after MEM → one bubble.</text><rect class="arch" x="65" y="135" width="250" height="100" rx="12"/><text class="head" x="190.0" y="169" text-anchor="middle">EX/MEM result</text><text class="body" x="190.0" y="199" text-anchor="middle">older ALU value</text><rect class="arch" x="65" y="285" width="250" height="100" rx="12"/><text class="head" x="190.0" y="319" text-anchor="middle">MEM/WB result</text><text class="body" x="190.0" y="349" text-anchor="middle">load or ALU value</text><rect class="warn" x="65" y="435" width="250" height="100" rx="12"/><text class="head" x="190.0" y="469" text-anchor="middle">ID/EX operand</text><text class="body" x="190.0" y="499" text-anchor="middle">stale register read</text><rect class="state" x="470" y="255" width="240" height="155" rx="12"/><text class="head" x="590.0" y="289" text-anchor="middle">forwarding mux</text><text class="body" x="590.0" y="319" text-anchor="middle">newest matching rd wins</text><path class="wire" d="M315 185L470 330"/><path class="wire" d="M315 335L470 330"/><path class="wire" d="M315 485L470 330"/><rect class="arch" x="850" y="255" width="255" height="155" rx="12"/><text class="head" x="977.5" y="289" text-anchor="middle">EX ALU input</text><text class="body" x="977.5" y="319" text-anchor="middle">selected operand</text><path class="wire" d="M710 330L850 330"/><rect class="state" x="75" y="635" width="270" height="110" rx="12"/><text class="head" x="210.0" y="669" text-anchor="middle">load in EX</text><text class="body" x="210.0" y="699" text-anchor="middle">rd=x7, MemRead=1</text><rect class="state" x="450" y="635" width="270" height="110" rx="12"/><text class="head" x="585.0" y="669" text-anchor="middle">consumer in ID</text><text class="body" x="585.0" y="699" text-anchor="middle">reads x7</text><rect class="warn" x="825" y="635" width="280" height="110" rx="12"/><text class="head" x="965.0" y="669" text-anchor="middle">interlock action</text><text class="body" x="965.0" y="699" text-anchor="middle">freeze PC + IF/ID; bubble ID/EX</text><path class="wire" d="M345 690L450 690"/><path class="wire" d="M720 690L825 690"/><text class="head" x="370" y="590" text-anchor="start">stall iff load.rd != x0 and consumer actually reads load.rd</text></svg>
