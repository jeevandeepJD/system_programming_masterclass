<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Branch prediction redirect flush and precise state</title><desc id="desc">A predicted path fetches younger work before EX resolution; a misprediction redirects fetch, invalidates wrong-path work, and preserves precise state, contrasted with a structural port conflict.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><marker id="bad" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6b6b"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:18px}.box{fill:#14344a;stroke:#8fd3ff;stroke-width:2}.state{fill:#27496d;stroke:#f7fbff;stroke-width:3}.arch{fill:#176b72;stroke:#74f0c0;stroke-width:2}.os{fill:#633c70;stroke:#e0b3ff;stroke-width:2}.phys{fill:#754f20;stroke:#ffd166;stroke-width:2}.warn{fill:#642f3c;stroke:#ff8f8f;stroke-width:2}.wire{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#8fd3ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#ff8f8f;stroke-width:3;stroke-dasharray:10 7;fill:none;marker-end:url(#bad)}.grid{stroke:#5d7890;stroke-width:2}.muted{fill:#bcd0df}.ok{fill:#82efb4}.bad{fill:#ff9b9b}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="40" y="52">Branch prediction redirect flush and precise state</text><text class="body" x="40" y="88" text-anchor="start">Control hazard: prediction starts work; resolution either validates it or kills it.</text><rect class="state" x="45" y="130" width="220" height="105" rx="12"/><text class="head" x="155.0" y="164" text-anchor="middle">PREDICT</text><text class="body" x="155.0" y="194" text-anchor="middle">not taken → PC+4</text><path class="wire" d="M265 182L360 182"/><rect class="box" x="360" y="130" width="220" height="105" rx="12"/><text class="head" x="470.0" y="164" text-anchor="middle">FETCH / DECODE</text><text class="body" x="470.0" y="194" text-anchor="middle">younger A and B</text><path class="wire" d="M580 182L675 182"/><rect class="warn" x="675" y="130" width="220" height="105" rx="12"/><text class="head" x="785.0" y="164" text-anchor="middle">RESOLVE in EX</text><text class="body" x="785.0" y="194" text-anchor="middle">actually taken</text><path class="dash" d="M895 182L1080 182"/><text class="head" x="1080" y="155" text-anchor="end">redirect target</text><rect class="warn" x="130" y="330" width="390" height="180" rx="12"/><text class="head" x="325.0" y="364" text-anchor="middle">wrong-path work</text><text class="body" x="165" y="390" text-anchor="start">A in ID: valid ← 0</text><text class="body" x="165" y="435" text-anchor="start">B in IF: valid ← 0</text><rect class="arch" x="670" y="330" width="390" height="180" rx="12"/><text class="head" x="865.0" y="364" text-anchor="middle">precise state</text><text class="body" x="705" y="390" text-anchor="start">older effects remain</text><text class="body" x="705" y="435" text-anchor="start">killed reg/store/trap effects forbidden</text><path class="wire" d="M520 420L670 420"/><rect class="os" x="85" y="620" width="420" height="110" rx="12"/><text class="head" x="295.0" y="654" text-anchor="middle">STRUCTURAL conflict</text><text class="body" x="295.0" y="684" text-anchor="middle">IF and MEM request one physical port</text><rect class="state" x="680" y="620" width="420" height="110" rx="12"/><text class="head" x="890.0" y="654" text-anchor="middle">CONTROL conflict</text><text class="body" x="890.0" y="684" text-anchor="middle">fetched identity came from wrong PC</text><text class="body" x="45" y="790" text-anchor="start">Both lose cycles, but arbitration solves finite resources; redirect and flush solve wrong-path identity.</text></svg>
