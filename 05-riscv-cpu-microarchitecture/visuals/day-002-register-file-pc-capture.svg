<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Register file, x0 enforcement, and PC edge capture</title><desc id="desc">A two-read one-write register file enforces x0 while current PC feeds several next-PC candidates selected and captured at a clock edge.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><marker id="bad" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6b6b"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:18px}.box{fill:#14344a;stroke:#8fd3ff;stroke-width:2}.state{fill:#27496d;stroke:#f7fbff;stroke-width:3}.arch{fill:#176b72;stroke:#74f0c0;stroke-width:2}.os{fill:#633c70;stroke:#e0b3ff;stroke-width:2}.phys{fill:#754f20;stroke:#ffd166;stroke-width:2}.warn{fill:#642f3c;stroke:#ff8f8f;stroke-width:2}.wire{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#8fd3ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#ff8f8f;stroke-width:3;stroke-dasharray:10 7;fill:none;marker-end:url(#bad)}.grid{stroke:#5d7890;stroke-width:2}.muted{fill:#bcd0df}.ok{fill:#82efb4}.bad{fill:#ff9b9b}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="40" y="52">Register file, x0 enforcement, and PC edge capture</text><rect class="state" x="50" y="120" width="310" height="350" rx="12"/><text class="head" x="205.0" y="154" text-anchor="middle">2-read / 1-write register file</text><text class="body" x="85" y="200" text-anchor="start">raddr1 ──▶ rdata1</text><text class="body" x="85" y="245" text-anchor="start">raddr2 ──▶ rdata2</text><text class="body" x="85" y="315" text-anchor="start">waddr + wdata + WE</text><text class="body" x="85" y="355" text-anchor="start">captured at rising edge</text><rect class="warn" x="80" y="390" width="250" height="55" rx="12"/><text class="head" x="205.0" y="424" text-anchor="middle">x0 guard</text><text class="body" x="205.0" y="454" text-anchor="middle">read 0; discard write</text><rect class="state" x="500" y="110" width="180" height="95" rx="12"/><text class="head" x="590.0" y="144" text-anchor="middle">current PC</text><text class="body" x="590.0" y="174" text-anchor="middle">clocked state</text><path class="wire" d="M680 157L790 157"/><rect class="box" x="790" y="95" width="330" height="260" rx="12"/><text class="head" x="955.0" y="129" text-anchor="middle">candidate logic</text><text class="body" x="820" y="145" text-anchor="start">pc + 4</text><text class="body" x="820" y="193" text-anchor="start">pc + branch imm</text><text class="body" x="820" y="241" text-anchor="start">pc + J imm</text><text class="body" x="820" y="289" text-anchor="start">(rs1 + I imm) and ~1</text><rect class="arch" x="730" y="475" width="270" height="115" rx="12"/><text class="head" x="865.0" y="509" text-anchor="middle">next-PC mux</text><text class="body" x="865.0" y="539" text-anchor="middle">selected by control</text><path class="wire" d="M955 355L865 475"/><path class="wire" d="M730 532H590V205H500"/><text class="head" x="610" y="620" text-anchor="start">rising edge capture</text><path class="thin" d="M360 290L730 532"/><text class="body" x="450" y="275" text-anchor="start">rs1 can feed JALR candidate</text><text class="body" x="45" y="785" text-anchor="start">Combinational reads and candidates settle; register-file writes and PC update only at the edge.</text></svg>
