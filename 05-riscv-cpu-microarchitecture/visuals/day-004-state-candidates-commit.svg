<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">One loop iteration from state through candidates to commit</title><desc id="desc">The first sum-loop iteration separates old architectural state, combinational load arithmetic and branch candidates, and five explicit commit edges.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><marker id="bad" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6b6b"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:18px}.box{fill:#14344a;stroke:#8fd3ff;stroke-width:2}.state{fill:#27496d;stroke:#f7fbff;stroke-width:3}.arch{fill:#176b72;stroke:#74f0c0;stroke-width:2}.os{fill:#633c70;stroke:#e0b3ff;stroke-width:2}.phys{fill:#754f20;stroke:#ffd166;stroke-width:2}.warn{fill:#642f3c;stroke:#ff8f8f;stroke-width:2}.wire{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#8fd3ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#ff8f8f;stroke-width:3;stroke-dasharray:10 7;fill:none;marker-end:url(#bad)}.grid{stroke:#5d7890;stroke-width:2}.muted{fill:#bcd0df}.ok{fill:#82efb4}.bad{fill:#ff9b9b}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="40" y="52">One loop iteration from state through candidates to commit</text><rect class="state" x="35" y="110" width="280" height="570" rx="12"/><text class="head" x="175.0" y="144" text-anchor="middle">STATE before edge</text><text class="body" x="65" y="185" text-anchor="start">PC = 0x0c</text><text class="body" x="65" y="237" text-anchor="start">x1 sum = 0</text><text class="body" x="65" y="289" text-anchor="start">x2 ptr = 0x100</text><text class="body" x="65" y="341" text-anchor="start">x3 count = 4</text><text class="body" x="65" y="393" text-anchor="start">mem[0x100] = 7</text><rect class="box" x="410" y="110" width="350" height="570" rx="12"/><text class="head" x="585.0" y="144" text-anchor="middle">COMBINATIONAL candidates</text><text class="body" x="440" y="180" text-anchor="start">LW: addr 0x100, data 7</text><text class="body" x="440" y="240" text-anchor="start">ADD: sum candidate 7</text><text class="body" x="440" y="300" text-anchor="start">ADDI: ptr candidate 0x104</text><text class="body" x="440" y="360" text-anchor="start">ADDI: count candidate 3</text><text class="body" x="440" y="420" text-anchor="start">BNE: 3 != 0</text><text class="body" x="440" y="480" text-anchor="start">target: 0x1c - 16 = 0x0c</text><path class="wire" d="M315 395L410 395"/><rect class="arch" x="855" y="110" width="300" height="570" rx="12"/><text class="head" x="1005.0" y="144" text-anchor="middle">COMMIT boundaries</text><text class="body" x="885" y="180" text-anchor="start">edge 1: x4 ← 7</text><text class="body" x="885" y="250" text-anchor="start">edge 2: x1 ← 7</text><text class="body" x="885" y="320" text-anchor="start">edge 3: x2 ← 0x104</text><text class="body" x="885" y="390" text-anchor="start">edge 4: x3 ← 3</text><text class="body" x="885" y="460" text-anchor="start">edge 5: PC ← 0x0c</text><path class="wire" d="M760 395L855 395"/><text class="body" x="45" y="775" text-anchor="start">Candidates may toggle continuously; only enabled effects become the next architectural state.</text></svg>
