<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Architectural transition and request-port boundary</title><desc id="desc">Architectural state drives a teaching datapath whose instruction and data request ports stop at a boundary before caches or memory arrays.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><marker id="bad" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6b6b"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:18px}.box{fill:#14344a;stroke:#8fd3ff;stroke-width:2}.state{fill:#27496d;stroke:#f7fbff;stroke-width:3}.arch{fill:#176b72;stroke:#74f0c0;stroke-width:2}.os{fill:#633c70;stroke:#e0b3ff;stroke-width:2}.phys{fill:#754f20;stroke:#ffd166;stroke-width:2}.warn{fill:#642f3c;stroke:#ff8f8f;stroke-width:2}.wire{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#8fd3ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#ff8f8f;stroke-width:3;stroke-dasharray:10 7;fill:none;marker-end:url(#bad)}.grid{stroke:#5d7890;stroke-width:2}.muted{fill:#bcd0df}.ok{fill:#82efb4}.bad{fill:#ff9b9b}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="40" y="52">Architectural transition and request-port boundary</text><rect class="arch" x="45" y="110" width="280" height="150" rx="12"/><text class="head" x="185.0" y="144" text-anchor="middle">Architectural state</text><text class="body" x="185.0" y="174" text-anchor="middle">PC, x0..x31, memory</text><rect class="box" x="455" y="110" width="280" height="150" rx="12"/><text class="head" x="595.0" y="144" text-anchor="middle">Teaching datapath</text><text class="body" x="595.0" y="174" text-anchor="middle">decode, ALU, muxes, enables</text><path class="wire" d="M325 185L455 185"/><text class="body" x="390" y="145" text-anchor="middle">must realize</text><rect class="arch" x="865" y="110" width="280" height="150" rx="12"/><text class="head" x="1005.0" y="144" text-anchor="middle">Next transition</text><text class="body" x="1005.0" y="174" text-anchor="middle">new PC / regs / memory</text><path class="wire" d="M735 185L865 185"/><rect class="box" x="70" y="355" width="230" height="115" rx="12"/><text class="head" x="185.0" y="389" text-anchor="middle">instruction request</text><text class="body" x="185.0" y="419" text-anchor="middle">address → word</text><rect class="box" x="70" y="570" width="230" height="115" rx="12"/><text class="head" x="185.0" y="604" text-anchor="middle">data request</text><text class="body" x="185.0" y="634" text-anchor="middle">addr/op/data → response</text><rect class="warn" x="475" y="430" width="250" height="150" rx="12"/><text class="head" x="600.0" y="464" text-anchor="middle">request-port boundary</text><text class="body" x="600.0" y="494" text-anchor="middle">stall / ready / fault</text><path class="wire" d="M300 412L475 470"/><path class="wire" d="M300 627L475 545"/><rect class="box" x="900" y="355" width="220" height="115" rx="12"/><text class="head" x="1010.0" y="389" text-anchor="middle">I-cache / memory</text><text class="body" x="1010.0" y="419" text-anchor="middle">implementation</text><rect class="box" x="900" y="570" width="220" height="115" rx="12"/><text class="head" x="1010.0" y="604" text-anchor="middle">D-cache / memory</text><text class="body" x="1010.0" y="634" text-anchor="middle">implementation</text><path class="wire" d="M725 470L900 412"/><path class="wire" d="M725 545L900 627"/><text class="body" x="45" y="785" text-anchor="start">ISA constrains visible transitions; ports and memory organization remain implementation choices.</text></svg>
