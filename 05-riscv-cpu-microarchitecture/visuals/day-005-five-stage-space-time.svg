<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Five-stage pipeline space-time schedule</title><desc id="desc">Six independent instructions occupy IF ID EX MEM and WB over ten cycles, explicitly marking fill, steady state, drain, and k plus N minus one.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><marker id="bad" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6b6b"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:18px}.box{fill:#14344a;stroke:#8fd3ff;stroke-width:2}.state{fill:#27496d;stroke:#f7fbff;stroke-width:3}.arch{fill:#176b72;stroke:#74f0c0;stroke-width:2}.os{fill:#633c70;stroke:#e0b3ff;stroke-width:2}.phys{fill:#754f20;stroke:#ffd166;stroke-width:2}.warn{fill:#642f3c;stroke:#ff8f8f;stroke-width:2}.wire{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#8fd3ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#ff8f8f;stroke-width:3;stroke-dasharray:10 7;fill:none;marker-end:url(#bad)}.grid{stroke:#5d7890;stroke-width:2}.muted{fill:#bcd0df}.ok{fill:#82efb4}.bad{fill:#ff9b9b}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="40" y="52">Five-stage pipeline space-time schedule</text><text class="body" x="40" y="88" text-anchor="start">Five stages; six independent instructions; first WB at C5, last WB at C10.</text><text class="head" x="250" y="130" text-anchor="middle">C1</text><text class="head" x="336" y="130" text-anchor="middle">C2</text><text class="head" x="422" y="130" text-anchor="middle">C3</text><text class="head" x="508" y="130" text-anchor="middle">C4</text><text class="head" x="594" y="130" text-anchor="middle">C5</text><text class="head" x="680" y="130" text-anchor="middle">C6</text><text class="head" x="766" y="130" text-anchor="middle">C7</text><text class="head" x="852" y="130" text-anchor="middle">C8</text><text class="head" x="938" y="130" text-anchor="middle">C9</text><text class="head" x="1024" y="130" text-anchor="middle">C10</text><text class="head" x="50" y="194" text-anchor="start">I1</text><rect class="box" x="215" y="160" width="70" height="52" rx="6"/><text class="body" x="250" y="194" text-anchor="middle">IF</text><rect class="box" x="301" y="160" width="70" height="52" rx="6"/><text class="body" x="336" y="194" text-anchor="middle">ID</text><rect class="state" x="387" y="160" width="70" height="52" rx="6"/><text class="body" x="422" y="194" text-anchor="middle">EX</text><rect class="box" x="473" y="160" width="70" height="52" rx="6"/><text class="body" x="508" y="194" text-anchor="middle">MEM</text><rect class="arch" x="559" y="160" width="70" height="52" rx="6"/><text class="body" x="594" y="194" text-anchor="middle">WB</text><text class="head" x="50" y="270" text-anchor="start">I2</text><rect class="box" x="301" y="236" width="70" height="52" rx="6"/><text class="body" x="336" y="270" text-anchor="middle">IF</text><rect class="box" x="387" y="236" width="70" height="52" rx="6"/><text class="body" x="422" y="270" text-anchor="middle">ID</text><rect class="state" x="473" y="236" width="70" height="52" rx="6"/><text class="body" x="508" y="270" text-anchor="middle">EX</text><rect class="box" x="559" y="236" width="70" height="52" rx="6"/><text class="body" x="594" y="270" text-anchor="middle">MEM</text><rect class="arch" x="645" y="236" width="70" height="52" rx="6"/><text class="body" x="680" y="270" text-anchor="middle">WB</text><text class="head" x="50" y="346" text-anchor="start">I3</text><rect class="box" x="387" y="312" width="70" height="52" rx="6"/><text class="body" x="422" y="346" text-anchor="middle">IF</text><rect class="box" x="473" y="312" width="70" height="52" rx="6"/><text class="body" x="508" y="346" text-anchor="middle">ID</text><rect class="state" x="559" y="312" width="70" height="52" rx="6"/><text class="body" x="594" y="346" text-anchor="middle">EX</text><rect class="box" x="645" y="312" width="70" height="52" rx="6"/><text class="body" x="680" y="346" text-anchor="middle">MEM</text><rect class="arch" x="731" y="312" width="70" height="52" rx="6"/><text class="body" x="766" y="346" text-anchor="middle">WB</text><text class="head" x="50" y="422" text-anchor="start">I4</text><rect class="box" x="473" y="388" width="70" height="52" rx="6"/><text class="body" x="508" y="422" text-anchor="middle">IF</text><rect class="box" x="559" y="388" width="70" height="52" rx="6"/><text class="body" x="594" y="422" text-anchor="middle">ID</text><rect class="state" x="645" y="388" width="70" height="52" rx="6"/><text class="body" x="680" y="422" text-anchor="middle">EX</text><rect class="box" x="731" y="388" width="70" height="52" rx="6"/><text class="body" x="766" y="422" text-anchor="middle">MEM</text><rect class="arch" x="817" y="388" width="70" height="52" rx="6"/><text class="body" x="852" y="422" text-anchor="middle">WB</text><text class="head" x="50" y="498" text-anchor="start">I5</text><rect class="box" x="559" y="464" width="70" height="52" rx="6"/><text class="body" x="594" y="498" text-anchor="middle">IF</text><rect class="box" x="645" y="464" width="70" height="52" rx="6"/><text class="body" x="680" y="498" text-anchor="middle">ID</text><rect class="state" x="731" y="464" width="70" height="52" rx="6"/><text class="body" x="766" y="498" text-anchor="middle">EX</text><rect class="box" x="817" y="464" width="70" height="52" rx="6"/><text class="body" x="852" y="498" text-anchor="middle">MEM</text><rect class="arch" x="903" y="464" width="70" height="52" rx="6"/><text class="body" x="938" y="498" text-anchor="middle">WB</text><text class="head" x="50" y="574" text-anchor="start">I6</text><rect class="box" x="645" y="540" width="70" height="52" rx="6"/><text class="body" x="680" y="574" text-anchor="middle">IF</text><rect class="box" x="731" y="540" width="70" height="52" rx="6"/><text class="body" x="766" y="574" text-anchor="middle">ID</text><rect class="state" x="817" y="540" width="70" height="52" rx="6"/><text class="body" x="852" y="574" text-anchor="middle">EX</text><rect class="box" x="903" y="540" width="70" height="52" rx="6"/><text class="body" x="938" y="574" text-anchor="middle">MEM</text><rect class="arch" x="989" y="540" width="70" height="52" rx="6"/><text class="body" x="1024" y="574" text-anchor="middle">WB</text><text class="head" x="250" y="650" text-anchor="middle">FILL</text><text class="head" x="550" y="650" text-anchor="middle">STEADY: one WB/cycle</text><text class="head" x="940" y="650" text-anchor="middle">DRAIN</text><path d="M220 685H335M350 685H765M780 685H1030" stroke="#ffd166" stroke-width="5"/><rect class="arch" x="260" y="725" width="670" height="75" rx="12"/><text class="head" x="595.0" y="759" text-anchor="middle">Cycle count</text><text class="body" x="595.0" y="789" text-anchor="middle">k + N - 1 = 5 + 6 - 1 = 10</text></svg>
