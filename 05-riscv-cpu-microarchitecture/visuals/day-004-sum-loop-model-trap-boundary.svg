<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Hand-encoded sum loop and trap boundary</title><desc id="desc">A timeline shows four loop iterations, final store and load-back, then distinguishes a teaching-model host error from a precise architectural trap.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><marker id="bad" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6b6b"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:18px}.box{fill:#14344a;stroke:#8fd3ff;stroke-width:2}.state{fill:#27496d;stroke:#f7fbff;stroke-width:3}.arch{fill:#176b72;stroke:#74f0c0;stroke-width:2}.os{fill:#633c70;stroke:#e0b3ff;stroke-width:2}.phys{fill:#754f20;stroke:#ffd166;stroke-width:2}.warn{fill:#642f3c;stroke:#ff8f8f;stroke-width:2}.wire{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#8fd3ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#ff8f8f;stroke-width:3;stroke-dasharray:10 7;fill:none;marker-end:url(#bad)}.grid{stroke:#5d7890;stroke-width:2}.muted{fill:#bcd0df}.ok{fill:#82efb4}.bad{fill:#ff9b9b}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="40" y="52">Hand-encoded sum loop and trap boundary</text><text class="head" x="40" y="88" text-anchor="start">Hand-encoded sum over [7, -2, 13, 5] → 23</text><rect class="arch" x="50" y="130" width="240" height="115" rx="12"/><text class="head" x="170.0" y="164" text-anchor="middle">setup</text><text class="body" x="170.0" y="194" text-anchor="middle">x1=0, x2=100, x3=4</text><path class="wire" d="M290 187L350 187"/><rect class="arch" x="350" y="130" width="440" height="115" rx="12"/><text class="head" x="570.0" y="164" text-anchor="middle">loop ×4</text><text class="body" x="570.0" y="194" text-anchor="middle">LW → ADD → ptr+4 → count-1 → BNE</text><path class="wire" d="M790 187L840 187"/><rect class="arch" x="840" y="130" width="300" height="115" rx="12"/><text class="head" x="990.0" y="164" text-anchor="middle">exit</text><text class="body" x="990.0" y="194" text-anchor="middle">SW x1→[110] → LW [110]→x5</text><text class="head" x="55" y="362" text-anchor="start">iteration 1</text><rect class="box" x="220" y="330" width="135" height="52" rx="12"/><text class="head" x="287.5" y="364" text-anchor="middle">LW 7</text><path class="wire" d="M355 356L410 356"/><rect class="box" x="410" y="330" width="145" height="52" rx="12"/><text class="head" x="482.5" y="364" text-anchor="middle">sum 7</text><path class="wire" d="M555 356L610 356"/><rect class="box" x="610" y="330" width="180" height="52" rx="12"/><text class="head" x="700.0" y="364" text-anchor="middle">ptr+4 / count-1</text><path class="wire" d="M790 356L845 356"/><rect class="box" x="845" y="330" width="220" height="52" rx="12"/><text class="head" x="955.0" y="364" text-anchor="middle">BNE taken</text><text class="head" x="55" y="432" text-anchor="start">iteration 2</text><rect class="box" x="220" y="400" width="135" height="52" rx="12"/><text class="head" x="287.5" y="434" text-anchor="middle">LW -2</text><path class="wire" d="M355 426L410 426"/><rect class="box" x="410" y="400" width="145" height="52" rx="12"/><text class="head" x="482.5" y="434" text-anchor="middle">sum 5</text><path class="wire" d="M555 426L610 426"/><rect class="box" x="610" y="400" width="180" height="52" rx="12"/><text class="head" x="700.0" y="434" text-anchor="middle">ptr+4 / count-1</text><path class="wire" d="M790 426L845 426"/><rect class="box" x="845" y="400" width="220" height="52" rx="12"/><text class="head" x="955.0" y="434" text-anchor="middle">BNE taken</text><text class="head" x="55" y="502" text-anchor="start">iteration 3</text><rect class="box" x="220" y="470" width="135" height="52" rx="12"/><text class="head" x="287.5" y="504" text-anchor="middle">LW 13</text><path class="wire" d="M355 496L410 496"/><rect class="box" x="410" y="470" width="145" height="52" rx="12"/><text class="head" x="482.5" y="504" text-anchor="middle">sum 18</text><path class="wire" d="M555 496L610 496"/><rect class="box" x="610" y="470" width="180" height="52" rx="12"/><text class="head" x="700.0" y="504" text-anchor="middle">ptr+4 / count-1</text><path class="wire" d="M790 496L845 496"/><rect class="box" x="845" y="470" width="220" height="52" rx="12"/><text class="head" x="955.0" y="504" text-anchor="middle">BNE taken</text><text class="head" x="55" y="572" text-anchor="start">iteration 4</text><rect class="box" x="220" y="540" width="135" height="52" rx="12"/><text class="head" x="287.5" y="574" text-anchor="middle">LW 5</text><path class="wire" d="M355 566L410 566"/><rect class="box" x="410" y="540" width="145" height="52" rx="12"/><text class="head" x="482.5" y="574" text-anchor="middle">sum 23</text><path class="wire" d="M555 566L610 566"/><rect class="box" x="610" y="540" width="180" height="52" rx="12"/><text class="head" x="700.0" y="574" text-anchor="middle">ptr+4 / count-1</text><path class="wire" d="M790 566L845 566"/><rect class="box" x="845" y="540" width="220" height="52" rx="12"/><text class="head" x="955.0" y="574" text-anchor="middle">BNE not taken</text><rect class="warn" x="115" y="650" width="430" height="110" rx="12"/><text class="head" x="330.0" y="684" text-anchor="middle">MODEL ERROR</text><text class="body" x="330.0" y="714" text-anchor="middle">misaligned access → Python stops</text><rect class="os" x="645" y="650" width="430" height="110" rx="12"/><text class="head" x="860.0" y="684" text-anchor="middle">ARCHITECTURAL TRAP</text><text class="body" x="860.0" y="714" text-anchor="middle">cause + fault PC + vector + restart</text><path class="dash" d="M545 705L645 705"/></svg>
