<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Translation cache fill and precise fault path</title><desc id="desc">A virtual address traverses TLB hit or page-table walk, permission checks, physical address formation, cache hit or miss and fill, then either completes a waiting load or reports a precise fault.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><marker id="bad" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6b6b"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:18px}.box{fill:#14344a;stroke:#8fd3ff;stroke-width:2}.state{fill:#27496d;stroke:#f7fbff;stroke-width:3}.arch{fill:#176b72;stroke:#74f0c0;stroke-width:2}.os{fill:#633c70;stroke:#e0b3ff;stroke-width:2}.phys{fill:#754f20;stroke:#ffd166;stroke-width:2}.warn{fill:#642f3c;stroke:#ff8f8f;stroke-width:2}.wire{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#8fd3ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#ff8f8f;stroke-width:3;stroke-dasharray:10 7;fill:none;marker-end:url(#bad)}.grid{stroke:#5d7890;stroke-width:2}.muted{fill:#bcd0df}.ok{fill:#82efb4}.bad{fill:#ff9b9b}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="40" y="52">Translation cache fill and precise fault path</text><rect class="arch" x="30" y="120" width="170" height="110" rx="12"/><text class="head" x="115.0" y="154" text-anchor="middle">virtual address</text><text class="body" x="115.0" y="184" text-anchor="middle">VPN | offset</text><path class="wire" d="M200 175L260 175"/><rect class="state" x="260" y="120" width="165" height="110" rx="12"/><text class="head" x="342.5" y="154" text-anchor="middle">TLB lookup</text><text class="body" x="342.5" y="184" text-anchor="middle">ASID + VPN</text><rect class="arch" x="505" y="90" width="210" height="90" rx="12"/><text class="head" x="610.0" y="124" text-anchor="middle">TLB HIT</text><text class="body" x="610.0" y="154" text-anchor="middle">PPN + perms</text><path class="wire" d="M425 150L505 135"/><rect class="warn" x="505" y="260" width="210" height="110" rx="12"/><text class="head" x="610.0" y="294" text-anchor="middle">TLB MISS</text><text class="body" x="610.0" y="324" text-anchor="middle">page-table walk</text><path class="dash" d="M425 200L505 315"/><rect class="os" x="790" y="235" width="210" height="135" rx="12"/><text class="head" x="895.0" y="269" text-anchor="middle">PTE check</text><text class="body" x="895.0" y="299" text-anchor="middle">valid? permitted?</text><path class="wire" d="M715 315L790 302"/><path class="wire" d="M610 180L790 260"/><rect class="arch" x="790" y="70" width="210" height="100" rx="12"/><text class="head" x="895.0" y="104" text-anchor="middle">physical address</text><text class="body" x="895.0" y="134" text-anchor="middle">PPN | same offset</text><path class="wire" d="M895 235L895 170"/><rect class="state" x="1020" y="70" width="145" height="100" rx="12"/><text class="head" x="1092.5" y="104" text-anchor="middle">cache</text><text class="body" x="1092.5" y="134" text-anchor="middle">tag + set</text><path class="wire" d="M1000 120L1020 120"/><rect class="arch" x="955" y="470" width="205" height="120" rx="12"/><text class="head" x="1057.5" y="504" text-anchor="middle">CACHE HIT</text><text class="body" x="1057.5" y="534" text-anchor="middle">return bytes</text><path class="wire" d="M1092 170L1060 470"/><rect class="warn" x="660" y="470" width="220" height="120" rx="12"/><text class="head" x="770.0" y="504" text-anchor="middle">CACHE MISS</text><text class="body" x="770.0" y="534" text-anchor="middle">lower level → fill</text><path class="dash" d="M1092 170L770 470"/><rect class="arch" x="355" y="665" width="430" height="100" rx="12"/><text class="head" x="570.0" y="699" text-anchor="middle">waiting load completes</text><text class="body" x="570.0" y="729" text-anchor="middle">data → rd only when ready</text><path class="wire" d="M1060 590L785 715"/><path class="wire" d="M770 590L650 665"/><rect class="warn" x="45" y="470" width="420" height="120" rx="12"/><text class="head" x="255.0" y="504" text-anchor="middle">PRECISE FAULT</text><text class="body" x="255.0" y="540" text-anchor="middle">no mapping or denied permission</text><text class="body" x="255.0" y="568" text-anchor="middle">suppress register write or store</text><path class="dash" d="M790 330L465 530"/></svg>
