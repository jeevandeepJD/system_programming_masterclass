<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Complete single-cycle load critical path</title><desc id="desc">A load traverses PC launch, instruction fetch, decode and register read, address generation, data memory, and writeback before setup at the closing edge.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><marker id="bad" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6b6b"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:18px}.box{fill:#14344a;stroke:#8fd3ff;stroke-width:2}.state{fill:#27496d;stroke:#f7fbff;stroke-width:3}.arch{fill:#176b72;stroke:#74f0c0;stroke-width:2}.os{fill:#633c70;stroke:#e0b3ff;stroke-width:2}.phys{fill:#754f20;stroke:#ffd166;stroke-width:2}.warn{fill:#642f3c;stroke:#ff8f8f;stroke-width:2}.wire{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#8fd3ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#ff8f8f;stroke-width:3;stroke-dasharray:10 7;fill:none;marker-end:url(#bad)}.grid{stroke:#5d7890;stroke-width:2}.muted{fill:#bcd0df}.ok{fill:#82efb4}.bad{fill:#ff9b9b}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="40" y="52">Complete single-cycle load critical path</text><text class="body" x="45" y="90" text-anchor="start">One load must settle through every enabled block before the closing edge.</text><rect class="state" x="45" y="180" width="130" height="110" rx="10"/><text class="head" x="110.0" y="215" text-anchor="middle">PC reg</text><text class="body" x="110.0" y="268" text-anchor="middle">clock-to-Q</text><rect class="state" x="210" y="180" width="150" height="110" rx="10"/><text class="head" x="285.0" y="215" text-anchor="middle">I-memory</text><text class="body" x="285.0" y="268" text-anchor="middle">fetch</text><rect class="state" x="395" y="165" width="170" height="110" rx="10"/><text class="head" x="480.0" y="200" text-anchor="middle">decode +</text><text class="head" x="480.0" y="226" text-anchor="middle">reg read</text><text class="body" x="480.0" y="253" text-anchor="middle">fields/operand</text><rect class="state" x="600" y="180" width="165" height="110" rx="10"/><text class="head" x="682.5" y="215" text-anchor="middle">address ALU</text><text class="body" x="682.5" y="268" text-anchor="middle">rs1 + imm</text><rect class="state" x="800" y="180" width="155" height="110" rx="10"/><text class="head" x="877.5" y="215" text-anchor="middle">D-memory</text><text class="body" x="877.5" y="268" text-anchor="middle">load word</text><rect class="state" x="990" y="180" width="145" height="110" rx="10"/><text class="head" x="1062.5" y="215" text-anchor="middle">WB mux</text><text class="body" x="1062.5" y="268" text-anchor="middle">MEM</text><path class="wire" d="M175 235L210 235"/><path class="wire" d="M360 235L395 235"/><path class="wire" d="M565 235L600 235"/><path class="wire" d="M765 235L800 235"/><path class="wire" d="M955 235L990 235"/><rect class="arch" x="210" y="405" width="780" height="115" rx="12"/><text class="head" x="600.0" y="439" text-anchor="middle">Timing condition</text><text class="body" x="600.0" y="469" text-anchor="middle">Tclk ≥ tCQ + tIF + tdecode/read + tALU + tMEM + tmux + tsetup</text><path d="M45 590H1135" stroke="#8fd3ff" stroke-width="4"/><path d="M45 574V606M1135 574V606" stroke="#8fd3ff" stroke-width="4"/><text class="head" x="590" y="640" text-anchor="middle">single global cycle: even ADD waits for the load path budget</text><rect class="warn" x="330" y="700" width="530" height="75" rx="12"/><text class="head" x="595.0" y="734" text-anchor="middle">cache miss in a realistic core</text><text class="body" x="595.0" y="764" text-anchor="middle">ready is late → retain identity and stall; do not capture absent data</text></svg>
