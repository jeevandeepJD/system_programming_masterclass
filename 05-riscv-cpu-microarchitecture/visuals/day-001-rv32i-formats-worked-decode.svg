<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">RV32I field layouts and one worked decode</title><desc id="desc">R, I, S, B, U, and J field layouts plus a worked decode of a negative B-type branch.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><marker id="bad" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6b6b"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:18px}.box{fill:#14344a;stroke:#8fd3ff;stroke-width:2}.state{fill:#27496d;stroke:#f7fbff;stroke-width:3}.arch{fill:#176b72;stroke:#74f0c0;stroke-width:2}.os{fill:#633c70;stroke:#e0b3ff;stroke-width:2}.phys{fill:#754f20;stroke:#ffd166;stroke-width:2}.warn{fill:#642f3c;stroke:#ff8f8f;stroke-width:2}.wire{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#8fd3ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#ff8f8f;stroke-width:3;stroke-dasharray:10 7;fill:none;marker-end:url(#bad)}.grid{stroke:#5d7890;stroke-width:2}.muted{fill:#bcd0df}.ok{fill:#82efb4}.bad{fill:#ff9b9b}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="40" y="52">RV32I field layouts and one worked decode</text><text class="body" x="40" y="91" text-anchor="start">All six formats keep opcode at [6:0]; roles of other bits depend on the format.</text><text class="head" x="45" y="155" text-anchor="start">R</text><rect class="box" x="100" y="125" width="150" height="48"/><text class="small" x="175.0" y="156" text-anchor="middle">funct7</text><rect class="box" x="250" y="125" width="150" height="48"/><text class="small" x="325.0" y="156" text-anchor="middle">rs2</text><rect class="box" x="400" y="125" width="150" height="48"/><text class="small" x="475.0" y="156" text-anchor="middle">rs1</text><rect class="box" x="550" y="125" width="150" height="48"/><text class="small" x="625.0" y="156" text-anchor="middle">f3</text><rect class="box" x="700" y="125" width="150" height="48"/><text class="small" x="775.0" y="156" text-anchor="middle">rd</text><rect class="box" x="850" y="125" width="150" height="48"/><text class="small" x="925.0" y="156" text-anchor="middle">opcode</text><text class="head" x="45" y="229" text-anchor="start">I</text><rect class="box" x="100" y="199" width="180" height="48"/><text class="small" x="190.0" y="230" text-anchor="middle">imm[11:0]</text><rect class="box" x="280" y="199" width="180" height="48"/><text class="small" x="370.0" y="230" text-anchor="middle">rs1</text><rect class="box" x="460" y="199" width="180" height="48"/><text class="small" x="550.0" y="230" text-anchor="middle">f3</text><rect class="box" x="640" y="199" width="180" height="48"/><text class="small" x="730.0" y="230" text-anchor="middle">rd</text><rect class="box" x="820" y="199" width="180" height="48"/><text class="small" x="910.0" y="230" text-anchor="middle">opcode</text><text class="head" x="45" y="303" text-anchor="start">S</text><rect class="box" x="100" y="273" width="150" height="48"/><text class="small" x="175.0" y="304" text-anchor="middle">imm[11:5]</text><rect class="box" x="250" y="273" width="150" height="48"/><text class="small" x="325.0" y="304" text-anchor="middle">rs2</text><rect class="box" x="400" y="273" width="150" height="48"/><text class="small" x="475.0" y="304" text-anchor="middle">rs1</text><rect class="box" x="550" y="273" width="150" height="48"/><text class="small" x="625.0" y="304" text-anchor="middle">f3</text><rect class="box" x="700" y="273" width="150" height="48"/><text class="small" x="775.0" y="304" text-anchor="middle">imm[4:0]</text><rect class="box" x="850" y="273" width="150" height="48"/><text class="small" x="925.0" y="304" text-anchor="middle">opcode</text><text class="head" x="45" y="377" text-anchor="start">B</text><rect class="box" x="100" y="347" width="150" height="48"/><text class="small" x="175.0" y="378" text-anchor="middle">i12/i10:5</text><rect class="box" x="250" y="347" width="150" height="48"/><text class="small" x="325.0" y="378" text-anchor="middle">rs2</text><rect class="box" x="400" y="347" width="150" height="48"/><text class="small" x="475.0" y="378" text-anchor="middle">rs1</text><rect class="box" x="550" y="347" width="150" height="48"/><text class="small" x="625.0" y="378" text-anchor="middle">f3</text><rect class="box" x="700" y="347" width="150" height="48"/><text class="small" x="775.0" y="378" text-anchor="middle">i4:1/i11</text><rect class="box" x="850" y="347" width="150" height="48"/><text class="small" x="925.0" y="378" text-anchor="middle">opcode</text><text class="head" x="45" y="451" text-anchor="start">U</text><rect class="box" x="100" y="421" width="300" height="48"/><text class="small" x="250.0" y="452" text-anchor="middle">imm[31:12]</text><rect class="box" x="400" y="421" width="300" height="48"/><text class="small" x="550.0" y="452" text-anchor="middle">rd</text><rect class="box" x="700" y="421" width="300" height="48"/><text class="small" x="850.0" y="452" text-anchor="middle">opcode</text><text class="head" x="45" y="525" text-anchor="start">J</text><rect class="box" x="100" y="495" width="300" height="48"/><text class="small" x="250.0" y="526" text-anchor="middle">i20/i10:1/i11/i19:12</text><rect class="box" x="400" y="495" width="300" height="48"/><text class="small" x="550.0" y="526" text-anchor="middle">rd</text><rect class="box" x="700" y="495" width="300" height="48"/><text class="small" x="850.0" y="526" text-anchor="middle">opcode</text><rect class="arch" x="95" y="605" width="1000" height="155" rx="12"/><text class="head" x="595.0" y="639" text-anchor="middle">Worked decode: 0xfe0198e3 = bne x3, x0, -16</text><text class="body" x="125" y="675" text-anchor="start">opcode 1100011  funct3 001  rs1=x3  rs2=x0</text><text class="body" x="125" y="710" text-anchor="start">imm = sext({inst31, inst7, inst30:25, inst11:8, 0}) = -16</text><text class="body" x="125" y="745" text-anchor="start">at PC 0x1c: target = 0x1c - 0x10 = 0x0c; no rd write</text></svg>
