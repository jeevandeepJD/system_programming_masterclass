<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">C sum operation from compiler to charge</title><desc id="desc">An end-to-end responsibility trace carries one C sum operation through compiler-selected instructions, ISA effects, datapath, TLB and cache alternatives, OS policy, gates, and transistor charge.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><marker id="bad" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6b6b"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:18px}.box{fill:#14344a;stroke:#8fd3ff;stroke-width:2}.state{fill:#27496d;stroke:#f7fbff;stroke-width:3}.arch{fill:#176b72;stroke:#74f0c0;stroke-width:2}.os{fill:#633c70;stroke:#e0b3ff;stroke-width:2}.phys{fill:#754f20;stroke:#ffd166;stroke-width:2}.warn{fill:#642f3c;stroke:#ff8f8f;stroke-width:2}.wire{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#8fd3ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#ff8f8f;stroke-width:3;stroke-dasharray:10 7;fill:none;marker-end:url(#bad)}.grid{stroke:#5d7890;stroke-width:2}.muted{fill:#bcd0df}.ok{fill:#82efb4}.bad{fill:#ff9b9b}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="40" y="52">C sum operation from compiler to charge</text><text class="body" x="40" y="88" text-anchor="start">One operation: s += a[i] — responsibilities remain distinct even when timing alternatives differ.</text><rect class="arch" x="155" y="115" width="880" height="78" rx="12"/><text class="head" x="595.0" y="149" text-anchor="middle">C / compiler</text><text class="body" x="595.0" y="179" text-anchor="middle">defined int objects → selected lw + add</text><path class="wire" d="M595 193L595 220"/><rect class="arch" x="155" y="220" width="880" height="78" rx="12"/><text class="head" x="595.0" y="254" text-anchor="middle">ISA</text><text class="body" x="595.0" y="284" text-anchor="middle">VA load or fault; add result; PC/register effects</text><path class="wire" d="M595 298L595 325"/><rect class="state" x="155" y="325" width="880" height="78" rx="12"/><text class="head" x="595.0" y="359" text-anchor="middle">microarchitecture</text><text class="body" x="595.0" y="389" text-anchor="middle">decode → ALU address → TLB → cache → forwarding/stall</text><path class="wire" d="M595 403L595 430"/><rect class="os" x="155" y="430" width="880" height="78" rx="12"/><text class="head" x="595.0" y="464" text-anchor="middle">OS policy</text><text class="body" x="595.0" y="494" text-anchor="middle">PTE mapping + R/W permission; trap handler response</text><path class="wire" d="M595 508L595 535"/><rect class="box" x="155" y="535" width="880" height="78" rx="12"/><text class="head" x="595.0" y="569" text-anchor="middle">logic</text><text class="body" x="595.0" y="599" text-anchor="middle">mux → comparator → full adder → state element</text><path class="wire" d="M595 613L595 640"/><rect class="phys" x="155" y="640" width="880" height="78" rx="12"/><text class="head" x="595.0" y="674" text-anchor="middle">physics</text><text class="body" x="595.0" y="704" text-anchor="middle">transistor conduction → node charge → finite delay/energy</text><text class="head" x="45" y="770" text-anchor="start">LOAD alternatives: TLB hit | page walk | cache hit | line fill | precise fault</text><text class="body" x="45" y="805" text-anchor="start">All successful paths converge on the same architectural value; a fault commits no load result.</text></svg>
