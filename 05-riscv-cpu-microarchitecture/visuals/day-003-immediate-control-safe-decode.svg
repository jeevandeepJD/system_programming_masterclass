S: 31:25 + 11:7</text><text class="body" x="420" y="165" text-anchor="start">I  sext(31:20)</text><text class="body" x="420" y="217" text-anchor="start">S  sext(31:25,11:7)</text><text class="body" x="420" y="269" text-anchor="start">B  sext(31,7,30:25,11:8,0)</text><text class="body" x="420" y="321" text-anchor="start">U  inst[31:12] &lt;&lt; 12</text><text class="body" x="420" y="373" text-anchor="start">J  sext(31,19:12,20,30:21,0)</text><path class="wire" d="M300 280L395 280"/><rect class="arch" x="790" y="105" width="355" height="400" rx="12"/><text class="head" x="967.5" y="139" text-anchor="middle">control bundle</text><text class="body" x="820" y="165" text-anchor="start">ALUOp + operand selects</text><text class="body" x="820" y="221" text-anchor="start">ImmKind + WBSel</text><text class="body" x="820" y="277" text-anchor="start">RegWrite / MemRead / MemWrite</text><text class="body" x="820" y="333" text-anchor="start">BranchKind + PCSel</text><text class="body" x="820" y="389" text-anchor="start">Illegal</text><path class="wire" d="M695 280L790 280"/><rect class="warn" x="365" y="590" width="460" height="115" rx="12"/><text class="head" x="595.0" y="624" text-anchor="middle">illegal encoding</text><text class="body" x="595.0" y="654" text-anchor="middle">RegWrite=0   MemRead=0   MemWrite=0</text><path class="dash" d="M967 505L825 647"/><text class="body" x="45" y="785" text-anchor="start">Decode creates candidates; safe enables ensure unsupported words cannot alter architectural state.</text></svg>
