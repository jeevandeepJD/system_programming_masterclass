<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Week 5 responsibility roadmap</title><desc id="desc">A causal roadmap from C and compiler output through RISC-V state, datapath, pipeline, memory translation, OS traps, and physical switching, arranged in ownership lanes.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><marker id="bad" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6b6b"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:18px}.box{fill:#14344a;stroke:#8fd3ff;stroke-width:2}.state{fill:#27496d;stroke:#f7fbff;stroke-width:3}.arch{fill:#176b72;stroke:#74f0c0;stroke-width:2}.os{fill:#633c70;stroke:#e0b3ff;stroke-width:2}.phys{fill:#754f20;stroke:#ffd166;stroke-width:2}.warn{fill:#642f3c;stroke:#ff8f8f;stroke-width:2}.wire{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#8fd3ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#ff8f8f;stroke-width:3;stroke-dasharray:10 7;fill:none;marker-end:url(#bad)}.grid{stroke:#5d7890;stroke-width:2}.muted{fill:#bcd0df}.ok{fill:#82efb4}.bad{fill:#ff9b9b}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="40" y="52">Week 5 responsibility roadmap</text><rect class="arch" x="35" y="95" width="1120" height="125" rx="14"/><text class="head" x="55" y="129" text-anchor="start">ARCHITECTURE</text><text class="body" x="55" y="162" text-anchor="start">instructions, registers, exceptions</text><rect class="box" x="35" y="265" width="1120" height="125" rx="14"/><text class="head" x="55" y="299" text-anchor="start">MICROARCHITECTURE</text><text class="body" x="55" y="332" text-anchor="start">datapath, pipeline, cache and TLB</text><rect class="os" x="35" y="435" width="1120" height="125" rx="14"/><text class="head" x="55" y="469" text-anchor="start">OS POLICY</text><text class="body" x="55" y="502" text-anchor="start">mappings, permissions, trap response</text><rect class="phys" x="35" y="605" width="1120" height="125" rx="14"/><text class="head" x="55" y="639" text-anchor="start">PHYSICAL</text><text class="body" x="55" y="672" text-anchor="start">gates, wires, charge and delay</text><rect class="state" x="160" y="125" width="150" height="72" rx="10"/><text class="body" x="235" y="154" text-anchor="middle">C / compiler</text><rect class="state" x="340" y="125" width="150" height="72" rx="10"/><text class="body" x="415" y="154" text-anchor="middle">RISC-V instructions</text><text class="body" x="415" y="179" text-anchor="middle">+ state</text><rect class="state" x="525" y="295" width="150" height="72" rx="10"/><text class="body" x="600" y="324" text-anchor="middle">datapath</text><text class="body" x="600" y="349" text-anchor="middle">+ control</text><rect class="state" x="710" y="295" width="150" height="72" rx="10"/><text class="body" x="785" y="324" text-anchor="middle">pipeline +</text><text class="body" x="785" y="349" text-anchor="middle">hazards</text><rect class="state" x="895" y="295" width="150" height="72" rx="10"/><text class="body" x="970" y="324" text-anchor="middle">cache / TLB</text><text class="body" x="970" y="349" text-anchor="middle">/ MMU</text><rect class="state" x="710" y="465" width="150" height="72" rx="10"/><text class="body" x="785" y="494" text-anchor="middle">OS trap</text><text class="body" x="785" y="519" text-anchor="middle">+ policy</text><rect class="state" x="895" y="635" width="150" height="72" rx="10"/><text class="body" x="970" y="664" text-anchor="middle">gates / transistor</text><text class="body" x="970" y="689" text-anchor="middle">switching</text><path class="wire" d="M310 161L340 161"/><path class="wire" d="M490 161L525 331"/><path class="wire" d="M675 331L710 331"/><path class="wire" d="M860 331L895 331"/><path class="wire" d="M1045 331L710 501"/><path class="wire" d="M860 501L895 671"/><text class="body" x="45" y="785" text-anchor="start">Ownership changes at lane boundaries; causality continues through every lane.</text></svg>
