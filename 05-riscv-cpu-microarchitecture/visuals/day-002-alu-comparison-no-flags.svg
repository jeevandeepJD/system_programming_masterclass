<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">ALU signed and unsigned comparison without flags</title><desc id="desc">A worked ALU example contrasts modulo addition, signed SLT, unsigned SLTU, and internal comparison wires with no architectural flags register.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><marker id="bad" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6b6b"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:18px}.box{fill:#14344a;stroke:#8fd3ff;stroke-width:2}.state{fill:#27496d;stroke:#f7fbff;stroke-width:3}.arch{fill:#176b72;stroke:#74f0c0;stroke-width:2}.os{fill:#633c70;stroke:#e0b3ff;stroke-width:2}.phys{fill:#754f20;stroke:#ffd166;stroke-width:2}.warn{fill:#642f3c;stroke:#ff8f8f;stroke-width:2}.wire{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#arrow)}.thin{stroke:#8fd3ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#ff8f8f;stroke-width:3;stroke-dasharray:10 7;fill:none;marker-end:url(#bad)}.grid{stroke:#5d7890;stroke-width:2}.muted{fill:#bcd0df}.ok{fill:#82efb4}.bad{fill:#ff9b9b}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="40" y="52">ALU signed and unsigned comparison without flags</text><rect class="box" x="50" y="125" width="205" height="115" rx="12"/><text class="head" x="152.5" y="159" text-anchor="middle">a = ffffffff</text><text class="body" x="152.5" y="189" text-anchor="middle">signed -1</text><rect class="box" x="50" y="285" width="205" height="115" rx="12"/><text class="head" x="152.5" y="319" text-anchor="middle">b = 00000001</text><text class="body" x="152.5" y="349" text-anchor="middle">signed +1</text><rect class="state" x="390" y="110" width="350" height="330" rx="12"/><text class="head" x="565.0" y="144" text-anchor="middle">ALU / comparators</text><path class="wire" d="M255 182L390 182"/><path class="wire" d="M255 342L390 342"/><text class="body" x="425" y="195" text-anchor="start">ADD (mod 2³²)</text><text class="head" x="710" y="195" text-anchor="end">00000000</text><text class="body" x="425" y="260" text-anchor="start">SLT signed</text><text class="head" x="710" y="260" text-anchor="end">00000001</text><text class="body" x="425" y="325" text-anchor="start">SLTU unsigned</text><text class="head" x="710" y="325" text-anchor="end">00000000</text><text class="body" x="425" y="390" text-anchor="start">compare wires</text><text class="head" x="710" y="390" text-anchor="end">internal only</text><rect class="arch" x="875" y="120" width="250" height="105" rx="12"/><text class="head" x="1000.0" y="154" text-anchor="middle">rd result</text><text class="body" x="1000.0" y="184" text-anchor="middle">selected 32-bit value</text><path class="wire" d="M740 182L875 172"/><rect class="warn" x="875" y="305" width="250" height="105" rx="12"/><text class="head" x="1000.0" y="339" text-anchor="middle">No flags register</text><text class="body" x="1000.0" y="369" text-anchor="middle">compare wires are not state</text><path class="dash" d="M740 342L875 357"/><rect class="arch" x="185" y="560" width="820" height="135" rx="12"/><text class="head" x="595.0" y="594" text-anchor="middle">Same bits, selected meaning</text><text class="body" x="595.0" y="624" text-anchor="middle">signed: -1 &lt; 1 is true     unsigned: 4294967295 &lt; 1 is false</text><text class="body" x="45" y="780" text-anchor="start">ADD wraps; SLT and SLTU select interpretation; ordinary arithmetic creates no ISA-visible flags.</text></svg>
