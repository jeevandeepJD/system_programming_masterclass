ext-anchor="middle">groups +</text><text class="head" x="691.625" y="433" text-anchor="middle">sessions</text><text class="body" x="691.625" y="460" text-anchor="middle">PGID · SID</text><text class="body" x="691.625" y="486" text-anchor="middle">terminal foreground</text><rect class="box" x="312.2" y="355" width="238.2" height="180" rx="16" fill="#5969c7"/><text class="head" x="431.375" y="407" text-anchor="middle">/proc · trace</text><text class="head" x="431.375" y="433" text-anchor="middle">debug</text><text class="body" x="431.375" y="460" text-anchor="middle">snapshot · syscall</text><text class="body" x="431.375" y="486" text-anchor="middle">source stop</text><path class="arrow" d="M 290.2 195.0 L 312.2 195.0"/><path class="arrow" d="M 550.5 195.0 L 572.5 195.0"/><path class="arrow" d="M 810.8 195.0 L 832.8 195.0"/><path class="arrow" d="M 951.9 285.0 L 951.9 350.0"/><path class="arrow" d="M 832.8 445.0 L 810.8 445.0"/><path class="arrow" d="M 572.5 445.0 L 550.5 445.0"/><rect x="52" y="726" width="1019" height="45" rx="10" fill="#13283a" stroke="#7594ad" stroke-width="2"/><text class="small" x="561.5" y="755" text-anchor="middle">Follow ownership, identity, and state; each transition changes only some of them.</text>
