<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794" role="img" aria-labelledby="title desc">
<title id="title">Week 10: one task, changing relationships</title>
<desc id="desc">A seven-stage roadmap from process identity and resource ownership through fork, exec, waiting, signals, job control, and evidence tools.</desc>
