<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794" role="img" aria-labelledby="title desc">
<title id="title">Copy-on-write: one frame becomes two on demand</title>
<desc id="desc">A page-table sequence from writable parent page through fork write protection to a parent write fault and private copied frame.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ffd166"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f8fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:18px;fill:#c9d8e6}.box{stroke:#f8fbff;stroke-width:2}.arrow{fill:none;stroke:#ffd166;stroke-width:4;marker-end:url(#arrow)}</style></defs>
<rect width="1123" height="794" fill="#071521"/>
<text class="title" x="52" y="58">Copy-on-write: one frame becomes two on demand</text><rect class="box" x="52.0" y="105" width="325.0" height="180" rx="16" fill="#4cc9f0"/><text class="head" x="214.5" y="157" text-anchor="middle">before fork</text><text class="body" x="214.5" y="210" text-anchor="middle">PTE P: V → frame A</text><text class="body" x="214.5" y="236" text-anchor="middle">writable</text><rect class="box" x="399.0" y="105" width="325.0" height="180" rx="16" fill="#52b788"/><text class="head" x="561.5" y="157" text-anchor="middle">duplicate tables</text><text class="body" x="561.5" y="210" text-anchor="middle">new pgd C</text><text class="body" x="561.5" y="236" text-anchor="middle">same virtual V</text><rect class="box" x="746.0" y="105" width="325.0" height="180" rx="16" fill="#f4a261"/><text class="head" x="908.5" y="157" text-anchor="middle">write-protect</text><text class="body" x="908.5" y="210" text-anchor="middle">PTE P + C</text><text class="body" x="908.5" y="236" text-anchor="middle">V → A, read-only</text><rect class="box" x="746.0" y="355" width="325.0" height="180" rx="16" fill="#9b8afb"/><text class="head" x="908.5" y="407" text-anchor="middle">parent store</text><text class="body" x="908.5" y="460" text-anchor="middle">permission fault</text><text class="body" x="908.5" y="486" text-anchor="middle">do_wp_page</text><rect class="box" x="399.0" y="355" width="325.0" height="180" rx="16" fill="#ff6b6b"/><text class="head" x="561.5" y="407" text-anchor="middle">copy frame</text><text class="body" x="561.5" y="460" text-anchor="middle">A → new frame B</text><text class="body" x="561.5" y="486" text-anchor="middle">PTE P → B writable</text><rect class="box" x="52.0" y="355" width="325.0" height="180" rx="16" fill="#2878a8"/><text class="head" x="214.5" y="407" text-anchor="middle">child remains</text><text class="body" x="214.5" y="460" text-anchor="middle">PTE C → A</text><text class="body" x="214.5" y="486" text-anchor="middle">unchanged bytes</text><path class="arrow" d="M 377.0 195.0 L 399.0 195.0"/><path class="arrow" d="M 724.0 195.0 L 746.0 195.0"/><path class="arrow" d="M 908.5 285.0 L 908.5 350.0"/><path class="arrow" d="M 746.0 445.0 L 724.0 445.0"/><path class="arrow" d="M 399.0 445.0 L 377.0 445.0"/><rect x="52" y="726" width="1019" height="45" rx="10" fill="#13283a" stroke="#7594ad" stroke-width="2"/><text class="small" x="561.5" y="755" text-anchor="middle">The faulting mm receives the copy; the other page table is not rewritten.</text>
</svg>
