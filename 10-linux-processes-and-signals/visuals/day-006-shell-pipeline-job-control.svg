<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794" role="img" aria-labelledby="title desc">
<title id="title">A foreground pipeline is built before it is run</title>
<desc id="desc">A shell pipeline workflow creating a pipe, forking two children into one process group, arranging descriptors, execing, foregrounding, signaling, and waiting.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ffd166"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f8fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:18px;fill:#c9d8e6}.box{stroke:#f8fbff;stroke-width:2}.arrow{fill:none;stroke:#ffd166;stroke-width:4;marker-end:url(#arrow)}</style></defs>
<rect width="1123" height="794" fill="#071521"/>
<text class="title" x="52" y="58">A foreground pipeline is built before it is run</text><rect class="box" x="52.0" y="105" width="238.2" height="180" rx="16" fill="#4cc9f0"/><text class="head" x="171.125" y="157" text-anchor="middle">shell</text><text class="body" x="171.125" y="210" text-anchor="middle">pipe()</text><text class="body" x="171.125" y="236" text-anchor="middle">choose PGID J</text><rect class="box" x="312.2" y="105" width="238.2" height="180" rx="16" fill="#52b788"/><text class="head" x="431.375" y="157" text-anchor="middle">fork members</text><text class="body" x="431.375" y="210" text-anchor="middle">child A + B</text><text class="body" x="431.375" y="236" text-anchor="middle">inherit SID</text><rect class="box" x="572.5" y="105" width="238.2" height="180" rx="16" fill="#f4a261"/><text class="head" x="691.625" y="157" text-anchor="middle">setpgid</text><text class="body" x="691.625" y="210" text-anchor="middle">both join J</text><text class="body" x="691.625" y="236" text-anchor="middle">parent + child race</text><rect class="box" x="832.8" y="105" width="238.2" height="180" rx="16" fill="#9b8afb"/><text class="head" x="951.875" y="157" text-anchor="middle">wire + exec</text><text class="body" x="951.875" y="210" text-anchor="middle">dup2 / close</text><text class="body" x="951.875" y="236" text-anchor="middle">new ELF images</text><rect class="box" x="832.8" y="355" width="238.2" height="180" rx="16" fill="#ff6b6b"/><text class="head" x="951.875" y="407" text-anchor="middle">terminal fg</text><text class="body" x="951.875" y="460" text-anchor="middle">tcsetpgrp → J</text><text class="body" x="951.875" y="486" text-anchor="middle">Ctrl-C → group</text><rect class="box" x="572.5" y="355" width="238.2" height="180" rx="16" fill="#2878a8"/><text class="head" x="691.625" y="407" text-anchor="middle">wait group</text><text class="body" x="691.625" y="460" text-anchor="middle">waitpid(-J)</text><text class="body" x="691.625" y="486" text-anchor="middle">collect each status</text><rect class="box" x="312.2" y="355" width="238.2" height="180" rx="16" fill="#5969c7"/><text class="head" x="431.375" y="407" text-anchor="middle">restore shell</text><text class="body" x="431.375" y="460" text-anchor="middle">tcsetpgrp → shell</text><text class="body" x="431.375" y="486" text-anchor="middle">prompt resumes</text><path class="arrow" d="M 290.2 195.0 L 312.2 195.0"/><path class="arrow" d="M 550.5 195.0 L 572.5 195.0"/><path class="arrow" d="M 810.8 195.0 L 832.8 195.0"/><path class="arrow" d="M 951.9 285.0 L 951.9 350.0"/><path class="arrow" d="M 832.8 445.0 L 810.8 445.0"/><path class="arrow" d="M 572.5 445.0 L 550.5 445.0"/><rect x="52" y="726" width="1019" height="45" rx="10" fill="#13283a" stroke="#7594ad" stroke-width="2"/><text class="small" x="561.5" y="755" text-anchor="middle">The terminal signals a foreground group; the shell later reclaims foreground ownership.</text>
</svg>
