<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794" role="img" aria-labelledby="title desc">
<title id="title">Three evidence layers answer different questions</title>
<desc id="desc">A comparison of procfs snapshots, strace syscall stops, and GDB symbolic source stops, including what each can and cannot establish.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ffd166"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f8fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:18px;fill:#c9d8e6}.box{stroke:#f8fbff;stroke-width:2}.arrow{fill:none;stroke:#ffd166;stroke-width:4;marker-end:url(#arrow)}</style></defs>
<rect width="1123" height="794" fill="#071521"/>
<text class="title" x="52" y="58">Three evidence layers answer different questions</text><rect class="box" x="52.0" y="120" width="325.0" height="565" rx="16" fill="#10283a"/><rect x="52.0" y="120" width="325.0" height="78" rx="16" fill="#4cc9f0"/><text class="head" x="214.5" y="168" text-anchor="middle">/proc snapshot</text><circle cx="82.0" cy="239" r="7" fill="#ffd166"/><text class="body" x="100.0" y="245" text-anchor="start">generated at read time</text><circle cx="82.0" cy="321" r="7" fill="#ffd166"/><text class="body" x="100.0" y="327" text-anchor="start">identity + stored state</text><circle cx="82.0" cy="403" r="7" fill="#ffd166"/><text class="body" x="100.0" y="409" text-anchor="start">no reliable live PC</text><rect class="box" x="399.0" y="120" width="325.0" height="565" rx="16" fill="#10283a"/><rect x="399.0" y="120" width="325.0" height="78" rx="16" fill="#52b788"/><text class="head" x="561.5" y="168" text-anchor="middle">strace syscall</text><circle cx="429.0" cy="239" r="7" fill="#ffd166"/><text class="body" x="447.0" y="245" text-anchor="start">ptrace entry / exit stop</text><circle cx="429.0" cy="321" r="7" fill="#ffd166"/><text class="body" x="447.0" y="327" text-anchor="start">ABI args + return</text><circle cx="429.0" cy="403" r="7" fill="#ffd166"/><text class="body" x="447.0" y="409" text-anchor="start">perturbs scheduling</text><rect class="box" x="746.0" y="120" width="325.0" height="565" rx="16" fill="#10283a"/><rect x="746.0" y="120" width="325.0" height="78" rx="16" fill="#f4a261"/><text class="head" x="908.5" y="168" text-anchor="middle">GDB source stop</text><circle cx="776.0" cy="239" r="7" fill="#ffd166"/><text class="body" x="794.0" y="245" text-anchor="start">ptrace + ELF / DWARF</text><circle cx="776.0" cy="321" r="7" fill="#ffd166"/><text class="body" x="794.0" y="327" text-anchor="start">registers + variables</text><circle cx="776.0" cy="403" r="7" fill="#ffd166"/><text class="body" x="794.0" y="409" text-anchor="start">main follows startup</text><rect x="52" y="710" width="1019" height="61" rx="10" fill="#13283a" stroke="#7594ad" stroke-width="2"/><text class="small" x="561.5" y="747" text-anchor="middle">Match the tool to the claim: state snapshot, syscall boundary, or symbolic execution stop.</text>
</svg>
