<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794" role="img" aria-labelledby="title desc">
<title id="title">Task, process, thread: ownership is layered</title>
<desc id="desc">A comparison of per-task execution state, process-shared resources, address-space ownership, and external file or kernel resources.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ffd166"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f8fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:18px;fill:#c9d8e6}.box{stroke:#f8fbff;stroke-width:2}.arrow{fill:none;stroke:#ffd166;stroke-width:4;marker-end:url(#arrow)}</style></defs>
<rect width="1123" height="794" fill="#071521"/>
<text class="title" x="52" y="58">Task, process, thread: ownership is layered</text><rect class="box" x="52.0" y="120" width="238.2" height="565" rx="16" fill="#10283a"/><rect x="52.0" y="120" width="238.2" height="78" rx="16" fill="#4cc9f0"/><text class="head" x="171.125" y="168" text-anchor="middle">task / thread</text><circle cx="82.0" cy="239" r="7" fill="#ffd166"/><text class="body" x="100.0" y="245" text-anchor="start">TID + saved registers</text><circle cx="82.0" cy="321" r="7" fill="#ffd166"/><text class="body" x="100.0" y="327" text-anchor="start">kernel stack + mask</text><circle cx="82.0" cy="403" r="7" fill="#ffd166"/><text class="body" x="100.0" y="409" text-anchor="start">scheduler state</text><rect class="box" x="312.2" y="120" width="238.2" height="565" rx="16" fill="#10283a"/><rect x="312.2" y="120" width="238.2" height="78" rx="16" fill="#52b788"/><text class="head" x="431.375" y="168" text-anchor="middle">process view</text><circle cx="342.2" cy="239" r="7" fill="#ffd166"/><text class="body" x="360.25" y="245" text-anchor="start">TGID / PID identity</text><circle cx="342.2" cy="321" r="7" fill="#ffd166"/><text class="body" x="360.25" y="327" text-anchor="start">mm + files + fs</text><circle cx="342.2" cy="403" r="7" fill="#ffd166"/><text class="body" x="360.25" y="409" text-anchor="start">credentials + sighand</text><rect class="box" x="572.5" y="120" width="238.2" height="565" rx="16" fill="#10283a"/><rect x="572.5" y="120" width="238.2" height="78" rx="16" fill="#f4a261"/><text class="head" x="691.625" y="168" text-anchor="middle">address space</text><circle cx="602.5" cy="239" r="7" fill="#ffd166"/><text class="body" x="620.5" y="245" text-anchor="start">VMA map + pgd root</text><circle cx="602.5" cy="321" r="7" fill="#ffd166"/><text class="body" x="620.5" y="327" text-anchor="start">stack · heap · ELF</text><circle cx="602.5" cy="403" r="7" fill="#ffd166"/><text class="body" x="620.5" y="409" text-anchor="start">private virtual addresses</text><rect class="box" x="832.8" y="120" width="238.2" height="565" rx="16" fill="#10283a"/><rect x="832.8" y="120" width="238.2" height="78" rx="16" fill="#9b8afb"/><text class="head" x="951.875" y="168" text-anchor="middle">resources</text><circle cx="862.8" cy="239" r="7" fill="#ffd166"/><text class="body" x="880.75" y="245" text-anchor="start">fd indexes → files</text><circle cx="862.8" cy="321" r="7" fill="#ffd166"/><text class="body" x="880.75" y="327" text-anchor="start">inode · pipe · socket</text><circle cx="862.8" cy="403" r="7" fill="#ffd166"/><text class="body" x="880.75" y="409" text-anchor="start">reference-counted lifetime</text><rect x="52" y="710" width="1019" height="61" rx="10" fill="#13283a" stroke="#7594ad" stroke-width="2"/><text class="small" x="561.5" y="747" text-anchor="middle">A process is not one allocation: task_struct points to objects with different sharing rules.</text>
</svg>
