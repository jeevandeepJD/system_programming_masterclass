<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794" role="img" aria-labelledby="title desc">
<title id="title">Exit status outlives the child image</title>
<desc id="desc">A parent-child sequence where child exit stores a status, drops resources, becomes zombie, and parent wait copies and reaps it.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ffd166"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f8fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:18px;fill:#c9d8e6}.box{stroke:#f8fbff;stroke-width:2}.arrow{fill:none;stroke:#ffd166;stroke-width:4;marker-end:url(#arrow)}</style></defs>
<rect width="1123" height="794" fill="#071521"/>
<text class="title" x="52" y="58">Exit status outlives the child image</text><rect class="box" x="52.0" y="105" width="325.0" height="180" rx="16" fill="#4cc9f0"/><text class="head" x="214.5" y="157" text-anchor="middle">child runs</text><text class="body" x="214.5" y="210" text-anchor="middle">PID C</text><text class="body" x="214.5" y="236" text-anchor="middle">user mm exists</text><rect class="box" x="399.0" y="105" width="325.0" height="180" rx="16" fill="#52b788"/><text class="head" x="561.5" y="157" text-anchor="middle">_exit(23)</text><text class="body" x="561.5" y="210" text-anchor="middle">exit_code = 23 ≪ 8</text><text class="body" x="561.5" y="236" text-anchor="middle">no return</text><rect class="box" x="746.0" y="105" width="325.0" height="180" rx="16" fill="#f4a261"/><text class="head" x="908.5" y="157" text-anchor="middle">teardown</text><text class="body" x="908.5" y="210" text-anchor="middle">exit_mm + files</text><text class="body" x="908.5" y="236" text-anchor="middle">user image gone</text><rect class="box" x="746.0" y="355" width="325.0" height="180" rx="16" fill="#9b8afb"/><text class="head" x="908.5" y="407" text-anchor="middle">EXIT_ZOMBIE</text><text class="body" x="908.5" y="460" text-anchor="middle">PID + exit word</text><text class="body" x="908.5" y="486" text-anchor="middle">SIGCHLD parent</text><rect class="box" x="399.0" y="355" width="325.0" height="180" rx="16" fill="#ff6b6b"/><text class="head" x="561.5" y="407" text-anchor="middle">waitpid(C)</text><text class="body" x="561.5" y="460" text-anchor="middle">copy status</text><text class="body" x="561.5" y="486" text-anchor="middle">ZOMBIE → DEAD</text><rect class="box" x="52.0" y="355" width="325.0" height="180" rx="16" fill="#2878a8"/><text class="head" x="214.5" y="407" text-anchor="middle">release</text><text class="body" x="214.5" y="460" text-anchor="middle">task freed</text><text class="body" x="214.5" y="486" text-anchor="middle">PID reusable</text><path class="arrow" d="M 377.0 195.0 L 399.0 195.0"/><path class="arrow" d="M 724.0 195.0 L 746.0 195.0"/><path class="arrow" d="M 908.5 285.0 L 908.5 350.0"/><path class="arrow" d="M 746.0 445.0 L 724.0 445.0"/><path class="arrow" d="M 399.0 445.0 L 377.0 445.0"/><rect x="52" y="726" width="1019" height="45" rx="10" fill="#13283a" stroke="#7594ad" stroke-width="2"/><text class="small" x="561.5" y="755" text-anchor="middle">The zombie is retained kernel bookkeeping, not a process still executing user code.</text>
</svg>
