<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794" role="img" aria-labelledby="title desc">
<title id="title">Debugging workflow: predict, capture, correlate, narrow</title>
<desc id="desc">An evidence-driven debugging workflow that records versions and binary hashes, predicts a boundary, gathers proc, strace, and GDB evidence, and narrows the next hypothesis.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ffd166"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f8fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:18px;fill:#c9d8e6}.box{stroke:#f8fbff;stroke-width:2}.arrow{fill:none;stroke:#ffd166;stroke-width:4;marker-end:url(#arrow)}</style></defs>
<rect width="1123" height="794" fill="#071521"/>
<text class="title" x="52" y="58">Debugging workflow: predict, capture, correlate, narrow</text><rect class="box" x="52.0" y="105" width="238.2" height="180" rx="16" fill="#4cc9f0"/><text class="head" x="171.125" y="157" text-anchor="middle">identify</text><text class="body" x="171.125" y="210" text-anchor="middle">uname + arch</text><text class="body" x="171.125" y="236" text-anchor="middle">binary hash</text><rect class="box" x="312.2" y="105" width="238.2" height="180" rx="16" fill="#52b788"/><text class="head" x="431.375" y="157" text-anchor="middle">predict</text><text class="body" x="431.375" y="210" text-anchor="middle">state or boundary</text><text class="body" x="431.375" y="236" text-anchor="middle">expected invariant</text><rect class="box" x="572.5" y="105" width="238.2" height="180" rx="16" fill="#f4a261"/><text class="head" x="691.625" y="157" text-anchor="middle">snapshot</text><text class="body" x="691.625" y="210" text-anchor="middle">/proc status</text><text class="body" x="691.625" y="236" text-anchor="middle">identity + state</text><rect class="box" x="832.8" y="105" width="238.2" height="180" rx="16" fill="#9b8afb"/><text class="head" x="951.875" y="157" text-anchor="middle">trace</text><text class="body" x="951.875" y="210" text-anchor="middle">strace syscall</text><text class="body" x="951.875" y="236" text-anchor="middle">entry / exit result</text><rect class="box" x="832.8" y="355" width="238.2" height="180" rx="16" fill="#ff6b6b"/><text class="head" x="951.875" y="407" text-anchor="middle">stop</text><text class="body" x="951.875" y="460" text-anchor="middle">GDB breakpoint</text><text class="body" x="951.875" y="486" text-anchor="middle">source + registers</text><rect class="box" x="572.5" y="355" width="238.2" height="180" rx="16" fill="#2878a8"/><text class="head" x="691.625" y="407" text-anchor="middle">correlate</text><text class="body" x="691.625" y="460" text-anchor="middle">PID · time · image</text><text class="body" x="691.625" y="486" text-anchor="middle">same execution</text><rect class="box" x="312.2" y="355" width="238.2" height="180" rx="16" fill="#5969c7"/><text class="head" x="431.375" y="407" text-anchor="middle">narrow</text><text class="body" x="431.375" y="460" text-anchor="middle">first contradiction</text><text class="body" x="431.375" y="486" text-anchor="middle">next experiment</text><path class="arrow" d="M 290.2 195.0 L 312.2 195.0"/><path class="arrow" d="M 550.5 195.0 L 572.5 195.0"/><path class="arrow" d="M 810.8 195.0 L 832.8 195.0"/><path class="arrow" d="M 951.9 285.0 L 951.9 350.0"/><path class="arrow" d="M 832.8 445.0 L 810.8 445.0"/><path class="arrow" d="M 572.5 445.0 L 550.5 445.0"/><rect x="52" y="726" width="1019" height="45" rx="10" fill="#13283a" stroke="#7594ad" stroke-width="2"/><text class="small" x="561.5" y="755" text-anchor="middle">A transcript becomes evidence only when kernel, binary, task, and question are identified.</text>
</svg>
