<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 10 Day 1 Theory Check</title><style>body{margin:0;background:#08131e;color:#edf5fb;font:16px/1.5 system-ui}main{max-width:850px;margin:auto;padding:28px 18px}header,.q,#result{background:#112437;border:1px solid #31506c;border-radius:12px;padding:20px;margin:14px 0}h1{margin:.2em 0}.opt{display:block;background:#172e44;border:1px solid #31506c;border-radius:8px;padding:9px;margin:7px 0}.ok{border-color:#55dc9a}.bad{border-color:#ff7188}.fb{color:#b9ccdc;margin-top:8px}button{padding:10px 16px;background:#195070;color:white;border:1px solid #64ccff;border-radius:8px;margin-right:8px}#result{display:none}</style></head><body><main><header><small>WEEK 10 · DAY 1 · THEORY CHECK</small><h1>Process Mental Model</h1><p>Answer all four, then inspect causal explanations.</p></header><form id="quiz"></form><button type="button" id="submit">Submit</button><button type="button" id="reset">Reset</button><section id="result"></section></main><script>const Q=[{"prompt": "What best distinguishes a process from a program?", "options": ["A process is a live kernel-managed execution context; a program is passive executable input", "A process is only an ELF file in RAM", "A program always has a PID", "They are exact synonyms"], "answer": 0, "explanation": "Exec can replace an image while preserving PID, and one executable can back many processes."}, {"prompt": "Where does a current regular-file offset normally live?", "options": ["In the descriptor integer", "In the open-file description", "In the ELF header", "In the PID namespace"], "answer": 1, "explanation": "Descriptor entries reference an open-file description, which owns offset and file status flags."}, {"prompt": "Why is a bare PID weak long-term identity?", "options": ["It is encrypted", "It can be reused and is namespace-relative", "It changes on every syscall", "It names only files"], "answer": 1, "explanation": "PID numbers are scoped by PID namespaces and can be reused after release."}, {"prompt": "Which is architecture-specific in today\u2019s model?", "options": ["Credential policy", "Descriptor lifetime", "Syscall entry instruction/register ABI", "Parent-child meaning"], "answer": 2, "explanation": "Entry differs across ISAs; generic process policy should not be attributed to that instruction."}];const F=document.querySelector('#quiz');function build(){F.innerHTML='';Q.forEach((q,i)=>{let s=document.createElement('section');s.className='q';s.innerHTML=`<strong>${i+1}. ${q.prompt}</strong>`;q.options.forEach((o,j)=>s.innerHTML+=`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${o}</label>`);s.innerHTML+='<div class="fb"></div>';F.append(s)})}document.querySelector('#submit').onclick=()=>{let n=0;[...F.children].forEach((s,i)=>{let x=s.querySelector('input:checked');s.querySelectorAll('.opt').forEach((e,j)=>{e.classList.toggle('ok',j===Q[i].answer);e.classList.toggle('bad',!!x&&+x.value===j&&j!==Q[i].answer)});s.querySelector('.fb').textContent=x?Q[i].explanation:'Unanswered: choose an option before review.';if(x&&+x.value===Q[i].answer)n++});let r=document.querySelector('#result');r.style.display='block';r.textContent=`Score: ${n} / ${Q.length}`;};document.querySelector('#reset').onclick=()=>{build();document.querySelector('#result').style.display='none'};build();</script></body></html>
