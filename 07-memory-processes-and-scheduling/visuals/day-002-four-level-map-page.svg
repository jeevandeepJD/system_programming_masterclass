<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Four-level virtual translation and map_page</title><desc id="desc">A canonical virtual address is split into four nine-bit indices and an offset; map_page walks or allocates page-table frames, installs one leaf mapping, and invalidates the virtual address in the TLB.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.box{fill:#173b57;stroke:#8fd3ff;stroke-width:3}.new{fill:#573b69;stroke:#e1b8ff;stroke-width:3}.leaf{fill:#145f54;stroke:#80efca;stroke-width:3}.line{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="t" x="40" y="55">map_page: walk, allocate missing tables, install, invalidate</text>
<g text-anchor="middle"><rect class="box" x="55" y="110" width="205" height="70"/><text class="h" x="158" y="153">PML4 [47:39]</text><rect class="box" x="275" y="110" width="205" height="70"/><text class="h" x="378" y="153">PDPT [38:30]</text><rect class="box" x="495" y="110" width="205" height="70"/><text class="h" x="598" y="153">PD [29:21]</text><rect class="box" x="715" y="110" width="205" height="70"/><text class="h" x="818" y="153">PT [20:12]</text><rect class="new" x="935" y="110" width="200" height="70"/><text class="h" x="1035" y="153">offset [11:0]</text></g>
<text class="b" x="55" y="225">CR3 / bootstrap_pml4</text><path class="line" d="M160 245V305"/>
<g text-anchor="middle"><rect class="box" x="55" y="305" width="190" height="105" rx="12"/><text class="h" x="150" y="343">PML4 entry</text><text class="b" x="150" y="378">next_table</text><rect class="box" x="315" y="305" width="190" height="105" rx="12"/><text class="h" x="410" y="343">PDPT entry</text><text class="b" x="410" y="378">next_table</text><rect class="box" x="575" y="305" width="190" height="105" rx="12"/><text class="h" x="670" y="343">PD entry</text><text class="b" x="670" y="378">next_table</text><rect class="leaf" x="835" y="305" width="300" height="105" rx="12"/><text class="h" x="985" y="343">leaf PTE</text><text class="b" x="985" y="378">physical frame + flags + P</text></g>
<path class="line" d="M245 357H315"/><path class="line" d="M505 357H575"/><path class="line" d="M765 357H835"/>
<rect class="new" x="135" y="525" width="390" height="120" rx="14"/><text class="h" x="330" y="565" text-anchor="middle">Absent intermediate entry</text><text class="b" x="330" y="600" text-anchor="middle">frame_alloc creates zeroed table frame</text><text class="b" x="330" y="630" text-anchor="middle">ownership transfers to page tables</text>
<rect class="leaf" x="665" y="525" width="390" height="120" rx="14"/><text class="h" x="860" y="565" text-anchor="middle">After PTE write</text><text class="b" x="860" y="600" text-anchor="middle">invlpg virtual_address</text><text class="b" x="860" y="630" text-anchor="middle">cached translation cannot stay stale</text><path class="line" d="M525 585H665"/>
<text class="b" x="595" y="750" text-anchor="middle">Huge entry? Stop: this teaching mapper does not split 2 MiB pages.</text>
</svg>
