<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Interrupt-context safety boundary</title><desc id="desc">The interrupted task stack contains hardware, assembly, and C frames while interrupts are disabled; safe timer actions are contrasted with blocking, allocation, contended locks, recursive logging, and unsafe scheduler-state windows.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.stack{fill:#173b57;stroke:#8fd3ff;stroke-width:3}.ok{fill:#145f54;stroke:#80efca;stroke-width:3}.bad{fill:#65313d;stroke:#ff9999;stroke-width:3}.boundary{stroke:#ffd166;stroke-width:5;stroke-dasharray:14 10}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="t" x="40" y="55">Interrupt context is a contract boundary, not ordinary task context</text>
<rect class="stack" x="60" y="120" width="430" height="610" rx="16"/><text class="h" x="275" y="160" text-anchor="middle">Interrupted task's owned stack</text>
<rect class="stack" x="110" y="205" width="330" height="100"/><text class="b" x="275" y="245" text-anchor="middle">hardware frame</text><text class="b" x="275" y="275" text-anchor="middle">RIP " CS " RFLAGS</text><rect class="stack" x="110" y="325" width="330" height="100"/><text class="b" x="275" y="365" text-anchor="middle">isr_common saves GPRs</text><text class="b" x="275" y="395" text-anchor="middle">interrupt_frame</text><rect class="stack" x="110" y="445" width="330" height="100"/><text class="b" x="275" y="485" text-anchor="middle">C handler frames</text><text class="b" x="275" y="515" text-anchor="middle">scheduler may switch away</text><text class="b" x="275" y="625" text-anchor="middle">stack must remain intact</text><text class="b" x="275" y="660" text-anchor="middle">until eventual iretq</text>
<line class="boundary" x1="550" y1="105" x2="550" y2="760"/><text class="h" x="570" y="135">Safety classification</text>
<rect class="ok" x="620" y="175" width="500" height="200" rx="14"/><text class="h" x="870" y="215" text-anchor="middle">Narrow demonstrated path</text><text class="b" x="665" y="255">" increment ticks</text><text class="b" x="665" y="290">" send PIC EOI before scheduling</text><text class="b" x="665" y="325">" preserve the interrupted stack owner</text><text class="b" x="665" y="355">" return later through the same frames</text>
<rect class="bad" x="620" y="435" width="500" height="270" rx="14"/><text class="h" x="870" y="475" text-anchor="middle">Needs an explicit design before use</text><text class="b" x="665" y="515">" block or sleep</text><text class="b" x="665" y="550">" allocate through an unsafe allocator</text><text class="b" x="665" y="585">" acquire a contended or IRQ-recursive lock</text><text class="b" x="665" y="620">" call logging that reenters interrupt services</text><text class="b" x="665" y="655">" expose partially updated scheduler state</text>
<text class="b" x="595" y="805" text-anchor="middle">Single CPU narrows concurrency; it does not make arbitrary interrupt-context calls safe.</text>
</svg>
