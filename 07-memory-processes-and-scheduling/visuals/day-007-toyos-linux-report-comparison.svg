<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">ToyOS and Linux scheduler comparison workflow</title><desc id="desc">ToyOS observations are compared by concept with revision-checked Linux source landmarks, separating shared scheduling questions from major differences in processes, paging, run queues, synchronization, and multicore policy.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.toy{fill:#173b57;stroke:#8fd3ff;stroke-width:3}.lin{fill:#573b69;stroke:#e1b8ff;stroke-width:3}.mid{fill:#145f54;stroke:#80efca;stroke-width:3}.warn{fill:#65313d;stroke:#ff9999;stroke-width:3}.line{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="t" x="40" y="55">Compare concepts and evidence, not renamed boxes</text>
<rect class="toy" x="45" y="120" width="330" height="400" rx="16"/><text class="h" x="210" y="162" text-anchor="middle">ToyOS milestone 7</text><text class="b" x="80" y="210">" two ring-0 kernel tasks</text><text class="b" x="80" y="250">" one address space</text><text class="b" x="80" y="290">" fixed tasks[2] run queue</text><text class="b" x="80" y="330">" cooperative + PIT preemption</text><text class="b" x="80" y="370">" no locks; one CPU</text><text class="b" x="80" y="410">" blocked means finished</text><text class="b" x="80" y="450">" exact local ELF + QEMU trace</text>
<rect class="mid" x="430" y="165" width="330" height="310" rx="16"/><text class="h" x="595" y="207" text-anchor="middle">Comparison questions</text><text class="b" x="465" y="255">Who is runnable?</text><text class="b" x="465" y="295">Who owns CPU + stack?</text><text class="b" x="465" y="335">What forces a switch?</text><text class="b" x="465" y="375">What synchronizes state?</text><text class="b" x="465" y="415">What evidence supports this?</text>
<rect class="lin" x="815" y="120" width="330" height="400" rx="16"/><text class="h" x="980" y="162" text-anchor="middle">Linux, checked revision</text><text class="b" x="850" y="210">" processes and threads</text><text class="b" x="850" y="250">" user/kernel address spaces</text><text class="b" x="850" y="290">" per-CPU run queues</text><text class="b" x="850" y="330">" scheduler classes + priorities</text><text class="b" x="850" y="370">" synchronization + SMP</text><text class="b" x="850" y="410">" sleep/wakeup lifecycle</text><text class="b" x="850" y="450">" arch/x86 + mm + kernel/sched</text>
<path class="line" d="M375 320H430"/><path class="line" d="M760 320H815"/>
<rect class="warn" x="90" y="620" width="1010" height="135" rx="16"/><text class="h" x="595" y="662" text-anchor="middle">Report discipline</text><text class="b" x="595" y="700" text-anchor="middle">Record revision, inspect source, compare one concept, cite evidence, state limits</text><text class="b" x="595" y="732" text-anchor="middle">Do not project ToyOS port writes, task states, or fairness claims onto Linux.</text>
</svg>
