<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Yield, scheduler choice, context switch, and resume</title><desc id="desc">A voluntary yield enters scheduler policy, selects another runnable task, saves the old ABI context and stack pointer, loads the new context, and resumes either at a trampoline or a prior switch label.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.policy{fill:#173b57;stroke:#8fd3ff;stroke-width:3}.mech{fill:#573b69;stroke:#e1b8ff;stroke-width:3}.run{fill:#145f54;stroke:#80efca;stroke-width:3}.line{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="t" x="40" y="55">Voluntary yield separates scheduler policy from switch mechanism</text>
<g text-anchor="middle"><rect class="run" x="45" y="140" width="190" height="110" rx="14"/><text class="h" x="140" y="180">Task A</text><text class="b" x="140" y="215">calls schedule</text><rect class="policy" x="285" y="140" width="220" height="110" rx="14"/><text class="h" x="395" y="180">Choose Task B</text><text class="b" x="395" y="215">update states/current</text><rect class="mech" x="555" y="140" width="270" height="110" rx="14"/><text class="h" x="690" y="180">Save old context</text><text class="b" x="690" y="215">r15 through rbp, rsp, label 1</text><rect class="mech" x="875" y="140" width="270" height="110" rx="14"/><text class="h" x="1010" y="180">Load new context</text><text class="b" x="1010" y="215">registers + rsp + rip</text></g>
<path class="line" d="M235 195H285"/><path class="line" d="M505 195H555"/><path class="line" d="M825 195H875"/>
<rect class="policy" x="115" y="360" width="410" height="155" rx="14"/><text class="h" x="320" y="400" text-anchor="middle">First entry</text><text class="b" x="320" y="440" text-anchor="middle">new RIP = task_trampoline</text><text class="b" x="320" y="475" text-anchor="middle">new stack contains zero sentinel</text>
<rect class="run" x="665" y="360" width="410" height="155" rx="14"/><text class="h" x="870" y="400" text-anchor="middle">Later resume</text><text class="b" x="870" y="440" text-anchor="middle">saved RIP = switch label 1</text><text class="b" x="870" y="475" text-anchor="middle">ret consumes saved return address</text>
<path class="line" d="M1010 250L870 360"/><path class="line" d="M980 250L320 360"/>
<rect class="mech" x="160" y="650" width="870" height="110" rx="16"/><text class="h" x="595" y="690" text-anchor="middle">Ownership transfer</text><text class="b" x="595" y="728" text-anchor="middle">Task A keeps its inactive stack and saved continuation; Task B gains live CPU state.</text>
</svg>
