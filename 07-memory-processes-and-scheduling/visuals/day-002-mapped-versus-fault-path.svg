<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Mapped access versus page-fault path</title><desc id="desc">A virtual write either finds a permitted translation and reaches a physical frame or fails translation and produces a page-fault evidence tuple containing CR2, error bits, saved RIP, and the exact ELF.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff8f8f"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.box{fill:#173b57;stroke:#8fd3ff;stroke-width:3}.ok{fill:#145f54;stroke:#80efca;stroke-width:3}.bad{fill:#65313d;stroke:#ff9999;stroke-width:3}.line{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}.fail{stroke:#ff8f8f;stroke-width:4;fill:none;marker-end:url(#r)}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="t" x="40" y="55">The same store request can commit or become evidence</text>
<rect class="box" x="410" y="105" width="370" height="100" rx="14"/><text class="h" x="595" y="145" text-anchor="middle">CPU issues virtual write</text><text class="b" x="595" y="178" text-anchor="middle">TLB lookup, then page-table walk if needed</text>
<path class="line" d="M500 205L285 315"/><path class="fail" d="M690 205L905 315"/>
<rect class="ok" x="70" y="315" width="430" height="135" rx="14"/><text class="h" x="285" y="355" text-anchor="middle">Mapped + writable</text><text class="b" x="285" y="390" text-anchor="middle">0x40000000 has a present leaf PTE</text><text class="b" x="285" y="422" text-anchor="middle">write reaches owned physical frame</text>
<rect class="bad" x="690" y="315" width="430" height="135" rx="14"/><text class="h" x="905" y="355" text-anchor="middle">No present translation</text><text class="b" x="905" y="390" text-anchor="middle">0x70000000 causes vector 14</text><text class="b" x="905" y="422" text-anchor="middle">not-present write supervisor</text>
<rect class="box" x="70" y="555" width="430" height="135" rx="14"/><text class="h" x="285" y="595" text-anchor="middle">Successful evidence</text><text class="b" x="285" y="630" text-anchor="middle">mapper marker + source + disassembly</text><text class="b" x="285" y="662" text-anchor="middle">TLB reflects installed PTE</text>
<rect class="bad" x="650" y="540" width="500" height="180" rx="14"/><text class="h" x="900" y="580" text-anchor="middle">Fault tuple</text><text class="b" x="685" y="620">CR2 = 0x70000000</text><text class="b" x="685" y="652">error bits = not-present / write / supervisor</text><text class="b" x="685" y="684">saved RIP + exact build/week7-page/toyos.elf</text>
<path class="line" d="M285 450V555"/><path class="fail" d="M905 450V540"/>
</svg>
