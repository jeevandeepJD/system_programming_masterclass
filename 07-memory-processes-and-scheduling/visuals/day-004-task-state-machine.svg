<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">ToyOS runnable, running, and blocked task states</title><desc id="desc">A created task becomes runnable, scheduler selection makes it running, switching makes the old task runnable, and task completion makes it permanently blocked; ToyOS has no wakeup transition.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff8f8f"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.ready{fill:#173b57;stroke:#8fd3ff;stroke-width:3}.run{fill:#145f54;stroke:#80efca;stroke-width:3}.stop{fill:#65313d;stroke:#ff9999;stroke-width:3}.line{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}.none{stroke:#ff8f8f;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#r)}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="t" x="40" y="55">ToyOS task state machine: policy encoded in three states</text>
<g text-anchor="middle"><rect class="ready" x="80" y="310" width="250" height="130" rx="65"/><text class="h" x="205" y="365">RUNNABLE</text><text class="b" x="205" y="400">eligible in tasks[]</text><rect class="run" x="470" y="310" width="250" height="130" rx="65"/><text class="h" x="595" y="365">RUNNING</text><text class="b" x="595" y="400">owns current + CPU</text><rect class="stop" x="860" y="310" width="250" height="130" rx="65"/><text class="h" x="985" y="365">BLOCKED</text><text class="b" x="985" y="400">finished permanently</text></g>
<path class="line" d="M330 350H470"/><text class="b" x="400" y="330" text-anchor="middle">selected</text><path class="line" d="M470 420H330"/><text class="b" x="400" y="465" text-anchor="middle">switch away</text><path class="line" d="M720 375H860"/><text class="b" x="790" y="350" text-anchor="middle">task_finish</text>
<text class="h" x="80" y="145">Creation</text><path class="line" d="M205 175V310"/><text class="b" x="225" y="230">record + stack + valid context</text>
<path class="none" d="M985 440C985 660 205 660 205 440"/><text class="h" x="595" y="620" text-anchor="middle">No wakeup path</text><text class="b" x="595" y="655" text-anchor="middle">BLOCKED does not mean sleeping on a wait channel in this milestone</text>
<rect class="ready" x="230" y="735" width="730" height="70" rx="12"/><text class="b" x="595" y="778" text-anchor="middle">Fixed tasks[2] array is both storage and tiny run queue; no priority or fairness accounting.</text>
</svg>
