<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">PIT and PIC timer preemption chain</title><desc id="desc">A PIT pulse enters PIC IRQ0, reaches IDT vector 32, builds an interrupt frame, increments ticks, sends PIC EOI, invokes scheduler policy, switches task context, and later returns through iretq.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.hw{fill:#674e1f;stroke:#ffd166;stroke-width:3}.entry{fill:#173b57;stroke:#8fd3ff;stroke-width:3}.policy{fill:#573b69;stroke:#e1b8ff;stroke-width:3}.run{fill:#145f54;stroke:#80efca;stroke-width:3}.line{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="t" x="40" y="55">One involuntary switch, from timer pulse to eventual iretq</text>
<g text-anchor="middle"><rect class="hw" x="45" y="120" width="180" height="100" rx="12"/><text class="h" x="135" y="158">PIT tick</text><text class="b" x="135" y="192">about 100 Hz</text><rect class="hw" x="270" y="120" width="180" height="100" rx="12"/><text class="h" x="360" y="158">PIC IRQ0</text><text class="b" x="360" y="192">remapped</text><rect class="entry" x="495" y="120" width="180" height="100" rx="12"/><text class="h" x="585" y="158">IDT 32</text><text class="b" x="585" y="192">irq0_stub</text><rect class="entry" x="720" y="120" width="180" height="100" rx="12"/><text class="h" x="810" y="158">ISR frame</text><text class="b" x="810" y="192">current stack</text><rect class="policy" x="945" y="120" width="200" height="100" rx="12"/><text class="h" x="1045" y="158">ticks++</text><text class="b" x="1045" y="192">timer policy</text></g>
<path class="line" d="M225 170H270"/><path class="line" d="M450 170H495"/><path class="line" d="M675 170H720"/><path class="line" d="M900 170H945"/>
<g text-anchor="middle"><rect class="hw" x="120" y="380" width="220" height="110" rx="12"/><text class="h" x="230" y="420">PIC EOI</text><text class="b" x="230" y="455">controller released</text><rect class="policy" x="410" y="380" width="220" height="110" rx="12"/><text class="h" x="520" y="420">scheduler_tick</text><text class="b" x="520" y="455">choose runnable</text><rect class="policy" x="700" y="380" width="220" height="110" rx="12"/><text class="h" x="810" y="420">context_switch</text><text class="b" x="810" y="455">change stacks</text><rect class="run" x="990" y="380" width="150" height="110" rx="12"/><text class="h" x="1065" y="420">Task B</text><text class="b" x="1065" y="455">runs</text></g>
<path class="line" d="M1045 220V300H230V380"/><path class="line" d="M340 435H410"/><path class="line" d="M630 435H700"/><path class="line" d="M920 435H990"/>
<rect class="entry" x="165" y="640" width="860" height="120" rx="16"/><text class="h" x="595" y="680" text-anchor="middle">When Task A is selected again</text><text class="b" x="595" y="718" text-anchor="middle">switch returns, handler returns, registers restore, iretq resumes interrupted RIP</text><path class="line" d="M1065 490L1025 640"/>
</svg>
