<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Kernel heap block ownership, splitting, coalescing, and lifetime</title><desc id="desc">ToyOS bump allocation advances a cursor without reclamation; a future reclaiming allocator would need explicit block ownership, split rules, release transitions, adjacent free-block coalescing, and stale-alias defenses.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.box{fill:#173b57;stroke:#8fd3ff;stroke-width:3}.own{fill:#573b69;stroke:#e1b8ff;stroke-width:3}.free{fill:#145f54;stroke:#80efca;stroke-width:3}.warn{fill:#65313d;stroke:#ff9999;stroke-width:3}.line{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="t" x="40" y="55">Heap bytes need ownership and lifetime rules</text>
<text class="h" x="55" y="125">ToyOS today: bump-only</text><rect class="own" x="55" y="160" width="250" height="85"/><text class="b" x="180" y="195" text-anchor="middle">task record</text><text class="b" x="180" y="224" text-anchor="middle">scheduler owns</text><rect class="own" x="305" y="160" width="380" height="85"/><text class="b" x="495" y="195" text-anchor="middle">8192-byte task stack</text><text class="b" x="495" y="224" text-anchor="middle">task lifetime</text><rect class="free" x="685" y="160" width="430" height="85"/><text class="b" x="900" y="195" text-anchor="middle">unused capacity</text><text class="b" x="900" y="224" text-anchor="middle">heap_next advances right</text>
<text class="b" x="55" y="290">No kfree: finished objects remain consumed for the kernel lifetime.</text>
<text class="h" x="55" y="370">Future reclaiming allocator: additional invariants, not current behavior</text>
<rect class="free" x="55" y="415" width="930" height="90"/><text class="b" x="520" y="468" text-anchor="middle">one free block: header records size + free state</text><path class="line" d="M985 460H1100"/>
<rect class="own" x="55" y="560" width="360" height="90"/><text class="b" x="235" y="600" text-anchor="middle">allocated block</text><text class="b" x="235" y="630" text-anchor="middle">owner + lifetime</text><rect class="free" x="415" y="560" width="570" height="90"/><text class="b" x="700" y="614" text-anchor="middle">split remainder</text><text class="h" x="1035" y="615" text-anchor="middle">split</text>
<rect class="warn" x="55" y="710" width="1060" height="85" rx="12"/><text class="b" x="585" y="745" text-anchor="middle">release, mark free, coalesce adjacent free blocks, invalidate aliases</text><text class="b" x="585" y="775" text-anchor="middle">requires double-free, use-after-free, locking, and interrupt-context policy</text>
</svg>
