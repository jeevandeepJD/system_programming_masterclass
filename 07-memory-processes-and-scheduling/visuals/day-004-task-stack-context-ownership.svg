<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Kernel task, dedicated stack, and saved context ownership</title><desc id="desc">Each ToyOS kernel task owns a record and dedicated downward-growing stack; the context stores callee-saved registers, stack pointer, and resume instruction pointer while only the running task owns the live CPU state.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.rec{fill:#173b57;stroke:#8fd3ff;stroke-width:3}.stack{fill:#573b69;stroke:#e1b8ff;stroke-width:3}.cpu{fill:#145f54;stroke:#80efca;stroke-width:3}.line{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="t" x="40" y="55">A task is a resumable ownership bundle</text>
<rect class="rec" x="55" y="120" width="420" height="285" rx="16"/><text class="h" x="265" y="160" text-anchor="middle">kernel_task</text><text class="b" x="90" y="205">id + state + entry</text><rect class="rec" x="90" y="235" width="350" height="125" rx="10"/><text class="h" x="265" y="273" text-anchor="middle">saved context</text><text class="b" x="265" y="308" text-anchor="middle">r15 r14 r13 r12 rbx rbp</text><text class="b" x="265" y="340" text-anchor="middle">rsp + resume rip</text>
<rect class="stack" x="690" y="120" width="430" height="440" rx="16"/><text class="h" x="905" y="160" text-anchor="middle">dedicated 8192-byte kernel stack</text><text class="b" x="720" y="205">high address / stack_top</text><path class="line" d="M905 225V450"/><rect class="stack" x="755" y="285" width="300" height="80"/><text class="b" x="905" y="318" text-anchor="middle">saved continuation frames</text><text class="b" x="905" y="348" text-anchor="middle">owned while inactive</text><rect class="rec" x="755" y="430" width="300" height="75"/><text class="b" x="905" y="462" text-anchor="middle">zero return sentinel</text><text class="b" x="905" y="490" text-anchor="middle">initial RSP ends in 8</text>
<path class="line" d="M475 300H690"/><text class="b" x="580" y="280" text-anchor="middle">context.rsp</text>
<rect class="cpu" x="250" y="630" width="690" height="120" rx="16"/><text class="h" x="595" y="670" text-anchor="middle">Live CPU state belongs only to current</text><text class="b" x="595" y="708" text-anchor="middle">active RSP + registers + instruction pointer</text><text class="b" x="595" y="737" text-anchor="middle">other tasks remain records plus inactive stacks</text>
</svg>
