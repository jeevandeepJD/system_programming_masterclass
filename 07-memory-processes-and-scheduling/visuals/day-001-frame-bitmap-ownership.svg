<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Bitmap frame ownership and allocation</title><desc id="desc">The bitmap starts fully used, usable normalized frames become free, live boot ranges become reserved, and first-fit allocation and free transitions preserve the free frame count while rejecting a double free.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.used{fill:#65313d;stroke:#ff9999;stroke-width:3}.free{fill:#145f54;stroke:#80efca;stroke-width:3}.box{fill:#173b57;stroke:#8fd3ff;stroke-width:3}.line{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="t" x="40" y="55">One bitmap bit is a physical ownership claim</text><text class="b" x="42" y="92">1 = unavailable or allocated " 0 = free " frame zero stays reserved</text>
<g text-anchor="middle"><text class="h" x="130" y="165">Initial</text><text class="h" x="390" y="165">Release usable</text><text class="h" x="650" y="165">Reserve live</text><text class="h" x="950" y="165">First fit</text>
<g transform="translate(45 195)"><rect class="used" width="55" height="55"/><rect class="used" x="60" width="55" height="55"/><rect class="used" x="120" width="55" height="55"/><rect class="used" x="180" width="55" height="55"/></g>
<g transform="translate(305 195)"><rect class="used" width="55" height="55"/><rect class="free" x="60" width="55" height="55"/><rect class="free" x="120" width="55" height="55"/><rect class="free" x="180" width="55" height="55"/></g>
<g transform="translate(565 195)"><rect class="used" width="55" height="55"/><rect class="used" x="60" width="55" height="55"/><rect class="free" x="120" width="55" height="55"/><rect class="free" x="180" width="55" height="55"/></g>
<g transform="translate(865 195)"><rect class="used" width="55" height="55"/><rect class="used" x="60" width="55" height="55"/><rect class="used" x="120" width="55" height="55"/><rect class="free" x="180" width="55" height="55"/></g></g>
<path class="line" d="M280 222H305"/><path class="line" d="M540 222H565"/><path class="line" d="M800 222H865"/>
<rect class="box" x="65" y="350" width="300" height="125" rx="12"/><text class="h" x="215" y="390" text-anchor="middle">frame_alloc</text><text class="b" x="215" y="425" text-anchor="middle">find 0, set 1, count minus 1</text><text class="b" x="215" y="455" text-anchor="middle">zero frame, transfer owner</text>
<rect class="box" x="445" y="350" width="300" height="125" rx="12"/><text class="h" x="595" y="390" text-anchor="middle">frame_free</text><text class="b" x="595" y="425" text-anchor="middle">validate, clear 1, count plus 1</text><text class="b" x="595" y="455" text-anchor="middle">caller relinquishes once</text>
<rect class="used" x="825" y="350" width="300" height="125" rx="12"/><text class="h" x="975" y="390" text-anchor="middle">second free rejected</text><text class="b" x="975" y="425" text-anchor="middle">frame_is_used = false</text><text class="b" x="975" y="455" text-anchor="middle">count must not change</text>
<path class="line" d="M365 412H445"/><path class="line" d="M745 412H825"/>
<rect class="free" x="170" y="610" width="850" height="105" rx="14"/><text class="h" x="595" y="650" text-anchor="middle">Invariant</text><text class="b" x="595" y="687" text-anchor="middle">free_frames equals zero bits within the bounded bitmap</text>
</svg>
