<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Integrated scheduler evidence and report workflow</title><desc id="desc">Runtime state, run-queue selection, context ownership, timer evidence, injected faults, source contracts, and exact ELF identity are combined into claims with interpretations and explicit limits.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.src{fill:#173b57;stroke:#8fd3ff;stroke-width:3}.run{fill:#145f54;stroke:#80efca;stroke-width:3}.fault{fill:#65313d;stroke:#ff9999;stroke-width:3}.report{fill:#573b69;stroke:#e1b8ff;stroke-width:3}.line{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="t" x="40" y="55">Build claims by joining independent evidence streams</text>
<g text-anchor="middle"><rect class="src" x="50" y="120" width="245" height="120" rx="14"/><text class="h" x="173" y="160">Source contracts</text><text class="b" x="173" y="195">states " queue " switch</text><text class="b" x="173" y="222">IRQ ordering</text><rect class="src" x="330" y="120" width="245" height="120" rx="14"/><text class="h" x="453" y="160">Artifact identity</text><text class="b" x="453" y="195">ELF hash " symbols</text><text class="b" x="453" y="222">tool versions</text><rect class="run" x="610" y="120" width="245" height="120" rx="14"/><text class="h" x="733" y="160">Runtime trace</text><text class="b" x="733" y="195">task states " current</text><text class="b" x="733" y="222">stack owner " ticks</text><rect class="fault" x="890" y="120" width="250" height="120" rx="14"/><text class="h" x="1015" y="160">Fault controls</text><text class="b" x="1015" y="195">allocator " page</text><text class="b" x="1015" y="222">context</text></g>
<path class="line" d="M173 240L420 395"/><path class="line" d="M453 240L510 395"/><path class="line" d="M733 240L680 395"/><path class="line" d="M1015 240L770 395"/>
<rect class="report" x="340" y="395" width="510" height="175" rx="18"/><text class="h" x="595" y="438" text-anchor="middle">Scheduler evidence report</text><text class="b" x="390" y="478">1. prediction</text><text class="b" x="390" y="512">2. exact observation</text><text class="b" x="630" y="478">3. causal interpretation</text><text class="b" x="630" y="512">4. limits + next test</text><text class="b" x="595" y="550" text-anchor="middle">separate source states / ELF contains / QEMU emitted / we infer</text>
<path class="line" d="M595 570V650"/><rect class="run" x="150" y="650" width="890" height="120" rx="16"/><text class="h" x="595" y="690" text-anchor="middle">Reproducible ownership narrative</text><text class="b" x="595" y="728" text-anchor="middle">state, queue choice, saved context, timer cause, restored task, checked result</text><text class="b" x="595" y="758" text-anchor="middle">Every claim names its artifact and does not exceed its evidence.</text>
</svg>
