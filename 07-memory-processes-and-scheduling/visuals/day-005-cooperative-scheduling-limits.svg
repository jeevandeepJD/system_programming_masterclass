<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Cooperative scheduling progress and limits</title><desc id="desc">A yielding task gives another runnable task CPU time, while a non-yielding task can monopolize the CPU; the diagram separates demonstrated ABI switching from fairness, interrupt safety, SIMD state, and multicore guarantees not provided.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.a{fill:#173b57;stroke:#8fd3ff;stroke-width:3}.b2{fill:#573b69;stroke:#e1b8ff;stroke-width:3}.ok{fill:#145f54;stroke:#80efca;stroke-width:3}.warn{fill:#65313d;stroke:#ff9999;stroke-width:3}.line{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="t" x="40" y="55">Cooperation proves switching, not forced fairness</text>
<text class="h" x="55" y="130">Yielding timeline</text><line x1="120" y1="205" x2="1100" y2="205" stroke="#8fd3ff" stroke-width="4"/>
<rect class="a" x="120" y="165" width="190" height="80"/><text class="b" x="215" y="213" text-anchor="middle">Task A runs</text><rect class="b2" x="310" y="165" width="190" height="80"/><text class="b" x="405" y="213" text-anchor="middle">Task B runs</text><rect class="a" x="500" y="165" width="190" height="80"/><text class="b" x="595" y="213" text-anchor="middle">Task A resumes</text><rect class="b2" x="690" y="165" width="190" height="80"/><text class="b" x="785" y="213" text-anchor="middle">Task B resumes</text><text class="b" x="310" y="280" text-anchor="middle">yield</text><text class="b" x="500" y="280" text-anchor="middle">yield</text><text class="b" x="690" y="280" text-anchor="middle">yield</text>
<text class="h" x="55" y="365">Non-yielding timeline</text><rect class="warn" x="120" y="400" width="760" height="90"/><text class="b" x="500" y="453" text-anchor="middle">Task A runs indefinitely: no voluntary scheduling point</text><rect class="b2" x="880" y="400" width="220" height="90"/><text class="b" x="990" y="438" text-anchor="middle">Task B runnable</text><text class="b" x="990" y="468" text-anchor="middle">but never chosen</text>
<rect class="ok" x="60" y="600" width="510" height="155" rx="14"/><text class="h" x="315" y="642" text-anchor="middle">Evidence supports</text><text class="b" x="315" y="680" text-anchor="middle">callee-saved ABI agreement</text><text class="b" x="315" y="714" text-anchor="middle">stack ownership + first-entry/resume</text>
<rect class="warn" x="620" y="600" width="510" height="155" rx="14"/><text class="h" x="875" y="642" text-anchor="middle">Evidence does not support</text><text class="b" x="875" y="680" text-anchor="middle">forced progress " priority " starvation freedom</text><text class="b" x="875" y="714" text-anchor="middle">arbitrary IRQ timing " SIMD/FPU " SMP</text>
</svg>
