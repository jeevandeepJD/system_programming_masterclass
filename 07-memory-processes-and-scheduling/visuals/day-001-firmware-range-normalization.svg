<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Firmware memory range normalization</title><desc id="desc">Multiboot ranges are validated, filtered for type one, rounded to page boundaries, clipped to the ToyOS physical limit, then overlaid with kernel and boot information reservations.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.box{fill:#173b57;stroke:#8fd3ff;stroke-width:3}.ok{fill:#145f54;stroke:#80efca;stroke-width:3}.bad{fill:#65313d;stroke:#ff9999;stroke-width:3}.line{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="t" x="40" y="55">Normalize firmware ranges before releasing frames</text>
<g text-anchor="middle"><rect class="box" x="50" y="115" width="245" height="120" rx="14"/><text class="h" x="173" y="153">Multiboot type 6 tag</text><text class="b" x="173" y="188">variable entry_size</text><text class="b" x="173" y="215">address + length</text>
<rect class="box" x="355" y="115" width="245" height="120" rx="14"/><text class="h" x="478" y="153">Validate</text><text class="b" x="478" y="188">bounds " sizes " overflow</text><text class="b" x="478" y="215">accept only type 1</text>
<rect class="ok" x="660" y="115" width="245" height="120" rx="14"/><text class="h" x="783" y="153">Normalize pages</text><text class="b" x="783" y="188">start rounds up</text><text class="b" x="783" y="215">end rounds down</text>
<rect class="ok" x="965" y="115" width="180" height="120" rx="14"/><text class="h" x="1055" y="153">Clip</text><text class="b" x="1055" y="188">below 128 MiB</text><text class="b" x="1055" y="215">full 4 KiB frames</text>
<path class="line" d="M295 175H355"/><path class="line" d="M600 175H660"/><path class="line" d="M905 175H965"/></g>
<text class="h" x="70" y="335">Worked unaligned range</text><rect class="bad" x="70" y="375" width="980" height="60" rx="8"/><text class="b" x="90" y="412">firmware: [0x0010_0123, 0x0010_5ABC): edge bytes cannot form complete frames</text>
<rect class="ok" x="250" y="475" width="620" height="60" rx="8"/><text class="b" x="560" y="512" text-anchor="middle">released: [0x0010_1000, 0x0010_5000): four complete pages</text>
<path class="line" d="M560 435V475"/><rect class="bad" x="70" y="630" width="480" height="105" rx="12"/><text class="h" x="310" y="668" text-anchor="middle">Reserve again</text><text class="b" x="310" y="705" text-anchor="middle">0..__kernel_end + Multiboot block</text><rect class="box" x="640" y="630" width="480" height="105" rx="12"/><text class="h" x="880" y="668" text-anchor="middle">Fail closed</text><text class="b" x="880" y="705" text-anchor="middle">unmentioned memory remains unavailable</text>
</svg>
