<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Physical frame, virtual page, and heap object layers</title><desc id="desc">The frame allocator owns physical 4 KiB frames, page tables map virtual pages to those frames, and the heap allocator lends aligned byte ranges to typed kernel objects with distinct owners and lifetimes.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.phys{fill:#674e1f;stroke:#ffd166;stroke-width:3}.virt{fill:#173b57;stroke:#8fd3ff;stroke-width:3}.heap{fill:#573b69;stroke:#e1b8ff;stroke-width:3}.line{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="t" x="40" y="55">Three allocators answer three different questions</text>
<rect class="heap" x="80" y="115" width="1030" height="170" rx="16"/><text class="h" x="110" y="155">HEAP OBJECT LAYER: Which byte range may this caller use?</text><rect class="heap" x="145" y="185" width="260" height="65"/><text class="b" x="275" y="225" text-anchor="middle">kernel_task object</text><rect class="heap" x="450" y="185" width="420" height="65"/><text class="b" x="660" y="225" text-anchor="middle">dedicated 8192-byte stack</text><text class="b" x="905" y="225">16-byte alignment</text>
<rect class="virt" x="80" y="345" width="1030" height="170" rx="16"/><text class="h" x="110" y="385">VIRTUAL PAGE LAYER: What physical frame does this address mean?</text><g text-anchor="middle"><rect class="virt" x="145" y="415" width="200" height="65"/><text class="b" x="245" y="455">HEAP_BASE + 0</text><rect class="virt" x="365" y="415" width="200" height="65"/><text class="b" x="465" y="455">+ 0x1000</text><rect class="virt" x="585" y="415" width="200" height="65"/><text class="b" x="685" y="455">...</text><rect class="virt" x="805" y="415" width="200" height="65"/><text class="b" x="905" y="455">+ 0x7000</text></g>
<rect class="phys" x="80" y="575" width="1030" height="170" rx="16"/><text class="h" x="110" y="615">PHYSICAL FRAME LAYER: Which 4 KiB frame may the kernel own?</text><g text-anchor="middle"><rect class="phys" x="145" y="645" width="200" height="65"/><text class="b" x="245" y="685">frame 0xA9000</text><rect class="phys" x="365" y="645" width="200" height="65"/><text class="b" x="465" y="685">frame 0xC2000</text><rect class="phys" x="585" y="645" width="200" height="65"/><text class="b" x="685" y="685">noncontiguous</text><rect class="phys" x="805" y="645" width="200" height="65"/><text class="b" x="905" y="685">frame 0xEF000</text></g>
<path class="line" d="M595 285V345"/><path class="line" d="M595 515V575"/><text class="b" x="595" y="805" text-anchor="middle">Virtual contiguity does not require physical contiguity; object lifetime is a separate contract.</text>
</svg>
