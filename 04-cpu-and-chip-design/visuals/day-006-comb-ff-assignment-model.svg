<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Combinational candidate and edge-captured state in SystemVerilog</title><desc id="desc">Inputs feed an always_comb block that computes a candidate with blocking assignment, then an always_ff block captures current right-hand-side values with nonblocking assignment at a clock edge.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.mono{font-family:monospace;font-size:18px}.box{stroke:#f7fbff;stroke-width:2}.arrow{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="45" y="58">Candidate values settle; state changes only at the edge</text>
<rect class="panel" x="45" y="105" width="1100" height="470" rx="16"/>
<rect class="box" x="80" y="195" width="170" height="180" rx="12" fill="#315a88"/><text class="head" x="165" y="235" text-anchor="middle">current inputs</text><text class="body" x="165" y="280" text-anchor="middle">a = 3</text><text class="body" x="165" y="315" text-anchor="middle">b = 5</text><text class="body" x="165" y="350" text-anchor="middle">op = ADD</text><path class="arrow" d="M250 285H340"/>
<rect class="box" x="350" y="150" width="300" height="270" rx="12" fill="#176b72"/><text class="head" x="500" y="195" text-anchor="middle">always_comb</text><text class="mono" x="380" y="245">alu_result = a + b;</text><text class="body" x="380" y="290">blocking assignment (=)</text><text class="body" x="380" y="325">updates within this activation</text><text class="body" x="380" y="370">complete paths  =>  no memory</text><path class="arrow" d="M650 285H740"/>
<rect class="box" x="750" y="195" width="150" height="180" rx="12" fill="#624b88"/><text class="head" x="825" y="235" text-anchor="middle">candidate</text><text class="body" x="825" y="290" text-anchor="middle">alu_result</text><text class="head" x="825" y="335" text-anchor="middle">8</text><path class="arrow" d="M900 285H970"/>
<rect class="box" x="980" y="150" width="130" height="270" rx="12" fill="#7d3850"/><text class="head" x="1045" y="195" text-anchor="middle">always_ff</text><text class="mono" x="995" y="245">q &lt;= alu;</text><text class="body" x="1045" y="300" text-anchor="middle">sample RHS</text><text class="body" x="1045" y="333" text-anchor="middle">at posedge</text><text class="body" x="1045" y="380" text-anchor="middle">update q later</text>
<path d="M1045 500V420" stroke="#75e6a4" stroke-width="5" marker-end="url(#a)"/><text class="head" x="965" y="530">posedge clk</text><text class="body" x="80" y="470">Before edge: q = old value while candidate may change continuously.</text><text class="body" x="80" y="515">At edge: evaluate RHS using current values; nonblocking updates commit together.</text>
<rect class="panel" x="90" y="625" width="1010" height="135" rx="14"/><text class="head" x="120" y="665">Two distinct conventions, two hardware intents</text><text class="body" x="120" y="705">Blocking "=" supports ordered combinational calculation; nonblocking "&lt;=" models simultaneous-looking register capture.</text><text class="body" x="120" y="738">Neither operator supplies physical delay, setup/hold closure, placement, or a transistor-level storage circuit.</text>
</svg>
