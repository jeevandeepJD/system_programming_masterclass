<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Testbench reset, enable, candidate, and captured-value waveform</title><desc id="desc">A timing diagram shows testbench-driven clock, reset, enable, current inputs, combinational candidate, and captured register output, with a boundary separating simulation stimulus from synthesizable RTL.</desc>
<style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.axis{stroke:#f7fbff;stroke-width:2}.wave{stroke:#75e6a4;stroke-width:4;fill:none}.data{stroke:#ffd166;stroke-width:4;fill:none}.capture{stroke:#ff7b7b;stroke-width:3;stroke-dasharray:8 6}.boundary{stroke:#6fa8dc;stroke-width:3;stroke-dasharray:10 8}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}</style>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="45" y="58">Simulation drives the environment; RTL defines candidate and capture</text>
<rect class="panel" x="45" y="95" width="1100" height="625" rx="16"/><line class="boundary" x1="285" y1="120" x2="285" y2="695"/><text class="head" x="80" y="145">signal</text><text class="head" x="310" y="145">time  -> </text>
<text class="body" x="75" y="205">clk (testbench)</text><path class="wave" d="M310 225V185H410V225H510V185H610V225H710V185H810V225H910V185H1010V225H1110"/>
<text class="body" x="75" y="285">rst (testbench)</text><path class="wave" d="M310 305V265H500V305H1110"/><text class="body" x="330" y="255">asserted</text>
<text class="body" x="75" y="365">enable / valid</text><path class="wave" d="M310 385V345H460V385H650V345H890V385H1110"/>
<text class="body" x="75" y="445">current inputs</text><path class="data" d="M310 425L460 425L475 465L650 465L665 425L890 425L905 465H1110"/><text class="body" x="340" y="452">0</text><text class="body" x="520" y="452">3+5</text><text class="body" x="730" y="452">7+9</text><text class="body" x="965" y="452">2+1</text>
<text class="body" x="75" y="525">candidate (comb)</text><path class="data" d="M310 505L460 505L475 545L650 545L665 505L890 505L905 545H1110"/><text class="body" x="525" y="532">8</text><text class="body" x="735" y="532">16</text><text class="body" x="970" y="532">3</text>
<text class="body" x="75" y="605">captured q (ff)</text><path class="wave" d="M310 625V585H510V625H710V585H910V625H1110"/><text class="body" x="330" y="575">reset -> 0</text><text class="body" x="540" y="612">capture 8</text><text class="body" x="735" y="575">capture 16</text><text class="body" x="935" y="612">hold (enable=0)</text>
<line class="capture" x1="410" y1="160" x2="410" y2="670"/><line class="capture" x1="610" y1="160" x2="610" y2="670"/><line class="capture" x1="810" y1="160" x2="810" y2="670"/><line class="capture" x1="1010" y1="160" x2="1010" y2="670"/><text class="body" x="365" y="690">posedge capture instants</text>
<rect class="panel" x="85" y="750" width="1020" height="60" rx="12"/><text class="body" x="110" y="787">Simulation-only: clock generator, delays, stimulus, assertions  |  Synthesizable: combinational function, enable/reset muxing, registers</text>
</svg>
