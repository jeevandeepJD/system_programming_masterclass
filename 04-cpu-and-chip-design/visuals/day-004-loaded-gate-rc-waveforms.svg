<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Loaded gate RC waveforms, propagation thresholds, rise and fall time</title><desc id="desc">A loaded inverter drives four receiver capacitances while aligned input and output waveforms label 50 percent propagation delay, 10-to-90 percent rise and fall time, and increased fan-out.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.axis{stroke:#f7fbff;stroke-width:3}.wave1{stroke:#75e6a4;stroke-width:5;fill:none}.wave2{stroke:#ffd166;stroke-width:6;fill:none}.guide{stroke:#6fa8dc;stroke-width:2;stroke-dasharray:8 6}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="45" y="58">Fan-out adds capacitance; finite drive turns edges into slopes</text>
<rect class="panel" x="45" y="100" width="1100" height="190" rx="16"/><polygon points="120,150 250,195 120,240" fill="#7d3850" stroke="#f7fbff" stroke-width="2"/><circle cx="132" cy="195" r="8" fill="#08131e" stroke="#f7fbff" stroke-width="2"/><text class="head" x="185" y="270" text-anchor="middle">driver</text><path d="M250 195H520" stroke="#ffd166" stroke-width="5" marker-end="url(#a)"/><text class="body" x="310" y="175">Rdriver + Rwire</text>
<path d="M530 145V245 M560 145V245" stroke="#f7fbff" stroke-width="5"/><text class="head" x="545" y="130" text-anchor="middle">CLOAD</text><path d="M560 195H1080" stroke="#f7fbff" stroke-width="4"/><rect x="650" y="155" width="90" height="75" rx="10" fill="#315a88" stroke="#f7fbff" stroke-width="2"/><rect x="760" y="155" width="90" height="75" rx="10" fill="#315a88" stroke="#f7fbff" stroke-width="2"/><rect x="870" y="155" width="90" height="75" rx="10" fill="#315a88" stroke="#f7fbff" stroke-width="2"/><rect x="980" y="155" width="90" height="75" rx="10" fill="#315a88" stroke="#f7fbff" stroke-width="2"/><text class="body" x="695" y="202" text-anchor="middle">input 1</text><text class="body" x="805" y="202" text-anchor="middle">input 2</text><text class="body" x="915" y="202" text-anchor="middle">input 3</text><text class="body" x="1025" y="202" text-anchor="middle">input 4</text>
<line class="axis" x1="100" y1="735" x2="1100" y2="735"/><line class="axis" x1="100" y1="330" x2="100" y2="735"/><text class="head" x="1020" y="775">time</text><line class="guide" x1="100" y1="430" x2="1100" y2="430"/><line class="guide" x1="100" y1="610" x2="1100" y2="610"/><text class="body" x="45" y="436">90%</text><text class="body" x="45" y="616">10%</text>
<path class="wave1" d="M110 680H250V365H600V680H1080"/><text class="head" x="120" y="355" fill="#75e6a4">VIN</text><path class="wave2" d="M110 370H250 C300 370 340 390 380 505 C420 620 455 680 520 680 H600 C650 680 690 660 730 545 C770 430 805 370 875 370H1080"/><text class="head" x="900" y="360" fill="#ffd166">VOUT</text>
<line class="guide" x1="250" y1="330" x2="250" y2="735"/><line class="guide" x1="380" y1="330" x2="380" y2="735"/><path d="M255 525H372" stroke="#ff7b7b" stroke-width="4" marker-end="url(#a)"/><text class="body" x="275" y="510">tpHL: 50%  ->  50%</text><path d="M320 650H445" stroke="#75e6a4" stroke-width="4" marker-end="url(#a)"/><text class="body" x="325" y="700">tfall: 90%  ->  10%</text><path d="M685 650H790" stroke="#75e6a4" stroke-width="4" marker-end="url(#a)"/><text class="body" x="670" y="700">trise: 10%  ->  90%</text>
<text class="body" x="610" y="330">More receivers  ->  larger CLOAD  ->  more Q=CV  ->  longer edge and delay</text>
</svg>
