<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">CMOS voltage-transfer curve, noise margins, and restoration</title><desc id="desc">A worked 3.3 volt inverter transfer curve labels VOL, VOH, VIL, VIH, NML, and NMH, then shows a degraded valid input restored to a supply rail.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.axis{stroke:#f7fbff;stroke-width:3}.curve{stroke:#ffd166;stroke-width:7;fill:none}.guide{stroke:#6fa8dc;stroke-width:2;stroke-dasharray:8 6}.margin{stroke:#75e6a4;stroke-width:5;marker-end:url(#a)}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="45" y="58">A steep transfer curve creates reusable logic levels</text>
<line class="axis" x1="110" y1="610" x2="700" y2="610"/><line class="axis" x1="110" y1="610" x2="110" y2="120"/><text class="head" x="390" y="655">VIN (V)</text><text class="head" x="45" y="115">VOUT</text>
<path class="curve" d="M115 145 C300 145 350 160 390 245 C425 330 440 485 500 555 C545 600 610 602 690 602"/>
<line class="guide" x1="275" y1="120" x2="275" y2="610"/><line class="guide" x1="500" y1="120" x2="500" y2="610"/><line class="guide" x1="110" y1="160" x2="700" y2="160"/><line class="guide" x1="110" y1="590" x2="700" y2="590"/>
<text class="body" x="260" y="635">VIL=1.0</text><text class="body" x="480" y="635">VIH=2.2</text><text class="body" x="120" y="152">VOH=3.2</text><text class="body" x="120" y="585">VOL=0.1</text>
<text class="body" x="125" y="690">safe LOW input</text><text class="body" x="315" y="690" fill="#ff7b7b">uncertain input region</text><text class="body" x="545" y="690">safe HIGH input</text>
<path class="margin" d="M135 755H270"/><text class="body" x="135" y="790">NML = VIL  -  VOL = 0.9 V</text><path class="margin" d="M510 755H680"/><text class="body" x="470" y="790">NMH = VOH  -  VIH = 1.0 V</text>
<rect class="panel" x="745" y="120" width="400" height="520" rx="16"/><text class="head" x="770" y="165">Restoration uses supply energy</text><rect x="780" y="220" width="145" height="75" rx="12" fill="#315a88" stroke="#f7fbff" stroke-width="2"/><text class="body" x="852" y="250" text-anchor="middle">2.9 V HIGH</text><text class="body" x="852" y="277" text-anchor="middle">(&gt; VIH)</text><path d="M925 257H975" stroke="#ffd166" stroke-width="4" marker-end="url(#a)"/><polygon points="980,205 1090,257 980,309" fill="#7d3850" stroke="#f7fbff" stroke-width="2"/><circle cx="1000" cy="257" r="8" fill="#08131e" stroke="#f7fbff" stroke-width="2"/><text class="body" x="1035" y="335" text-anchor="middle">inverter</text><text class="head" x="890" y="390" text-anchor="middle">output ~= 0.1 V</text><text class="body" x="770" y="440">A valid but degraded HIGH drives</text><text class="body" x="770" y="470">a fresh LOW near ground. Another</text><text class="body" x="770" y="500">inverter restores HIGH near VDD.</text><text class="body" x="770" y="555" fill="#ff7b7b">Restoration is not error correction:</text><text class="body" x="770" y="585">crossing into the wrong valid range</text><text class="body" x="770" y="615">can faithfully produce the wrong bit.</text>
</svg>
