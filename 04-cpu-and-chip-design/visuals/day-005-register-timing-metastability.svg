<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Register path timing, clock uncertainty, and metastability risk reduction</title><desc id="desc">A launch register, combinational path, and capture register are annotated with clock-to-Q, setup, hold, skew, and jitter. An asynchronous input passes through two flip-flops to gain resolution time without eliminating metastability risk.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.box{stroke:#f7fbff;stroke-width:2}.arrow{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}.clock{stroke:#75e6a4;stroke-width:4;fill:none}.risk{stroke:#ff7b7b;stroke-width:4;fill:none}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="45" y="58">Reliable capture requires both path timing and boundary discipline</text>
<rect class="panel" x="45" y="100" width="1100" height="350" rx="16"/><text class="head" x="75" y="140">Synchronous register-to-register path</text>
<rect class="box" x="90" y="205" width="180" height="110" rx="12" fill="#315a88"/><text class="head" x="180" y="248" text-anchor="middle">launch register</text><text class="body" x="180" y="282" text-anchor="middle">tclk -> Q max/min</text><path class="arrow" d="M270 260H355"/>
<rect class="box" x="365" y="185" width="330" height="150" rx="12" fill="#624b88"/><text class="head" x="530" y="230" text-anchor="middle">combinational path</text><text class="body" x="530" y="270" text-anchor="middle">tcomb,max sets setup pressure</text><text class="body" x="530" y="303" text-anchor="middle">tcomb,min sets hold race</text><path class="arrow" d="M695 260H780"/>
<rect class="box" x="790" y="205" width="180" height="110" rx="12" fill="#7d3850"/><text class="head" x="880" y="248" text-anchor="middle">capture register</text><text class="body" x="880" y="282" text-anchor="middle">setup | edge | hold</text>
<path class="clock" d="M120 390V350H250V390H790V350H940V390"/><text class="body" x="95" y="420">launch edge</text><text class="body" x="785" y="420">capture edge +/- skew +/- jitter</text><text class="body" x="300" y="370">Tclock &gt;= tclk-to-Q,max + tcomb,max + tsetup + uncertainty</text><text class="body" x="300" y="405">hold: tclk-to-Q,min + tcomb,min must outlast thold (frequency does not fix it)</text>
<rect class="panel" x="45" y="500" width="1100" height="285" rx="16"/><text class="head" x="75" y="540">Asynchronous boundary: buy analog resolution time</text><text class="body" x="80" y="620">async input</text><path class="arrow" d="M185 612H290"/><rect class="box" x="300" y="560" width="150" height="105" rx="12" fill="#7d3850"/><text class="head" x="375" y="602" text-anchor="middle">FF1</text><text class="body" x="375" y="637" text-anchor="middle">may metastabilize</text><path class="risk" d="M370 555 C340 520 410 500 380 470"/><path class="arrow" d="M450 612H590"/><text class="body" x="520" y="590" text-anchor="middle">H one cycle</text><rect class="box" x="600" y="560" width="150" height="105" rx="12" fill="#176b72"/><text class="head" x="675" y="602" text-anchor="middle">FF2</text><text class="body" x="675" y="637" text-anchor="middle">samples later</text><path class="arrow" d="M750 612H900"/><text class="body" x="920" y="620">destination logic</text><path class="clock" d="M325 720H735"/><text class="body" x="460" y="755">same destination clock; no combinational logic between FF1 and FF2</text><text class="body" x="80" y="700" fill="#ff7b7b">Two flops reduce probability; they do not eliminate risk, capture narrow pulses, or safely synchronize a bus.</text>
</svg>
