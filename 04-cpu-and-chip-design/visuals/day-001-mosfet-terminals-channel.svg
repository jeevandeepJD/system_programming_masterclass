<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">MOSFET terminals and gate-controlled channel</title><desc id="desc">An NMOS cross-section labels gate, drain, source, and body; shows how gate voltage creates an electric-field-controlled channel; and marks the parasitic body diode caveat.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.label{font-size:19px;font-weight:700}.arrow{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}.wire{stroke:#f7fbff;stroke-width:5;fill:none}.dash{stroke:#75e6a4;stroke-width:4;stroke-dasharray:9 7;fill:none}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="45" y="58">NMOS: four terminals, one controlled channel</text>
<rect x="120" y="520" width="700" height="160" rx="12" fill="#315a88" stroke="#f7fbff" stroke-width="2"/><text class="head" x="470" y="650" text-anchor="middle">p-type body (B)</text>
<rect x="175" y="430" width="150" height="110" fill="#176b72" stroke="#f7fbff" stroke-width="2"/><text class="label" x="250" y="490" text-anchor="middle">n+ source (S)</text>
<rect x="615" y="430" width="150" height="110" fill="#176b72" stroke="#f7fbff" stroke-width="2"/><text class="label" x="690" y="490" text-anchor="middle">n+ drain (D)</text>
<rect x="350" y="300" width="240" height="62" rx="8" fill="#7d3850" stroke="#f7fbff" stroke-width="2"/><text class="head" x="470" y="340" text-anchor="middle">gate (G): insulated</text><rect x="350" y="375" width="240" height="25" fill="#ffd166"/><text class="body" x="610" y="394">oxide dielectric</text>
<path class="arrow" d="M470 365V425"/><text class="body" x="490" y="420">electric field</text><path class="dash" d="M325 505 C410 430 530 430 615 505"/><text class="head" x="470" y="455" text-anchor="middle" fill="#75e6a4">VGS &gt; VTH: inversion channel forms</text>
<path class="arrow" d="M665 468H340"/><text class="body" x="500" y="495">conventional ID</text>
<rect class="panel" x="850" y="150" width="285" height="210" rx="14"/><text class="head" x="875" y="190">Control is capacitive</text><text class="body" x="875" y="230">Gate voltage changes field;</text><text class="body" x="875" y="260">steady gate conduction is tiny.</text><text class="body" x="875" y="310">Channel current flows between</text><text class="body" x="875" y="340">drain and source--not into G.</text>
<rect class="panel" x="850" y="410" width="285" height="285" rx="14"/><text class="head" x="875" y="450">Body-diode caveat</text><path class="wire" d="M900 560H965 M1040 560H1100"/><polygon points="965,525 965,595 1030,560" fill="none" stroke="#ff7b7b" stroke-width="4"/><line x1="1040" y1="522" x2="1040" y2="598" stroke="#ff7b7b" stroke-width="4"/><text class="body" x="875" y="630">Source/drain junctions create</text><text class="body" x="875" y="660">parasitic diodes. Body bias can</text><text class="body" x="875" y="690">shift threshold (body effect).</text>
<text class="body" x="110" y="775">"Source" and "drain" are not freely interchangeable in every bias/body connection.</text>
</svg>
