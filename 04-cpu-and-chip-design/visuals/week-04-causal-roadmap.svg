<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Week 4 causal roadmap from software to transistor switching</title>
<desc id="desc">A layered roadmap connects software and ISA through datapath and control, RTL, synthesis and netlists, gates, and transistor switching. A dashed boundary separates synthesis from physical design, while timing, area, and power constrain every implementation choice.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff7b7b"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.box{stroke:#f7fbff;stroke-width:2}.arrow{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}.feedback{stroke:#ff7b7b;stroke-width:4;fill:none;marker-end:url(#r)}.boundary{stroke:#75e6a4;stroke-width:3;stroke-dasharray:10 8}.note{fill:#12283b;stroke:#6fa8dc;stroke-width:2}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="45" y="55">One contract, many implementation layers</text>
<rect class="box" x="45" y="115" width="155" height="92" rx="12" fill="#176b72"/><text class="head" x="122" y="150" text-anchor="middle">Software / ISA</text><text class="body" x="122" y="181" text-anchor="middle">visible contract</text>
<rect class="box" x="235" y="115" width="180" height="92" rx="12" fill="#315a88"/><text class="head" x="325" y="150" text-anchor="middle">Datapath + control</text><text class="body" x="325" y="181" text-anchor="middle">microarchitecture</text>
<rect class="box" x="450" y="115" width="135" height="92" rx="12" fill="#624b88"/><text class="head" x="517" y="150" text-anchor="middle">RTL</text><text class="body" x="517" y="181" text-anchor="middle">cycle intent</text>
<rect class="box" x="620" y="115" width="175" height="92" rx="12" fill="#7d3850"/><text class="head" x="707" y="150" text-anchor="middle">Synthesis / netlist</text><text class="body" x="707" y="181" text-anchor="middle">cells + wires</text>
<rect class="box" x="830" y="115" width="125" height="92" rx="12" fill="#8a5a24"/><text class="head" x="892" y="150" text-anchor="middle">Gates</text><text class="body" x="892" y="181" text-anchor="middle">restoration</text>
<rect class="box" x="990" y="115" width="155" height="92" rx="12" fill="#176b72"/><text class="head" x="1067" y="150" text-anchor="middle">Transistors</text><text class="body" x="1067" y="181" text-anchor="middle">charge moves</text>
<path class="arrow" d="M200 161H225"/><path class="arrow" d="M415 161H440"/><path class="arrow" d="M585 161H610"/><path class="arrow" d="M795 161H820"/><path class="arrow" d="M955 161H980"/>
<line class="boundary" x1="812" y1="82" x2="812" y2="330"/><text class="head" x="812" y="358" text-anchor="middle" fill="#75e6a4">explicit physical-design boundary</text>
<rect class="note" x="585" y="395" width="555" height="155" rx="15"/><text class="head" x="610" y="432">After synthesis: geometry still remains</text><text class="body" x="610" y="470">placement  ->  clock-tree synthesis  ->  routing</text><text class="body" x="610" y="505">parasitic extraction  ->  timing / power / physical signoff</text>
<rect class="note" x="45" y="395" width="485" height="155" rx="15"/><text class="head" x="70" y="432">Constraints judge candidate implementations</text><text class="body" x="70" y="472">TIMING: clock period, setup/hold, wire delay</text><text class="body" x="70" y="507">AREA: cells, memories, wiring and routing pressure</text>
<rect class="box" x="260" y="625" width="670" height="95" rx="18" fill="#4d294f"/><text class="head" x="595" y="663" text-anchor="middle">POWER:  alpha CV^2f + leakage + short-circuit</text><text class="body" x="595" y="698" text-anchor="middle">Voltage and frequency choices change both energy and timing margin.</text>
<path class="feedback" d="M930 675 C1090 675 1120 310 1030 225"/><path class="feedback" d="M260 675 C90 675 85 305 280 222"/><text class="body" x="950" y="610">physical limits</text><text class="body" x="65" y="610">shape architecture</text>
</svg>
