<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Evidence ladder from analog models to final silicon</title><desc id="desc">Four separated evidence levels show what ngspice analog simulation, HDL simulation, synthesis, and final silicon timing and layout can and cannot establish.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.box{stroke:#f7fbff;stroke-width:2}.arrow{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}.no{fill:#ff7b7b}.yes{fill:#75e6a4}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="45" y="58">Evidence supports bounded claims; tools do not prove the next layer</text>
<rect class="box" x="65" y="590" width="250" height="165" rx="14" fill="#176b72"/><text class="head" x="190" y="625" text-anchor="middle">1  |  ngspice</text><text class="body yes" x="90" y="665">[YES] model voltages/current</text><text class="body yes" x="90" y="697">[YES] analog delay trends</text><text class="body no" x="90" y="729">[NO] fabricated process</text>
<path class="arrow" d="M315 670H355"/>
<rect class="box" x="365" y="445" width="250" height="165" rx="14" fill="#315a88"/><text class="head" x="490" y="480" text-anchor="middle">2  |  HDL simulation</text><text class="body yes" x="390" y="520">[YES] exercised behavior</text><text class="body yes" x="390" y="552">[YES] scheduler / waveform</text><text class="body no" x="390" y="584">[NO] gates or setup/hold</text>
<path class="arrow" d="M615 525H655"/>
<rect class="box" x="665" y="300" width="250" height="165" rx="14" fill="#624b88"/><text class="head" x="790" y="335" text-anchor="middle">3  |  Synthesis</text><text class="body yes" x="690" y="375">[YES] inferred structure</text><text class="body yes" x="690" y="407">[YES] mapped netlist</text><text class="body no" x="690" y="439">[NO] routed timing/layout</text>
<path class="arrow" d="M915 380H955"/>
<rect class="box" x="925" y="115" width="245" height="165" rx="14" fill="#7d3850"/><text class="head" x="1047" y="150" text-anchor="middle">4  |  Final implementation</text><text class="body yes" x="950" y="190">[YES] extracted timing</text><text class="body yes" x="950" y="222">[YES] placed/routed layout</text><text class="body no" x="950" y="254">[NO] universal correctness</text>
<text class="body" x="365" y="670">Different question</text><text class="body" x="665" y="525">Different question</text><text class="body" x="920" y="380">Implementation required</text>
<rect class="panel" x="80" y="95" width="745" height="165" rx="16"/><text class="head" x="110" y="138">The handoff rule</text><text class="body" x="110" y="180">Passing one rung does not silently establish the next rung.</text><text class="body" x="110" y="215">Preserve assumptions, stimulus, target, constraints, and artifacts at every boundary.</text>
<text class="body" x="80" y="805">Even signoff supports specified modes/corners and checks; manufactured silicon still needs test and validation.</text>
</svg>
