<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">RTL through synthesis and the physical-design flow</title><desc id="desc">RTL proceeds through elaboration, generic inference, optimization, technology mapping, and a netlist. A boundary then separates synthesis from placement, clock-tree synthesis, routing, extraction, and signoff.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px}.box{stroke:#f7fbff;stroke-width:2}.arrow{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}.boundary{stroke:#75e6a4;stroke-width:4;stroke-dasharray:10 8}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="45" y="58">Synthesis ends with connectivity--not physical geometry</text>
<text class="head" x="45" y="115">LOGIC SYNTHESIS</text>
<rect class="box" x="45" y="145" width="145" height="105" rx="12" fill="#176b72"/><text class="head" x="117" y="183" text-anchor="middle">RTL</text><text class="body" x="117" y="218" text-anchor="middle">behavior + state</text><path class="arrow" d="M190 198H220"/>
<rect class="box" x="230" y="145" width="165" height="105" rx="12" fill="#315a88"/><text class="head" x="312" y="183" text-anchor="middle">Elaboration</text><text class="body" x="312" y="218" text-anchor="middle">widths  |  hierarchy</text><path class="arrow" d="M395 198H425"/>
<rect class="box" x="435" y="145" width="175" height="105" rx="12" fill="#624b88"/><text class="head" x="522" y="183" text-anchor="middle">Generic inference</text><text class="body" x="522" y="218" text-anchor="middle">mux  |  add  |  flop</text><path class="arrow" d="M610 198H640"/>
<rect class="box" x="650" y="145" width="155" height="105" rx="12" fill="#7d3850"/><text class="head" x="727" y="183" text-anchor="middle">Optimization</text><text class="body" x="727" y="218" text-anchor="middle">rewrite graph</text><path class="arrow" d="M805 198H835"/>
<rect class="box" x="845" y="145" width="170" height="105" rx="12" fill="#8a5a24"/><text class="head" x="930" y="183" text-anchor="middle">Tech mapping</text><text class="body" x="930" y="218" text-anchor="middle">target cells</text><path class="arrow" d="M1015 198H1045"/>
<rect class="box" x="1055" y="145" width="95" height="105" rx="12" fill="#176b72"/><text class="head" x="1102" y="183" text-anchor="middle">Netlist</text><text class="body" x="1102" y="218" text-anchor="middle">cells +</text><text class="body" x="1102" y="240" text-anchor="middle">nets</text>
<line class="boundary" x1="45" y1="310" x2="1145" y2="310"/><text class="head" x="595" y="345" text-anchor="middle" fill="#75e6a4">PHYSICAL-DESIGN BOUNDARY -- synthesis has not located or routed anything</text>
<text class="head" x="45" y="410">IMPLEMENTATION</text><rect class="box" x="75" y="455" width="180" height="105" rx="12" fill="#315a88"/><text class="head" x="165" y="495" text-anchor="middle">Placement</text><text class="body" x="165" y="530" text-anchor="middle">legal coordinates</text><path class="arrow" d="M255 507H300"/>
<rect class="box" x="310" y="455" width="180" height="105" rx="12" fill="#624b88"/><text class="head" x="400" y="495" text-anchor="middle">CTS</text><text class="body" x="400" y="530" text-anchor="middle">clock network</text><path class="arrow" d="M490 507H535"/>
<rect class="box" x="545" y="455" width="180" height="105" rx="12" fill="#7d3850"/><text class="head" x="635" y="495" text-anchor="middle">Routing</text><text class="body" x="635" y="530" text-anchor="middle">wires + vias</text><path class="arrow" d="M725 507H770"/>
<rect class="box" x="780" y="455" width="180" height="105" rx="12" fill="#8a5a24"/><text class="head" x="870" y="495" text-anchor="middle">Extraction</text><text class="body" x="870" y="530" text-anchor="middle">physical parasitics</text><path class="arrow" d="M960 507H1005"/>
<rect class="box" x="1015" y="455" width="130" height="105" rx="12" fill="#176b72"/><text class="head" x="1080" y="495" text-anchor="middle">Signoff</text><text class="body" x="1080" y="530" text-anchor="middle">timing  |  power</text>
<rect class="panel" x="95" y="650" width="1000" height="115" rx="15"/><text class="head" x="125" y="690">Constraints and feedback</text><text class="body" x="125" y="730">clock / I/O / area / power goals guide synthesis; extracted wire delay can force remapping, buffering, placement, or RTL changes.</text>
</svg>
