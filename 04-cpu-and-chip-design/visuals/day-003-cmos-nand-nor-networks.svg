<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Two-input static CMOS NAND and NOR transistor networks</title><desc id="desc">Complete pull-up and pull-down networks show parallel pMOS with series nMOS for NAND, and series pMOS with parallel nMOS for NOR, including the input rows that establish each rail path.</desc>
<style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:18px}.wire{stroke:#f7fbff;stroke-width:5;fill:none}.p{fill:#7d3850;stroke:#f7fbff;stroke-width:2}.n{fill:#176b72;stroke:#f7fbff;stroke-width:2}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}</style>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="45" y="58">NAND and NOR emerge from complementary rail paths</text>
<rect class="panel" x="45" y="100" width="525" height="650" rx="16"/><text class="head" x="307" y="140" text-anchor="middle">NAND2: Y = NOT (A AND B)</text><text class="body" x="80" y="185">PUN: parallel pMOS -> either LOW input pulls HIGH</text>
<text class="head" x="280" y="230">VDD</text><path class="wire" d="M300 245V280H180 M300 280H420"/><rect class="p" x="125" y="300" width="110" height="60" rx="10"/><text class="body" x="180" y="337" text-anchor="middle">pMOS A</text><rect class="p" x="365" y="300" width="110" height="60" rx="10"/><text class="body" x="420" y="337" text-anchor="middle">pMOS B</text><path class="wire" d="M180 360V400H300 M420 360V400H300 M300 400V440"/><circle cx="300" cy="440" r="8" fill="#ffd166"/><text class="head" x="325" y="447">Y</text>
<text class="body" x="80" y="490">PDN: series nMOS  ->  only A=B=1 pulls LOW</text><path class="wire" d="M300 440V510"/><rect class="n" x="245" y="510" width="110" height="60" rx="10"/><text class="body" x="300" y="547" text-anchor="middle">nMOS A</text><path class="wire" d="M300 570V590"/><rect class="n" x="245" y="590" width="110" height="60" rx="10"/><text class="body" x="300" y="627" text-anchor="middle">nMOS B</text><path class="wire" d="M300 650V695"/><text class="body" x="80" y="725">00,01,10  ->  HIGH  |  11  ->  LOW</text>
<rect class="panel" x="620" y="100" width="525" height="650" rx="16"/><text class="head" x="882" y="140" text-anchor="middle">NOR2: Y = NOT (A OR B)</text><text class="body" x="655" y="185">PUN: series pMOS -> only A=B=0 pulls HIGH</text>
<text class="head" x="855" y="230">VDD</text><path class="wire" d="M875 245V285"/><rect class="p" x="820" y="285" width="110" height="60" rx="10"/><text class="body" x="875" y="322" text-anchor="middle">pMOS A</text><path class="wire" d="M875 345V365"/><rect class="p" x="820" y="365" width="110" height="60" rx="10"/><text class="body" x="875" y="402" text-anchor="middle">pMOS B</text><path class="wire" d="M875 425V455"/><circle cx="875" cy="455" r="8" fill="#ffd166"/><text class="head" x="900" y="462">Y</text>
<text class="body" x="655" y="500">PDN: parallel nMOS  ->  either HIGH input pulls LOW</text><path class="wire" d="M875 455V535H755 M875 535H995"/><rect class="n" x="700" y="555" width="110" height="60" rx="10"/><text class="body" x="755" y="592" text-anchor="middle">nMOS A</text><rect class="n" x="940" y="555" width="110" height="60" rx="10"/><text class="body" x="995" y="592" text-anchor="middle">nMOS B</text><path class="wire" d="M755 615V665H875 M995 615V665H875 M875 665V695"/><text class="body" x="655" y="725">00  ->  HIGH  |  01,10,11  ->  LOW</text>
<text class="body" x="220" y="800">For every stable row, one network supplies a rail path and the complementary network is open.</text>
</svg>
