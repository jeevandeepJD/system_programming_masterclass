<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Dual-network derivation and physical facts omitted by truth tables</title><desc id="desc">A worked derivation builds the pull-down for A AND open-parenthesis B OR C close-parenthesis, constructs the dual pull-up by swapping series and parallel, and contrasts Boolean truth with resistance, fan-in, capacitance, and delay.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.box{stroke:#f7fbff;stroke-width:2}.arrow{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="45" y="58">Derive conduction first; Boolean output follows</text>
<rect class="panel" x="45" y="100" width="1100" height="180" rx="16"/><text class="head" x="75" y="140">Worked target: Y = NOT (A AND (B OR C))</text>
<rect class="box" x="80" y="175" width="250" height="70" rx="12" fill="#315a88"/><text class="body" x="205" y="205" text-anchor="middle">1. Output-LOW condition</text><text class="head" x="205" y="233" text-anchor="middle">G = A AND (B OR C)</text><path class="arrow" d="M330 210H395"/>
<rect class="box" x="405" y="175" width="300" height="70" rx="12" fill="#176b72"/><text class="body" x="555" y="205" text-anchor="middle">2. nMOS PDN</text><text class="head" x="555" y="233" text-anchor="middle">A series (B parallel C)</text><path class="arrow" d="M705 210H770"/>
<rect class="box" x="780" y="175" width="320" height="70" rx="12" fill="#7d3850"/><text class="body" x="940" y="205" text-anchor="middle">3. Dual pMOS PUN</text><text class="head" x="940" y="233" text-anchor="middle">A parallel (B series C)</text>
<rect class="panel" x="45" y="320" width="525" height="330" rx="16"/><text class="head" x="75" y="360">PDN conducts for G = 1</text><circle cx="155" cy="440" r="38" fill="#176b72" stroke="#f7fbff" stroke-width="2"/><text class="body" x="155" y="447" text-anchor="middle">nA</text><path d="M193 440H280" stroke="#f7fbff" stroke-width="5"/><path d="M280 440V395H355 M280 440V490H355" stroke="#f7fbff" stroke-width="5" fill="none"/><circle cx="400" cy="395" r="38" fill="#176b72" stroke="#f7fbff" stroke-width="2"/><text class="body" x="400" y="402" text-anchor="middle">nB</text><circle cx="400" cy="490" r="38" fill="#176b72" stroke="#f7fbff" stroke-width="2"/><text class="body" x="400" y="497" text-anchor="middle">nC</text><text class="body" x="75" y="575">Series means all conduction requirements;</text><text class="body" x="75" y="608">parallel means either branch is sufficient.</text>
<rect class="panel" x="620" y="320" width="525" height="330" rx="16"/><text class="head" x="650" y="360">PUN is the topology dual</text><path d="M690 445H770 M690 445V520H770" stroke="#f7fbff" stroke-width="5" fill="none"/><circle cx="815" cy="445" r="38" fill="#7d3850" stroke="#f7fbff" stroke-width="2"/><text class="body" x="815" y="452" text-anchor="middle">pA</text><circle cx="815" cy="520" r="38" fill="#7d3850" stroke="#f7fbff" stroke-width="2"/><text class="body" x="815" y="527" text-anchor="middle">pB</text><path d="M853 520H915" stroke="#f7fbff" stroke-width="5"/><circle cx="960" cy="520" r="38" fill="#7d3850" stroke="#f7fbff" stroke-width="2"/><text class="body" x="960" y="527" text-anchor="middle">pC</text><text class="body" x="650" y="575">Swap series and parallel; pMOS turns on</text><text class="body" x="650" y="608">for LOW controls, implementing NOT G.</text>
<rect class="panel" x="100" y="690" width="990" height="110" rx="14"/><text class="head" x="130" y="730">A truth table preserves function--but omits physics:</text><text class="body" x="130" y="770">series resistance  |  internal/output capacitance  |  fan-in load  |  rise/fall asymmetry  |  propagation delay</text>
</svg>
