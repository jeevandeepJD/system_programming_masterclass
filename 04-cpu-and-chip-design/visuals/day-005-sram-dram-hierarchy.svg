<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">6T SRAM feedback versus 1T1C DRAM charge storage</title><desc id="desc">A six-transistor SRAM cell uses cross-coupled inverter feedback and differential bit lines, while a one-transistor one-capacitor DRAM cell requires sensing, restoration, and refresh; a hierarchy connects registers, cache SRAM, and main DRAM.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.box{stroke:#f7fbff;stroke-width:2}.wire{stroke:#f7fbff;stroke-width:4;fill:none}.feedback{stroke:#75e6a4;stroke-width:4;fill:none;marker-end:url(#a)}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="45" y="58">Bit cells store differently; the memory hierarchy uses both</text>
<rect class="panel" x="45" y="100" width="525" height="475" rx="16"/><text class="head" x="307" y="140" text-anchor="middle">6T SRAM: feedback retains while powered</text><text class="body" x="80" y="185">Four transistors in two cross-coupled inverters + two access devices</text>
<rect class="box" x="175" y="250" width="115" height="80" rx="12" fill="#315a88"/><text class="head" x="232" y="298" text-anchor="middle">INV</text><rect class="box" x="330" y="250" width="115" height="80" rx="12" fill="#315a88"/><text class="head" x="387" y="298" text-anchor="middle">INV</text><path class="feedback" d="M290 270 C320 220 365 220 387 250"/><path class="feedback" d="M330 315 C300 365 250 365 232 330"/><text class="body" x="255" y="235">Q</text><text class="body" x="370" y="235">Q_bar</text>
<rect class="box" x="90" y="270" width="65" height="55" rx="8" fill="#176b72"/><rect class="box" x="465" y="270" width="65" height="55" rx="8" fill="#176b72"/><path class="wire" d="M65 298H90 M155 298H175 M445 298H465 M530 298H555"/><text class="body" x="70" y="255">BL</text><text class="body" x="505" y="255">BL_bar</text><text class="body" x="160" y="410">word line enables access; differential read</text><text class="body" x="100" y="450">sense amplifier detects small BL - BL_bar change</text><text class="body" x="100" y="490">feedback restores internal rails; no periodic refresh</text><text class="body" x="100" y="530" fill="#ff7b7b">volatile: power loss destroys state</text>
<rect class="panel" x="620" y="100" width="525" height="475" rx="16"/><text class="head" x="882" y="140" text-anchor="middle">1T1C DRAM: capacitor charge leaks</text><text class="body" x="655" y="185">Compact cell shares charge with a long bit line</text><path class="wire" d="M680 290H790"/><rect class="box" x="790" y="260" width="105" height="60" rx="10" fill="#176b72"/><text class="body" x="842" y="297" text-anchor="middle">access T</text><path class="wire" d="M895 290H965"/><path class="wire" d="M965 245V335 M995 245V335"/><text class="body" x="930" y="225">storage C</text><path d="M842 260V215" stroke="#ffd166" stroke-width="4"/><text class="body" x="810" y="205">word line</text><text class="body" x="655" y="360">1. activate: charge sharing perturbs bit line</text><text class="body" x="655" y="400">2. sense: amplifier resolves tiny difference</text><text class="body" x="655" y="440">3. restore: destructive read writes value back</text><text class="body" x="655" y="480">4. refresh: rows restored before leakage wins</text><text class="body" x="655" y="530" fill="#ff7b7b">"dynamic" means periodic refresh is required</text>
<rect class="panel" x="95" y="620" width="1000" height="150" rx="16"/><text class="head" x="120" y="660">Hierarchy use--not interchangeable cells</text><rect class="box" x="130" y="685" width="220" height="55" rx="10" fill="#7d3850"/><text class="body" x="240" y="720" text-anchor="middle">registers: closest / fewest</text><rect class="box" x="420" y="685" width="260" height="55" rx="10" fill="#315a88"/><text class="body" x="550" y="720" text-anchor="middle">cache SRAM: fast / costly per bit</text><rect class="box" x="750" y="685" width="300" height="55" rx="10" fill="#176b72"/><text class="body" x="900" y="720" text-anchor="middle">main DRAM: dense / longer access</text>
</svg>
