<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Complementary CMOS inverter conduction for LOW and HIGH inputs</title><desc id="desc">Side-by-side transistor paths show a LOW input turning on the PMOS pull-up and a HIGH input turning on the NMOS pull-down, with stable-state and transition-current behavior.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:18px}.wire{stroke:#f7fbff;stroke-width:5;fill:none}.on{stroke:#75e6a4;stroke-width:9;fill:none;marker-end:url(#a)}.off{stroke:#ff7b7b;stroke-width:4;stroke-dasharray:9 7;fill:none}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="45" y="58">Complementary paths actively restore each stable output</text>
<rect class="panel" x="45" y="105" width="525" height="560" rx="16"/><text class="head" x="307" y="148" text-anchor="middle">VIN = LOW (0)</text><text class="body" x="80" y="190">pMOS ON  |  nMOS OFF  |  VOUT  ->  VDD</text>
<text class="head" x="315" y="240">VDD</text><path class="wire" d="M350 255V310"/><rect x="300" y="310" width="100" height="70" rx="12" fill="#7d3850" stroke="#f7fbff" stroke-width="2"/><text class="body" x="350" y="352" text-anchor="middle">pMOS ON</text><path class="wire" d="M350 380V450"/><circle cx="350" cy="450" r="8" fill="#ffd166"/><text class="head" x="375" y="458">VOUT = HIGH</text><path class="wire" d="M350 450V510"/><rect x="300" y="510" width="100" height="70" rx="12" fill="#4d294f" stroke="#f7fbff" stroke-width="2"/><text class="body" x="350" y="552" text-anchor="middle">nMOS OFF</text><path class="off" d="M350 580V625"/><path class="on" d="M325 265V430"/><text class="body" x="80" y="620">Charge supplied from VDD; no intended DC rail-to-rail path.</text>
<rect class="panel" x="620" y="105" width="525" height="560" rx="16"/><text class="head" x="882" y="148" text-anchor="middle">VIN = HIGH (1)</text><text class="body" x="655" y="190">pMOS OFF  |  nMOS ON  |  VOUT  ->  GND</text>
<text class="head" x="890" y="240">VDD</text><path class="off" d="M925 255V310"/><rect x="875" y="310" width="100" height="70" rx="12" fill="#4d294f" stroke="#f7fbff" stroke-width="2"/><text class="body" x="925" y="352" text-anchor="middle">pMOS OFF</text><path class="wire" d="M925 380V450"/><circle cx="925" cy="450" r="8" fill="#ffd166"/><text class="head" x="950" y="458">VOUT = LOW</text><path class="wire" d="M925 450V510"/><rect x="875" y="510" width="100" height="70" rx="12" fill="#176b72" stroke="#f7fbff" stroke-width="2"/><text class="body" x="925" y="552" text-anchor="middle">nMOS ON</text><path class="wire" d="M925 580V625"/><path class="on" d="M950 465V615"/><text class="body" x="655" y="620">Charge removed to GND; no intended DC rail-to-rail path.</text>
<rect class="panel" x="120" y="705" width="950" height="90" rx="14"/><text class="head" x="145" y="742">Transition caveat:</text><text class="body" x="345" y="742">for a finite input edge, both devices can conduct briefly:</text><text class="body" x="345" y="774" fill="#ff7b7b">VDD  ->  pMOS  ->  nMOS  ->  GND (short-circuit current)</text>
</svg>
