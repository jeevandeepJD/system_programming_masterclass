<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">Dynamic energy, total power components, and voltage-frequency boundaries</title><desc id="desc">A worked capacitive switching example derives alpha C V squared f, adds leakage and short-circuit power, and shows why reducing voltage saves energy but reduces speed and noise headroom.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd166"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.big{font-size:27px;font-weight:700}.box{stroke:#f7fbff;stroke-width:2}.arrow{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="45" y="58">Switching power is a first model--not the whole budget</text>
<rect class="panel" x="45" y="100" width="690" height="330" rx="16"/><text class="head" x="75" y="140">One worked node</text><text class="body" x="75" y="180">C = 20 fF  |  V = 1.0 V  |   alpha  = 0.25  |  f = 2 GHz</text>
<rect class="box" x="80" y="215" width="180" height="85" rx="12" fill="#315a88"/><text class="body" x="170" y="245" text-anchor="middle">charge moved</text><text class="big" x="170" y="278" text-anchor="middle">Q = CV</text><path class="arrow" d="M260 257H310"/>
<rect class="box" x="320" y="215" width="180" height="85" rx="12" fill="#624b88"/><text class="body" x="410" y="245" text-anchor="middle">0 -> 1 -> 0 energy</text><text class="big" x="410" y="278" text-anchor="middle">E ~= CV^2</text><path class="arrow" d="M500 257H550"/>
<rect class="box" x="560" y="215" width="145" height="85" rx="12" fill="#7d3850"/><text class="body" x="632" y="245" text-anchor="middle">rate  alpha f</text><text class="big" x="632" y="278" text-anchor="middle">P =  alpha CV^2f</text>
<text class="big" x="75" y="365">Pdynamic = 0.25  x  20 fF  x  (1.0 V)^2  x  2 GHz = 10 uW</text><text class="body" x="75" y="402">Multiply across millions of active nodes; C and  alpha  differ by node and workload.</text>
<rect class="panel" x="785" y="100" width="360" height="330" rx="16"/><text class="head" x="815" y="140">Total chip power also includes</text><rect class="box" x="825" y="180" width="280" height="58" rx="10" fill="#176b72"/><text class="body" x="965" y="216" text-anchor="middle">capacitive switching</text><rect class="box" x="825" y="255" width="280" height="58" rx="10" fill="#7d3850"/><text class="body" x="965" y="291" text-anchor="middle">short-circuit overlap current</text><rect class="box" x="825" y="330" width="280" height="58" rx="10" fill="#4d294f"/><text class="body" x="965" y="366" text-anchor="middle">leakage while idle</text>
<rect class="panel" x="45" y="485" width="1100" height="285" rx="16"/><text class="head" x="75" y="530">Voltage-frequency tradeoff has boundaries</text>
<path class="arrow" d="M100 620H330"/><text class="big" x="215" y="590" text-anchor="middle">lower V</text><rect class="box" x="360" y="550" width="300" height="135" rx="14" fill="#176b72"/><text class="head" x="510" y="590" text-anchor="middle">benefit</text><text class="body" x="510" y="625" text-anchor="middle">dynamic energy falls as V^2</text><text class="body" x="510" y="658" text-anchor="middle">often less heat</text><path class="arrow" d="M660 620H720"/>
<rect class="box" x="750" y="535" width="350" height="170" rx="14" fill="#7d3850"/><text class="head" x="925" y="575" text-anchor="middle">boundary / cost</text><text class="body" x="925" y="612" text-anchor="middle">less transistor drive  ->  more delay</text><text class="body" x="925" y="645" text-anchor="middle">less noise headroom</text><text class="body" x="925" y="678" text-anchor="middle">frequency may need to fall</text>
<text class="body" x="75" y="740">Higher f raises dynamic power only if voltage, capacitance, activity, thermal limits, and timing closure permit it.</text>
</svg>
