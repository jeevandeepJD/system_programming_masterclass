<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 840" role="img" aria-labelledby="title desc">
<title id="title">NMOS pull-down and PMOS pull-up move charge on a capacitive node</title><desc id="desc">Two circuits distinguish voltage, charge, and current while a PMOS charges and an NMOS discharges a capacitive output node.</desc>
<defs><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#75e6a4"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff7b7b"/></marker><style>text{font-family:Arial,sans-serif;fill:#f7fbff}.title{font-size:34px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:18px}.wire{stroke:#f7fbff;stroke-width:5;fill:none}.charge{stroke:#75e6a4;stroke-width:5;fill:none;marker-end:url(#g)}.discharge{stroke:#ff7b7b;stroke-width:5;fill:none;marker-end:url(#r)}.panel{fill:#12283b;stroke:#6fa8dc;stroke-width:2}</style></defs>
<rect width="1190" height="840" fill="#08131e"/><text class="title" x="45" y="58">A node changes voltage only when current moves charge</text>
<rect class="panel" x="45" y="105" width="525" height="515" rx="16"/><text class="head" x="307" y="145" text-anchor="middle">PMOS pull-up: charge CLOAD</text><text class="body" x="80" y="190">gate LOW  ->  pMOS ON</text>
<text class="head" x="290" y="230">VDD = 3.3 V</text><path class="wire" d="M355 245V305"/><circle cx="355" cy="340" r="35" fill="#7d3850" stroke="#f7fbff" stroke-width="3"/><text class="body" x="355" y="347" text-anchor="middle">pMOS</text><path class="wire" d="M355 375V450H475"/><circle cx="355" cy="450" r="7" fill="#ffd166"/><text class="head" x="260" y="458">VOUT rises</text><path class="wire" d="M475 420V480 M505 420V480 M490 480V545"/><path class="wire" d="M455 545H525 M465 560H515 M478 575H502"/><text class="body" x="455" y="402">CLOAD</text><path class="charge" d="M315 260V420"/><text class="body" x="95" y="520">IUP enters node -> Q increases</text><text class="body" x="95" y="555">Q = C x V, so VOUT rises</text><text class="body" x="95" y="590">Current is charge/time; voltage does not "flow."</text>
<rect class="panel" x="620" y="105" width="525" height="515" rx="16"/><text class="head" x="882" y="145" text-anchor="middle">NMOS pull-down: discharge CLOAD</text><text class="body" x="655" y="190">gate HIGH  ->  nMOS ON</text>
<path class="wire" d="M745 300H1000"/><circle cx="855" cy="300" r="7" fill="#ffd166"/><text class="head" x="675" y="308">VOUT falls</text><path class="wire" d="M975 270V330 M1005 270V330 M990 210V270"/><text class="body" x="955" y="190">CLOAD</text><circle cx="855" cy="420" r="35" fill="#176b72" stroke="#f7fbff" stroke-width="3"/><text class="body" x="855" y="427" text-anchor="middle">nMOS</text><path class="wire" d="M855 300V385 M855 455V525"/><path class="wire" d="M820 525H890 M830 540H880 M843 555H867"/><path class="discharge" d="M895 330V500"/><text class="body" x="670" y="520">ID leaves node -> Q decreases</text><text class="body" x="670" y="555">I = dQ/dt = C x dV/dt</text><text class="body" x="670" y="590">Finite current + capacitance => finite transition time.</text>
<rect class="panel" x="125" y="665" width="940" height="120" rx="14"/><text class="head" x="155" y="705">Keep the quantities distinct</text><text class="body" x="155" y="745">Voltage V = electrical potential  |  Charge Q = stored amount  |  Current I = rate of charge movement</text>
</svg>
