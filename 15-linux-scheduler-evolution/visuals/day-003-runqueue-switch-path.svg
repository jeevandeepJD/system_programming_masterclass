<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 900" role="img" aria-labelledby="t d"><title id="t">Runqueue ownership through context switch</title><desc id="d">The local CPU locks its runqueue, optionally dequeues a blocking previous task, enqueues runnable work, picks next, and branches on whether previous equals next. A real switch crosses memory context, switch_to, and finish_task_switch before resuming a kernel continuation.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#ffd166"/></marker><style>text{font-family:sans-serif;fill:#fff}.h{font-size:34px;font-weight:700}.b{font-size:20px;font-weight:700}.s{font-size:18px}.box{stroke:#fff;stroke-width:2}.a{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1190" height="900" fill="#07121d"/><text class="h" x="55" y="62">Day 3: the owning runqueue serializes the decision</text>
<g text-anchor="middle"><rect class="box" x="55" y="130" width="180" height="90" rx="12" fill="#315a88"/><text class="b" x="145" y="167">local rq lock</text><text class="s" x="145" y="197">CPU N owns choice</text><rect class="box" x="285" y="130" width="190" height="90" rx="12" fill="#7d3850"/><text class="b" x="380" y="167">dequeue prev</text><text class="s" x="380" y="197">only if blocking</text><rect class="box" x="525" y="130" width="190" height="90" rx="12" fill="#176b72"/><text class="b" x="620" y="167">enqueue task</text><text class="s" x="620" y="197">class callback</text><rect class="box" x="765" y="130" width="180" height="90" rx="12" fill="#624b88"/><text class="b" x="855" y="167">pick_next</text><text class="s" x="855" y="197">active classes</text><polygon class="box" points="1050,125 1140,175 1050,225 970,175" fill="#9a6518"/><text class="b" x="1055" y="181">prev == next?</text></g><path class="a" d="M235 175h40M475 175h40M715 175h40M945 175h18"/>
<path class="a" d="M1050 225v80H890"/><text class="s" x="1072" y="267">yes</text><rect class="box" x="650" y="285" width="240" height="75" rx="12" fill="#34485d"/><text class="b" x="770" y="315" text-anchor="middle">unlock / balance callbacks</text><text class="s" x="770" y="342" text-anchor="middle">no stack switch</text>
<text class="s" x="1030" y="355">no: rq→curr = next</text><path class="a" d="M1050 225v180H955"/><rect class="box" x="745" y="390" width="210" height="90" rx="12" fill="#264d69"/><text class="b" x="850" y="425" text-anchor="middle">context_switch</text><text class="s" x="850" y="454" text-anchor="middle">MM / lazy TLB</text><path class="a" d="M745 435H625"/><rect class="box" x="385" y="390" width="240" height="90" rx="12" fill="#176b72"/><text class="b" x="505" y="425" text-anchor="middle">switch_to(prev,next)</text><text class="s" x="505" y="454" text-anchor="middle">stack + registers</text><path class="a" d="M385 435H265"/><rect class="box" x="55" y="390" width="210" height="90" rx="12" fill="#624b88"/><text class="b" x="160" y="425" text-anchor="middle">finish_task_switch</text><text class="s" x="160" y="454" text-anchor="middle">resumed context</text>
<rect x="55" y="545" width="1080" height="235" rx="18" fill="#12283b" stroke="#6fa8dc" stroke-width="2"/><text class="b" x="85" y="585">Ownership invariants</text><text class="s" x="85" y="625">• A runnable task is represented exactly once on a specific per-CPU rq.</text><text class="s" x="85" y="665">• rq lock protects membership, accounting, rq→curr, and local selection.</text><text class="s" x="85" y="705">• Migration transfers ownership with an ordered one- or two-rq protocol.</text><text class="s" x="85" y="745">• switch_to resumes a kernel continuation; return to userspace is a later boundary.</text><text class="s" x="595" y="842" text-anchor="middle">Entering schedule does not imply a context switch: prev == next is a valid result.</text></svg>
