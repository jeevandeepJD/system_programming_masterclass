<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 900" role="img" aria-labelledby="t d"><title id="t">Pipe ping-pong observations and switch-count limits</title><desc id="d">A timeline of 32 request and reply pipe round trips shows observable protocol completion. Below it, many possible kernel events demonstrate why round trips cannot equal an exact number of context switches.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#ffd166"/></marker><style>text{font-family:sans-serif;fill:#fff}.h{font-size:34px;font-weight:700}.b{font-size:22px;font-weight:700}.s{font-size:18px}.a{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1190" height="900" fill="#07121d"/><text class="h" x="55" y="62">Day 3 evidence: protocol turns ≠ kernel switches</text><text class="b" x="70" y="135">Parent</text><text class="b" x="70" y="300">Child</text><line x1="180" y1="125" x2="180" y2="360" stroke="#fff" stroke-width="4"/><line x1="1080" y1="125" x2="1080" y2="360" stroke="#fff" stroke-width="4"/>
<path class="a" d="M190 160L1065 275"/><text class="s" x="580" y="192" text-anchor="middle">request byte</text><path class="a" d="M1065 315L190 205"/><text class="s" x="625" y="300" text-anchor="middle">reply byte</text><rect x="420" y="350" width="350" height="65" rx="12" fill="#22563f" stroke="#fff" stroke-width="2"/><text class="b" x="595" y="390" text-anchor="middle">× 32 completed round trips</text>
<text class="b" x="55" y="485">Each turn permits several histories</text><g class="s" text-anchor="middle"><rect x="55" y="520" width="200" height="100" rx="12" fill="#315a88"/><text x="155" y="560">pipe buffers</text><text x="155" y="590">without immediate block</text><rect x="275" y="520" width="200" height="100" rx="12" fill="#624b88"/><text x="375" y="560">peer sleeps / wakes</text><text x="375" y="590">then waits runnable</text><rect x="495" y="520" width="200" height="100" rx="12" fill="#176b72"/><text x="595" y="560">peer runs</text><text x="595" y="590">immediately or later</text><rect x="715" y="520" width="200" height="100" rx="12" fill="#9a6518"/><text x="815" y="560">interrupt / preempt</text><text x="815" y="590">adds switches</text><rect x="935" y="520" width="200" height="100" rx="12" fill="#7d3850"/><text x="1035" y="560">migration / host work</text><text x="1035" y="590">changes aggregates</text></g>
<rect x="55" y="675" width="1080" height="130" rx="16" fill="#682e40" stroke="#ffb3bd" stroke-width="3"/><text class="b" x="595" y="718" text-anchor="middle">INVALID EQUATION</text><text class="b" x="595" y="758" text-anchor="middle">32 round trips × assumed switches per turn = exact kernel switch count</text><text class="s" x="595" y="789" text-anchor="middle">Observed: completion and opportunities to block/wake · exact switch count: explicitly none</text><text class="s" x="595" y="855" text-anchor="middle">Pinned source proves prev != next gates switching; it does not prove which branch this lab took.</text></svg>
