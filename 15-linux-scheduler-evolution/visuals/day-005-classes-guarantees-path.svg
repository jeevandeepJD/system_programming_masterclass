<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 900" role="img" aria-labelledby="t d"><title id="t">Scheduler class precedence and within-class contracts</title><desc id="d">A descending precedence ladder orders stop, deadline, real-time, fair, optional ext, and idle classes. Beside each class is its own within-class contract, emphasizing that class precedence and internal ordering are separate decisions.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#ffd166"/></marker><style>text{font-family:sans-serif;fill:#fff}.h{font-size:34px;font-weight:700}.b{font-size:21px;font-weight:700}.s{font-size:18px}.box{stroke:#fff;stroke-width:2}</style></defs><rect width="1190" height="900" fill="#07121d"/><text class="h" x="55" y="62">Day 5: precedence chooses a class; each class chooses a task</text><text class="b" x="260" y="118" text-anchor="middle">CLASS ORDER · highest first</text><text class="b" x="800" y="118" text-anchor="middle">WITHIN-CLASS CONTRACT</text>
<g><rect class="box" x="70" y="145" width="380" height="82" rx="12" fill="#862f43"/><text class="b" x="260" y="195" text-anchor="middle">STOP</text><text class="s" x="510" y="195">kernel-internal coordination; not a userspace policy</text><rect class="box" x="70" y="245" width="380" height="82" rx="12" fill="#9a6518"/><text class="b" x="260" y="295" text-anchor="middle">SCHED_DEADLINE</text><text class="s" x="510" y="282">EDF + CBS reservation</text><text class="s" x="510" y="310">runtime / deadline / period; admission + throttling</text><rect class="box" x="70" y="345" width="380" height="82" rx="12" fill="#6e458c"/><text class="b" x="260" y="395" text-anchor="middle">RT · FIFO / RR</text><text class="s" x="510" y="382">fixed priority; FIFO no slice</text><text class="s" x="510" y="410">RR quantum only among equal-priority peers</text><rect class="box" x="70" y="445" width="380" height="82" rx="12" fill="#176b72"/><text class="b" x="260" y="495" text-anchor="middle">FAIR</text><text class="s" x="510" y="482">weighted service</text><text class="s" x="510" y="510">6.12: EEVDF eligibility + virtual deadline</text><rect class="box" x="70" y="545" width="380" height="82" rx="12" fill="#315a88"/><text class="b" x="260" y="595" text-anchor="middle">optional EXT</text><text class="s" x="510" y="595">SCX policy when configured and active</text><rect class="box" x="70" y="645" width="380" height="82" rx="12" fill="#3c4852"/><text class="b" x="260" y="695" text-anchor="middle">IDLE</text><text class="s" x="510" y="695">final runnable fallback</text></g>
<path d="M35 150v570" stroke="#ffd166" stroke-width="5"/><path d="M25 170l10-20 10 20" fill="#ffd166"/><text class="s" x="25" y="755" transform="rotate(-90 25 755)">higher precedence</text><rect x="70" y="775" width="1065" height="75" rx="14" fill="#713f46" stroke="#fff" stroke-width="2"/><text class="s" x="602" y="807" text-anchor="middle">Class order is conditional on runnable, legal, unthrottled work.</text><text class="s" x="602" y="835" text-anchor="middle">A deadline-class deadline is not an EEVDF virtual deadline; nice is not RT priority.</text></svg>
