<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 900" role="img" aria-labelledby="t d"><title id="t">Priority inversion, inheritance, and lab limits</title><desc id="d">Low-priority L holds a mutex, high-priority H blocks on it, and medium-priority M preempts L. Priority inheritance donates H's effective priority to L until unlock, then deboosts. The normal userspace lab proves PI attribute support and completion, not an observed donation.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#ffd166"/></marker><style>text{font-family:sans-serif;fill:#fff}.h{font-size:34px;font-weight:700}.b{font-size:21px;font-weight:700}.s{font-size:18px}.box{stroke:#fff;stroke-width:2}.a{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1190" height="900" fill="#07121d"/><text class="h" x="55" y="62">Day 5 evidence: priority inheritance repairs one blocking chain</text>
<g text-anchor="middle"><circle class="box" cx="170" cy="205" r="82" fill="#315a88"/><text class="b" x="170" y="192">L · low</text><text class="s" x="170" y="222">holds mutex</text><circle class="box" cx="595" cy="205" r="82" fill="#862f43"/><text class="b" x="595" y="192">H · high</text><text class="s" x="595" y="222">blocks on mutex</text><circle class="box" cx="1015" cy="205" r="82" fill="#9a6518"/><text class="b" x="1015" y="192">M · medium</text><text class="s" x="1015" y="222">preempts L</text></g><path class="a" d="M510 205H262"/><text class="s" x="385" y="185" text-anchor="middle">waits for owner</text><path class="a" d="M932 245C790 340 350 340 230 263"/><text class="s" x="595" y="337" text-anchor="middle">without PI: M delays the only task that can release H</text>
<rect class="box" x="90" y="390" width="1010" height="175" rx="18" fill="#22563f"/><text class="b" x="595" y="430" text-anchor="middle">PI path</text><text class="s" x="130" y="475">H blocks → rtmutex identifies L as owner → H donates effective priority → L runs ahead of M</text><text class="s" x="130" y="515">L unlocks → H acquires / becomes runnable → L deboosts to normal priority</text><text class="s" x="130" y="545">Donation changes effective priority, not normal_prio; deadlock and unbounded critical sections remain.</text>
<rect x="55" y="620" width="510" height="210" rx="16" fill="#183b5b" stroke="#fff" stroke-width="2"/><text class="b" x="310" y="660" text-anchor="middle">NORMAL USERSPACE LAB OBSERVES</text><text class="s" x="85" y="705">✓ PTHREAD_PRIO_INHERIT accepted or SKIP</text><text class="s" x="85" y="745">✓ bounded mutex contention completed</text><text class="s" x="85" y="785">✓ no RT policy change requested</text><rect x="625" y="620" width="510" height="210" rx="16" fill="#682e40" stroke="#fff" stroke-width="2"/><text class="b" x="880" y="660" text-anchor="middle">DOES NOT OBSERVE</text><text class="s" x="655" y="705">? owner boost / class transition / futex op</text><text class="s" x="655" y="745">? privileged FIFO, RR, or deadline behavior</text><text class="s" x="655" y="785">? worst-case latency bound</text><text class="s" x="595" y="870" text-anchor="middle">A PI-capable attribute is protocol support—not proof that donation occurred in this run.</text></svg>
