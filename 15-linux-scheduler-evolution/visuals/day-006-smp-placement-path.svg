<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 900" role="img" aria-labelledby="t d"><title id="t">SMP placement from legal mask to destination runqueue</title><desc id="d">A placement pipeline computes the effective allowed CPU mask, invokes class CPU selection, weighs topology, capacity, and locality, then enqueues on one destination runqueue. A topology sketch compares SMT siblings, another core, and a remote NUMA node.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#ffd166"/></marker><style>text{font-family:sans-serif;fill:#fff}.h{font-size:34px;font-weight:700}.b{font-size:21px;font-weight:700}.s{font-size:18px}.box{stroke:#fff;stroke-width:2}.a{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1190" height="900" fill="#07121d"/><text class="h" x="55" y="62">Day 6: placement is legality first, preference second</text>
<g text-anchor="middle"><rect class="box" x="55" y="120" width="240" height="125" rx="16" fill="#315a88"/><text class="b" x="175" y="158">EFFECTIVE MASK</text><text class="s" x="175" y="190">affinity ∩ cpuset</text><text class="s" x="175" y="218">∩ active CPU rules</text><rect class="box" x="350" y="120" width="230" height="125" rx="16" fill="#624b88"/><text class="b" x="465" y="173">select_task_rq()</text><text class="s" x="465" y="207">class placement policy</text><rect class="box" x="635" y="105" width="290" height="155" rx="16" fill="#9a6518"/><text class="b" x="780" y="148">TRADEOFF</text><text class="s" x="780" y="180">idle capacity / load</text><text class="s" x="780" y="208">cache + NUMA locality</text><text class="s" x="780" y="236">SMT / energy / wake affinity</text><rect class="box" x="980" y="120" width="155" height="125" rx="16" fill="#176b72"/><text class="b" x="1057" y="166">CPU N rq</text><text class="s" x="1057" y="198">enqueue</text><text class="s" x="1057" y="224">later select</text></g><path class="a" d="M295 182h45M580 182h45M925 182h45"/>
<text class="b" x="55" y="335">Example candidate topology · task allowed on CPUs 2–5</text><rect x="55" y="375" width="690" height="350" rx="18" fill="#12283b" stroke="#6fa8dc" stroke-width="2"/><rect class="box" x="90" y="420" width="270" height="230" rx="15" fill="#263d54"/><text class="b" x="225" y="455" text-anchor="middle">NUMA node 0</text><rect class="box" x="115" y="485" width="220" height="125" rx="12" fill="#315a88"/><text class="s" x="225" y="518" text-anchor="middle">shared physical core</text><circle cx="165" cy="565" r="30" fill="#176b72"/><text class="s" x="165" y="572" text-anchor="middle">2</text><circle cx="285" cy="565" r="30" fill="#9a6518"/><text class="s" x="285" y="572" text-anchor="middle">3</text><text class="s" x="225" y="640" text-anchor="middle">SMT siblings share capacity</text><rect class="box" x="410" y="420" width="300" height="230" rx="15" fill="#3c3158"/><text class="b" x="560" y="455" text-anchor="middle">NUMA node 1</text><circle cx="500" cy="540" r="38" fill="#176b72"/><text class="s" x="500" y="547" text-anchor="middle">4</text><circle cx="625" cy="540" r="38" fill="#315a88"/><text class="s" x="625" y="547" text-anchor="middle">5</text><text class="s" x="560" y="610" text-anchor="middle">more core capacity</text><text class="s" x="560" y="640" text-anchor="middle">possible remote memory cost</text>
<rect x="790" y="375" width="345" height="350" rx="18" fill="#713f46" stroke="#fff" stroke-width="2"/><text class="b" x="962" y="420" text-anchor="middle">No universal winner</text><text class="s" x="820" y="468">CPU 3: idle-looking,</text><text class="s" x="820" y="497">but shares CPU 2's core</text><text class="s" x="820" y="548">CPU 4: full core capacity,</text><text class="s" x="820" y="577">but remote NUMA locality</text><text class="s" x="820" y="628">CPU 2: warm locality,</text><text class="s" x="820" y="657">but already busy</text><text class="s" x="595" y="805" text-anchor="middle">An idle CPU outside the effective mask is not a legal destination.</text><text class="s" x="595" y="842" text-anchor="middle">Placement chooses a runqueue; local class selection later chooses a task.</text></svg>
