<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 900" role="img" aria-labelledby="t d"><title id="t">Day 1 evidence boundary</title><desc id="d">A split diagram contrasts what pinned source proves about task fields and scheduler control flow with what runtime observations prove about one host execution. Neither side proves the claims belonging to the other.</desc><defs><style>text{font-family:sans-serif;fill:#fff}.h{font-size:34px;font-weight:700}.b{font-size:22px;font-weight:700}.s{font-size:18px}.box{stroke-width:3;stroke:#fff}</style></defs><rect width="1190" height="900" fill="#08131e"/><text class="h" x="55" y="62">Day 1 evidence: source structure vs live behavior</text><line x1="595" y1="115" x2="595" y2="790" stroke="#ffd166" stroke-width="5" stroke-dasharray="14 10"/>
<rect class="box" x="55" y="120" width="500" height="610" rx="18" fill="#183b5b"/><text class="b" x="305" y="165" text-anchor="middle">PINNED SOURCE PROOF · Linux 6.12</text><text class="s" x="85" y="215">✓ separate __state, on_rq, on_cpu fields</text><text class="s" x="85" y="255">✓ blocking may dequeue prev</text><text class="s" x="85" y="295">✓ pick_next_task runs before switch branch</text><text class="s" x="85" y="335">✓ prev != next gates context_switch</text><text class="s" x="85" y="375">✓ MM work precedes switch_to</text><rect x="85" y="425" width="440" height="235" rx="12" fill="#10283e" stroke="#7fb3df" stroke-width="2"/><text class="b" x="110" y="468">Does not prove</text><text class="s" x="110" y="508">• this host runs that commit</text><text class="s" x="110" y="548">• a particular branch executed</text><text class="s" x="110" y="588">• later upstream is unchanged</text><text class="s" x="110" y="628">• simulator output is a kernel trace</text>
<rect class="box" x="635" y="120" width="500" height="610" rx="18" fill="#24533f"/><text class="b" x="885" y="165" text-anchor="middle">RUNTIME OBSERVATION · bounded lab</text><text class="s" x="665" y="215">✓ teaching simulator built and completed</text><text class="s" x="665" y="255">✓ deterministic toy deadline sequence</text><text class="s" x="665" y="295">✓ host release can be recorded separately</text><text class="s" x="665" y="335">✓ literal completion markers are observable</text><rect x="665" y="385" width="440" height="275" rx="12" fill="#173a2d" stroke="#8bd2a9" stroke-width="2"/><text class="b" x="690" y="428">Does not prove</text><text class="s" x="690" y="468">• host task state or runqueue choice</text><text class="s" x="690" y="508">• Linux EEVDF ran</text><text class="s" x="690" y="548">• a host context switch occurred</text><text class="s" x="690" y="588">• exact cause of any switch counter</text><text class="s" x="690" y="628">• source symbol = observed execution</text>
<rect x="120" y="775" width="950" height="75" rx="16" fill="#713f46" stroke="#fff" stroke-width="2"/><text class="b" x="595" y="807" text-anchor="middle">Evidence boundary</text><text class="s" x="595" y="837" text-anchor="middle">Source answers “what can this commit do?” · observation answers “what happened in this run?”</text></svg>
