<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 900" role="img" aria-labelledby="t d"><title id="t">Scheduler debugging workflow</title><desc id="d">A branching workflow starts from a measurable symptom, classifies the task as blocked, runnable, running, throttled, or unknown, develops competing hypotheses, collects a baseline and optional trace, maps observations to pinned source, then applies a scoped mitigation and regression check.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#ffd166"/></marker><style>text{font-family:sans-serif;fill:#fff}.h{font-size:34px;font-weight:700}.b{font-size:20px;font-weight:700}.s{font-size:18px}.box{stroke:#fff;stroke-width:2}.a{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1190" height="900" fill="#07121d"/><text class="h" x="55" y="62">Day 7: turn “scheduler slow” into a falsifiable report</text>
<rect class="box" x="430" y="105" width="330" height="75" rx="14" fill="#7d3850"/><text class="b" x="595" y="138" text-anchor="middle">1 · MEASURABLE SYMPTOM</text><text class="s" x="595" y="165" text-anchor="middle">task + operation + event boundary</text><path class="a" d="M595 180v45"/><text class="b" x="595" y="260" text-anchor="middle">2 · CLASSIFY BAD INTERVAL</text>
<g text-anchor="middle"><rect class="box" x="40" y="285" width="190" height="75" rx="12" fill="#315a88"/><text class="b" x="135" y="330">BLOCKED</text><rect class="box" x="270" y="285" width="190" height="75" rx="12" fill="#176b72"/><text class="b" x="365" y="330">RUNNABLE</text><rect class="box" x="500" y="285" width="190" height="75" rx="12" fill="#624b88"/><text class="b" x="595" y="330">RUNNING</text><rect class="box" x="730" y="285" width="190" height="75" rx="12" fill="#9a6518"/><text class="b" x="825" y="330">THROTTLED</text><rect class="box" x="960" y="285" width="190" height="75" rx="12" fill="#4b5864"/><text class="b" x="1055" y="330">UNKNOWN</text></g><path d="M595 270V285M135 270H1055M135 270v15M365 270v15M825 270v15M1055 270v15" stroke="#ffd166" stroke-width="4" fill="none"/>
<path class="a" d="M595 360v45"/><rect class="box" x="375" y="410" width="440" height="78" rx="14" fill="#713f46"/><text class="b" x="595" y="442" text-anchor="middle">3 · COMPETING HYPOTHESES</text><text class="s" x="595" y="470" text-anchor="middle">write observations that separate H1 from H2</text><path class="a" d="M595 488v38"/>
<g text-anchor="middle"><rect class="box" x="70" y="535" width="270" height="95" rx="14" fill="#315a88"/><text class="b" x="205" y="570">4 · BASELINE</text><text class="s" x="205" y="600">/proc · policy · mask · cgroup</text><rect class="box" x="460" y="535" width="270" height="95" rx="14" fill="#624b88"/><text class="b" x="595" y="570">5 · OPTIONAL TRACE</text><text class="s" x="595" y="600">only if needed + permitted</text><rect class="box" x="850" y="535" width="270" height="95" rx="14" fill="#176b72"/><text class="b" x="985" y="570">6 · PINNED SOURCE</text><text class="s" x="985" y="600">map events, not imagined branches</text></g><path class="a" d="M595 630v65"/><rect class="box" x="260" y="705" width="670" height="100" rx="16" fill="#22563f"/><text class="b" x="595" y="740" text-anchor="middle">7 · MITIGATION → BOUNDED REGRESSION</text><text class="s" x="595" y="772" text-anchor="middle">one reversible change · completion marker · distribution/counter delta</text><text class="s" x="595" y="795" text-anchor="middle">record alternatives and limits that remain</text><text class="s" x="595" y="860" text-anchor="middle">Tracing unavailable or denied? Record SKIP—never fabricate event evidence from source.</text></svg>
