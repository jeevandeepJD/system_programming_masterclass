<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 900" role="img" aria-labelledby="t d"><title id="t">Waiter and waker ordering without lost wakeups</title><desc id="d">Parallel waiter and waker lanes show waiter registration, state publication, predicate recheck, schedule, condition store, wake queue scan, try_to_wake_up, target runqueue activation, and resumed predicate recheck. A red inset shows the unsafe lost-wakeup ordering.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#ffd166"/></marker><style>text{font-family:sans-serif;fill:#fff}.h{font-size:34px;font-weight:700}.b{font-size:21px;font-weight:700}.s{font-size:18px}.a{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}.box{stroke:#fff;stroke-width:2}</style></defs><rect width="1190" height="900" fill="#07121d"/><text class="h" x="55" y="62">Day 2: publish sleep before the decisive recheck</text><text class="b" x="190" y="125" text-anchor="middle">WAITER CPU</text><text class="b" x="840" y="125" text-anchor="middle">WAKER CPU</text><line x1="585" y1="100" x2="585" y2="680" stroke="#53738e" stroke-width="3" stroke-dasharray="10 8"/>
<g text-anchor="middle"><rect class="box" x="60" y="155" width="390" height="72" rx="12" fill="#315a88"/><text class="b" x="255" y="185">condition loop: predicate false</text><text class="s" x="255" y="211">prepare_to_wait_event()</text><rect class="box" x="60" y="270" width="390" height="86" rx="12" fill="#624b88"/><text class="b" x="255" y="302">link entry + set_current_state</text><text class="s" x="255" y="331">publication / ordering barrier</text><rect class="box" x="60" y="405" width="390" height="80" rx="12" fill="#7c4550"/><text class="b" x="255" y="437">recheck false → schedule()</text><text class="s" x="255" y="465">dequeue and stop consuming CPU</text><rect class="box" x="720" y="155" width="390" height="72" rx="12" fill="#176b72"/><text class="b" x="915" y="185">producer stores CONDITION = true</text><text class="s" x="915" y="211">store ordered before wake call</text><rect class="box" x="720" y="270" width="390" height="86" rx="12" fill="#1f7049"/><text class="b" x="915" y="302">wake_up() scans wait queue</text><text class="s" x="915" y="331">callback → try_to_wake_up()</text><rect class="box" x="720" y="405" width="390" height="80" rx="12" fill="#9a6518"/><text class="b" x="915" y="437">select CPU → ttwu_queue()</text><text class="s" x="915" y="465">rq lock activation or remote wake list</text><rect class="box" x="365" y="560" width="460" height="90" rx="14" fill="#176b72"/><text class="b" x="595" y="594">TASK_RUNNING → later selected</text><text class="s" x="595" y="624">switch → loop rechecks predicate → finish_wait()</text></g>
<path class="a" d="M255 227v35M255 356v41M450 445H710M915 227v35M915 356v41M915 485C915 535 810 545 780 555M365 605C260 605 220 530 220 493"/><text class="s" x="520" y="430" text-anchor="middle">matching state + ordered store</text>
<rect x="55" y="720" width="1080" height="125" rx="15" fill="#6a2836" stroke="#ffb3bd" stroke-width="3"/><text class="b" x="80" y="757">LOST-WAKEUP (unsafe order)</text><text class="s" x="80" y="792">waiter tests false → waker stores true + wake finds no published sleeper → waiter publishes sleep → event already gone</text><text class="s" x="80" y="823">Fix: register + publish state, then recheck; wakeup grants eligibility, never ownership of the condition.</text></svg>
