<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 900" role="img" aria-labelledby="t d"><title id="t">Task facts, selection, and switching</title><desc id="d">Three independent task facts—sleep state, runqueue membership, and CPU execution—change along blocking, wakeup, selection, and context-switch paths. A lower boundary distinguishes choosing next from switching machine context.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#ffd166"/></marker><style>text{font-family:sans-serif;fill:#fff}.h{font-size:34px;font-weight:700}.b{font-size:21px;font-weight:700}.s{font-size:18px}.box{stroke:#fff;stroke-width:2}.a{stroke:#ffd166;stroke-width:5;fill:none;marker-end:url(#a)}</style></defs><rect width="1190" height="900" fill="#08131e"/><text class="h" x="55" y="62">Day 1: one task, three independent facts</text>
<text class="b" x="55" y="120">Causal transitions</text><g text-anchor="middle"><rect class="box" x="55" y="150" width="240" height="140" rx="15" fill="#176b72"/><text class="b" x="175" y="190">RUNNING</text><text class="s" x="175" y="222">__state = TASK_RUNNING</text><text class="s" x="175" y="249">on_rq = 1 · on_cpu = 1</text><rect class="box" x="365" y="150" width="230" height="140" rx="15" fill="#7d3850"/><text class="b" x="480" y="190">BLOCK / DEQUEUE</text><text class="s" x="480" y="222">sleep state published</text><text class="s" x="480" y="249">on_rq → 0 · on_cpu → 0</text><rect class="box" x="665" y="150" width="220" height="140" rx="15" fill="#315a88"/><text class="b" x="775" y="190">WAKE / RUNNABLE</text><text class="s" x="775" y="222">state → TASK_RUNNING</text><text class="s" x="775" y="249">on_rq → 1 · on_cpu = 0</text><rect class="box" x="955" y="150" width="180" height="140" rx="15" fill="#176b72"/><text class="b" x="1045" y="190">SELECTED</text><text class="s" x="1045" y="222">rq→curr</text><text class="s" x="1045" y="249">on_cpu → 1</text></g><path class="a" d="M295 220h60M595 220h60M885 220h60"/><text class="s" x="325" y="205" text-anchor="middle">false predicate</text><text class="s" x="625" y="205" text-anchor="middle">event</text><text class="s" x="915" y="205" text-anchor="middle">policy pick</text>
<rect x="55" y="355" width="1080" height="190" rx="18" fill="#12283b" stroke="#6fa8dc" stroke-width="2"/><text class="b" x="85" y="400">Selection ≠ switch</text><rect class="box" x="95" y="430" width="275" height="75" rx="12" fill="#624b88"/><text class="b" x="232" y="465" text-anchor="middle">pick_next_task()</text><text class="s" x="232" y="491" text-anchor="middle">policy chooses next</text><polygon class="box" points="470,428 600,468 470,508 405,468" fill="#9a6518"/><text class="b" x="500" y="474" text-anchor="middle">prev == next?</text><path class="a" d="M370 468h30M600 468h65"/><text class="s" x="535" y="535">yes: unlock, no architecture switch</text><rect class="box" x="670" y="430" width="420" height="75" rx="12" fill="#1b6444"/><text class="b" x="880" y="463" text-anchor="middle">context_switch → switch_to</text><text class="s" x="880" y="490" text-anchor="middle">MM + stack/registers + resumed kernel continuation</text>
<text class="b" x="55" y="620">Field questions</text><g><rect x="55" y="650" width="330" height="145" rx="14" fill="#263d54"/><text class="b" x="80" y="690">p→__state</text><text class="s" x="80" y="722">May wakeup / selection consider it?</text><text class="s" x="80" y="755">TASK_RUNNING includes queued or running.</text><rect x="430" y="650" width="330" height="145" rx="14" fill="#3c3158"/><text class="b" x="455" y="690">p→on_rq</text><text class="s" x="455" y="722">Is it represented on a runqueue?</text><text class="s" x="455" y="755">Includes a distinct migrating value.</text><rect x="805" y="650" width="330" height="145" rx="14" fill="#234f43"/><text class="b" x="830" y="690">p→on_cpu</text><text class="s" x="830" y="722">Is an SMP CPU still executing it?</text><text class="s" x="830" y="755">Ordered against concurrent wakeup.</text></g><text class="s" x="595" y="850" text-anchor="middle">Legend: yellow arrows = causal/order edge · white borders = scheduler-owned state boundary</text></svg>
