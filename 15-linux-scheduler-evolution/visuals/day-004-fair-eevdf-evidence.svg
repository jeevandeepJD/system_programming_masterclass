<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 900" role="img" aria-labelledby="t d"><title id="t">Scheduler evolution timeline with evidence labels</title><desc id="d">Four distinct historical and current fair-scheduling eras are arranged on a timeline: Linux 0.12 counters, historical O(1) arrays, classic CFS vruntime, and pinned Linux 6.12 EEVDF. A footer separates toy simulator observation from source proof.</desc><defs><style>text{font-family:sans-serif;fill:#fff}.h{font-size:34px;font-weight:700}.b{font-size:21px;font-weight:700}.s{font-size:18px}.box{stroke:#fff;stroke-width:2}</style></defs><rect width="1190" height="900" fill="#07121d"/><text class="h" x="55" y="62">Day 4 evidence: label the era before comparing policy</text><line x1="125" y1="300" x2="1065" y2="300" stroke="#ffd166" stroke-width="8"/><g text-anchor="middle"><circle cx="150" cy="300" r="18" fill="#fff"/><circle cx="445" cy="300" r="18" fill="#fff"/><circle cx="745" cy="300" r="18" fill="#fff"/><circle cx="1040" cy="300" r="18" fill="#fff"/>
<rect class="box" x="55" y="120" width="225" height="140" rx="14" fill="#315a88"/><text class="b" x="167" y="158">Linux 0.12</text><text class="s" x="167" y="193">HISTORICAL</text><text class="s" x="167" y="225">max runnable counter</text><rect class="box" x="330" y="345" width="230" height="140" rx="14" fill="#7d3850"/><text class="b" x="445" y="383">O(1) scheduler</text><text class="s" x="445" y="418">HISTORICAL</text><text class="s" x="445" y="450">active / expired arrays</text><rect class="box" x="630" y="120" width="230" height="140" rx="14" fill="#624b88"/><text class="b" x="745" y="158">Classic CFS</text><text class="s" x="745" y="193">HISTORICAL</text><text class="s" x="745" y="225">leftmost vruntime</text><rect class="box" x="915" y="345" width="240" height="160" rx="14" fill="#176b72"/><text class="b" x="1035" y="383">Linux 6.12 fair</text><text class="s" x="1035" y="418">PINNED CURRENT</text><text class="s" x="1035" y="450">eligible first</text><text class="s" x="1035" y="478">then earliest virtual deadline</text></g>
<rect x="55" y="565" width="1080" height="230" rx="18" fill="#12283b" stroke="#6fa8dc" stroke-width="2"/><text class="b" x="85" y="608">Evidence boundary</text><text class="s" x="85" y="650">Toy simulator observes: its three literal records, six deterministic smallest-deadline choices, bounded completion.</text><text class="s" x="85" y="692">It does not observe: eligibility, kernel vruntime/lag/slice, augmented tree, host picker branch, shares, or latency.</text><text class="s" x="85" y="734">Pinned 6.12 source proves: eligibility comparison, deadline update, augmented EEVDF search for that commit.</text><text class="s" x="85" y="776">Later upstream: potentially changed until version-checked.</text><text class="s" x="595" y="855" text-anchor="middle">O(1) is not early CFS; classic CFS is not a complete description of Linux 6.12 EEVDF.</text></svg>
