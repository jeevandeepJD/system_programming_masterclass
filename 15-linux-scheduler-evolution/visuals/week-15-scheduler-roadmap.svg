<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 900" role="img" aria-labelledby="t d">
<title id="t">Week 15 Linux scheduler causal loop and evolution</title><desc id="d">A task runs, blocks or is preempted, becomes runnable, is enqueued on a per-CPU runqueue, selected by a scheduler class including fair EEVDF, switched, and runs again. A lower lane separates Linux 0.12, O(1), classic CFS, and Linux 6.12 EEVDF eras.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#ffd166"/></marker><style>text{font-family:sans-serif;fill:#fff}.h{font-size:34px;font-weight:700}.b{font-size:20px;font-weight:700}.s{font-size:18px}.box{stroke:#fff;stroke-width:2}.arr{fill:none;stroke:#ffd166;stroke-width:5;marker-end:url(#a)}</style></defs>
<rect width="1190" height="900" fill="#07111b"/><text class="h" x="55" y="62">Week 15: one causal loop, four policy eras</text>
<circle cx="130" cy="260" r="76" fill="#0b6e75" class="box"/><text class="b" x="130" y="254" text-anchor="middle">RUNNING</text><text class="s" x="130" y="282" text-anchor="middle">owns a CPU</text>
<rect x="265" y="195" width="165" height="130" rx="18" fill="#8b3a52" class="box"/><text class="b" x="347" y="245" text-anchor="middle">block</text><text class="b" x="347" y="274" text-anchor="middle">or preempt</text><text class="s" x="347" y="303" text-anchor="middle">trigger</text>
<rect x="495" y="195" width="155" height="130" rx="65" fill="#315b8a" class="box"/><text class="b" x="572" y="254" text-anchor="middle">RUNNABLE</text><text class="s" x="572" y="282" text-anchor="middle">eligible</text>
<rect x="715" y="180" width="180" height="160" rx="12" fill="#5b4b8a" class="box"/><text class="b" x="805" y="225" text-anchor="middle">enqueue</text><text class="s" x="805" y="258" text-anchor="middle">per-CPU rq</text><path d="M750 290h110M765 310h80" stroke="#fff" stroke-width="6"/>
<polygon points="1010,180 1135,260 1010,340 925,260" fill="#9a6518" class="box"/><text class="b" x="1035" y="245" text-anchor="middle">class /</text><text class="b" x="1035" y="273" text-anchor="middle">EEVDF</text><text class="s" x="1035" y="300" text-anchor="middle">pick next</text>
<path class="arr" d="M206 260h50M430 260h55M650 260h55M895 260h25M1065 348C1065 440 900 460 730 460"/><rect x="485" y="405" width="245" height="105" rx="15" fill="#175d3b" class="box"/><text class="b" x="607" y="448" text-anchor="middle">context switch</text><text class="s" x="607" y="478" text-anchor="middle">MM → stack/registers</text><path class="arr" d="M485 457C300 457 145 420 130 346"/>
<text class="b" x="55" y="595">Evolution lane — historical mechanisms are not interchangeable</text><path d="M95 690H1090" stroke="#9ec5ff" stroke-width="8"/><g text-anchor="middle"><circle cx="120" cy="690" r="17" fill="#ffd166"/><text class="b" x="120" y="650">Linux 0.12</text><text class="s" x="120" y="735">array scan + counters</text><circle cx="430" cy="690" r="17" fill="#ffd166"/><text class="b" x="430" y="650">O(1)</text><text class="s" x="430" y="735">active / expired arrays</text><circle cx="735" cy="690" r="17" fill="#ffd166"/><text class="b" x="735" y="650">classic CFS</text><text class="s" x="735" y="735">leftmost vruntime</text><circle cx="1060" cy="690" r="17" fill="#ffd166"/><text class="b" x="1060" y="650">Linux 6.12</text><text class="s" x="1060" y="735">eligible → earliest vd</text></g>
<rect x="55" y="800" width="1080" height="55" rx="12" fill="#152435" stroke="#6f90ad" stroke-width="2"/><text class="s" x="595" y="835" text-anchor="middle">Durable split: eligibility → queue ownership → policy selection → switch mechanics</text></svg>
