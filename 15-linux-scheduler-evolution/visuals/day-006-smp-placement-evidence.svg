<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 900" role="img" aria-labelledby="t d"><title id="t">Layered explanations for apparent CPU placement</title><desc id="d">Five stacked evidence layers—affinity, cpuset and CPU state, topology and NUMA, cgroup CPU controls, and KVM host scheduling—show what each can explain and what it cannot. The self-affinity lab observes only the first layer.</desc><defs><style>text{font-family:sans-serif;fill:#fff}.h{font-size:34px;font-weight:700}.b{font-size:21px;font-weight:700}.s{font-size:18px}.box{stroke:#fff;stroke-width:2}</style></defs><rect width="1190" height="900" fill="#07121d"/><text class="h" x="55" y="62">Day 6 evidence: placement has layered constraints</text><g><rect class="box" x="55" y="120" width="1080" height="112" rx="15" fill="#315a88"/><text class="b" x="85" y="158">1 · AFFINITY</text><text class="s" x="85" y="193">Explains requested CPUs and legal self-narrowing.</text><text class="s" x="650" y="193">Cannot explain why one legal CPU won.</text><rect class="box" x="85" y="245" width="1020" height="112" rx="15" fill="#624b88"/><text class="b" x="115" y="283">2 · CPUSET + CPU STATE</text><text class="s" x="115" y="318">Explains effective-mask narrowing, hotplug legality.</text><text class="s" x="650" y="318">taskset alone is incomplete.</text><rect class="box" x="115" y="370" width="960" height="112" rx="15" fill="#176b72"/><text class="b" x="145" y="408">3 · TOPOLOGY + NUMA</text><text class="s" x="145" y="443">Explains SMT/core/cache capacity and locality costs.</text><text class="s" x="700" y="443">CPU location ≠ page location.</text><rect class="box" x="145" y="495" width="900" height="112" rx="15" fill="#9a6518"/><text class="b" x="175" y="533">4 · CGROUP CPU</text><text class="s" x="175" y="568">cpu.max / cpu.stat explain proven throttling.</text><text class="s" x="690" y="568">cpu.weight alone ≠ quota.</text><rect class="box" x="175" y="620" width="840" height="112" rx="15" fill="#7d3850"/><text class="b" x="205" y="658">5 · KVM HOST</text><text class="s" x="205" y="693">Steal may explain unavailable physical service.</text><text class="s" x="690" y="693">Guest pinning ≠ host vCPU pinning.</text></g>
<rect x="55" y="780" width="1080" height="78" rx="14" fill="#173a2d" stroke="#8bd2a9" stroke-width="2"/><text class="s" x="595" y="812" text-anchor="middle">affinity_lab observes inherited mask + legal self-affinity + completion only.</text><text class="s" x="595" y="842" text-anchor="middle">Migration, picker branch, cache warmth, NUMA pages, throttling, and steal remain unobserved.</text></svg>
