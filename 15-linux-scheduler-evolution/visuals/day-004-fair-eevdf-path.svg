<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 900" role="img" aria-labelledby="t d"><title id="t">EEVDF eligibility then earliest virtual deadline</title><desc id="d">A two-stage EEVDF picker first removes tasks with negative lag, then chooses the earliest virtual deadline among eligible tasks. A three-task worked example at virtual time 20 selects B even though ineligible C has the earliest deadline.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#ffd166"/></marker><style>text{font-family:sans-serif;fill:#fff}.h{font-size:34px;font-weight:700}.b{font-size:22px;font-weight:700}.s{font-size:18px}.box{stroke:#fff;stroke-width:2}.a{stroke:#ffd166;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1190" height="900" fill="#07121d"/><text class="h" x="55" y="62">Day 4: EEVDF is a filter, then an ordering</text>
<rect class="box" x="55" y="115" width="310" height="150" rx="16" fill="#315a88"/><text class="b" x="210" y="155" text-anchor="middle">1 · ELIGIBILITY</text><text class="s" x="85" y="197">lag = weight × (V − vruntime)</text><text class="s" x="85" y="230">keep lag ≥ 0: task is owed service</text><path class="a" d="M365 190H470"/><rect class="box" x="475" y="115" width="310" height="150" rx="16" fill="#624b88"/><text class="b" x="630" y="155" text-anchor="middle">2 · DEADLINE ORDER</text><text class="s" x="505" y="197">among eligible entities only</text><text class="s" x="505" y="230">choose earliest virtual deadline</text><path class="a" d="M785 190H890"/><rect class="box" x="895" y="115" width="240" height="150" rx="16" fill="#176b72"/><text class="b" x="1015" y="168" text-anchor="middle">PICK WINNER</text><text class="s" x="1015" y="205" text-anchor="middle">class selection</text><text class="s" x="1015" y="235" text-anchor="middle">then common switch</text>
<text class="b" x="55" y="335">Worked mini-example · equal weights · V = 20</text><rect x="55" y="370" width="1080" height="275" rx="18" fill="#12283b" stroke="#6fa8dc" stroke-width="2"/><g class="b"><text x="105" y="418">task</text><text x="275" y="418">vruntime</text><text x="470" y="418">lag</text><text x="650" y="418">virtual deadline</text><text x="925" y="418">stage result</text></g><line x1="85" y1="438" x2="1105" y2="438" stroke="#8ba4b8" stroke-width="2"/><g class="s"><text x="120" y="485">A</text><text x="300" y="485">18</text><text x="470" y="485">+2</text><text x="685" y="485">24</text><text x="925" y="485">eligible</text><text x="120" y="545">B</text><text x="300" y="545">20</text><text x="470" y="545">0</text><text x="685" y="545">21</text><text x="925" y="545">eligible → WINNER</text><text x="120" y="605">C</text><text x="300" y="605">22</text><text x="470" y="605">−2</text><text x="685" y="605">20.5 (earliest!)</text><text x="925" y="605">INELIGIBLE → filtered</text></g>
<rect x="55" y="700" width="1080" height="120" rx="16" fill="#713f46" stroke="#fff" stroke-width="2"/><text class="b" x="595" y="743" text-anchor="middle">Why “pick smallest deadline” is wrong</text><text class="s" x="595" y="780" text-anchor="middle">It would choose C, which has already run ahead. EEVDF chooses B: eligible first, earliest vd second.</text><text class="s" x="595" y="860" text-anchor="middle">Augmented deadline tree stores subtree minimum vruntime so ineligible subtrees can be pruned in O(log n).</text></svg>
